  - name: JS-TransformProductDetail
    type: Javascript
    content:
      Javascript:
        metadata:
          continueOnError: "false"
          enabled: "true"
          timeLimit: "200"
          name: JS-TransformProductDetail
        DisplayName: JS-TransformProductDetail
        Properties: {}
        Source: "var productId = context.getVariable(\"productId\");\nvar deploymentRaw = context.getVariable(\"deploymentResponse.content\");\nvar versionRaw = context.getVariable(\"specContentsResponse.content\") || context.getVariable(\"versionResponse.content\");\nvar realProductJson = context.getVariable(\"realProductJson\");\n\nvar deploymentData = null;\nif (deploymentRaw) {\n  try {\n    deploymentData = JSON.parse(deploymentRaw);\n  } catch(e) {}\n}\n\nvar versionData = null;\nif (versionRaw) {\n  try {\n    versionData = JSON.parse(versionRaw);\n  } catch(e) {}\n}\n\nvar mockProducts = null;\nvar realProduct = null;\nif (realProductJson) {\n  try {\n    realProduct = JSON.parse(realProductJson);\n    mockProducts = { \"products\": [realProduct] };\n  } catch(e) {}\n}\n\nvar result = transformProductDetail(deploymentData, versionData, productId, mockProducts);\n\nif (!result.spec) {\n  if (result.displayStyle === \"MCP\") {\n    result.spec = {\n      \"tools\": [\n        {\n          \"name\": \"query\",\n          \"description\": \"Run analytical SQL queries\",\n          \"inputSchema\": {\n            \"type\": \"object\",\n            \"properties\": {\n              \"sql\": { \"type\": \"string\" }\n            },\n            \"required\": [\"sql\"]\n          }\n        }\n      ]\n    };\n  } else {\n    var displayName = (realProduct && (realProduct.displayName || realProduct.name)) || productId;\n    result.spec = \"openapi: 3.0.0\\ninfo:\\n  title: \" + displayName + \" Spec\\n  version: 1.0.0\\npaths:\\n  /:\\n    get:\\n      responses:\\n        '200':\\n          description: Success\";\n  }\n}\n\nresponse.content = JSON.stringify(result);\nresponse.headers[\"Content-Type\"] = \"application/json\";\n"
        IncludeURL: jsc://transformations.js
