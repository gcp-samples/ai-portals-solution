resources:
  - name: apihub.properties
    type: properties
    content: |
      APIHUB_LOCATION=europe-west1
  - name: mcp.js
    type: jsc
    content: "/**\n * Model Context Protocol (MCP) ES5 Library\n * Provides handlers for MCP standard requests with live Apigee/API Hub support\n * and mockCatalog fallback for offline unit tests.\n */\n\nvar mockCatalog = [\n  {\n    name: \"Qwen admin_ Product\",\n    displayName: \"Qwen admin_ Product\",\n    description: \"Access to Qwen family models including qwen3-next-80b-a3b-thinking-maas for advanced multilingual generation.\",\n    approvalType: \"auto\"\n  },\n  {\n    name: \"DeepSeek admin_ Product\",\n    displayName: \"DeepSeek admin_ Product\",\n    description: \"Provides low-latency access to DeepSeek models (e.g. deepseek-v3.2-maas).\",\n    approvalType: \"auto\"\n  },\n  {\n    name: \"Claude admin_ Product\",\n    displayName: \"Claude admin_ Product\",\n    description: \"Claude developer access product supporting advanced Claude models.\",\n    approvalType: \"auto\"\n  },\n  {\n    name: \"Gemini Core Product\",\n    displayName: \"Gemini Core Product\",\n    description: \"Developer access to Gemini models including multimodal capabilities.\",\n    approvalType: \"auto\"\n  }\n];\n\nfunction initialize(request) {\n  return {\n    protocolVersion: \"2024-11-05\",\n    capabilities: {\n      tools: {},\n    },\n    serverInfo: {\n      name: \"portals-mcp-server\",\n      version: \"1.1.0\",\n    },\n  };\n}\n\nfunction toolsList() {\n  return {\n    tools: [\n      {\n        name: \"getCatalog\",\n        description: \"Retrieves the list of available API products in the API Hub / Apigee catalog.\",\n        inputSchema: {\n          type: \"object\",\n          properties: {\n            limit: {\n              type: \"integer\",\n              description: \"Optional limit on the number of products returned.\"\n            }\n          }\n        }\n      },\n      {\n        name: \"searchCatalog\",\n        description: \"Searches the API Hub / Apigee catalog for APIs matching the search query.\",\n        inputSchema: {\n          type: \"object\",\n          properties: {\n            query: {\n              type: \"string\",\n              description: \"The search term or keyword to match against API name, description, tags, or style.\"\n            }\n          },\n          required: [\"query\"]\n        }\n      },\n      {\n        name: \"getApps\",\n        description: \"Lists the authenticated developer's applications, subscribed API products, and credentials.\",\n        inputSchema: {\n          type: \"object\",\n          properties: {\n            appName: {\n              type: \"string\",\n              description: \"Optional application name to filter by.\"\n            }\n          }\n        }\n      },\n      {\n        name: \"getCredentials\",\n        description: \"Retrieves API credentials (clientId and clientSecret) for the authenticated developer's applications.\",\n        inputSchema: {\n          type: \"object\",\n          properties: {\n            appName: {\n              type: \"string\",\n              description: \"Optional application name to retrieve credentials for.\"\n            },\n            apiProduct: {\n              type: \"string\",\n              description: \"Optional API product name to filter credentials by.\"\n            }\n          }\n        }\n      },\n      {\n        name: \"createApp\",\n        description: \"Creates a new developer application and optionally subscribes it to an API product, returning new credentials.\",\n        inputSchema: {\n          type: \"object\",\n          properties: {\n            appName: {\n              type: \"string\",\n              description: \"Name of the new developer application.\"\n            },\n            description: {\n              type: \"string\",\n              description: \"Optional description of the application.\"\n            },\n            apiProduct: {\n              type: \"string\",\n              description: \"Optional API product name to subscribe the new app to.\"\n            }\n          },\n          required: [\"appName\"]\n        }\n      },\n      {\n        name: \"subscribe\",\n        description: \"Subscribes a developer's application to a specific API product.\",\n        inputSchema: {\n          type: \"object\",\n          properties: {\n            developerEmail: {\n              type: \"string\",\n              description: \"Optional email of the developer (defaults to authenticated user).\"\n            },\n            appName: {\n              type: \"string\",\n              description: \"The name of the developer application.\"\n            },\n            apiProduct: {\n              type: \"string\",\n              description: \"The name of the API product to subscribe to.\"\n            }\n          },\n          required: [\"appName\", \"apiProduct\"]\n        }\n      },\n      {\n        name: \"unsubscribe\",\n        description: \"Unsubscribes a developer's application from a specific API product.\",\n        inputSchema: {\n          type: \"object\",\n          properties: {\n            developerEmail: {\n              type: \"string\",\n              description: \"Optional email of the developer (defaults to authenticated user).\"\n            },\n            appName: {\n              type: \"string\",\n              description: \"The name of the developer application.\"\n            },\n            apiProduct: {\n              type: \"string\",\n              description: \"The name of the API product to unsubscribe from.\"\n            }\n          },\n          required: [\"appName\", \"apiProduct\"]\n        }\n      }\n    ],\n  };\n}\n\nfunction formatLiveCatalog(liveContext) {\n  if (!liveContext || !liveContext.apis || !Array.isArray(liveContext.apis.apis)) {\n    return null;\n  }\n  var apigeeProducts = (liveContext.products && Array.isArray(liveContext.products.apiProduct))\n    ? liveContext.products.apiProduct\n    : [];\n\n  var items = [];\n  for (var i = 0; i < liveContext.apis.apis.length; i++) {\n    var api = liveContext.apis.apis[i];\n    if (!api) continue;\n    var displayName = api.displayName || (api.name ? api.name.split(\"/\").pop() : \"\");\n    var id = api.name ? api.name.split(\"/\").pop() : displayName;\n    var packages = [];\n    for (var p = 0; p < apigeeProducts.length; p++) {\n      var prod = apigeeProducts[p];\n      if (!prod) continue;\n      var matched = false;\n      var groups = [prod.operationGroup, prod.llmOperationGroup, prod.payloadOperationGroup];\n      for (var g = 0; g < groups.length; g++) {\n        var grp = groups[g];\n        if (grp && Array.isArray(grp.operationConfigs)) {\n          for (var c = 0; c < grp.operationConfigs.length; c++) {\n            if (grp.operationConfigs[c] && grp.operationConfigs[c].apiSource === displayName) {\n              matched = true;\n              break;\n            }\n          }\n        }\n        if (matched) break;\n      }\n      if (matched) {\n        packages.push(prod.name);\n      }\n    }\n    items.push({\n      id: id,\n      name: displayName,\n      displayName: displayName,\n      description: api.description || \"\",\n      apiProducts: packages\n    });\n  }\n  return items;\n}\n\nfunction formatApigeeApps(appsData) {\n  var list = [];\n  if (appsData && Array.isArray(appsData.app)) {\n    list = appsData.app;\n  } else if (appsData && appsData.name && appsData.appId) {\n    list = [appsData];\n  }\n  return list.map(function (a) {\n    var creds = (a.credentials || []).map(function (c) {\n      var prods = (c.apiProducts || []).map(function (p) { return p.apiproduct; }).filter(Boolean);\n      return {\n        clientId: c.consumerKey || \"\",\n        clientSecret: c.consumerSecret || \"\",\n        status: c.status || \"\",\n        apiProducts: prods\n      };\n    });\n    return {\n      id: a.appId || \"\",\n      name: a.name || \"\",\n      status: a.status || \"\",\n      credentials: creds\n    };\n  });\n}\n\n/**\n * Executes a specific tool by name.\n */\nfunction callTool(name, args, liveContext) {\n  args = args || {};\n\n  if (name === \"getCatalog\") {\n    var limit = args.limit ? parseInt(args.limit, 10) : undefined;\n    var liveItems = formatLiveCatalog(liveContext);\n    var products = liveItems !== null ? liveItems : mockCatalog;\n    if (limit && limit > 0) {\n      products = products.slice(0, limit);\n    }\n    return {\n      content: [\n        {\n          type: \"text\",\n          text: JSON.stringify(products),\n        },\n      ],\n    };\n  }\n\n  if (name === \"searchCatalog\") {\n    if (typeof args.query !== \"string\" || !args.query) {\n      return {\n        isError: true,\n        content: [\n          {\n            type: \"text\",\n            text: \"Error: The 'query' argument is required.\",\n          },\n        ],\n      };\n    }\n    var query = args.query.toLowerCase();\n    var liveItems = formatLiveCatalog(liveContext);\n    var sourceList = liveItems !== null ? liveItems : mockCatalog;\n    var results = [];\n    for (var i = 0; i < sourceList.length; i++) {\n      var prod = sourceList[i];\n      var matchName = prod.name && prod.name.toLowerCase().indexOf(query) !== -1;\n      var matchDisplay = prod.displayName && prod.displayName.toLowerCase().indexOf(query) !== -1;\n      var matchDesc = prod.description && prod.description.toLowerCase().indexOf(query) !== -1;\n      var matchPkg = prod.apiProducts && prod.apiProducts.join(\" \").toLowerCase().indexOf(query) !== -1;\n      if (matchName || matchDisplay || matchDesc || matchPkg) {\n        results.push(prod);\n      }\n    }\n    return {\n      content: [\n        {\n          type: \"text\",\n          text: JSON.stringify(results),\n        },\n      ],\n    };\n  }\n\n  if (name === \"getApps\" || name === \"getCredentials\") {\n    var apps = liveContext && liveContext.apps ? formatApigeeApps(liveContext.apps) : [];\n    if (args.appName) {\n      var targetApp = args.appName.toLowerCase();\n      apps = apps.filter(function (a) {\n        return a.name && a.name.toLowerCase() === targetApp;\n      });\n    }\n    if (name === \"getCredentials\" && args.apiProduct) {\n      var targetProd = args.apiProduct.toLowerCase();\n      apps = apps.filter(function (a) {\n        return a.credentials.some(function (c) {\n          return c.apiProducts.some(function (p) {\n            return p.toLowerCase() === targetProd;\n          });\n        });\n      });\n    }\n    return {\n      content: [\n        {\n          type: \"text\",\n          text: JSON.stringify(apps),\n        },\n      ],\n    };\n  }\n\n  if (name === \"createApp\") {\n    if (!args.appName) {\n      return {\n        isError: true,\n        content: [{ type: \"text\", text: \"Error: 'appName' is required.\" }],\n      };\n    }\n    if (liveContext && liveContext.error) {\n      return {\n        isError: true,\n        content: [{ type: \"text\", text: \"Error creating app: \" + liveContext.error }],\n      };\n    }\n    var created = liveContext && liveContext.createdApp\n      ? formatApigeeApps(liveContext.createdApp)[0]\n      : { name: args.appName, status: \"approved\", credentials: [] };\n    return {\n      content: [\n        {\n          type: \"text\",\n          text: JSON.stringify({ success: true, app: created }),\n        },\n      ],\n    };\n  }\n\n  if (name === \"subscribe\") {\n    if (!args.appName || !args.apiProduct) {\n      return {\n        isError: true,\n        content: [\n          {\n            type: \"text\",\n            text: \"Error: 'appName' and 'apiProduct' are required.\",\n          },\n        ],\n      };\n    }\n    if (liveContext && liveContext.error) {\n      return {\n        isError: true,\n        content: [{ type: \"text\", text: \"Error subscribing: \" + liveContext.error }],\n      };\n    }\n    var email = (liveContext && liveContext.developerEmail) || args.developerEmail || \"\";\n    var response = {\n      success: true,\n      message: \"Successfully subscribed application '\" + args.appName + \"' of '\" + email + \"' to API product '\" + args.apiProduct + \"'.\",\n      subscription: {\n        appName: args.appName,\n        developerEmail: email,\n        apiProduct: args.apiProduct,\n        status: \"approved\",\n        updatedAt: new Date().toISOString(),\n      },\n    };\n    return {\n      content: [\n        {\n          type: \"text\",\n          text: JSON.stringify(response),\n        },\n      ],\n    };\n  }\n\n  if (name === \"unsubscribe\") {\n    if (!args.appName || !args.apiProduct) {\n      return {\n        isError: true,\n        content: [\n          {\n            type: \"text\",\n            text: \"Error: 'appName' and 'apiProduct' are required.\",\n          },\n        ],\n      };\n    }\n    if (liveContext && liveContext.error) {\n      return {\n        isError: true,\n        content: [{ type: \"text\", text: \"Error unsubscribing: \" + liveContext.error }],\n      };\n    }\n    var email = (liveContext && liveContext.developerEmail) || args.developerEmail || \"\";\n    var response = {\n      success: true,\n      message: \"Successfully unsubscribed application '\" + args.appName + \"' of '\" + email + \"' from API product '\" + args.apiProduct + \"'.\",\n      unsubscribed: {\n        appName: args.appName,\n        developerEmail: email,\n        apiProduct: args.apiProduct,\n        status: \"removed\",\n        unsubscribedAt: new Date().toISOString(),\n      },\n    };\n    return {\n      content: [\n        {\n          type: \"text\",\n          text: JSON.stringify(response),\n        },\n      ],\n    };\n  }\n\n  return {\n    isError: true,\n    content: [\n      {\n        type: \"text\",\n        text: \"Error: Tool '\" + name + \"' not found.\",\n      },\n    ],\n  };\n}\n"
  - name: transformations.js
    type: jsc
    content: "function transformApisToProducts(input, apigeeProducts) {\n  if (!input || !Array.isArray(input.apis)) {\n    return { products: [] };\n  }\n\n  var products = input.apis.map(function (api) {\n    // 1. Map ID from name (extract the last part of the path)\n    var id = api.name ? api.name.split(\"/\").pop() : \"\";\n\n    // 2. Extract displayName\n    var displayName = api.displayName || \"\";\n\n    // 3. Extract versions and sourceId (version resource name)\n    var versions = api.versions || [];\n    var sourceId = (versions && versions.length > 0) ? versions[0] : \"\";\n\n    // 4. Extract createTime\n    var createTime = api.createTime || \"\";\n\n    // 5. Extract updateTime\n    var updateTime = api.updateTime || \"\";\n\n    // 6. Extract targetUser (just the displayName value)\n    var targetUser = null;\n    if (\n      api.targetUser &&\n      api.targetUser.enumValues &&\n      api.targetUser.enumValues.values &&\n      api.targetUser.enumValues.values[0]\n    ) {\n      targetUser = api.targetUser.enumValues.values[0].displayName || null;\n    }\n\n    // 7. Extract categories, tags, and api-style from attributes\n    var categories = [];\n    var tags = [];\n    var displayStyle = \"REST\"; // default fallback style\n\n    // First-class system property check for apiStyle (or snake_case api_style) from API Hub\n    var systemStyleObj = api.apiStyle || api.api_style;\n    if (\n      systemStyleObj &&\n      systemStyleObj.enumValues &&\n      systemStyleObj.enumValues.values &&\n      systemStyleObj.enumValues.values[0]\n    ) {\n      displayStyle = systemStyleObj.enumValues.values[0].displayName || systemStyleObj.enumValues.values[0].id || displayStyle;\n    }\n\n    if (api.attributes) {\n      var keys = Object.keys(api.attributes);\n      for (var i = 0; i < keys.length; i++) {\n        var key = keys[i];\n        var attr = api.attributes[key];\n        if (key.slice(-9) === \"/category\") {\n          var vals = (attr && attr.enumValues && attr.enumValues.values) || [];\n          categories = vals\n            .map(function (v) {\n              return v.displayName;\n            })\n            .filter(Boolean);\n        } else if (key.slice(-5) === \"/tags\") {\n          tags = (attr && attr.stringValues && attr.stringValues.values) || [];\n        } else if (key.slice(-10) === \"/api-style\" || key.slice(-10) === \"/api_style\" || key.slice(-6) === \"/style\") {\n          // Extract style from enum values\n          if (attr && attr.enumValues && attr.enumValues.values && attr.enumValues.values.length > 0) {\n            displayStyle = attr.enumValues.values[0].displayName || attr.enumValues.values[0].id || displayStyle;\n          }\n          // Extract style from string values\n          else if (attr && attr.stringValues && attr.stringValues.values && attr.stringValues.values.length > 0) {\n            displayStyle = attr.stringValues.values[0] || displayStyle;\n          }\n        }\n      }\n    }\n\n    // 8. Find matching packages (Apigee API Products)\n    var packages = [];\n    var apigeeProductsList = (apigeeProducts && Array.isArray(apigeeProducts.apiProduct)) ? apigeeProducts.apiProduct : [];\n\n    for (var p = 0; p < apigeeProductsList.length; p++) {\n      var prod = apigeeProductsList[p];\n      var isMatched = false;\n      var matchingConfigs = [];\n\n      // Check operationConfigs in operationGroup\n      if (prod.operationGroup && Array.isArray(prod.operationGroup.operationConfigs)) {\n        var opConfigs = prod.operationGroup.operationConfigs;\n        for (var o = 0; o < opConfigs.length; o++) {\n          if (opConfigs[o] && opConfigs[o].apiSource === displayName) {\n            isMatched = true;\n            matchingConfigs.push(opConfigs[o]);\n          }\n        }\n      }\n\n      // Check operationConfigs in llmOperationGroup\n      if (prod.llmOperationGroup && Array.isArray(prod.llmOperationGroup.operationConfigs)) {\n        var llmConfigs = prod.llmOperationGroup.operationConfigs;\n        for (var l = 0; l < llmConfigs.length; l++) {\n          if (llmConfigs[l] && llmConfigs[l].apiSource === displayName) {\n            isMatched = true;\n            matchingConfigs.push(llmConfigs[l]);\n          }\n        }\n      }\n\n      // Check operationConfigs in payloadOperationGroup\n      if (prod.payloadOperationGroup && Array.isArray(prod.payloadOperationGroup.operationConfigs)) {\n        var payloadConfigs = prod.payloadOperationGroup.operationConfigs;\n        for (var l = 0; l < payloadConfigs.length; l++) {\n          if (payloadConfigs[l] && payloadConfigs[l].apiSource === displayName) {\n            isMatched = true;\n            matchingConfigs.push(payloadConfigs[l]);\n          }\n        }\n      }\n\n      if (isMatched) {\n        var tokenLimits = [];\n        var callLimits = [];\n\n        for (var m = 0; m < matchingConfigs.length; m++) {\n          var config = matchingConfigs[m];\n\n          // Map normal 'quota' if it exists and has a limit\n          if (config.quota && typeof config.quota === 'object' && config.quota.limit) {\n            callLimits.push({\n              callLimit: Number(config.quota.limit) || 0,\n              type: \"USER\"\n            });\n          }\n\n          // Map 'llmTokenQuota' if it exists and has a limit\n          if (config.llmTokenQuota && typeof config.llmTokenQuota === 'object' && config.llmTokenQuota.limit) {\n            var modelName = \"\";\n            if (Array.isArray(config.llmOperations) && config.llmOperations.length > 0 && config.llmOperations[0]) {\n              modelName = config.llmOperations[0].model || \"\";\n            }\n            tokenLimits.push({\n              modelName: modelName,\n              tokenLimit: Number(config.llmTokenQuota.limit) || 0,\n              type: \"USER\"\n            });\n          }\n        }\n\n        // Support root-level quota mapping if we have matching config but no config-level quota/tokenLimit was added\n        if (tokenLimits.length === 0 && prod.llmQuota) {\n          var rootModelName = \"\";\n          if (prod.llmOperationGroup && Array.isArray(prod.llmOperationGroup.operationConfigs)) {\n            var rConfigs = prod.llmOperationGroup.operationConfigs;\n            for (var rc = 0; rc < rConfigs.length; rc++) {\n              if (rConfigs[rc] && Array.isArray(rConfigs[rc].llmOperations) && rConfigs[rc].llmOperations.length > 0 && rConfigs[rc].llmOperations[0]) {\n                rootModelName = rConfigs[rc].llmOperations[0].model || \"\";\n                break;\n              }\n            }\n          }\n          tokenLimits.push({\n            modelName: rootModelName,\n            tokenLimit: Number(prod.llmQuota) || 0,\n            type: \"USER\"\n          });\n        }\n\n        if (callLimits.length === 0 && prod.quota && typeof prod.quota === 'object' && prod.quota.limit) {\n          callLimits.push({\n            callLimit: Number(prod.quota.limit) || 0,\n            type: \"USER\"\n          });\n        } else if (callLimits.length === 0 && prod.quota && (typeof prod.quota === 'string' || typeof prod.quota === 'number')) {\n          callLimits.push({\n            callLimit: Number(prod.quota) || 0,\n            type: \"USER\"\n          });\n        }\n\n        packages.push({\n          packageId: prod.name || \"\",\n          requestTokenPricePerMillion: 0.0,\n          responseTokenPricePerMillion: 0.0,\n          requestCallPricePerThousand: 0.0,\n          responseCallPricePerThousand: 0.0,\n          tokenLimits: tokenLimits,\n          callLimits: callLimits\n        });\n      }\n    }\n\n    return {\n      id: id,\n      displayName: displayName,\n      displayDescription: api.description || \"\",\n      displayStyle: displayStyle,\n      sourceId: sourceId,\n      versions: versions,\n      createTime: createTime,\n      updateTime: updateTime,\n      targetUser: targetUser,\n      categories: categories,\n      tags: tags,\n      packages: packages,\n    };\n  }).filter(function (p) {\n    return p.packages && p.packages.length > 0;\n  });\n\n  return { products: products };\n}\n\nfunction transformApp(app) {\n  if (!app) {\n    return null;\n  }\n\n  // 1. Map ID from appId\n  var id = app.appId || \"\";\n\n  // 2. Map name from name\n  var name = app.name || \"\";\n\n  // 3. Extract description from attributes (find attribute with name \"description\")\n  var description = \"\";\n  if (app.attributes && Array.isArray(app.attributes)) {\n    for (var i = 0; i < app.attributes.length; i++) {\n      var attr = app.attributes[i];\n      if (attr && attr.name === \"description\") {\n        description = attr.value || \"\";\n        break;\n      }\n    }\n  }\n\n  // 4. Map credentials\n  var credentials = [];\n  if (app.credentials && Array.isArray(app.credentials)) {\n    credentials = app.credentials.map(function (cred) {\n      var clientId = cred.consumerKey || \"\";\n      var clientSecret = cred.consumerSecret || \"\";\n\n      var products = [];\n      if (cred.apiProducts && Array.isArray(cred.apiProducts)) {\n        products = cred.apiProducts\n          .map(function (prod) {\n            return prod.apiproduct || \"\";\n          })\n          .filter(Boolean);\n      }\n\n      return {\n        clientId: clientId,\n        clientSecret: clientSecret,\n        products: products,\n      };\n    });\n  }\n\n  return {\n    credentials: credentials,\n    description: description,\n    id: id,\n    name: name,\n  };\n}\n\nfunction transformApps(input) {\n  if (!input || !Array.isArray(input.app)) {\n    return { apps: [] };\n  }\n\n  var apps = input.app.map(function (app) {\n    return transformApp(app);\n  }).filter(Boolean);\n\n  return { apps: apps };\n}\n\nfunction transformAppToApigee(app) {\n  if (!app) {\n    return {\n      name: \"\",\n      apiProducts: [],\n      attributes: []\n    };\n  }\n\n  var name = app.name || \"\";\n  var apiProducts = [];\n\n  if (app.apiProducts && Array.isArray(app.apiProducts)) {\n    for (var k = 0; k < app.apiProducts.length; k++) {\n      var topProd = app.apiProducts[k];\n      if (topProd && apiProducts.indexOf(topProd) === -1) {\n        apiProducts.push(topProd);\n      }\n    }\n  }\n\n  if (app.credentials && Array.isArray(app.credentials)) {\n    for (var i = 0; i < app.credentials.length; i++) {\n      var cred = app.credentials[i];\n      if (cred && cred.products && Array.isArray(cred.products)) {\n        for (var j = 0; j < cred.products.length; j++) {\n          var prod = cred.products[j];\n          if (prod && apiProducts.indexOf(prod) === -1) {\n            apiProducts.push(prod);\n          }\n        }\n      }\n    }\n  }\n\n  var attributes = [];\n  if (app.description) {\n    attributes.push({\n      name: \"description\",\n      value: app.description\n    });\n  }\n\n  return {\n    name: name,\n    apiProducts: apiProducts,\n    attributes: attributes\n  };\n}\n\nfunction getApigeeTimeRange() {\n  var now = new Date();\n\n  // Create a date object set to exactly 3 months ago\n  var threeMonthsAgo = new Date();\n  threeMonthsAgo.setMonth(threeMonthsAgo.getMonth() - 3);\n\n  // Helper function to pad single digits with a leading zero (ES5 alternative to padStart)\n  function pad(num) {\n    return (num < 10 ? \"0\" : \"\") + num;\n  }\n\n  // Helper function to format the date to MM/DD/YYYY HH:mm\n  function formatDate(date) {\n    var month = pad(date.getMonth() + 1); // Months are 0-indexed\n    var day = pad(date.getDate());\n    var year = date.getFullYear();\n    var hours = pad(date.getHours());\n    var minutes = pad(date.getMinutes());\n\n    return month + \"/\" + day + \"/\" + year + \" \" + hours + \":\" + minutes;\n  }\n\n  // Combine both dates with the tilde separator\n  var rawRange = formatDate(threeMonthsAgo) + \"~\" + formatDate(now);\n\n  // URL-encode the string. encodeURIComponent leaves '~' unescaped naturally,\n  // matching your Apigee URL format perfectly.\n  return encodeURIComponent(rawRange);\n}\n\nfunction checkAppCredentials(inputApp, originalApp) {\n  var changes = [];\n\n  if (!inputApp || !originalApp) {\n    return changes;\n  }\n\n  var inputCreds = inputApp.credentials || [];\n  var originalCreds = originalApp.credentials || [];\n\n  for (var i = 0; i < inputCreds.length; i++) {\n    var inputCred = inputCreds[i];\n    if (!inputCred || !inputCred.clientId) {\n      continue;\n    }\n\n    var clientId = inputCred.clientId;\n\n    // Find matching original credential\n    var originalCred = null;\n    for (var j = 0; j < originalCreds.length; j++) {\n      if (originalCreds[j] && originalCreds[j].consumerKey === clientId) {\n        originalCred = originalCreds[j];\n        break;\n      }\n    }\n\n    if (!originalCred) {\n      continue;\n    }\n\n    var inputProducts = inputCred.products || [];\n    var originalApiProducts = originalCred.apiProducts || [];\n\n    // Extract list of original product names\n    var originalProductNames = [];\n    for (var k = 0; k < originalApiProducts.length; k++) {\n      var prod = originalApiProducts[k];\n      if (prod && prod.apiproduct) {\n        originalProductNames.push(prod.apiproduct);\n      }\n    }\n\n    // Check for ADDED apiProducts\n    for (var p = 0; p < inputProducts.length; p++) {\n      var inputProd = inputProducts[p];\n      if (inputProd && originalProductNames.indexOf(inputProd) === -1) {\n        changes.push({\n          clientId: clientId,\n          consumerKey: clientId,\n          apiproduct: inputProd,\n          apiProduct: inputProd,\n          operationName: \"ADDED\",\n          apiProducts: inputProducts\n        });\n      }\n    }\n\n    // Check for REMOVED apiProducts\n    for (var r = 0; r < originalProductNames.length; r++) {\n      var origProd = originalProductNames[r];\n      if (origProd && inputProducts.indexOf(origProd) === -1) {\n        changes.push({\n          clientId: clientId,\n          consumerKey: clientId,\n          apiproduct: origProd,\n          apiProduct: origProd,\n          operationName: \"REMOVED\",\n          apiProducts: inputProducts\n        });\n      }\n    }\n  }\n\n  return changes;\n}\n\nfunction decodeBase64(str) {\n  if (!str) return \"\";\n  // Check if it's not base64 (e.g. contains spaces, newlines, or YAML delimiters like ': ')\n  if (/\\s/.test(str) || str.indexOf(\": \") !== -1) {\n    return str;\n  }\n  try {\n    var chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=';\n    var output = '';\n    str = String(str).replace(/=+$/, '');\n    if (str.length % 4 === 1) {\n      return str;\n    }\n    for (\n      var bc = 0, bs, buffer, idx = 0;\n      (buffer = str.charAt(idx++));\n      ~buffer && ((bs = bc % 4 ? bs * 64 + buffer : buffer),\n        bc++ % 4) ? (output += String.fromCharCode(255 & (bs >> ((-2 * bc) & 6)))) : 0\n    ) {\n      buffer = chars.indexOf(buffer);\n    }\n    return output;\n  } catch (e) {\n    return str;\n  }\n}\n\nfunction transformProductDetail(deploymentData, versionData, productKey, mockProducts) {\n  var result = {\n    id: productKey || \"\",\n    endpoint: \"\",\n    spec: null,\n    displayStyle: \"\"\n  };\n\n  var product = null;\n  if (mockProducts && Array.isArray(mockProducts.products)) {\n    for (var i = 0; i < mockProducts.products.length; i++) {\n      var p = mockProducts.products[i];\n      if (p && (p.id === productKey || p.productId === productKey)) {\n        product = p;\n        break;\n      }\n    }\n  }\n\n  if (product) {\n    result.displayStyle = product.displayStyle || \"\";\n  }\n\n  if (deploymentData) {\n    var deployments = [];\n    if (Array.isArray(deploymentData.deployments)) {\n      deployments = deploymentData.deployments;\n    } else if (Array.isArray(deploymentData)) {\n      deployments = deploymentData;\n    } else {\n      deployments = [deploymentData];\n    }\n\n    var targetVersion = product ? product.sourceId : \"\";\n\n    for (var d = 0; d < deployments.length; d++) {\n      var dep = deployments[d];\n      if (!dep) continue;\n\n      var match = true;\n      if (targetVersion && dep.apiVersions && Array.isArray(dep.apiVersions)) {\n        match = false;\n        for (var av = 0; av < dep.apiVersions.length; av++) {\n          if (dep.apiVersions[av] === targetVersion) {\n            match = true;\n            break;\n          }\n        }\n      }\n\n      if (match) {\n        var endpoints = dep.endpoints || [];\n        if (Array.isArray(endpoints) && endpoints.length > 0) {\n          var ep = endpoints[0];\n          if (typeof ep === 'string') {\n            result.endpoint = ep;\n          } else if (ep && typeof ep === 'object' && ep.uri) {\n            result.endpoint = ep.uri;\n          }\n        } else if (dep.resourceUri) {\n          result.endpoint = dep.resourceUri;\n        } else if (dep.deploymentUri) {\n          result.endpoint = dep.deploymentUri;\n        }\n        if (result.endpoint) {\n          break;\n        }\n      }\n    }\n  }\n\n  if (!result.endpoint && product && product.endpoints && product.endpoints.length > 0) {\n    result.endpoint = product.endpoints[0];\n  }\n\n  if (versionData) {\n    var rawSpec = null;\n    if (typeof versionData === 'string') {\n      rawSpec = versionData;\n    } else if (typeof versionData === 'object') {\n      if (versionData.contents) {\n        rawSpec = versionData.contents;\n      } else if (versionData.specs && Array.isArray(versionData.specs) && versionData.specs.length > 0) {\n        var spec = versionData.specs[0];\n        rawSpec = spec.contents || spec.value || spec;\n      } else if (versionData.value) {\n        rawSpec = versionData.value;\n      } else if (versionData.schema) {\n        rawSpec = versionData.schema;\n      } else {\n        rawSpec = versionData;\n      }\n    }\n\n    if (rawSpec) {\n      if (typeof rawSpec === 'string') {\n        var decoded = decodeBase64(rawSpec);\n        try {\n          result.spec = JSON.parse(decoded);\n        } catch (e) {\n          result.spec = decoded;\n        }\n      } else {\n        result.spec = rawSpec;\n      }\n    }\n  }\n\n  return result;\n}\n\n"
