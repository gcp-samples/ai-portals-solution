  - name: JS-SetPriceListSaveResponse
    type: Javascript
    content:
      Javascript:
        metadata:
          continueOnError: "false"
          enabled: "true"
          timeLimit: "200"
          name: JS-SetPriceListSaveResponse
        DisplayName: JS-SetPriceListSaveResponse
        Properties: {}
        Source: |
          var putStatus = context.getVariable("putPriceResponse.status.code") || 500;
