  - name: JS-SetGlobalAnalyticsParams
    type: Javascript
    content:
      Javascript:
        metadata:
          continueOnError: "false"
          enabled: "true"
          timeLimit: "200"
          name: JS-SetGlobalAnalyticsParams
        DisplayName: JS-SetGlobalAnalyticsParams
        Properties: {}
        Source: |
          var timeframe = (context.getVariable("request.queryparam.timeframe") || "month").toLowerCase();
          var userFilterParam = (context.getVariable("request.queryparam.user") || "").trim();
          var modelFilterParam = (context.getVariable("request.queryparam.model") || "").trim();

          var now = new Date();
          var start = new Date(now.getTime());
          var timeUnit = "day";

          if (timeframe === "day") {
            start.setHours(start.getHours() - 24);
            timeUnit = "hour";
          } else if (timeframe === "week") {
            start.setDate(start.getDate() - 7);
            timeUnit = "day";
          } else if (timeframe === "year") {
            start = new Date(now.getFullYear(), 0, 1, 0, 0, 0);
            timeUnit = "day";
          } else if (timeframe === "all") {
            start.setFullYear(start.getFullYear() - 5);
            timeUnit = "month";
          } else {
            // Default: current month
            start = new Date(now.getFullYear(), now.getMonth(), 1, 0, 0, 0);
            timeUnit = "day";
          }

          function pad(n) { return (n < 10 ? "0" : "") + n; }
          function fmt(d) {
            return pad(d.getMonth() + 1) + "/" + pad(d.getDate()) + "/" + d.getFullYear() + " " + pad(d.getHours()) + ":" + pad(d.getMinutes());
          }

          context.setVariable("apigee.timeRange", encodeURIComponent(fmt(start) + "~" + fmt(now)));
          context.setVariable("apigee.timeUnit", timeUnit);

          var safeUser = userFilterParam && userFilterParam !== "all" ? userFilterParam.replace(/'/g, "") : "";
          var safeModel = modelFilterParam && modelFilterParam !== "all" ? modelFilterParam.replace(/'/g, "") : "";

          var modelFilterExpr = safeUser ? "(developer_email eq '" + safeUser + "')" : "";
          var userFilterExpr = safeModel ? "(dc_ai_model eq '" + safeModel + "')" : "";
          var combinedParts = [];
          if (modelFilterExpr) combinedParts.push(modelFilterExpr);
          if (userFilterExpr) combinedParts.push(userFilterExpr);
          var combinedExpr = combinedParts.join(" and ");

          context.setVariable("apigee.modelFilter", modelFilterExpr ? "&filter=" + encodeURIComponent(modelFilterExpr) : "");
          context.setVariable("apigee.userFilter", userFilterExpr ? "&filter=" + encodeURIComponent(userFilterExpr) : "");
          context.setVariable("apigee.combinedFilter", combinedExpr ? "&filter=" + encodeURIComponent(combinedExpr) : "");
  - name: JS-SetGlobalAnalyticsResponse
    type: Javascript
    content:
      Javascript:
        metadata:
          continueOnError: "false"
          enabled: "true"
          timeLimit: "200"
          name: JS-SetGlobalAnalyticsResponse
        DisplayName: JS-SetGlobalAnalyticsResponse
        Properties: {}
        Source: |
          function safeParse(raw) {
            if (!raw) return {};
            try { return JSON.parse(raw); } catch (e) { return {}; }
          }
          var payload = {
