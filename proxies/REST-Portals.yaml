div>\n    </div>\n\n    <!-- Main Portal Javascript -->\n    <script>window.__BUNDLED_VIEWS__={\"admin\":\"<div class=\\\"admin-shell\\\">\\n  <!-- Side Navigation Menu -->\\n  <aside class=\\\"admin-sidebar panel\\\" aria-label=\\\"Admin sections\\\">\\n    <div class=\\\"admin-sidebar-header\\\">\\n      <div class=\\\"admin-sidebar-badge\\\">\\n        <i data-lucide=\\\"shield-check\\\" style=\\\"width: 1.1rem; height: 1.1rem\\\"><\\/i>\\n        <span>Portal Admin<\\/span>\\n      <\\/div>\\n      <p style=\\\"font-size: 0.8rem; color: var(--text-muted); margin-top: 0.35rem\\\">\\n        Manage API Hub, AI models &amp; global analytics\\n      <\\/p>\\n    <\\/div>\\n\\n    <nav class=\\\"admin-nav\\\">\\n      <button class=\\\"admin-nav-item active\\\" id=\\\"nav-admin-catalogue\\\" onclick=\\\"switchAdminSection('catalogue')\\\">\\n        <i data-lucide=\\\"book-open\\\" style=\\\"width: 1.1rem; height: 1.1rem\\\"><\\/i>\\n        <span>Manage Catalogue<\\/span>\\n      <\\/button>\\n      <button class=\\\"admin-nav-item\\\" id=\\\"nav-admin-models\\\" onclick=\\\"switchAdminSection('models')\\\">\\n        <i data-lucide=\\\"cpu\\\" style=\\\"width: 1.1rem; height: 1.1rem\\\"><\\/i>\\n        <span>Manage Models<\\/span>\\n      <\\/button>\\n      <button class=\\\"admin-nav-item\\\" id=\\\"nav-admin-analytics\\\" onclick=\\\"switchAdminSection('analytics')\\\">\\n        <i data-lucide=\\\"bar-chart-3\\\" style=\\\"width: 1.1rem; height: 1.1rem\\\"><\\/i>\\n        <span>Global Analytics<\\/span>\\n      <\\/button>\\n    <\\/nav>\\n  <\\/aside>\\n\\n  <!-- Full-Width Section Content -->\\n  <div class=\\\"admin-main\\\">\\n    <!-- SECTION 1: MANAGE CATALOGUE -->\\n    <section id=\\\"admin-section-catalogue\\\" class=\\\"admin-section\\\">\\n      <div class=\\\"admin-section-header\\\">\\n        <div>\\n          <h1 style=\\\"font-size: 1.85rem; margin-bottom: 0.35rem\\\">Manage Catalogue<\\/h1>\\n          <p style=\\\"color: var(--text-secondary)\\\">\\n            Edit API Hub display names, descriptions, and deployment states across all catalog entries.\\n          <\\/p>\\n        <\\/div>\\n        <button class=\\\"btn btn-secondary btn-sm\\\" onclick=\\\"fetchAdminApis(true)\\\" title=\\\"Refresh from API Hub\\\">\\n          <i data-lucide=\\\"refresh-cw\\\" style=\\\"width: 1rem; height: 1rem\\\"><\\/i>\\n          Refresh\\n        <\\/button>\\n      <\\/div>\\n\\n      <div class=\\\"admin-toolbar panel\\\">\\n        <div class=\\\"search-box\\\" style=\\\"flex: 1\\\">\\n          <i data-lucide=\\\"search\\\" class=\\\"search-icon\\\"><\\/i>\\n          <input\\n            type=\\\"text\\\"\\n            id=\\\"admin-api-search\\\"\\n            class=\\\"input-control\\\"\\n            placeholder=\\\"Search API Hub entries by name, ID, or description...\\\"\\n            oninput=\\\"renderAdminApisList()\\\"\\n            style=\\\"padding-left: 2.75rem\\\"\\n          />\\n        <\\/div>\\n        <div class=\\\"filter-group\\\" style=\\\"display: flex; align-items: center; gap: 0.5rem\\\">\\n          <label for=\\\"admin-state-filter\\\" style=\\\"font-size: 0.875rem; color: var(--text-secondary)\\\">State:<\\/label>\\n          <select id=\\\"admin-state-filter\\\" class=\\\"input-control select-control\\\" onchange=\\\"renderAdminApisList()\\\">\\n            <option value=\\\"all\\\">All States<\\/option>\\n            <option value=\\\"active\\\">Active<\\/option>\\n            <option value=\\\"production\\\">Production<\\/option>\\n            <option value=\\\"staging\\\">Staging<\\/option>\\n            <option value=\\\"development\\\">Development<\\/option>\\n            <option value=\\\"deprecated\\\">Deprecated<\\/option>\\n            <option value=\\\"retired\\\">Retired<\\/option>\\n            <option value=\\\"unassigned\\\">Unassigned<\\/option>\\n          <\\/select>\\n        <\\/div>\\n      <\\/div>\\n\\n      <div class=\\\"panel admin-table-panel\\\">\\n        <div id=\\\"admin-apis-loading\\\" style=\\\"text-align: center; padding: 3rem; color: var(--text-muted)\\\">\\n          Loading API Hub entries...\\n        <\\/div>\\n        <table class=\\\"analytics-table admin-full-table\\\" id=\\\"admin-apis-table\\\" style=\\\"display: none\\\">\\n          <thead>\\n            <tr>\\n              <th>Display Name<\\/th>\\n              <th>Description<\\/th>\\n              <th>Deployment State<\\/th>\\n              <th>Linked Products<\\/th>\\n              <th style=\\\"text-align: right\\\">Actions<\\/th>\\n            <\\/tr>\\n          <\\/thead>\\n          <tbody id=\\\"admin-apis-tbody\\\"><\\/tbody>\\n        <\\/table>\\n      <\\/div>\\n    <\\/section>\\n\\n    <!-- SECTION 2: MANAGE MODELS (AI PROVIDERS & KVM PRICE LIST) -->\\n    <section id=\\\"admin-section-models\\\" class=\\\"admin-section\\\" style=\\\"display: none\\\">\\n      <div class=\\\"admin-section-header\\\">\\n        <div>\\n          <h1 style=\\\"font-size: 1.85rem; margin-bottom: 0.35rem\\\">Manage Models<\\/h1>\\n          <p style=\\\"color: var(--text-secondary)\\\">\\n            Maintain the LLM price list per model (saved to Apigee KVM <code>AI-Config / PriceList<\\/code> for proxy cost tracking).\\n          <\\/p>\\n        <\\/div>\\n        <div style=\\\"display: flex; gap: 0.65rem; flex-wrap: wrap\\\">\\n          <button class=\\\"btn btn-secondary btn-sm\\\" onclick=\\\"loadDefaultModelPrices()\\\">\\n            <i data-lucide=\\\"rotate-ccw\\\" style=\\\"width: 1rem; height: 1rem\\\"><\\/i>\\n            Load Defaults\\n          <\\/button>\\n          <button class=\\\"btn btn-secondary btn-sm\\\" onclick=\\\"openRawPricesModal()\\\">\\n            <i data-lucide=\\\"code\\\" style=\\\"width: 1rem; height: 1rem\\\"><\\/i>\\n            Raw JSON\\n          <\\/button>\\n          <button class=\\\"btn btn-secondary btn-sm\\\" onclick=\\\"openModelPriceModal()\\\">\\n            <i data-lucide=\\\"plus\\\" style=\\\"width: 1rem; height: 1rem\\\"><\\/i>\\n            Add Model\\n          <\\/button>\\n          <button class=\\\"btn btn-primary btn-sm\\\" id=\\\"btn-save-prices-kvm\\\" onclick=\\\"saveModelPricesToKvm()\\\">\\n            <i data-lucide=\\\"cloud-upload\\\" style=\\\"width: 1rem; height: 1rem\\\"><\\/i>\\n            Save to KVM\\n          <\\/button>\\n        <\\/div>\\n      <\\/div>\\n\\n      <div class=\\\"admin-toolbar panel\\\" style=\\\"flex-wrap: wrap\\\">\\n        <div class=\\\"search-box\\\" style=\\\"flex: 1; min-width: 220px\\\">\\n          <i data-lucide=\\\"search\\\" class=\\\"search-icon\\\"><\\/i>\\n          <input\\n            type=\\\"text\\\"\\n            id=\\\"admin-model-search\\\"\\n            class=\\\"input-control\\\"\\n            placeholder=\\\"Filter models by name...\\\"\\n            oninput=\\\"renderModelPricesTable()\\\"\\n            style=\\\"padding-left: 2.75rem\\\"\\n          />\\n        <\\/div>\\n        <div style=\\\"display: flex; align-items: center; gap: 0.75rem; font-size: 0.85rem\\\">\\n          <span id=\\\"kvm-price-status-badge\\\" class=\\\"state-badge\\\">Checking KVM...<\\/span>\\n          <span id=\\\"admin-model-count\\\" style=\\\"color: var(--text-secondary)\\\">0 models<\\/span>\\n        <\\/div>\\n      <\\/div>\\n\\n      <div class=\\\"panel admin-table-panel\\\">\\n        <div id=\\\"admin-models-loading\\\" style=\\\"text-align: center; padding: 3rem; color: var(--text-muted)\\\">\\n          Loading LLM price list...\\n        <\\/div>\\n        <table class=\\\"analytics-table admin-full-table\\\" id=\\\"admin-models-table\\\" style=\\\"display: none\\\">\\n          <thead>\\n            <tr>\\n              <th>Model Identifier<\\/th>\\n              <th>Input ($ / 1M tokens)<\\/th>\\n              <th>Output ($ / 1M tokens)<\\/th>\\n              <th>Cached Input ($ / 1M tokens)<\\/th>\\n              <th style=\\\"text-align: right\\\">Actions<\\/th>\\n            <\\/tr>\\n          <\\/thead>\\n          <tbody id=\\\"admin-models-tbody\\\"><\\/tbody>\\n        <\\/table>\\n      <\\/div>\\n    <\\/section>\\n\\n    <!-- SECTION 3: GLOBAL ANALYTICS -->\\n    <section id=\\\"admin-section-analytics\\\" class=\\\"admin-section\\\" style=\\\"display: none\\\">\\n      <div class=\\\"admin-section-header\\\">\\n        <div>\\n          <h1 style=\\\"font-size: 1.85rem; margin-bottom: 0.35rem\\\">Global Analytics<\\/h1>\\n          <p style=\\\"color: var(--text-secondary)\\\">\\n            Inspect organization-wide model, token, latency, and cost usage across all users and products.\\n          <\\/p>\\n        <\\/div>\\n        <button class=\\\"btn btn-secondary btn-sm\\\" onclick=\\\"fetchGlobalAnalytics(true)\\\">\\n          <i data-lucide=\\\"refresh-cw\\\" style=\\\"width: 1rem; height: 1rem\\\"><\\/i>\\n          Reload\\n        <\\/button>\\n      <\\/div>\\n\\n      <div class=\\\"admin-toolbar panel\\\" style=\\\"flex-wrap: wrap\\\">\\n        <div class=\\\"filter-group\\\" style=\\\"display: flex; align-items: center; gap: 0.5rem\\\">\\n          <label for=\\\"admin-filter-timeframe\\\" style=\\\"font-size: 0.875rem; color: var(--text-secondary)\\\">Timeframe:<\\/label>\\n          <select id=\\\"admin-filter-timeframe\\\" class=\\\"input-control select-control\\\" onchange=\\\"onGlobalAnalyticsQueryChange()\\\">\\n            <option value=\\\"month\\\" selected>Current Month<\\/option>\\n            <option value=\\\"week\\\">Last 7 Days (Week)<\\/option>\\n            <option value=\\\"day\\\">Last 24 Hours (Day)<\\/option>\\n            <option value=\\\"year\\\">Current Year<\\/option>\\n            <option value=\\\"all\\\">All Time<\\/option>\\n          <\\/select>\\n        <\\/div>\\n\\n        <div class=\\\"filter-group\\\" style=\\\"display: flex; align-items: center; gap: 0.5rem\\\">\\n          <label for=\\\"admin-filter-model\\\" style=\\\"font-size: 0.875rem; color: var(--text-secondary)\\\">Model:<\\/label>\\n          <select id=\\\"admin-filter-model\\\" class=\\\"input-control select-control\\\" onchange=\\\"renderGlobalAnalytics()\\\">\\n            <option value=\\\"all\\\">All Models<\\/option>\\n          <\\/select>\\n        <\\/div>\\n\\n        <div class=\\\"filter-group\\\" style=\\\"display: flex; align-items: center; gap: 0.5rem\\\">\\n          <label for=\\\"admin-filter-user\\\" style=\\\"font-size: 0.875rem; color: var(--text-secondary)\\\">User:<\\/label>\\n          <select id=\\\"admin-filter-user\\\" class=\\\"input-control select-control\\\" onchange=\\\"renderGlobalAnalytics()\\\">\\n            <option value=\\\"all\\\">All Users<\\/option>\\n          <\\/select>\\n        <\\/div>\\n\\n        <div class=\\\"filter-group\\\" style=\\\"display: flex; align-items: center; gap: 0.5rem\\\">\\n          <label for=\\\"admin-filter-cost\\\" style=\\\"font-size: 0.875rem; color: var(--text-secondary)\\\">Min Cost:<\\/label>\\n          <select id=\\\"admin-filter-cost\\\" class=\\\"input-control select-control\\\" onchange=\\\"renderGlobalAnalytics()\\\">\\n            <option value=\\\"0\\\">All Costs<\\/option>\\n            <option value=\\\"0.01\\\">&ge; $0.01<\\/option>\\n            <option value=\\\"0.10\\\">&ge; $0.10<\\/option>\\n            <option value=\\\"1.00\\\">&ge; $1.00<\\/option>\\n            <option value=\\\"10.00\\\">&ge; $10.00<\\/option>\\n          <\\/select>\\n        <\\/div>\\n\\n        <div class=\\\"filter-group\\\" style=\\\"display: flex; align-items: center; gap: 0.5rem\\\">\\n          <label for=\\\"admin-analytics-view\\\" style=\\\"font-size: 0.875rem; color: var(--text-secondary)\\\">View By:<\\/label>\\n          <select id=\\\"admin-analytics-view\\\" class=\\\"input-control select-control\\\" onchange=\\\"renderGlobalAnalytics()\\\">\\n            <option value=\\\"user_model\\\" selected>Model &amp; Cost per User<\\/option>\\n            <option value=\\\"model\\\">By Model<\\/option>\\n            <option value=\\\"user\\\">By User<\\/option>\\n            <option value=\\\"product\\\">By API Product<\\/option>\\n          <\\/select>\\n        <\\/div>\\n      <\\/div>\\n\\n      <div id=\\\"admin-analytics-loading\\\" class=\\\"panel\\\" style=\\\"text-align: center; padding: 4rem 2rem\\\">\\n        <p style=\\\"color: var(--text-secondary)\\\">Loading global analytics across all users and models...<\\/p>\\n      <\\/div>\\n\\n      <div id=\\\"admin-analytics-content\\\" style=\\\"display: none\\\">\\n        <div class=\\\"kpi-grid\\\" style=\\\"margin-bottom: 2rem\\\">\\n          <div class=\\\"kpi-card panel\\\">\\n            <div class=\\\"kpi-icon-box\\\" style=\\\"background: rgba(99, 102, 241, 0.15); color: #6366f1\\\">\\n              <i data-lucide=\\\"activity\\\" style=\\\"width: 1.5rem; height: 1.5rem\\\"><\\/i>\\n            <\\/div>\\n            <div>\\n              <span class=\\\"kpi-label\\\">Global Requests<\\/span>\\n              <h2 class=\\\"kpi-value-text\\\" id=\\\"admin-kpi-requests\\\">0<\\/h2>\\n            <\\/div>\\n          <\\/div>\\n\\n          <div class=\\\"kpi-card panel\\\">\\n            <div class=\\\"kpi-icon-box\\\" style=\\\"background: rgba(16, 185, 129, 0.15); color: #10b981\\\">\\n              <i data-lucide=\\\"cpu\\\" style=\\\"width: 1.5rem; height: 1.5rem\\\"><\\/i>\\n            <\\/div>\\n            <div>\\n              <span class=\\\"kpi-label\\\">Global LLM Tokens<\\/span>\\n              <h2 class=\\\"kpi-value-text\\\" id=\\\"admin-kpi-tokens\\\">0<\\/h2>\\n            <\\/div>\\n          <\\/div>\\n\\n          <div class=\\\"kpi-card panel\\\">\\n            <div class=\\\"kpi-icon-box\\\" style=\\\"background: rgba(245, 158, 11, 0.15); color: #f59e0b\\\">\\n              <i data-lucide=\\\"zap\\\" style=\\\"width: 1.5rem; height: 1.5rem\\\"><\\/i>\\n            <\\/div>\\n            <div>\\n              <span class=\\\"kpi-label\\\">Global Avg TTFT<\\/span>\\n              <h2 class=\\\"kpi-value-text\\\" id=\\\"admin-kpi-ttft\\\">0 ms<\\/h2>\\n            <\\/div>\\n          <\\/div>\\n\\n          <div class=\\\"kpi-card panel\\\">\\n            <div class=\\\"kpi-icon-box\\\" style=\\\"background: rgba(236, 72, 153, 0.15); color: #ec4899\\\">\\n              <i data-lucide=\\\"circle-dollar-sign\\\" style=\\\"width: 1.5rem; height: 1.5rem\\\"><\\/i>\\n            <\\/div>\\n            <div>\\n              <span class=\\\"kpi-label\\\">Global Est. Cost<\\/span>\\n              <h2 class=\\\"kpi-value-text\\\" id=\\\"admin-kpi-cost\\\">$0.00<\\/h2>\\n            <\\/div>\\n          <\\/div>\\n        <\\/div>\\n\\n        <div class=\\\"charts-layout\\\" style=\\\"margin-bottom: 2rem\\\">\\n          <div class=\\\"panel chart-card\\\">\\n            <h3>Global Token Usage by Model<\\/h3>\\n            <div class=\\\"chart-container-box\\\">\\n              <canvas id=\\\"admin-chart-models\\\"><\\/canvas>\\n            <\\/div>\\n          <\\/div>\\n\\n          <div class=\\\"panel chart-card\\\">\\n            <h3>Global Token Usage by User<\\/h3>\\n            <div class=\\\"chart-container-box\\\">\\n              <canvas id=\\\"admin-chart-users\\\"><\\/canvas>\\n            <\\/div>\\n          <\\/div>\\n        <\\/div>\\n\\n        <div class=\\\"panel admin-table-panel\\\">\\n          <h3 id=\\\"admin-breakdown-title\\\" style=\\\"margin-bottom: 1rem\\\">Global Usage Breakdown<\\/h3>\\n          <table class=\\\"analytics-table admin-full-table\\\">\\n            <thead>\\n              <tr id=\\\"admin-breakdown-thead-row\\\">\\n                <th id=\\\"admin-breakdown-dim-header\\\">Dimension<\\/th>\\n                <th>Requests<\\/th>\\n                <th>Prompt Tokens<\\/th>\\n                <th>Response Tokens<\\/th>\\n                <th>Total Tokens<\\/th>\\n                <th>Avg TTFT<\\/th>\\n                <th>Est. Cost<\\/th>\\n              <\\/tr>\\n            <\\/thead>\\n            <tbody id=\\\"admin-analytics-table-body\\\"><\\/tbody>\\n          <\\/table>\\n        <\\/div>\\n      <\\/div>\\n    <\\/section>\\n  <\\/div>\\n<\\/div>\\n\\n<!-- MODAL: Edit API Hub Catalogue Metadata -->\\n<dialog id=\\\"admin-edit-dialog\\\" class=\\\"auth-dialog\\\" style=\\\"max-width: 560px; width: 92%\\\">\\n  <div class=\\\"auth-header\\\">\\n    <h3 style=\\\"display: flex; align-items: center; gap: 0.5rem; margin: 0\\\">\\n      <i data-lucide=\\\"pencil\\\" style=\\\"width: 1.15rem; height: 1.15rem; color: var(--primary)\\\"><\\/i>\\n      Edit Catalogue Entry\\n    <\\/h3>\\n    <button class=\\\"close-btn\\\" onclick=\\\"closeAdminEditPanel()\\\" aria-label=\\\"Close modal\\\">\\n      <i data-lucide=\\\"x\\\" style=\\\"width: 1.25rem; height: 1.25rem\\\"><\\/i>\\n    <\\/button>\\n  <\\/div>\\n  <form id=\\\"admin-edit-form\\\" onsubmit=\\\"saveAdminApiMetadata(event)\\\">\\n    <input type=\\\"hidden\\\" id=\\\"edit-api-id\\\" />\\n    <input type=\\\"hidden\\\" id=\\\"edit-deployment-id\\\" />\\n\\n    <div class=\\\"auth-form-group\\\">\\n      <label for=\\\"edit-api-resource\\\">API Hub Resource ID<\\/label>\\n      <input type=\\\"text\\\" id=\\\"edit-api-resource\\\" class=\\\"input-control\\\" disabled style=\\\"opacity: 0.7\\\" />\\n    <\\/div>\\n\\n    <div class=\\\"auth-form-group\\\">\\n      <label for=\\\"edit-api-display-name\\\">Display Name<\\/label>\\n      <input type=\\\"text\\\" id=\\\"edit-api-display-name\\\" class=\\\"input-control\\\" required placeholder=\\\"Enter display name\\\" />\\n    <\\/div>\\n\\n    <div class=\\\"auth-form-group\\\">\\n      <label for=\\\"edit-api-description\\\">Description<\\/label>\\n      <textarea\\n        id=\\\"edit-api-description\\\"\\n        class=\\\"input-control\\\"\\n        rows=\\\"4\\\"\\n        placeholder=\\\"Describe this AI product, capabilities, and usage notes...\\\"\\n        style=\\\"resize: vertical\\\"\\n      ><\\/textarea>\\n    <\\/div>\\n\\n    <div class=\\\"auth-form-group\\\">\\n      <label for=\\\"edit-deployment-state\\\">Deployment State<\\/label>\\n      <select id=\\\"edit-deployment-state\\\" class=\\\"input-control select-control\\\">\\n        <option value=\\\"active\\\">Active<\\/option>\\n        <option value=\\\"production\\\">Production<\\/option>\\n        <option value=\\\"staging\\\">Staging<\\/option>\\n        <option value=\\\"development\\\">Development<\\/option>\\n        <option value=\\\"deprecated\\\">Deprecated<\\/option>\\n        <option value=\\\"retired\\\">Retired<\\/option>\\n      <\\/select>\\n      <small id=\\\"edit-deployment-hint\\\" style=\\\"color: var(--text-muted); display: block; margin-top: 0.35rem\\\"><\\/small>\\n    <\\/div>\\n\\n    <div style=\\\"display: flex; gap: 0.75rem; margin-top: 1.5rem\\\">\\n      <button type=\\\"submit\\\" class=\\\"btn btn-primary\\\" id=\\\"btn-save-admin-api\\\" style=\\\"flex: 1\\\">\\n        <i data-lucide=\\\"save\\\" style=\\\"width: 1rem; height: 1rem\\\"><\\/i>\\n        Save to API Hub\\n      <\\/button>\\n      <button type=\\\"button\\\" class=\\\"btn btn-secondary\\\" onclick=\\\"closeAdminEditPanel()\\\">Cancel<\\/button>\\n    <\\/div>\\n  <\\/form>\\n<\\/dialog>\\n\\n<!-- MODAL: Add / Edit Model Price -->\\n<dialog id=\\\"admin-model-price-dialog\\\" class=\\\"auth-dialog\\\" style=\\\"max-width: 480px; width: 92%\\\">\\n  <div class=\\\"auth-header\\\">\\n    <h3 id=\\\"model-price-modal-title\\\" style=\\\"margin: 0\\\">Add / Edit Model Price<\\/h3>\\n    <button class=\\\"close-btn\\\" onclick=\\\"document.getElementById('admin-model-price-dialog').close()\\\" aria-label=\\\"Close modal\\\">\\n      <i data-lucide=\\\"x\\\" style=\\\"width: 1.25rem; height: 1.25rem\\\"><\\/i>\\n    <\\/button>\\n  <\\/div>\\n  <form onsubmit=\\\"saveModelPriceEntry(event)\\\">\\n    <div class=\\\"auth-form-group\\\">\\n      <label for=\\\"price-model-name\\\">Model Name (or \\\"default\\\")<\\/label>\\n      <input type=\\\"text\\\" id=\\\"price-model-name\\\" class=\\\"input-control\\\" required placeholder=\\\"e.g. gemini-2.5-flash\\\" />\\n    <\\/div>\\n    <div class=\\\"auth-form-group\\\">\\n      <label for=\\\"price-req-per-m\\\">Input / Prompt ($ per 1M tokens)<\\/label>\\n      <input type=\\\"number\\\" step=\\\"any\\\" min=\\\"0\\\" id=\\\"price-req-per-m\\\" class=\\\"input-control\\\" required placeholder=\\\"0.10\\\" />\\n    <\\/div>\\n    <div class=\\\"auth-form-group\\\">\\n      <label for=\\\"price-resp-per-m\\\">Output / Response ($ per 1M tokens)<\\/label>\\n      <input type=\\\"number\\\" step=\\\"any\\\" min=\\\"0\\\" id=\\\"price-resp-per-m\\\" class=\\\"input-control\\\" required placeholder=\\\"0.40\\\" />\\n    <\\/div>\\n    <div class=\\\"auth-form-group\\\">\\n      <label for=\\\"price-cached-per-m\\\">Cached Input ($ per 1M tokens)<\\/label>\\n      <input type=\\\"number\\\" step=\\\"any\\\" min=\\\"0\\\" id=\\\"price-cached-per-m\\\" class=\\\"input-control\\\" placeholder=\\\"0.025\\\" />\\n    <\\/div>\\n    <div style=\\\"display: flex; gap: 0.75rem; margin-top: 1.5rem\\\">\\n      <button type=\\\"submit\\\" class=\\\"btn btn-primary\\\" style=\\\"flex: 1\\\">Update Price List<\\/button>\\n      <button type=\\\"button\\\" class=\\\"btn btn-secondary\\\" onclick=\\\"document.getElementById('admin-model-price-dialog').close()\\\">Cancel<\\/button>\\n    <\\/div>\\n  <\\/form>\\n<\\/dialog>\\n\\n<!-- MODAL: Raw PriceList JSON -->\\n<dialog id=\\\"admin-raw-prices-dialog\\\" class=\\\"auth-dialog\\\" style=\\\"max-width: 640px; width: 92%\\\">\\n  <div class=\\\"auth-header\\\">\\n    <h3 style=\\\"margin: 0\\\">Edit PriceList JSON<\\/h3>\\n    <button class=\\\"close-btn\\\" onclick=\\\"document.getElementById('admin-raw-prices-dialog').close()\\\" aria-label=\\\"Close modal\\\">\\n      <i data-lucide=\\\"x\\\" style=\\\"width: 1.25rem; height: 1.25rem\\\"><\\/i>\\n    <\\/button>\\n  <\\/div>\\n  <form onsubmit=\\\"applyRawPricesJson(event)\\\">\\n    <div class=\\\"auth-form-group\\\">\\n      <textarea id=\\\"raw-prices-textarea\\\" class=\\\"input-control\\\" rows=\\\"14\\\" style=\\\"font-family: monospace; font-size: 0.85rem\\\"><\\/textarea>\\n    <\\/div>\\n    <div style=\\\"display: flex; gap: 0.75rem; margin-top: 1rem\\\">\\n      <button type=\\\"submit\\\" class=\\\"btn btn-primary\\\" style=\\\"flex: 1\\\">Apply JSON<\\/button>\\n      <button type=\\\"button\\\" class=\\\"btn btn-secondary\\\" onclick=\\\"document.getElementById('admin-raw-prices-dialog').close()\\\">Cancel<\\/button>\\n    <\\/div>\\n  <\\/form>\\n<\\/dialog>\\n\\n<style>\\n  .admin-shell {\\n    max-width: 1440px;\\n    width: 100%;\\n    margin: 0 auto;\\n    padding: 2rem 1.5rem 4rem;\\n    display: grid;\\n    grid-template-columns: 240px minmax(0, 1fr);\\n    gap: 1.75rem;\\n    align-items: start;\\n  }\\n  @media (max-width: 900px) {\\n    .admin-shell {\\n      grid-template-columns: 1fr;\\n    }\\n  }\\n  .admin-sidebar {\\n    padding: 1.25rem;\\n    position: sticky;\\n    top: 5.5rem;\\n  }\\n  .admin-sidebar-header {\\n    padding-bottom: 1rem;\\n    margin-bottom: 1rem;\\n    border-bottom: 1px solid var(--border-color);\\n  }\\n  .admin-sidebar-badge {\\n    display: inline-flex;\\n    align-items: center;\\n    gap: 0.5rem;\\n    font-weight: 700;\\n    font-size: 0.95rem;\\n    color: var(--text-primary);\\n  }\\n  .admin-nav {\\n    display: flex;\\n    flex-direction: column;\\n    gap: 0.35rem;\\n  }\\n  .admin-nav-item {\\n    display: flex;\\n    align-items: center;\\n    gap: 0.75rem;\\n    width: 100%;\\n    padding: 0.65rem 0.85rem;\\n    border: 1px solid transparent;\\n    border-radius: 0.5rem;\\n    background: transparent;\\n    color: var(--text-secondary);\\n    font-size: 0.9rem;\\n    font-weight: 500;\\n    cursor: pointer;\\n    text-align: left;\\n    transition: all var(--transition-fast);\\n  }\\n  .admin-nav-item:hover {\\n    background: var(--primary-light);\\n    color: var(--text-primary);\\n  }\\n  .admin-nav-item.active {\\n    background: var(--primary);\\n    color: #fff;\\n    font-weight: 600;\\n  }\\n  .admin-main {\\n    min-width: 0;\\n    width: 100%;\\n  }\\n  .admin-section-header {\\n    display: flex;\\n    justify-content: space-between;\\n    align-items: flex-end;\\n    gap: 1rem;\\n    margin-bottom: 1.5rem;\\n    flex-wrap: wrap;\\n  }\\n  .admin-toolbar {\\n    display: flex;\\n    gap: 1rem;\\n    align-items: center;\\n    padding: 1rem 1.25rem;\\n    margin-bottom: 1.5rem;\\n    width: 100%;\\n  }\\n  .admin-table-panel {\\n    width: 100%;\\n    padding: 1.25rem;\\n    overflow-x: auto;\\n  }\\n  .admin-full-table {\\n    width: 100%;\\n    border-collapse: collapse;\\n  }\\n  .state-badge {\\n    display: inline-flex;\\n    align-items: center;\\n    padding: 0.2rem 0.65rem;\\n    border-radius: 9999px;\\n    font-size: 0.75rem;\\n    font-weight: 600;\\n    text-transform: capitalize;\\n    background: rgba(99, 102, 241, 0.15);\\n    color: #818cf8;\\n  }\\n  .state-badge.active,\\n  .state-badge.production {\\n    background: rgba(16, 185, 129, 0.15);\\n    color: #34d399;\\n  }\\n  .state-badge.staging,\\n  .state-badge.development {\\n    background: rgba(245, 158, 11, 0.15);\\n    color: #fbbf24;\\n  }\\n  .state-badge.deprecated,\\n  .state-badge.retired {\\n    background: rgba(239, 68, 68, 0.15);\\n    color: #f87171;\\n  }\\n<\\/style>\\n\\n<script>\\n  var adminApisList = [];\\n  var adminModelPrices = {};\\n  var adminPricesModified = false;\\n  var globalAnalyticsRaw = null;\\n  var adminModelChart = null;\\n  var adminUserChart = null;\\n\\n  var DEFAULT_MODEL_PRICES = {\\n    \\\"default\\\": { requestPerMillionTokens: 1.0, responsePerMillionTokens: 3.0, cachedRequestPerMillionTokens: 0.25 },\\n    \\\"gemini-2.5-flash\\\": { requestPerMillionTokens: 0.10, responsePerMillionTokens: 0.40, cachedRequestPerMillionTokens: 0.025 },\\n    \\\"gemini-2.5-pro\\\": { requestPerMillionTokens: 1.25, responsePerMillionTokens: 5.0, cachedRequestPerMillionTokens: 0.3125 },\\n    \\\"gemini-3-flash-preview\\\": { requestPerMillionTokens: 0.15, responsePerMillionTokens: 0.60, cachedRequestPerMillionTokens: 0.0375 },\\n    \\\"claude-sonnet-4-6\\\": { requestPerMillionTokens: 3.0, responsePerMillionTokens: 15.0, cachedRequestPerMillionTokens: 0.30 },\\n    \\\"claude-opus-4-6\\\": { requestPerMillionTokens: 15.0, responsePerMillionTokens: 75.0, cachedRequestPerMillionTokens: 1.50 },\\n    \\\"claude-haiku-4-5\\\": { requestPerMillionTokens: 0.80, responsePerMillionTokens: 4.0, cachedRequestPerMillionTokens: 0.08 },\\n    \\\"qwen3-next-80b-a3b-thinking-maas\\\": { requestPerMillionTokens: 0.40, responsePerMillionTokens: 1.20, cachedRequestPerMillionTokens: 0.10 },\\n    \\\"deepseek-v3.2-maas\\\": { requestPerMillionTokens: 0.27, responsePerMillionTokens: 1.10, cachedRequestPerMillionTokens: 0.07 }\\n  };\\n\\n  window.viewInitializers[\\\"admin\\\"] = async function (param) {\\n    let editTargetId = null;\\n    if (param && param.startsWith(\\\"edit/\\\")) {\\n      editTargetId = decodeURIComponent(param.slice(5));\\n    }\\n\\n    await fetchAdminApis(false);\\n\\n    if (editTargetId) {\\n      switchAdminSection(\\\"catalogue\\\");\\n      openAdminEditPanel(editTargetId);\\n    } else if (param === \\\"models\\\" || param === \\\"analytics\\\" || param === \\\"catalogue\\\") {\\n      switchAdminSection(param);\\n    }\\n  };\\n\\n  function switchAdminSection(section) {\\n    const sections = [\\\"catalogue\\\", \\\"models\\\", \\\"analytics\\\"];\\n    sections.forEach((s) => {\\n      const panel = document.getElementById(`admin-section-${s}`);\\n      const nav = document.getElementById(`nav-admin-${s}`);\\n      if (panel) panel.style.display = s === section ? \\\"block\\\" : \\\"none\\\";\\n      if (nav) nav.classList.toggle(\\\"active\\\", s === section);\\n    });\\n\\n    if (section === \\\"models\\\" && Object.keys(adminModelPrices).length === 0) {\\n      fetchModelPrices(false);\\n    }\\n    if (section === \\\"analytics\\\" && !globalAnalyticsRaw) {\\n      fetchGlobalAnalytics(false);\\n    }\\n    lucide.createIcons();\\n  }\\n\\n  /* =========================\\n     SECTION 1: MANAGE CATALOGUE\\n     ========================= */\\n  async function fetchAdminApis(forceRefresh) {\\n    const loader = document.getElementById(\\\"admin-apis-loading\\\");\\n    const table = document.getElementById(\\\"admin-apis-table\\\");\\n    const cacheKey = `portal_admin_apis_cache_${CONFIG.demoMode ? \\\"demo\\\" : CONFIG.portalId}`;\\n    const cachedApis = !forceRefresh ? app.getCachedData(cacheKey) : null;\\n    const hasCache = Array.isArray(cachedApis);\\n\\n    if (hasCache) {\\n      adminApisList = cachedApis;\\n      renderAdminApisList();\\n      app.hideGlobalLoader();\\n      if (loader) loader.style.display = \\\"none\\\";\\n      if (table) table.style.display = \\\"table\\\";\\n      if (!forceRefresh && app.getCacheAgeMs(cacheKey) < 30000) return;\\n    } else {\\n      app.showGlobalLoader(\\\"Loading API Hub catalogue...\\\");\\n      if (loader) loader.style.display = \\\"block\\\";\\n      if (table) table.style.display = \\\"none\\\";\\n    }\\n\\n    try {\\n      if (CONFIG.demoMode) {\\n        if (!app.products || app.products.length === 0) {\\n          await app.loadProductsWithCache();\\n        }\\n        const overrides = JSON.parse(localStorage.getItem(\\\"portal_demo_apihub_overrides\\\") || \\\"{}\\\");\\n        adminApisList = (app.products || []).map((p) => {\\n          const ov = overrides[p.id] || {};\\n          return {\\n            id: p.id,\\n            name: `projects/demo/locations/europe-west1/apis/${p.id}`,\\n            displayName: ov.displayName !== undefined ? ov.displayName : p.displayName || p.name,\\n            description: ov.description !== undefined ? ov.description : p.displayDescription || \\\"\\\",\\n            deploymentState: ov.deploymentState || \\\"active\\\",\\n            deployment: { id: `dep-${p.id}`, state: ov.deploymentState || \\\"active\\\" },\\n            linkedProducts: (p.packages || []).map((pkg) => pkg.packageId),\\n          };\\n        });\\n      } else {\\n        const res = await app.makeRequest(`${CONFIG.apiHost}/api/portals/${CONFIG.portalId}/admin/apis`);\\n        if (!res.ok) throw new Error(`HTTP ${res.status}`);\\n        const data = await res.json();\\n        adminApisList = Array.isArray(data.apis) ? data.apis : [];\\n      }\\n\\n      app.setCachedData(cacheKey, adminApisList);\\n      renderAdminApisList();\\n      app.hideGlobalLoader();\\n      if (loader) loader.style.display = \\\"none\\\";\\n      if (table) table.style.display = \\\"table\\\";\\n    } catch (err) {\\n      console.error(\\\"Failed to fetch admin APIs:\\\", err);\\n      app.hideGlobalLoader();\\n      if (!hasCache && loader) {\\n        loader.innerHTML = `<span style=\\\"color:var(--danger);\\\">Failed to load API Hub entries: ${err.message}<\\/span>`;\\n      }\\n    }\\n  }\\n\\n  function renderAdminApisList() {\\n    const tbody = document.getElementById(\\\"admin-apis-tbody\\\");\\n    if (!tbody) return;\\n\\n    const query = (document.getElementById(\\\"admin-api-search\\\")?.value || \\\"\\\").toLowerCase().trim();\\n    const stateFilter = document.getElementById(\\\"admin-state-filter\\\")?.value || \\\"all\\\";\\n\\n    const filtered = adminApisList.filter((item) => {\\n      const state = (item.deploymentState || \\\"unassigned\\\").toLowerCase();\\n      if (stateFilter !== \\\"all\\\" && state !== stateFilter) return false;\\n      if (!query) return true;\\n      return (\\n        (item.displayName || \\\"\\\").toLowerCase().includes(query) ||\\n        (item.id || \\\"\\\").toLowerCase().includes(query) ||\\n        (item.description || \\\"\\\").toLowerCase().includes(query)\\n      );\\n    });\\n\\n    if (filtered.length === 0) {\\n      tbody.innerHTML = `<tr><td colspan=\\\"5\\\" style=\\\"text-align:center; padding:2rem; color:var(--text-muted);\\\">No API Hub entries match your filter.<\\/td><\\/tr>`;\\n      return;\\n    }\\n\\n    tbody.innerHTML = filtered\\n      .map((item) => {\\n        const state = (item.deploymentState || \\\"unassigned\\\").toLowerCase();\\n        const desc = item.description\\n          ? item.description.length > 110\\n            ? item.description.slice(0, 110) + \\\"...\\\"\\n            : item.description\\n          : '<span style=\\\"color:var(--text-muted); font-style:italic;\\\">No description<\\/span>';\\n        const linkedCount = (item.linkedProducts || []).length;\\n        return `\\n        <tr>\\n          <td>\\n            <div style=\\\"font-weight:600;\\\">${item.displayName || item.id}<\\/div>\\n            <div style=\\\"font-size:0.75rem; color:var(--text-muted);\\\">${item.id}<\\/div>\\n          <\\/td>\\n          <td style=\\\"font-size:0.875rem; color:var(--text-secondary);\\\">${desc}<\\/td>\\n          <td><span class=\\\"state-badge ${state}\\\">${item.deploymentState || \\\"unassigned\\\"}<\\/span><\\/td>\\n          <td>${linkedCount > 0 ? `${linkedCount} product${linkedCount > 1 ? \\\"s\\\" : \\\"\\\"}` : '<span style=\\\"color:var(--text-muted);\\\">None<\\/span>'}<\\/td>\\n          <td style=\\\"text-align:right;\\\">\\n            <button class=\\\"btn btn-secondary btn-sm\\\" onclick=\\\"openAdminEditPanel('${item.id}')\\\">\\n              <i data-lucide=\\\"pencil\\\" style=\\\"width:0.85rem; height:0.85rem;\\\"><\\/i>\\n              Edit\\n            <\\/button>\\n          <\\/td>\\n        <\\/tr>\\n      `;\\n      })\\n      .join(\\\"\\\");\\n\\n    lucide.createIcons();\\n  }\\n\\n  function openAdminEditPanel(apiId) {\\n    const item = adminApisList.find((a) => a.id === apiId);\\n    if (!item) {\\n      app.showToast(`API Hub entry '${apiId}' not found`, \\\"warning\\\");\\n      return;\\n    }\\n\\n    document.getElementById(\\\"edit-api-id\\\").value = item.id;\\n    document.getElementById(\\\"edit-api-resource\\\").value = item.name || item.id;\\n    document.getElementById(\\\"edit-api-display-name\\\").value = item.displayName || \\\"\\\";\\n    document.getElementById(\\\"edit-api-description\\\").value = item.description || \\\"\\\";\\n\\n    const depId = item.deployment ? item.deployment.id : \\\"\\\";\\n    document.getElementById(\\\"edit-deployment-id\\\").value = depId;\\n\\n    const stateSelect = document.getElementById(\\\"edit-deployment-state\\\");\\n    const stateVal = (item.deploymentState || \\\"active\\\").toLowerCase();\\n    if (!Array.from(stateSelect.options).some((o) => o.value === stateVal)) {\\n      const opt = document.createElement(\\\"option\\\");\\n      opt.value = stateVal;\\n      opt.textContent = item.deploymentState || stateVal;\\n      stateSelect.appendChild(opt);\\n    }\\n    stateSelect.value = stateVal;\\n    stateSelect.disabled = !depId;\\n\\n    document.getElementById(\\\"edit-deployment-hint\\\").textContent = depId\\n      ? `Linked deployment: ${depId}`\\n      : \\\"No API Hub deployment is currently linked to this API version.\\\";\\n\\n    const dialog = document.getElementById(\\\"admin-edit-dialog\\\");\\n    if (dialog && typeof dialog.showModal === \\\"function\\\") {\\n      dialog.showModal();\\n    }\\n    lucide.createIcons();\\n  }\\n\\n  function closeAdminEditPanel() {\\n    const dialog = document.getElementById(\\\"admin-edit-dialog\\\");\\n    if (dialog && dialog.open) dialog.close();\\n  }\\n\\n  async function saveAdminApiMetadata(event) {\\n    event.preventDefault();\\n    const apiId = document.getElementById(\\\"edit-api-id\\\").value;\\n    const displayName = document.getElementById(\\\"edit-api-display-name\\\").value.trim();\\n    const description = document.getElementById(\\\"edit-api-description\\\").value.trim();\\n    const deploymentId = document.getElementById(\\\"edit-deployment-id\\\").value;\\n    const deploymentState = document.getElementById(\\\"edit-deployment-state\\\").value;\\n\\n    const saveBtn = document.getElementById(\\\"btn-save-admin-api\\\");\\n    saveBtn.disabled = true;\\n\\n    try {\\n      if (CONFIG.demoMode) {\\n        const overrides = JSON.parse(localStorage.getItem(\\\"portal_demo_apihub_overrides\\\") || \\\"{}\\\");\\n        overrides[apiId] = { displayName, description, deploymentState };\\n        localStorage.setItem(\\\"portal_demo_apihub_overrides\\\", JSON.stringify(overrides));\\n        const prod = (app.products || []).find((p) => p.id === apiId);\\n        if (prod) {\\n          prod.displayName = displayName;\\n          prod.displayDescription = description;\\n        }\\n      } else {\\n        const payload = { displayName, description };\\n        if (deploymentId) {\\n          payload.deploymentId = deploymentId;\\n          payload.deploymentState = deploymentState;\\n        }\\n        const res = await app.makeRequest(\\n          `${CONFIG.apiHost}/api/portals/${CONFIG.portalId}/admin/apis/${encodeURIComponent(apiId)}`,\\n          {\\n            method: \\\"PATCH\\\",\\n            headers: { \\\"Content-Type\\\": \\\"application/json\\\" },\\n            body: JSON.stringify(payload),\\n          },\\n        );\\n        if (!res.ok) {\\n          const err = await res.json().catch(() => ({}));\\n          throw new Error(err.error || `HTTP ${res.status}`);\\n        }\\n      }\\n\\n      const target = adminApisList.find((a) => a.id === apiId);\\n      if (target) {\\n        target.displayName = displayName;\\n        target.description = description;\\n        if (deploymentId) target.deploymentState = deploymentState;\\n      }\\n\\n      app.setCachedData(`portal_admin_apis_cache_${CONFIG.demoMode ? \\\"demo\\\" : CONFIG.portalId}`, adminApisList);\\n      renderAdminApisList();\\n      closeAdminEditPanel();\\n      app.showToast(\\\"API Hub metadata saved!\\\", \\\"success\\\");\\n    } catch (err) {\\n      console.error(\\\"Failed to save API Hub metadata:\\\", err);\\n      app.showToast(\\\"Save failed: \\\" + err.message, \\\"error\\\");\\n    } finally {\\n      saveBtn.disabled = false;\\n    }\\n  }\\n\\n  /* =========================\\n     SECTION 2: MANAGE MODELS (KVM PRICE LIST)\\n     ========================= */\\n  async function fetchModelPrices(forceRefresh) {\\n    const loader = document.getElementById(\\\"admin-models-loading\\\");\\n    const table = document.getElementById(\\\"admin-models-table\\\");\\n    const badge = document.getElementById(\\\"kvm-price-status-badge\\\");\\n    const cacheKey = `portal_admin_prices_cache_${CONFIG.demoMode ? \\\"demo\\\" : CONFIG.portalId}`;\\n    const cached = !forceRefresh ? app.getCachedData(cacheKey) : null;\\n\\n    if (cached && cached.prices) {\\n      adminModelPrices = cached.prices;\\n      app.setModelPricingTable(adminModelPrices);\\n      if (badge) {\\n        badge.textContent = cached.exists ? \\\"KVM: AI-Config / PriceList\\\" : \\\"Using Defaults\\\";\\n        badge.className = `state-badge ${cached.exists ? \\\"active\\\" : \\\"staging\\\"}`;\\n      }\\n      renderModelPricesTable();\\n      if (loader) loader.style.display = \\\"none\\\";\\n      if (table) table.style.display = \\\"table\\\";\\n      if (!forceRefresh && app.getCacheAgeMs(cacheKey) < 30000) return;\\n    } else {\\n      if (loader) loader.style.display = \\\"block\\\";\\n      if (table) table.style.display = \\\"none\\\";\\n    }\\n\\n    try {\\n      let result;\\n      if (CONFIG.demoMode) {\\n        const stored = app.getCachedData(\\\"portal_demo_model_prices\\\");\\n        result = {\\n          exists: Boolean(stored),\\n          prices: stored || Object.assign({}, DEFAULT_MODEL_PRICES),\\n        };\\n      } else {\\n        const res = await app.makeRequest(`${CONFIG.apiHost}/api/portals/${CONFIG.portalId}/admin/prices`);\\n        if (!res.ok) throw new Error(`HTTP ${res.status}`);\\n        result = await res.json();\\n      }\\n\\n      adminModelPrices = result.prices || Object.assign({}, DEFAULT_MODEL_PRICES);\\n      app.setCachedData(cacheKey, result);\\n      app.setModelPricingTable(adminModelPrices);\\n\\n      if (badge) {\\n        badge.textContent = result.exists ? \\\"KVM: AI-Config / PriceList\\\" : \\\"Using Defaults (Unsaved)\\\";\\n        badge.className = `state-badge ${result.exists ? \\\"active\\\" : \\\"staging\\\"}`;\\n      }\\n\\n      renderModelPricesTable();\\n      if (loader) loader.style.display = \\\"none\\\";\\n      if (table) table.style.display = \\\"table\\\";\\n    } catch (err) {\\n      console.error(\\\"Failed to fetch model prices:\\\", err);\\n      if (loader && !cached) {\\n        loader.innerHTML = `<span style=\\\"color:var(--danger);\\\">Failed to load model prices: ${err.message}<\\/span>`;\\n      }\\n    }\\n  }\\n\\n  function renderModelPricesTable() {\\n    const tbody = document.getElementById(\\\"admin-models-tbody\\\");\\n    const countEl = document.getElementById(\\\"admin-model-count\\\");\\n    if (!tbody) return;\\n\\n    const query = (document.getElementById(\\\"admin-model-search\\\")?.value || \\\"\\\").toLowerCase().trim();\\n    const entries = Object.entries(adminModelPrices)\\n      .filter(([name]) => !query || name.toLowerCase().includes(query))\\n      .sort(([a], [b]) => (a === \\\"default\\\" ? -1 : b === \\\"default\\\" ? 1 : a.localeCompare(b)));\\n\\n    if (countEl) countEl.textContent = `${Object.keys(adminModelPrices).length} models`;\\n\\n    if (entries.length === 0) {\\n      tbody.innerHTML = `<tr><td colspan=\\\"5\\\" style=\\\"text-align:center; padding:2rem; color:var(--text-muted);\\\">No models match your search.<\\/td><\\/tr>`;\\n      return;\\n    }\\n\\n    tbody.innerHTML = entries\\n      .map(([modelName, rate]) => {\\n        const req = Number(rate.requestPerMillionTokens || 0).toFixed(4).replace(/\\\\.?0+$/, \\\"\\\");\\n        const resp = Number(rate.responsePerMillionTokens || 0).toFixed(4).replace(/\\\\.?0+$/, \\\"\\\");\\n        const cached = Number(rate.cachedRequestPerMillionTokens || 0).toFixed(4).replace(/\\\\.?0+$/, \\\"\\\");\\n        return `\\n        <tr>\\n          <td style=\\\"font-weight:600;\\\">\\n            <code>${modelName}<\\/code>\\n            ${modelName === \\\"default\\\" ? '<span class=\\\"state-badge\\\" style=\\\"margin-left:0.5rem;\\\">Fallback<\\/span>' : \\\"\\\"}\\n          <\\/td>\\n          <td>$${req}<\\/td>\\n          <td>$${resp}<\\/td>\\n          <td>$${cached}<\\/td>\\n          <td style=\\\"text-align:right; white-space:nowrap;\\\">\\n            <button class=\\\"btn btn-secondary btn-sm\\\" onclick=\\\"openModelPriceModal('${modelName}')\\\">\\n              <i data-lucide=\\\"pencil\\\" style=\\\"width:0.85rem; height:0.85rem;\\\"><\\/i>\\n              Edit\\n            <\\/button>\\n            ${\\n              modelName !== \\\"default\\\"\\n                ? `<button class=\\\"btn btn-secondary btn-sm\\\" style=\\\"margin-left:0.35rem; color:var(--danger);\\\" onclick=\\\"deleteModelPrice('${modelName}')\\\" title=\\\"Remove model\\\">\\n                    <i data-lucide=\\\"trash-2\\\" style=\\\"width:0.85rem; height:0.85rem;\\\"><\\/i>\\n                  <\\/button>`\\n                : \\\"\\\"\\n            }\\n          <\\/td>\\n        <\\/tr>\\n      `;\\n      })\\n      .join(\\\"\\\");\\n\\n    lucide.createIcons();\\n  }\\n\\n  function openModelPriceModal(modelName = \\\"\\\") {\\n    const existing = modelName ? adminModelPrices[modelName] : null;\\n    document.getElementById(\\\"model-price-modal-title\\\").textContent = existing ? `Edit ${modelName}` : \\\"Add Model Price\\\";\\n    const nameInput = document.getElementById(\\\"price-model-name\\\");\\n    nameInput.value = modelName || \\\"\\\";\\n    nameInput.disabled = Boolean(existing);\\n    document.getElementById(\\\"price-req-per-m\\\").value = existing ? existing.requestPerMillionTokens : \\\"\\\";\\n    document.getElementById(\\\"price-resp-per-m\\\").value = existing ? existing.responsePerMillionTokens : \\\"\\\";\\n    document.getElementById(\\\"price-cached-per-m\\\").value = existing ? (existing.cachedRequestPerMillionTokens || 0) : \\\"0\\\";\\n    document.getElementById(\\\"admin-model-price-dialog\\\").showModal();\\n  }\\n\\n  function saveModelPriceEntry(event) {\\n    event.preventDefault();\\n    const modelName = document.getElementById(\\\"price-model-name\\\").value.trim();\\n    const req = parseFloat(document.getElementById(\\\"price-req-per-m\\\").value) || 0;\\n    const resp = parseFloat(document.getElementById(\\\"price-resp-per-m\\\").value) || 0;\\n    const cached = parseFloat(document.getElementById(\\\"price-cached-per-m\\\").value) || 0;\\n    if (!modelName) return;\\n\\n    adminModelPrices[modelName] = {\\n      requestPerMillionTokens: req,\\n      responsePerMillionTokens: resp,\\n      cachedRequestPerMillionTokens: cached,\\n    };\\n    markPricesModified();\\n    renderModelPricesTable();\\n    document.getElementById(\\\"admin-model-price-dialog\\\").close();\\n    app.showToast(`Updated ${modelName} (click \\\"Save to KVM\\\" to persist)`, \\\"info\\\");\\n  }\\n\\n  function deleteModelPrice(modelName) {\\n    delete adminModelPrices[modelName];\\n    markPricesModified();\\n    renderModelPricesTable();\\n  }\\n\\n  function loadDefaultModelPrices() {\\n    adminModelPrices = JSON.parse(JSON.stringify(DEFAULT_MODEL_PRICES));\\n    markPricesModified();\\n    renderModelPricesTable();\\n    app.showToast('Loaded default prices (click \\\"Save to KVM\\\" to persist)', \\\"info\\\");\\n  }\\n\\n  function openRawPricesModal() {\\n    document.getElementById(\\\"raw-prices-textarea\\\").value = JSON.stringify(adminModelPrices, null, 2);\\n    document.getElementById(\\\"admin-raw-prices-dialog\\\").showModal();\\n  }\\n\\n  function applyRawPricesJson(event) {\\n    event.preventDefault();\\n    try {\\n      const parsed = JSON.parse(document.getElementById(\\\"raw-prices-textarea\\\").value);\\n      if (!parsed || typeof parsed !== \\\"object\\\" || Array.isArray(parsed)) {\\n        throw new Error(\\\"Root must be a JSON object mapping model names to price objects.\\\");\\n      }\\n      adminModelPrices = parsed;\\n      markPricesModified();\\n      renderModelPricesTable();\\n      document.getElementById(\\\"admin-raw-prices-dialog\\\").close();\\n      app.showToast('Applied JSON (click \\\"Save to KVM\\\" to persist)', \\\"info\\\");\\n    } catch (e) {\\n      app.showToast(\\\"Invalid JSON: \\\" + e.message, \\\"error\\\");\\n    }\\n  }\\n\\n  function markPricesModified() {\\n    adminPricesModified = true;\\n    const badge = document.getElementById(\\\"kvm-price-status-badge\\\");\\n    if (badge) {\\n      badge.textContent = \\\"Unsaved Changes\\\";\\n      badge.className = \\\"state-badge staging\\\";\\n    }\\n  }\\n\\n  async function saveModelPricesToKvm() {\\n    const btn = document.getElementById(\\\"btn-save-prices-kvm\\\");\\n    btn.disabled = true;\\n    try {\\n      if (CONFIG.demoMode) {\\n        app.setCachedData(\\\"portal_demo_model_prices\\\", adminModelPrices);\\n      } else {\\n        const res = await app.makeRequest(`${CONFIG.apiHost}/api/portals/${CONFIG.portalId}/admin/prices`, {\\n          method: \\\"PUT\\\",\\n          headers: { \\\"Content-Type\\\": \\\"application/json\\\" },\\n          body: JSON.stringify({ prices: adminModelPrices }),\\n        });\\n        if (!res.ok) {\\n          const err = await res.json().catch(() => ({}));\\n          throw new Error(err.error || `HTTP ${res.status}`);\\n        }\\n      }\\n\\n      adminPricesModified = false;\\n      app.setModelPricingTable(adminModelPrices);\\n      app.setCachedData(`portal_admin_prices_cache_${CONFIG.demoMode ? \\\"demo\\\" : CONFIG.portalId}`, {\\n        exists: true,\\n        prices: adminModelPrices,\\n      });\\n\\n      const badge = document.getElementById(\\\"kvm-price-status-badge\\\");\\n      if (badge) {\\n        badge.textContent = \\\"KVM: AI-Config / PriceList\\\";\\n        badge.className = \\\"state-badge active\\\";\\n      }\\n      app.showToast(\\\"Model prices saved to Apigee KVM (AI-Config / PriceList)!\\\", \\\"success\\\");\\n    } catch (err) {\\n      console.error(\\\"Failed to save prices to KVM:\\\", err);\\n      app.showToast(\\\"Failed to save to KVM: \\\" + err.message, \\\"error\\\");\\n    } finally {\\n      btn.disabled = false;\\n    }\\n  }\\n\\n  /* =========================\\n     SECTION 3: GLOBAL ANALYTICS\\n     ========================= */\\n  var knownGlobalModels = new Set();\\n  var knownGlobalUsers = new Set();\\n\\n  function onGlobalAnalyticsQueryChange() {\\n    fetchGlobalAnalytics(false);\\n  }\\n\\n  function getTimeframeCutoffMs(tf) {\\n    const now = new Date();\\n    if (tf === \\\"day\\\") return now.getTime() - 24 * 60 * 60 * 1000;\\n    if (tf === \\\"week\\\") return now.getTime() - 7 * 24 * 60 * 60 * 1000;\\n    if (tf === \\\"month\\\") return new Date(now.getFullYear(), now.getMonth(), 1, 0, 0, 0).getTime();\\n    if (tf === \\\"year\\\") return new Date(now.getFullYear(), 0, 1, 0, 0, 0).getTime();\\n    return 0;\\n  }\\n\\n  async function fetchGlobalAnalytics(forceRefresh) {\\n    const loader = document.getElementById(\\\"admin-analytics-loading\\\");\\n    const content = document.getElementById(\\\"admin-analytics-content\\\");\\n    const timeframe = document.getElementById(\\\"admin-filter-timeframe\\\")?.value || \\\"month\\\";\\n\\n    const cacheKey = `portal_admin_analytics_cache_${CONFIG.demoMode ? \\\"demo\\\" : CONFIG.portalId}_${timeframe}`;\\n    const cached = !forceRefresh ? app.getCachedData(cacheKey) : null;\\n    const hasCache = Boolean(cached);\\n\\n    if (hasCache) {\\n      globalAnalyticsRaw = cached;\\n      populateGlobalAnalyticsFilters();\\n      renderGlobalAnalytics();\\n      app.hideGlobalLoader();\\n      if (loader) loader.style.display = \\\"none\\\";\\n      if (content) content.style.display = \\\"block\\\";\\n      if (!forceRefresh && app.getCacheAgeMs(cacheKey) < 30000) return;\\n    } else if (!globalAnalyticsRaw) {\\n      app.showGlobalLoader(\\\"Loading global analytics...\\\");\\n      if (loader) loader.style.display = \\\"block\\\";\\n      if (content) content.style.display = \\\"none\\\";\\n    }\\n\\n    try {\\n      if (CONFIG.demoMode) {\\n        const res = await fetch(\\\"/mock-analytics.json\\\");\\n        const mock = await res.json();\\n        const modelDims = mock.model?.[0]?.environments?.[0]?.dimensions || [];\\n        const demoUsers = [\\\"test@example.com\\\", \\\"alice@example.com\\\"];\\n        const umDims = [];\\n        modelDims.forEach((d, idx) => {\\n          const mName = d.individualNames?.[0];\\n          if (!mName || mName === \\\"(not set)\\\") return;\\n          const uName = demoUsers[idx % demoUsers.length];\\n          umDims.push({\\n            individualNames: [uName, mName],\\n            metrics: d.metrics || [],\\n          });\\n        });\\n        mock.userModel = [{ environments: [{ dimensions: umDims }] }];\\n        mock.user = [\\n          {\\n            environments: [\\n              {\\n                dimensions: [\\n                  {\\n                    individualNames: [\\\"test@example.com\\\"],\\n                    metrics: mock.app?.[0]?.environments?.[0]?.dimensions?.[0]?.metrics || [],\\n                  },\\n                  {\\n                    individualNames: [\\\"alice@example.com\\\"],\\n                    metrics: mock.app?.[0]?.environments?.[0]?.dimensions?.[1]?.metrics || [],\\n                  },\\n                ],\\n              },\\n            ],\\n          },\\n        ];\\n        globalAnalyticsRaw = mock;\\n      } else {\\n        const params = new URLSearchParams({ timeframe });\\n        const res = await app.makeRequest(\\n          `${CONFIG.apiHost}/api/portals/${CONFIG.portalId}/admin/analytics?${params.toString()}`,\\n        );\\n        if (!res.ok) throw new Error(`HTTP ${res.status}`);\\n        globalAnalyticsRaw = await res.json();\\n      }\\n\\n      app.setCachedData(cacheKey, globalAnalyticsRaw);\\n      populateGlobalAnalyticsFilters();\\n      renderGlobalAnalytics();\\n\\n      app.hideGlobalLoader();\\n      if (loader) loader.style.display = \\\"none\\\";\\n      if (content) content.style.display = \\\"block\\\";\\n    } catch (err) {\\n      console.error(\\\"Failed to fetch global analytics:\\\", err);\\n      app.hideGlobalLoader();\\n      if (!hasCache && loader) {\\n        loader.innerHTML = `<span style=\\\"color:var(--danger);\\\">Failed to load global analytics: ${err.message}<\\/span>`;\\n      }\\n    }\\n  }\\n\\n  function extractUserModelPairs(sectionArr, minTimestampMs = 0) {\\n    const pairs = [];\\n    if (!Array.isArray(sectionArr)) return pairs;\\n    const agg = {};\\n    sectionArr.forEach((entry) => {\\n      (entry.environments || []).forEach((env) => {\\n        (env.dimensions || []).forEach((dim) => {\\n          let user = \\\"\\\";\\n          let model = \\\"\\\";\\n          if (Array.isArray(dim.individualNames) && dim.individualNames.length >= 2) {\\n            user = dim.individualNames[0] || \\\"\\\";\\n            model = dim.individualNames[1] || \\\"\\\";\\n          } else if (dim.name && dim.name.includes(\\\",\\\")) {\\n            const parts = dim.name.split(\\\",\\\");\\n            user = (parts[0] || \\\"\\\").trim();\\n            model = parts.slice(1).join(\\\",\\\").trim();\\n          }\\n          if (!user || !model || user === \\\"(not set)\\\" || model === \\\"(not set)\\\") return;\\n          const key = `${user}|||${model}`;\\n          if (!agg[key]) {\\n            agg[key] = { user, model, requests: 0, prompts: 0, responses: 0, ttftSum: 0, ttftCount: 0, cost: 0 };\\n          }\\n          (dim.metrics || []).forEach((m) => {\\n            const isMsg = m.name === \\\"sum(message_count)\\\";\\n            const isPrompt = m.name === \\\"sum(dc_ai_prompt_token_count)\\\";\\n            const isResp = m.name === \\\"sum(dc_ai_response_token_count)\\\";\\n            const isTtft = m.name === \\\"avg(dc_ai_time_first_token)\\\";\\n            (m.values || []).forEach((v) => {\\n              const ts = parseInt(v.timestamp, 10) || 0;\\n              if (minTimestampMs > 0 && ts > 0 && ts < minTimestampMs) return;\\n              const val = parseFloat(v.value) || 0;\\n              if (isMsg) agg[key].requests += Math.round(val);\\n              if (isPrompt) agg[key].prompts += Math.round(val);\\n              if (isResp) agg[key].responses += Math.round(val);\\n              if (isTtft && val > 0) {\\n                agg[key].ttftSum += val;\\n                agg[key].ttftCount += 1;\\n              }\\n            });\\n          });\\n        });\\n      });\\n    });\\n    Object.values(agg).forEach((p) => {\\n      p.cost = app.estimateModelCost(p.model, p.prompts, p.responses);\\n      if (p.requests > 0 || p.prompts > 0 || p.responses > 0) {\\n        pairs.push(p);\\n      }\\n    });\\n    return pairs;\\n  }\\n\\n  function extractDimensionsMap(sectionArr, includeCostByModelName, minTimestampMs = 0) {\\n    const map = {};\\n    if (!Array.isArray(sectionArr)) return map;\\n    sectionArr.forEach((entry) => {\\n      (entry.environments || []).forEach((env) => {\\n        (env.dimensions || []).forEach((dim) => {\\n          const name = dim.individualNames && dim.individualNames[0];\\n          if (!name || name === \\\"(not set)\\\") return;\\n          if (!map[name]) {\\n            map[name] = { requests: 0, prompts: 0, responses: 0, ttftSum: 0, ttftCount: 0, cost: 0 };\\n          }\\n          (dim.metrics || []).forEach((m) => {\\n            const isMsg = m.name === \\\"sum(message_count)\\\";\\n            const isPrompt = m.name === \\\"sum(dc_ai_prompt_token_count)\\\";\\n            const isResp = m.name === \\\"sum(dc_ai_response_token_count)\\\";\\n            const isTtft = m.name === \\\"avg(dc_ai_time_first_token)\\\";\\n            (m.values || []).forEach((v) => {\\n              const ts = parseInt(v.timestamp, 10) || 0;\\n              if (minTimestampMs > 0 && ts > 0 && ts < minTimestampMs) return;\\n              const val = parseFloat(v.value) || 0;\\n              if (isMsg) map[name].requests += Math.round(val);\\n              if (isPrompt) map[name].prompts += Math.round(val);\\n              if (isResp) map[name].responses += Math.round(val);\\n              if (isTtft && val > 0) {\\n                map[name].ttftSum += val;\\n                map[name].ttftCount += 1;\\n              }\\n            });\\n          });\\n          map[name].cost = app.estimateModelCost(\\n            includeCostByModelName ? name : \\\"default\\\",\\n            map[name].prompts,\\n            map[name].responses,\\n          );\\n        });\\n      });\\n    });\\n    return map;\\n  }\\n\\n  function populateGlobalAnalyticsFilters() {\\n    const modelSel = document.getElementById(\\\"admin-filter-model\\\");\\n    const userSel = document.getElementById(\\\"admin-filter-user\\\");\\n    const curModel = modelSel.value || \\\"all\\\";\\n    const curUser = userSel.value || \\\"all\\\";\\n\\n    extractUserModelPairs(globalAnalyticsRaw?.userModel).forEach((p) => {\\n      knownGlobalModels.add(p.model);\\n      knownGlobalUsers.add(p.user);\\n    });\\n    Object.keys(extractDimensionsMap(globalAnalyticsRaw?.model, true)).forEach((m) => knownGlobalModels.add(m));\\n    Object.keys(extractDimensionsMap(globalAnalyticsRaw?.user, false)).forEach((u) => knownGlobalUsers.add(u));\\n\\n    const models = Array.from(knownGlobalModels).sort();\\n    const users = Array.from(knownGlobalUsers).sort();\\n\\n    modelSel.innerHTML = `<option value=\\\"all\\\">All Models<\\/option>` + models.map((m) => `<option value=\\\"${m}\\\">${m}<\\/option>`).join(\\\"\\\");\\n    userSel.innerHTML = `<option value=\\\"all\\\">All Users<\\/option>` + users.map((u) => `<option value=\\\"${u}\\\">${u}<\\/option>`).join(\\\"\\\");\\n\\n    if (curModel !== \\\"all\\\" && knownGlobalModels.has(curModel)) modelSel.value = curModel;\\n    if (curUser !== \\\"all\\\" && knownGlobalUsers.has(curUser)) userSel.value = curUser;\\n  }\\n\\n  function renderGlobalAnalytics() {\\n    if (!globalAnalyticsRaw) return;\\n    const timeframe = document.getElementById(\\\"admin-filter-timeframe\\\")?.value || \\\"month\\\";\\n    const selectedModel = document.getElementById(\\\"admin-filter-model\\\").value;\\n    const selectedUser = document.getElementById(\\\"admin-filter-user\\\").value;\\n    const minCost = parseFloat(document.getElementById(\\\"admin-filter-cost\\\").value) || 0;\\n    const viewBy = document.getElementById(\\\"admin-analytics-view\\\").value;\\n\\n    const cutoffMs = CONFIG.demoMode ? getTimeframeCutoffMs(timeframe) : 0;\\n    const allPairs = extractUserModelPairs(globalAnalyticsRaw.userModel, cutoffMs);\\n    const hasPairs = allPairs.length > 0;\\n\\n    let filteredModels = [];\\n    let filteredUsers = [];\\n    let filteredPairs = [];\\n\\n    if (hasPairs) {\\n      filteredPairs = allPairs.filter(\\n        (p) =>\\n          (selectedModel === \\\"all\\\" || p.model === selectedModel) &&\\n          (selectedUser === \\\"all\\\" || p.user === selectedUser) &&\\n          p.cost >= minCost,\\n      );\\n\\n      const mAgg = {};\\n      const uAgg = {};\\n      filteredPairs.forEach((p) => {\\n        if (!mAgg[p.model]) mAgg[p.model] = { requests: 0, prompts: 0, responses: 0, ttftSum: 0, ttftCount: 0, cost: 0 };\\n        mAgg[p.model].requests += p.requests;\\n        mAgg[p.model].prompts += p.prompts;\\n        mAgg[p.model].responses += p.responses;\\n        mAgg[p.model].ttftSum += p.ttftSum;\\n        mAgg[p.model].ttftCount += p.ttftCount;\\n        mAgg[p.model].cost += p.cost;\\n\\n        if (!uAgg[p.user]) uAgg[p.user] = { requests: 0, prompts: 0, responses: 0, ttftSum: 0, ttftCount: 0, cost: 0 };\\n        uAgg[p.user].requests += p.requests;\\n        uAgg[p.user].prompts += p.prompts;\\n        uAgg[p.user].responses += p.responses;\\n        uAgg[p.user].ttftSum += p.ttftSum;\\n        uAgg[p.user].ttftCount += p.ttftCount;\\n        uAgg[p.user].cost += p.cost;\\n      });\\n      filteredModels = Object.entries(mAgg);\\n      filteredUsers = Object.entries(uAgg);\\n    } else {\\n      const modelMap = extractDimensionsMap(globalAnalyticsRaw.model, true, cutoffMs);\\n      const userMap = extractDimensionsMap(globalAnalyticsRaw.user, false, cutoffMs);\\n      filteredModels = Object.entries(modelMap).filter(\\n        ([name, s]) => (selectedModel === \\\"all\\\" || name === selectedModel) && s.cost >= minCost,\\n      );\\n      filteredUsers = Object.entries(userMap).filter(\\n        ([name, s]) => (selectedUser === \\\"all\\\" || name === selectedUser) && s.cost >= minCost,\\n      );\\n    }\\n\\n    const productMap = extractDimensionsMap(globalAnalyticsRaw.product, false, cutoffMs);\\n    const filteredProducts = Object.entries(productMap).filter(([, s]) => s.cost >= minCost);\\n\\n    const kpiSource = hasPairs\\n      ? filteredPairs.map((p) => [p.user, p])\\n      : (selectedUser !== \\\"all\\\" ? filteredUsers : filteredModels);\\n    let totalReq = 0, totalTokens = 0, ttftSum = 0, ttftCount = 0, totalCost = 0;\\n    kpiSource.forEach(([, s]) => {\\n      totalReq += s.requests;\\n      totalTokens += s.prompts + s.responses;\\n      ttftSum += s.ttftSum;\\n      ttftCount += s.ttftCount;\\n      totalCost += s.cost;\\n    });\\n\\n    document.getElementById(\\\"admin-kpi-requests\\\").textContent = totalReq.toLocaleString();\\n    document.getElementById(\\\"admin-kpi-tokens\\\").textContent =\\n      totalTokens >= 1000000\\n        ? `${(totalTokens / 1000000).toFixed(2)}M`\\n        : totalTokens >= 1000\\n          ? `${(totalTokens / 1000).toFixed(1)}K`\\n          : totalTokens.toLocaleString();\\n    const avgTtft = ttftCount > 0 ? Math.round(ttftSum / ttftCount) : 0;\\n    document.getElementById(\\\"admin-kpi-ttft\\\").textContent = `${avgTtft} ms`;\\n    document.getElementById(\\\"admin-kpi-cost\\\").textContent = `$${totalCost.toFixed(2)}`;\\n\\n    renderAdminBarChart(\\\"admin-chart-models\\\", filteredModels, \\\"#8b5cf6\\\", (c) => {\\n      if (adminModelChart) adminModelChart.destroy();\\n      adminModelChart = c;\\n    });\\n    renderAdminBarChart(\\\"admin-chart-users\\\", filteredUsers, \\\"#06b6d4\\\", (c) => {\\n      if (adminUserChart) adminUserChart.destroy();\\n      adminUserChart = c;\\n    });\\n\\n    const theadRow = document.getElementById(\\\"admin-breakdown-thead-row\\\");\\n    const tbody = document.getElementById(\\\"admin-analytics-table-body\\\");\\n\\n    if (viewBy === \\\"user_model\\\") {\\n      document.getElementById(\\\"admin-breakdown-title\\\").textContent = \\\"Model & Cost Breakdown per User\\\";\\n      theadRow.innerHTML = `\\n        <th>Developer Email<\\/th>\\n        <th>AI Model<\\/th>\\n        <th>Requests<\\/th>\\n        <th>Prompt Tokens<\\/th>\\n        <th>Response Tokens<\\/th>\\n        <th>Total Tokens<\\/th>\\n        <th>Avg TTFT<\\/th>\\n        <th>Est. Cost<\\/th>\\n      `;\\n      const sortedPairs = [...filteredPairs].sort((a, b) => b.cost - a.cost);\\n      if (sortedPairs.length === 0) {\\n        tbody.innerHTML = `<tr><td colspan=\\\"8\\\" style=\\\"text-align:center; padding:2rem; color:var(--text-muted);\\\">No user/model analytics data matches the selected filters.<\\/td><\\/tr>`;\\n        return;\\n      }\\n      tbody.innerHTML = sortedPairs\\n        .map((r) => {\\n          const avg = r.ttftCount > 0 ? Math.round(r.ttftSum / r.ttftCount) : 0;\\n          return `\\n          <tr>\\n            <td style=\\\"font-weight:600;\\\">${r.user}<\\/td>\\n            <td><code>${r.model}<\\/code><\\/td>\\n            <td>${r.requests.toLocaleString()}<\\/td>\\n            <td>${r.prompts.toLocaleString()}<\\/td>\\n            <td>${r.responses.toLocaleString()}<\\/td>\\n            <td style=\\\"font-weight:700;\\\">${(r.prompts + r.responses).toLocaleString()}<\\/td>\\n            <td>${avg} ms<\\/td>\\n            <td style=\\\"font-weight:600; color:var(--success);\\\">$${r.cost.toFixed(4)}<\\/td>\\n          <\\/tr>\\n        `;\\n        })\\n        .join(\\\"\\\");\\n      return;\\n    }\\n\\n    const dimLabel = viewBy === \\\"model\\\" ? \\\"AI Model\\\" : viewBy === \\\"user\\\" ? \\\"Developer Email\\\" : \\\"API Product\\\";\\n    document.getElementById(\\\"admin-breakdown-title\\\").textContent = `Global Usage Breakdown by ${dimLabel}`;\\n    theadRow.innerHTML = `\\n      <th id=\\\"admin-breakdown-dim-header\\\">${dimLabel}<\\/th>\\n      <th>Requests<\\/th>\\n      <th>Prompt Tokens<\\/th>\\n      <th>Response Tokens<\\/th>\\n      <th>Total Tokens<\\/th>\\n      <th>Avg TTFT<\\/th>\\n      <th>Est. Cost<\\/th>\\n    `;\\n\\n    const rows = (viewBy === \\\"model\\\" ? filteredModels : viewBy === \\\"user\\\" ? filteredUsers : filteredProducts)\\n      .sort((a, b) => b[1].cost - a[1].cost);\\n\\n    if (rows.length === 0) {\\n      tbody.innerHTML = `<tr><td colspan=\\\"7\\\" style=\\\"text-align:center; padding:2rem; color:var(--text-muted);\\\">No global analytics data matches the selected filters.<\\/td><\\/tr>`;\\n      return;\\n    }\\n\\n    tbody.innerHTML = rows\\n      .map(([name, r]) => {\\n        const avg = r.ttftCount > 0 ? Math.round(r.ttftSum / r.ttftCount) : 0;\\n        return `\\n        <tr>\\n          <td style=\\\"font-weight:600;\\\">${name}<\\/td>\\n          <td>${r.requests.toLocaleString()}<\\/td>\\n          <td>${r.prompts.toLocaleString()}<\\/td>\\n          <td>${r.responses.toLocaleString()}<\\/td>\\n          <td style=\\\"font-weight:700;\\\">${(r.prompts + r.responses).toLocaleString()}<\\/td>\\n          <td>${avg} ms<\\/td>\\n          <td style=\\\"font-weight:600; color:var(--success);\\\">$${r.cost.toFixed(4)}<\\/td>\\n        <\\/tr>\\n      `;\\n      })\\n      .join(\\\"\\\");\\n  }\\n\\n  function renderAdminBarChart(canvasId, entries, color, saveInstance) {\\n    const canvas = document.getElementById(canvasId);\\n    if (!canvas) return;\\n    const isLight = app.theme === \\\"light\\\";\\n    const top = [...entries]\\n      .sort((a, b) => b[1].prompts + b[1].responses - (a[1].prompts + a[1].responses))\\n      .slice(0, 8);\\n\\n    const chart = new Chart(canvas.getContext(\\\"2d\\\"), {\\n      type: \\\"bar\\\",\\n      data: {\\n        labels: top.map(([name]) => name),\\n        datasets: [\\n          {\\n            label: \\\"Total Tokens\\\",\\n            data: top.map(([, s]) => s.prompts + s.responses),\\n            backgroundColor: color,\\n            borderRadius: 4,\\n          },\\n        ],\\n      },\\n      options: {\\n        indexAxis: \\\"y\\\",\\n        responsive: true,\\n        maintainAspectRatio: false,\\n        plugins: { legend: { display: false } },\\n        scales: {\\n          x: {\\n            grid: { color: isLight ? \\\"rgba(0,0,0,0.05)\\\" : \\\"rgba(255,255,255,0.05)\\\" },\\n            ticks: { color: isLight ? \\\"#475569\\\" : \\\"#9ca3af\\\" },\\n          },\\n          y: {\\n            grid: { color: isLight ? \\\"rgba(0,0,0,0.05)\\\" : \\\"rgba(255,255,255,0.05)\\\" },\\n            ticks: { color: isLight ? \\\"#475569\\\" : \\\"#9ca3af\\\" },\\n          },\\n        },\\n      },\\n    });\\n    saveInstance(chart);\\n  }\\n<\\/script>\\n\",\"product-detail\":\"<div class=\\\"detail-container\\\">\\n  <!-- Back & Admin Edit bar -->\\n  <div style=\\\"display:flex; justify-content:space-between; align-items:center; margin-bottom: 2rem; gap: 1rem;\\\">\\n    <button class=\\\"btn btn-secondary btn-sm\\\" onclick=\\\"app.navigate('catalog')\\\">\\n      <i data-lucide=\\\"arrow-left\\\" style=\\\"width:1rem; height:1rem;\\\"><\\/i>\\n      Back to Catalog\\n    <\\/button>\\n    <button class=\\\"btn btn-secondary btn-sm\\\" id=\\\"btn-detail-admin-edit\\\" style=\\\"display:none;\\\">\\n      <i data-lucide=\\\"pencil\\\" style=\\\"width:1rem; height:1rem;\\\"><\\/i>\\n      Edit in Admin\\n    <\\/button>\\n  <\\/div>\\n\\n  <div class=\\\"detail-layout\\\">\\n    <!-- Left Column: Details -->\\n    <div class=\\\"detail-main-info\\\">\\n      <div class=\\\"panel detail-hero-panel\\\">\\n        <div style=\\\"display:flex; justify-content:space-between; align-items:flex-start;\\\">\\n          <div class=\\\"detail-icon-box\\\" id=\\\"detail-icon-box\\\">\\n            <i data-lucide=\\\"globe\\\" style=\\\"width:2rem; height:2rem;\\\"><\\/i>\\n          <\\/div>\\n          <span class=\\\"style-badge\\\" id=\\\"detail-style-badge\\\">REST<\\/span>\\n        <\\/div>\\n        \\n        <h1 class=\\\"detail-title\\\" id=\\\"detail-title\\\">Loading...<\\/h1>\\n        <p class=\\\"detail-desc\\\" id=\\\"detail-desc\\\">Fetching details of the product...<\\/p>\\n        \\n        <div style=\\\"border-top:1px solid var(--border-color); padding-top: 1.5rem; margin-top: 1.5rem;\\\">\\n          <h4 style=\\\"margin-bottom:0.75rem; font-size:0.9rem; text-transform:uppercase; letter-spacing:0.05em; color:var(--text-muted);\\\">Endpoints<\\/h4>\\n          <div class=\\\"endpoint-url-box\\\" id=\\\"detail-endpoints-list\\\">\\n            <!-- Dynamic endpoints lists -->\\n          <\\/div>\\n        <\\/div>\\n      <\\/div>\\n      \\n      <!-- Pricing Packages Section -->\\n      <div class=\\\"panel detail-pricing-panel\\\" id=\\\"detail-pricing-panel\\\" style=\\\"display:none; margin-top:2rem;\\\">\\n        <h3 style=\\\"margin-bottom:1.5rem; display:flex; align-items:center; gap:0.5rem; font-size:1.25rem;\\\">\\n          <i data-lucide=\\\"circle-dollar-sign\\\" style=\\\"width:1.25rem; height:1.25rem; color:var(--primary);\\\"><\\/i>\\n          Available Pricing Packages\\n        <\\/h3>\\n        <div class=\\\"pricing-grid\\\" id=\\\"detail-pricing-list\\\">\\n          <!-- Packages dynamically rendered here -->\\n        <\\/div>\\n      <\\/div>\\n      \\n      <!-- Scalar OpenAPI Spec Section -->\\n      <div class=\\\"panel detail-spec-panel\\\" id=\\\"detail-spec-panel\\\" style=\\\"display:none; margin-top:2rem;\\\">\\n        <h3 style=\\\"margin-bottom:1rem; display:flex; align-items:center; gap:0.5rem;\\\">\\n          <i data-lucide=\\\"file-code\\\" style=\\\"width:1.25rem; height:1.25rem; color:var(--primary);\\\"><\\/i>\\n          Interactive API Reference\\n        <\\/h3>\\n        \\n        <div id=\\\"scalar-reference\\\" class=\\\"scalar-mount-point\\\">\\n          <!-- Scalar renders here -->\\n        <\\/div>\\n      <\\/div>\\n\\n      <!-- MCP Schema Explorer Section -->\\n      <div class=\\\"panel detail-mcp-panel\\\" id=\\\"detail-mcp-panel\\\" style=\\\"display:none; margin-top:2rem;\\\">\\n        <h3 style=\\\"margin-bottom:1.5rem; display:flex; align-items:center; gap:0.5rem; font-size:1.25rem;\\\">\\n          <i data-lucide=\\\"wrench\\\" style=\\\"width:1.25rem; height:1.25rem; color:var(--primary);\\\"><\\/i>\\n          Model Context Protocol (MCP) Tools\\n        <\\/h3>\\n        <p style=\\\"color:var(--text-secondary); font-size:0.9rem; margin-bottom:1.5rem;\\\">\\n          This product provides a Model Context Protocol (MCP) server. Below are the tools and schemas exposed by this server to LLM agents.\\n        <\\/p>\\n        <div class=\\\"mcp-tools-list\\\" id=\\\"mcp-tools-list\\\">\\n          <!-- Dynamically rendered tools -->\\n        <\\/div>\\n      <\\/div>\\n    <\\/div>\\n\\n    <!-- Right Column: Subscriptions & Actions -->\\n    <div class=\\\"detail-side-actions\\\">\\n      <div class=\\\"panel subscription-status-panel\\\">\\n        <h3><i data-lucide=\\\"key-round\\\" style=\\\"width:1.25rem; height:1.25rem; color:var(--success); display:inline-block; vertical-align:middle; margin-right:0.5rem;\\\"><\\/i>Subscription<\\/h3>\\n        \\n        <div id=\\\"sub-status-loading\\\" style=\\\"padding:1rem 0; color:var(--text-muted); text-align:center;\\\">\\n          Checking subscription status...\\n        <\\/div>\\n        \\n        <!-- Case 1: Anonymous -->\\n        <div id=\\\"sub-status-anonymous\\\" style=\\\"display:none;\\\">\\n          <p style=\\\"color:var(--text-secondary); margin-bottom:1.5rem; font-size:0.9rem;\\\">Sign in to subscribe to this API, generate credentials, and track your usage metrics.<\\/p>\\n          <button class=\\\"btn btn-primary\\\" onclick=\\\"app.openAuthModal()\\\" style=\\\"width:100%;\\\">Sign In / Register<\\/button>\\n        <\\/div>\\n\\n        <!-- Case 2: Logged In -->\\n        <div id=\\\"sub-status-authenticated\\\" style=\\\"display:none;\\\">\\n          <div id=\\\"sub-status-included-box\\\" style=\\\"display:none; margin-bottom:1.5rem;\\\">\\n            <p style=\\\"font-size:0.875rem; color:var(--text-secondary); margin-bottom:0.75rem;\\\">This API is active in the following apps:<\\/p>\\n            <div class=\\\"subscribed-apps-list\\\" id=\\\"subscribed-apps-list\\\">\\n              <!-- Dynamically listed apps -->\\n            <\\/div>\\n          <\\/div>\\n          \\n          <div id=\\\"sub-status-subscribe-box\\\">\\n            <h4 style=\\\"font-size:0.875rem; margin-bottom:0.75rem;\\\">Select Package Tier<\\/h4>\\n            <div class=\\\"auth-form-group\\\" style=\\\"margin-bottom:1rem;\\\">\\n              <select id=\\\"sub-package-select\\\" class=\\\"input-control select-control\\\" style=\\\"width:100%; font-size:0.9rem;\\\">\\n                <option value=\\\"\\\">-- Choose Package --<\\/option>\\n              <\\/select>\\n            <\\/div>\\n\\n            <h4 style=\\\"font-size:0.875rem; margin-bottom:0.75rem;\\\">Add to Subscription<\\/h4>\\n            <div class=\\\"auth-form-group\\\" style=\\\"margin-bottom:1rem;\\\">\\n              <select id=\\\"sub-app-select\\\" class=\\\"input-control select-control\\\" style=\\\"width:100%; font-size:0.9rem;\\\" disabled>\\n                <option value=\\\"\\\">-- Choose Subscription --<\\/option>\\n              <\\/select>\\n            <\\/div>\\n            <button class=\\\"btn btn-primary\\\" id=\\\"btn-subscribe-to-app\\\" onclick=\\\"subscribeProductToSelectedApp()\\\" style=\\\"width:100%; font-size:0.9rem;\\\" disabled>\\n              Add to Subscription\\n            <\\/button>\\n            \\n            <div class=\\\"auth-divider\\\">or<\\/div>\\n            \\n            <button class=\\\"btn btn-secondary\\\" id=\\\"btn-create-app-sub\\\" onclick=\\\"openCreateAppSubModal()\\\" style=\\\"width:100%; font-size:0.9rem;\\\" disabled>\\n              Create New Subscription\\n            <\\/button>\\n          <\\/div>\\n        <\\/div>\\n      <\\/div>\\n    <\\/div>\\n  <\\/div>\\n<\\/div>\\n\\n<style>\\n.detail-layout {\\n  display: grid;\\n  grid-template-columns: 2fr 1fr;\\n  gap: 2rem;\\n  align-items: flex-start;\\n}\\n@media (max-width: 968px) {\\n  .detail-layout {\\n    grid-template-columns: 1fr;\\n  }\\n}\\n\\n.detail-hero-panel {\\n  padding: 2.5rem;\\n}\\n.detail-icon-box {\\n  width: 3.5rem;\\n  height: 3.5rem;\\n  background: var(--primary-light);\\n  color: var(--primary);\\n  border-radius: 0.75rem;\\n  display: flex;\\n  align-items: center;\\n  justify-content: center;\\n  margin-bottom: 1.5rem;\\n}\\n.detail-title {\\n  font-size: 2.25rem;\\n  margin-bottom: 1rem;\\n}\\n.detail-desc {\\n  font-size: 1.1rem;\\n  color: var(--text-secondary);\\n}\\n\\n.endpoint-url-box {\\n  display: flex;\\n  flex-direction: column;\\n  gap: 0.75rem;\\n}\\n.endpoint-item {\\n  font-family: monospace;\\n  font-size: 0.85rem;\\n  background: var(--input-bg);\\n  padding: 0.75rem 1rem;\\n  border-radius: 0.5rem;\\n  border: 1px solid var(--border-color);\\n  word-break: break-all;\\n  display: flex;\\n  align-items: center;\\n  gap: 0.5rem;\\n}\\n\\n.subscription-status-panel {\\n  padding: 1.75rem;\\n  display: flex;\\n  flex-direction: column;\\n  gap: 1.25rem;\\n}\\n.subscription-status-panel h3 {\\n  font-size: 1.25rem;\\n  border-bottom: 1px solid var(--border-color);\\n  padding-bottom: 0.75rem;\\n  margin-bottom: 0.25rem;\\n}\\n\\n.subscribed-apps-list {\\n  display: flex;\\n  flex-direction: column;\\n  gap: 0.5rem;\\n}\\n.sub-app-item {\\n  display: flex;\\n  justify-content: space-between;\\n  align-items: center;\\n  background: rgba(16, 185, 129, 0.1);\\n  border: 1px solid rgba(16, 185, 129, 0.2);\\n  color: var(--success);\\n  font-size: 0.875rem;\\n  padding: 0.625rem 0.875rem;\\n  border-radius: 0.5rem;\\n  cursor: pointer;\\n  transition: all var(--transition-fast);\\n}\\n.sub-app-item:hover {\\n  background: rgba(16, 185, 129, 0.15);\\n  border-color: var(--success);\\n}\\n\\n/* Scalar overrides to fit cleanly */\\n.scalar-mount-point {\\n  background: var(--bg-color);\\n  border-radius: 0.5rem;\\n  border: 1px solid var(--border-color);\\n  min-height: 400px;\\n  max-height: 800px;\\n  overflow-y: auto;\\n}\\n\\n/* Pricing Grid Styles */\\n.pricing-grid {\\n  display: grid;\\n  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));\\n  gap: 1.5rem;\\n}\\n.pricing-card {\\n  border: 1px solid var(--border-color);\\n  border-radius: 0.75rem;\\n  padding: 1.5rem;\\n  background: var(--input-bg);\\n  transition: all var(--transition-fast) ease-in-out;\\n  display: flex;\\n  flex-direction: column;\\n  justify-content: space-between;\\n  position: relative;\\n  overflow: hidden;\\n  cursor: pointer;\\n}\\n.pricing-card:hover {\\n  transform: translateY(-4px);\\n  border-color: var(--primary);\\n  box-shadow: var(--shadow-md);\\n}\\n.pricing-card.selected {\\n  border-color: var(--primary) !important;\\n  box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.4);\\n  background: rgba(99, 102, 241, 0.05);\\n}\\n.pricing-card.premium {\\n  border-color: rgba(99, 102, 241, 0.4);\\n  background: linear-gradient(135deg, var(--input-bg) 0%, rgba(99, 102, 241, 0.03) 100%);\\n}\\n.pricing-card.premium:hover {\\n  border-color: var(--primary);\\n}\\n.pricing-badge {\\n  position: absolute;\\n  top: 1rem;\\n  right: 1rem;\\n  font-size: 0.75rem;\\n  font-weight: 600;\\n  padding: 0.25rem 0.625rem;\\n  border-radius: 2rem;\\n  background: var(--primary-light);\\n  color: var(--primary);\\n}\\n.pricing-card.premium .pricing-badge {\\n  background: rgba(16, 185, 129, 0.1);\\n  color: var(--success);\\n}\\n.pricing-header h4 {\\n  font-size: 1.1rem;\\n  font-weight: 600;\\n  margin-bottom: 0.5rem;\\n  color: var(--text-color);\\n}\\n.pricing-header p {\\n  font-size: 0.825rem;\\n  color: var(--text-muted);\\n  margin-bottom: 1.25rem;\\n}\\n.pricing-rates {\\n  border-top: 1px solid var(--border-color);\\n  padding-top: 1rem;\\n  margin-top: auto;\\n}\\n.pricing-rate-item {\\n  display: flex;\\n  justify-content: space-between;\\n  font-size: 0.875rem;\\n  margin-bottom: 0.5rem;\\n}\\n.pricing-rate-item:last-child {\\n  margin-bottom: 0;\\n}\\n.pricing-rate-label {\\n  color: var(--text-secondary);\\n}\\n.pricing-rate-value {\\n  font-weight: 600;\\n  color: var(--text-color);\\n}\\n\\n/* MCP Tools Explorer Styles */\\n.mcp-tool-card {\\n  background: var(--input-bg);\\n  border: 1px solid var(--border-color);\\n  border-radius: 0.75rem;\\n  margin-bottom: 1rem;\\n  overflow: hidden;\\n  transition: all var(--transition-fast) ease;\\n}\\n.mcp-tool-card:hover {\\n  border-color: var(--primary);\\n  box-shadow: var(--shadow-sm);\\n}\\n.mcp-tool-header {\\n  padding: 1.25rem 1.5rem;\\n  display: flex;\\n  justify-content: space-between;\\n  align-items: center;\\n  cursor: pointer;\\n}\\n.mcp-tool-icon {\\n  width: 2.25rem;\\n  height: 2.25rem;\\n  background: var(--primary-light);\\n  color: var(--primary);\\n  border-radius: 0.5rem;\\n  display: flex;\\n  align-items: center;\\n  justify-content: center;\\n  flex-shrink: 0;\\n}\\n.mcp-tool-name {\\n  font-family: monospace;\\n  font-size: 1.05rem;\\n  font-weight: 600;\\n  color: var(--text-color);\\n  margin-bottom: 0.15rem;\\n}\\n.mcp-tool-short-desc {\\n  font-size: 0.85rem;\\n  color: var(--text-muted);\\n  margin: 0;\\n}\\n.mcp-toggle-icon {\\n  width: 1.25rem;\\n  height: 1.25rem;\\n  color: var(--text-muted);\\n  transition: transform var(--transition-fast) ease;\\n}\\n.mcp-tool-card.open .mcp-toggle-icon {\\n  transform: rotate(180deg);\\n  color: var(--primary);\\n}\\n.mcp-tool-details {\\n  border-top: 1px solid var(--border-color);\\n  background: rgba(0, 0, 0, 0.08);\\n}\\nbody.light .mcp-tool-details {\\n  background: rgba(0, 0, 0, 0.02);\\n}\\n.mcp-details-inner {\\n  padding: 1.5rem;\\n}\\n.mcp-section-title {\\n  font-size: 0.8rem;\\n  text-transform: uppercase;\\n  letter-spacing: 0.05em;\\n  color: var(--text-muted);\\n  margin-bottom: 0.75rem;\\n  font-weight: 600;\\n}\\n.mcp-params-list {\\n  display: flex;\\n  flex-direction: column;\\n  gap: 0.75rem;\\n}\\n.mcp-param-row {\\n  background: var(--bg-color);\\n  border: 1px solid var(--border-color);\\n  border-radius: 0.5rem;\\n  padding: 0.875rem 1.25rem;\\n  display: flex;\\n  justify-content: space-between;\\n  align-items: flex-start;\\n  gap: 1rem;\\n}\\n.mcp-param-meta {\\n  display: flex;\\n  flex-direction: column;\\n  gap: 0.25rem;\\n  min-width: 120px;\\n  text-align: left;\\n}\\n.mcp-param-name {\\n  font-family: monospace;\\n  font-weight: 600;\\n  font-size: 0.9rem;\\n  color: var(--text-color);\\n}\\n.mcp-param-type {\\n  font-family: monospace;\\n  font-size: 0.75rem;\\n  color: var(--primary);\\n  background: var(--primary-light);\\n  padding: 0.1rem 0.375rem;\\n  border-radius: 0.25rem;\\n  width: fit-content;\\n}\\n.mcp-param-req {\\n  font-size: 0.7rem;\\n  text-transform: uppercase;\\n  font-weight: 600;\\n  color: var(--danger);\\n  background: rgba(239, 68, 68, 0.1);\\n  padding: 0.1rem 0.375rem;\\n  border-radius: 0.25rem;\\n  width: fit-content;\\n}\\n.mcp-param-desc {\\n  font-size: 0.85rem;\\n  color: var(--text-secondary);\\n  line-height: 1.4;\\n  margin: 0;\\n  flex-grow: 1;\\n  text-align: left;\\n}\\n<\\/style>\\n\\n<!-- Create Subscription Dialog in Product Detail -->\\n<dialog id=\\\"create-app-sub-dialog\\\" class=\\\"auth-dialog\\\" style=\\\"max-width:450px;\\\">\\n  <div class=\\\"auth-header\\\">\\n    <h3>Create Subscription<\\/h3>\\n    <button class=\\\"close-btn\\\" onclick=\\\"closeCreateAppSubModal()\\\">\\n      <i data-lucide=\\\"x\\\" style=\\\"width:1.5rem; height:1.5rem;\\\"><\\/i>\\n    <\\/button>\\n  <\\/div>\\n  <form id=\\\"create-app-sub-form\\\" onsubmit=\\\"handleCreateAppSubSubmit(event)\\\">\\n    <div class=\\\"auth-form-group\\\">\\n      <label for=\\\"sub-new-app-name\\\">Subscription Name<\\/label>\\n      <input type=\\\"text\\\" id=\\\"sub-new-app-name\\\" class=\\\"input-control\\\" placeholder=\\\"My New Subscription\\\" required autocomplete=\\\"off\\\">\\n    <\\/div>\\n    <div class=\\\"auth-form-group\\\" style=\\\"margin-top:1rem;\\\">\\n      <label>Selected Package<\\/label>\\n      <div id=\\\"sub-new-app-package-display\\\" style=\\\"font-weight:600; font-family:monospace; font-size:0.9rem; padding:0.5rem; background:var(--input-bg); border:1px solid var(--border-color); border-radius:0.375rem; color:var(--primary);\\\">\\n        <!-- Selected package display -->\\n      <\\/div>\\n    <\\/div>\\n    <div style=\\\"margin-top:1.5rem; display:flex; justify-content:flex-end; gap:1rem;\\\">\\n      <button type=\\\"button\\\" class=\\\"btn btn-secondary btn-sm\\\" onclick=\\\"closeCreateAppSubModal()\\\">Cancel<\\/button>\\n      <button type=\\\"submit\\\" class=\\\"btn btn-primary btn-sm\\\">Create & Subscribe<\\/button>\\n    <\\/div>\\n  <\\/form>\\n<\\/dialog>\\n\\n<script>\\nvar currentProduct = null;\\nvar currentUnsubscribedApps = [];\\n\\nwindow.viewInitializers['product-detail'] = async function(productId) {\\n  console.log(\\\"Loading product details for:\\\", productId);\\n  \\n  if (!productId) {\\n    app.navigate('catalog');\\n    return;\\n  }\\n\\n  const editBtn = document.getElementById('btn-detail-admin-edit');\\n  if (editBtn) {\\n    if (app.user) {\\n      editBtn.style.display = 'inline-flex';\\n      editBtn.onclick = () => app.navigate(`admin/edit/${encodeURIComponent(productId)}`);\\n    } else {\\n      editBtn.style.display = 'none';\\n    }\\n  }\\n  \\n  await fetchProductDetails(productId);\\n  await handleSubscriptionStatusUI(productId);\\n};\\n\\nasync function fetchProductDetails(productId) {\\n  try {\\n    let products = [];\\n    if (CONFIG.demoMode) {\\n      const res = await fetch('/mock-products.json');\\n      const data = await res.json();\\n      products = data.products || [];\\n    } else {\\n      const res = await fetch(`${CONFIG.apiHost}/api/portals/${CONFIG.portalId}/products`);\\n      if (!res.ok) throw new Error();\\n      const data = await res.json();\\n      products = data.products || [];\\n    }\\n    \\n    currentProduct = products.find(p => p.productId === productId || p.id === productId);\\n    if (!currentProduct) {\\n      app.showToast(\\\"Product not found\\\", \\\"error\\\");\\n      app.navigate('catalog');\\n      return;\\n    }\\n\\n    // Now, fetch the single product details (endpoint / spec / displayStyle) from the newly added details endpoint!\\n    let details = null;\\n    if (CONFIG.demoMode) {\\n      // Simulate/mock details payload for local preview\\n      details = {\\n        id: productId,\\n        endpoint: currentProduct.endpoints && currentProduct.endpoints.length > 0 ? currentProduct.endpoints[0] : \\\"\\\",\\n        displayStyle: currentProduct.displayStyle || \\\"REST\\\",\\n        spec: null\\n      };\\n\\n      if (details.displayStyle === 'MCP') {\\n        details.spec = {\\n          \\\"tools\\\": [\\n            {\\n              \\\"name\\\": \\\"query\\\",\\n              \\\"description\\\": \\\"Run analytical SQL queries on the active database instances\\\",\\n              \\\"inputSchema\\\": {\\n                \\\"type\\\": \\\"object\\\",\\n                \\\"properties\\\": {\\n                  \\\"sql\\\": { \\\"type\\\": \\\"string\\\", \\\"description\\\": \\\"The raw SQL query to run against the database.\\\" }\\n                },\\n                \\\"required\\\": [\\\"sql\\\"]\\n              }\\n            },\\n            {\\n              \\\"name\\\": \\\"get_billing_summary\\\",\\n              \\\"description\\\": \\\"Get high-level billing summaries including billing cycles, invoices, and totals.\\\",\\n              \\\"inputSchema\\\": {\\n                \\\"type\\\": \\\"object\\\",\\n                \\\"properties\\\": {\\n                  \\\"accountId\\\": { \\\"type\\\": \\\"string\\\", \\\"description\\\": \\\"The ID of the account to query.\\\" },\\n                  \\\"year\\\": { \\\"type\\\": \\\"integer\\\", \\\"description\\\": \\\"Optional year filter (defaults to current year).\\\" }\\n                },\\n                \\\"required\\\": [\\\"accountId\\\"]\\n              }\\n            }\\n          ]\\n        };\\n      } else {\\n        details.spec = `openapi: 3.0.0\\ninfo:\\n  title: ${currentProduct.displayName || currentProduct.name} Spec\\n  description: Dynamic sandbox endpoint for testing the REST style AI models.\\n  version: 1.0.0\\npaths:\\n  /chat/completions:\\n    post:\\n      summary: Send an AI chat generation request\\n      requestBody:\\n        required: true\\n        content:\\n          application/json:\\n            schema:\\n              type: object\\n              properties:\\n                messages:\\n                  type: array\\n                  items:\\n                    type: object\\n                    properties:\\n                      role:\\n                        type: string\\n                        example: user\\n                      content:\\n                        type: string\\n                        example: Hello world!\\n                temperature:\\n                  type: number\\n                  example: 0.7\\n      responses:\\n        '200':\\n          description: Successful AI generation response\\n          content:\\n            application/json:\\n              schema:\\n                type: object\\n                properties:\\n                  choices:\\n                    type: array\\n                    items:\\n                      type: object\\n                      properties:\\n                        message:\\n                          type: object\\n                          properties:\\n                            role:\\n                              type: string\\n                            content:\\n                              type: string`;\\n      }\\n    } else {\\n      try {\\n        const res = await fetch(`${CONFIG.apiHost}/api/portals/${CONFIG.portalId}/products/${productId}`);\\n        if (res.ok) {\\n          details = await res.json();\\n          console.log(\\\"Fetched detailed product info from proxy:\\\", details);\\n        }\\n      } catch (err) {\\n        console.error(\\\"Failed to fetch product details from proxy:\\\", err);\\n      }\\n    }\\n    \\n    // Fill text content\\n    document.getElementById('detail-title').textContent = currentProduct.displayName || currentProduct.name;\\n    document.getElementById('detail-desc').textContent = currentProduct.displayDescription || 'Access is available for this product on the enterprise platform.';\\n    \\n    const styleStyle = (details && details.displayStyle) || currentProduct.displayStyle || 'REST';\\n    const styleBadge = document.getElementById('detail-style-badge');\\n    styleBadge.textContent = styleStyle;\\n    styleBadge.className = `style-badge ${styleStyle.toLowerCase()}`;\\n    \\n    // Fill endpoints list\\n    const endpointsList = document.getElementById('detail-endpoints-list');\\n    let endpointsHtml = '';\\n    const activeEndpoint = (details && details.endpoint) || (currentProduct.endpoints && currentProduct.endpoints[0]) || '';\\n    if (activeEndpoint) {\\n      endpointsHtml = `\\n        <div class=\\\"endpoint-item\\\">\\n          <i data-lucide=\\\"server\\\" style=\\\"width:1rem; height:1rem; color:var(--text-muted); flex-shrink:0;\\\"><\\/i>\\n          <span>${activeEndpoint}<\\/span>\\n        <\\/div>\\n      `;\\n    } else if (currentProduct.endpoints && currentProduct.endpoints.length > 0) {\\n      currentProduct.endpoints.forEach(ep => {\\n        endpointsHtml += `\\n          <div class=\\\"endpoint-item\\\">\\n            <i data-lucide=\\\"server\\\" style=\\\"width:1rem; height:1rem; color:var(--text-muted); flex-shrink:0;\\\"><\\/i>\\n            <span>${ep}<\\/span>\\n          <\\/div>\\n        `;\\n      });\\n    } else {\\n      endpointsHtml = `<div class=\\\"endpoint-item\\\" style=\\\"color:var(--text-muted);\\\">No endpoint URL provided<\\/div>`;\\n    }\\n    endpointsList.innerHTML = endpointsHtml;\\n    \\n    // Setup Icon box\\n    let icon = 'globe';\\n    if (styleStyle === 'REST') icon = 'globe';\\n    if (styleStyle === 'MCP') icon = 'wrench';\\n    if (styleStyle === 'A2A') icon = 'bot';\\n    document.getElementById('detail-icon-box').innerHTML = `<i data-lucide=\\\"${icon}\\\" style=\\\"width:2rem; height:2rem;\\\"><\\/i>`;\\n    \\n    // Render Pricing Packages\\n    const pricingPanel = document.getElementById('detail-pricing-panel');\\n    const pricingList = document.getElementById('detail-pricing-list');\\n    \\n    if (currentProduct.packages && currentProduct.packages.length > 0) {\\n      pricingPanel.style.display = 'block';\\n      let pricingHtml = '';\\n      currentProduct.packages.forEach((pkg) => {\\n        const isPremium = pkg.packageId.includes('premium') || pkg.packageId.includes('enterprise');\\n        const badgeText = isPremium ? 'Premium' : 'Standard';\\n        \\n        let ratesHtml = '';\\n        if (pkg.requestTokenPricePerMillion > 0 || pkg.responseTokenPricePerMillion > 0) {\\n          ratesHtml = `\\n            <div class=\\\"pricing-rate-item\\\">\\n              <span class=\\\"pricing-rate-label\\\">Input / Million:<\\/span>\\n              <span class=\\\"pricing-rate-value\\\">$${pkg.requestTokenPricePerMillion.toFixed(3)}<\\/span>\\n            <\\/div>\\n            <div class=\\\"pricing-rate-item\\\">\\n              <span class=\\\"pricing-rate-label\\\">Output / Million:<\\/span>\\n              <span class=\\\"pricing-rate-value\\\">$${pkg.responseTokenPricePerMillion.toFixed(3)}<\\/span>\\n            <\\/div>\\n          `;\\n        } else {\\n          ratesHtml = `\\n            <div class=\\\"pricing-rate-item\\\">\\n              <span class=\\\"pricing-rate-label\\\">Request / Thousand:<\\/span>\\n              <span class=\\\"pricing-rate-value\\\">$${pkg.requestCallPricePerThousand.toFixed(3)}<\\/span>\\n            <\\/div>\\n            <div class=\\\"pricing-rate-item\\\">\\n              <span class=\\\"pricing-rate-label\\\">Response / Thousand:<\\/span>\\n              <span class=\\\"pricing-rate-value\\\">$${pkg.responseCallPricePerThousand.toFixed(3)}<\\/span>\\n            <\\/div>\\n          `;\\n        }\\n        \\n        let limitsHtml = '';\\n        if (pkg.tokenLimits && pkg.tokenLimits.length > 0) {\\n          pkg.tokenLimits.forEach(tl => {\\n            const limitStr = Number(tl.tokenLimit).toLocaleString();\\n            limitsHtml += `\\n              <div class=\\\"pricing-rate-item\\\" style=\\\"font-size:0.8rem; margin-bottom:0.25rem;\\\">\\n                <span class=\\\"pricing-rate-label\\\" style=\\\"display:flex; align-items:center; gap:0.25rem; font-size:0.775rem;\\\">\\n                  <i data-lucide=\\\"shield-alert\\\" style=\\\"width:0.8rem; height:0.8rem; color:var(--primary);\\\"><\\/i>\\n                  ${tl.type === 'USER' ? 'User' : 'Cost Center'} Limit:\\n                <\\/span>\\n                <span class=\\\"pricing-rate-value\\\" style=\\\"font-size:0.8rem;\\\">${limitStr} T<\\/span>\\n              <\\/div>\\n              <div style=\\\"font-size:0.675rem; color:var(--text-muted); margin-top:-0.15rem; margin-bottom:0.5rem; text-align:right;\\\">\\n                Model: ${tl.modelName}\\n              <\\/div>\\n            `;\\n          });\\n        }\\n        if (pkg.callLimits && pkg.callLimits.length > 0) {\\n          pkg.callLimits.forEach(cl => {\\n            const limitStr = Number(cl.callLimit).toLocaleString();\\n            limitsHtml += `\\n              <div class=\\\"pricing-rate-item\\\" style=\\\"font-size:0.8rem; margin-bottom:0.25rem;\\\">\\n                <span class=\\\"pricing-rate-label\\\" style=\\\"display:flex; align-items:center; gap:0.25rem; font-size:0.775rem;\\\">\\n                  <i data-lucide=\\\"activity\\\" style=\\\"width:0.8rem; height:0.8rem; color:var(--success);\\\"><\\/i>\\n                  ${cl.type === 'USER' ? 'User' : 'Cost Center'} Calls:\\n                <\\/span>\\n                <span class=\\\"pricing-rate-value\\\" style=\\\"font-size:0.8rem;\\\">${limitStr}<\\/span>\\n              <\\/div>\\n            `;\\n          });\\n        }\\n        \\n        const limitsContainer = limitsHtml ? `\\n          <div class=\\\"pricing-limits\\\" style=\\\"border-top:1px dashed var(--border-color); padding-top:0.75rem; margin-top:0.75rem;\\\">\\n            <h5 style=\\\"font-size:0.7rem; text-transform:uppercase; letter-spacing:0.05em; color:var(--text-muted); margin-bottom:0.5rem; font-weight:600;\\\">Operational Limits<\\/h5>\\n            ${limitsHtml}\\n          <\\/div>\\n        ` : '';\\n        \\n        pricingHtml += `\\n          <div class=\\\"pricing-card ${isPremium ? 'premium' : ''}\\\" data-package-id=\\\"${pkg.packageId}\\\" onclick=\\\"selectPricingPackage('${pkg.packageId}')\\\">\\n            <span class=\\\"pricing-badge\\\">${badgeText}<\\/span>\\n            <div class=\\\"pricing-header\\\">\\n              <h4>${pkg.packageId.split('-').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ')}<\\/h4>\\n              <p>${isPremium ? 'Tailored for high-scale enterprise needs.' : 'Perfect for development and early testing.'}<\\/p>\\n            <\\/div>\\n            <div class=\\\"pricing-rates\\\">\\n              ${ratesHtml}\\n            <\\/div>\\n            ${limitsContainer}\\n          <\\/div>\\n        `;\\n      });\\n      pricingList.innerHTML = pricingHtml;\\n    } else {\\n      pricingPanel.style.display = 'none';\\n    }\\n    \\n    // Render OpenAPI Spec / MCP Schema in their respective panels\\n    const specPanel = document.getElementById('detail-spec-panel');\\n    const mcpPanel = document.getElementById('detail-mcp-panel');\\n    \\n    specPanel.style.display = 'none';\\n    mcpPanel.style.display = 'none';\\n    \\n    if (details && details.spec) {\\n      if (styleStyle === 'MCP') {\\n        mcpPanel.style.display = 'block';\\n        renderMcpTools(details.spec);\\n      } else {\\n        specPanel.style.display = 'block';\\n        renderScalarSpec(details.spec);\\n      }\\n    } else {\\n      // Fallback if details spec is not available\\n      if (styleStyle === 'MCP') {\\n        mcpPanel.style.display = 'block';\\n        renderMcpTools({\\n          \\\"tools\\\": [\\n            {\\n              \\\"name\\\": \\\"query\\\",\\n              \\\"description\\\": \\\"Run analytical SQL queries on the active database instances\\\",\\n              \\\"inputSchema\\\": {\\n                \\\"type\\\": \\\"object\\\",\\n                \\\"properties\\\": {\\n                  \\\"sql\\\": { \\\"type\\\": \\\"string\\\", \\\"description\\\": \\\"The raw SQL query to run against the database.\\\" }\\n                },\\n                \\\"required\\\": [\\\"sql\\\"]\\n              }\\n            }\\n          ]\\n        });\\n      } else {\\n        specPanel.style.display = 'block';\\n        await fetchAndRenderOpenApiSpec(productId);\\n      }\\n    }\\n    \\n    lucide.createIcons();\\n  } catch (err) {\\n    console.error(err);\\n    app.showToast(\\\"Failed to fetch product details\\\", \\\"error\\\");\\n  }\\n}\\n\\nasync function fetchAndRenderOpenApiSpec(productId) {\\n  const specPanel = document.getElementById('detail-spec-panel');\\n  specPanel.style.display = 'block';\\n  \\n  try {\\n    let specContent;\\n    // Standard spec fetch\\n    const url = `${CONFIG.apiHost}/api/products/${productId}/spec`;\\n    const res = await fetch(url);\\n    if (res.ok) {\\n      specContent = await res.text();\\n    } else {\\n      throw new Error(\\\"Local backend spec not available\\\");\\n    }\\n    \\n    // Render in Scalar\\n    renderScalarSpec(specContent);\\n  } catch (err) {\\n    console.warn(\\\"Could not load backend spec, loading beautiful fallback spec content:\\\", err);\\n    // Provide a beautiful mock spec so that Scalar doesn't crash in local demo mode!\\n    const mockSpec = `\\nopenapi: 3.0.0\\ninfo:\\n  title: ${currentProduct.displayName || currentProduct.name} Spec\\n  description: Dynamic sandbox endpoint for testing the REST style AI models.\\n  version: 1.0.0\\npaths:\\n  /chat/completions:\\n    post:\\n      summary: Send an AI chat generation request\\n      requestBody:\\n        required: true\\n        content:\\n          application/json:\\n            schema:\\n              type: object\\n              properties:\\n                messages:\\n                  type: array\\n                  items:\\n                    type: object\\n                    properties:\\n                      role:\\n                        type: string\\n                        example: user\\n                      content:\\n                        type: string\\n                        example: Hello world!\\n                temperature:\\n                  type: number\\n                  example: 0.7\\n      responses:\\n        '200':\\n          description: Successful AI generation response\\n          content:\\n            application/json:\\n              schema:\\n                type: object\\n                properties:\\n                  choices:\\n                    type: array\\n                    items:\\n                      type: object\\n                      properties:\\n                        message:\\n                          type: object\\n                          properties:\\n                            role:\\n                              type: string\\n                            content:\\n                              type: string\\n    `;\\n    renderScalarSpec(mockSpec);\\n  }\\n}\\n\\nfunction renderScalarSpec(specData) {\\n  const referenceContainer = document.getElementById('scalar-reference');\\n  if (!referenceContainer) return;\\n  \\n  // Clean container\\n  referenceContainer.innerHTML = '';\\n  \\n  try {\\n    // Scalar mounting call\\n    Scalar.createApiReference(referenceContainer, {\\n      spec: {\\n        content: specData\\n      },\\n      showSidebar: false,\\n      theme: app.theme === 'light' ? 'default' : 'moon'\\n    });\\n  } catch (err) {\\n    console.error(\\\"Scalar initialization crash\\\", err);\\n    referenceContainer.innerHTML = `<div style=\\\"padding:2rem; text-align:center; color:var(--text-secondary);\\\">Interactive playgrounds require modern baseline web components.<\\/div>`;\\n  }\\n}\\n\\nfunction toggleMcpTool(toolId) {\\n  const card = document.getElementById(`mcp-card-${toolId}`);\\n  const details = document.getElementById(`mcp-details-${toolId}`);\\n  if (!card || !details) return;\\n  \\n  const isOpen = card.classList.contains('open');\\n  if (isOpen) {\\n    card.classList.remove('open');\\n    details.style.display = 'none';\\n  } else {\\n    card.classList.add('open');\\n    details.style.display = 'block';\\n  }\\n}\\n\\nfunction renderMcpTools(spec) {\\n  const toolsListContainer = document.getElementById('mcp-tools-list');\\n  if (!toolsListContainer) return;\\n  \\n  toolsListContainer.innerHTML = '';\\n  \\n  let mcpSpec = null;\\n  if (typeof spec === 'object' && spec !== null) {\\n    mcpSpec = spec;\\n  } else if (typeof spec === 'string') {\\n    try {\\n      mcpSpec = JSON.parse(spec);\\n    } catch (e) {\\n      console.error(\\\"Failed to parse MCP spec string\\\", e);\\n    }\\n  }\\n  \\n  if (!mcpSpec || !Array.isArray(mcpSpec.tools) || mcpSpec.tools.length === 0) {\\n    toolsListContainer.innerHTML = `\\n      <div style=\\\"padding: 2rem; text-align: center; color: var(--text-secondary); border: 1px dashed var(--border-color); border-radius: 0.5rem; background: var(--input-bg);\\\">\\n        No tools or schema details defined for this MCP server.\\n      <\\/div>\\n    `;\\n    return;\\n  }\\n  \\n  let mcpToolsHtml = '';\\n  mcpSpec.tools.forEach((tool, index) => {\\n    const toolId = `tool-${index}-${tool.name}`;\\n    \\n    // Generate parameters rows\\n    let paramsHtml = '';\\n    const inputSchema = tool.inputSchema || {};\\n    const props = inputSchema.properties || {};\\n    const required = inputSchema.required || [];\\n    \\n    const propKeys = Object.keys(props);\\n    if (propKeys.length > 0) {\\n      paramsHtml = `<div class=\\\"mcp-params-list\\\">`;\\n      propKeys.forEach(propKey => {\\n        const prop = props[propKey];\\n        const isRequired = required.includes(propKey);\\n        const typeStr = prop.type || 'string';\\n        const descStr = prop.description || 'No description provided.';\\n        \\n        paramsHtml += `\\n          <div class=\\\"mcp-param-row\\\">\\n            <div class=\\\"mcp-param-meta\\\">\\n              <span class=\\\"mcp-param-name\\\">${propKey}<\\/span>\\n              <span class=\\\"mcp-param-type\\\">${typeStr}<\\/span>\\n              ${isRequired ? `<span class=\\\"mcp-param-req\\\">Required<\\/span>` : ''}\\n            <\\/div>\\n            <p class=\\\"mcp-param-desc\\\">${descStr}<\\/p>\\n          <\\/div>\\n        `;\\n      });\\n      paramsHtml += `<\\/div>`;\\n    } else {\\n      paramsHtml = `<div style=\\\"font-size: 0.875rem; color: var(--text-secondary);\\\">This tool requires no input arguments.<\\/div>`;\\n    }\\n    \\n    mcpToolsHtml += `\\n      <div class=\\\"mcp-tool-card\\\" id=\\\"mcp-card-${toolId}\\\">\\n        <div class=\\\"mcp-tool-header\\\" onclick=\\\"toggleMcpTool('${toolId}')\\\">\\n          <div style=\\\"display:flex; align-items:center; gap:0.75rem; text-align: left;\\\">\\n            <div class=\\\"mcp-tool-icon\\\">\\n              <i data-lucide=\\\"wrench\\\" style=\\\"width:1.2rem; height:1.2rem;\\\"><\\/i>\\n            <\\/div>\\n            <div>\\n              <h4 class=\\\"mcp-tool-name\\\">${tool.name}<\\/h4>\\n              <p class=\\\"mcp-tool-short-desc\\\">${tool.description || 'No tool description provided.'}<\\/p>\\n            <\\/div>\\n          <\\/div>\\n          <i data-lucide=\\\"chevron-down\\\" class=\\\"mcp-toggle-icon\\\"><\\/i>\\n        <\\/div>\\n        \\n        <div class=\\\"mcp-tool-details\\\" id=\\\"mcp-details-${toolId}\\\" style=\\\"display:none;\\\">\\n          <div class=\\\"mcp-details-inner\\\">\\n            <div class=\\\"mcp-section-title\\\">Arguments (Input Schema)<\\/div>\\n            ${paramsHtml}\\n          <\\/div>\\n        <\\/div>\\n      <\\/div>\\n    `;\\n  });\\n  \\n  toolsListContainer.innerHTML = mcpToolsHtml;\\n  lucide.createIcons();\\n}\\n\\nasync function handleSubscriptionStatusUI(productId) {\\n  const loader = document.getElementById('sub-status-loading');\\n  const anonBox = document.getElementById('sub-status-anonymous');\\n  const authBox = document.getElementById('sub-status-authenticated');\\n  const includedBox = document.getElementById('sub-status-included-box');\\n  const includedList = document.getElementById('subscribed-apps-list');\\n  const packageSelect = document.getElementById('sub-package-select');\\n  const appSelect = document.getElementById('sub-app-select');\\n  const btnSub = document.getElementById('btn-subscribe-to-app');\\n  const btnCreateSub = document.getElementById('btn-create-app-sub');\\n  \\n  loader.style.display = 'block';\\n  anonBox.style.display = 'none';\\n  authBox.style.display = 'none';\\n  \\n  if (!app.user) {\\n    loader.style.display = 'none';\\n    anonBox.style.display = 'block';\\n    return;\\n  }\\n  \\n  try {\\n    // Load developer apps\\n    let userApps = [];\\n    if (CONFIG.demoMode) {\\n      // Load apps from localStorage or mock\\n      const cached = localStorage.getItem('prism_apps_demo');\\n      if (cached) {\\n        const data = JSON.parse(cached);\\n        userApps = Array.isArray(data) ? data : (data.apps || []);\\n      } else {\\n        const res = await fetch('/mock-apps.json');\\n        const data = await res.json();\\n        userApps = data.apps || [];\\n        localStorage.setItem('prism_apps_demo', JSON.stringify(userApps));\\n      }\\n    } else {\\n      const res = await app.makeRequest(`${CONFIG.apiHost}/api/portals/${CONFIG.portalId}/users/${app.user.email}/apps`);\\n      if (!res.ok) throw new Error();\\n      const data = await res.json();\\n      userApps = data.apps || [];\\n    }\\n    \\n    app.apps = userApps;\\n    loader.style.display = 'none';\\n    authBox.style.display = 'block';\\n    \\n    // Fill Packages Dropdown\\n    packageSelect.innerHTML = `<option value=\\\"\\\">-- Choose Package --<\\/option>`;\\n    if (currentProduct.packages && currentProduct.packages.length > 0) {\\n      currentProduct.packages.forEach(pkg => {\\n        const displayName = pkg.packageId.split('-').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');\\n        packageSelect.innerHTML += `<option value=\\\"${pkg.packageId}\\\">${displayName}<\\/option>`;\\n      });\\n    } else {\\n      // Fallback to legacy product ID if no packages exist\\n      const prodId = currentProduct.productId || currentProduct.id;\\n      const displayName = prodId.split('-').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');\\n      packageSelect.innerHTML += `<option value=\\\"${prodId}\\\">${displayName}<\\/option>`;\\n    }\\n    packageSelect.value = \\\"\\\"; // Reset package selection\\n    \\n    // Wire up package onchange\\n    packageSelect.onchange = onPackageSelectionChanged;\\n    \\n    // Check which apps already have this product/packages subscribed\\n    const currentProductPackageIds = (currentProduct.packages || []).map(pkg => pkg.packageId);\\n    if (currentProductPackageIds.length === 0) {\\n      currentProductPackageIds.push(currentProduct.productId || currentProduct.id);\\n    }\\n    \\n    const includedApps = [];\\n    userApps.forEach(a => {\\n      const subscribedPackagesInApp = [];\\n      if (a.credentials) {\\n        a.credentials.forEach(cred => {\\n          if (cred.products) {\\n            cred.products.forEach(pId => {\\n              if (currentProductPackageIds.includes(pId)) {\\n                subscribedPackagesInApp.push(pId);\\n              }\\n            });\\n          }\\n        });\\n      }\\n      \\n      if (subscribedPackagesInApp.length > 0) {\\n        // Find human readable names for these packages\\n        const packageNames = subscribedPackagesInApp.map(pId => {\\n          const pkg = (currentProduct.packages || []).find(p => p.packageId === pId);\\n          return pkg ? (pkg.packageId.split('-').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ')) : pId.split('-').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');\\n        });\\n        includedApps.push({\\n          app: a,\\n          packagesText: packageNames.join(', ')\\n        });\\n      }\\n    });\\n    \\n    // Fill subscribed apps list\\n    if (includedApps.length > 0) {\\n      includedBox.style.display = 'block';\\n      let listHtml = '';\\n      includedApps.forEach(ia => {\\n        listHtml += `\\n          <div class=\\\"sub-app-item\\\" onclick=\\\"app.navigate('apps')\\\" style=\\\"display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;\\\">\\n            <div style=\\\"display: flex; flex-direction: column; gap: 0.15rem;\\\">\\n              <span style=\\\"font-weight: 500;\\\">${ia.app.name}<\\/span>\\n              <span style=\\\"font-size: 0.75rem; opacity: 0.85;\\\">Package: ${ia.packagesText}<\\/span>\\n            <\\/div>\\n            <i data-lucide=\\\"arrow-up-right\\\" style=\\\"width:1rem; height:1rem;\\\"><\\/i>\\n          <\\/div>\\n        `;\\n      });\\n      includedList.innerHTML = listHtml;\\n    } else {\\n      includedBox.style.display = 'none';\\n    }\\n    \\n    // Trigger initial state change (this will disable app select & subscribe/create buttons since no package is selected yet)\\n    onPackageSelectionChanged();\\n    \\n    lucide.createIcons();\\n  } catch (err) {\\n    console.error(err);\\n    loader.textContent = \\\"Error loading subscription status.\\\";\\n  }\\n}\\n\\nfunction onPackageSelectionChanged() {\\n  const packageSelect = document.getElementById('sub-package-select');\\n  const appSelect = document.getElementById('sub-app-select');\\n  const btnSub = document.getElementById('btn-subscribe-to-app');\\n  const btnCreateSub = document.getElementById('btn-create-app-sub');\\n  \\n  const selectedPackageId = packageSelect.value;\\n  \\n  // Sync card styles to match the selection\\n  syncPricingCardStyles(selectedPackageId);\\n  \\n  if (!selectedPackageId) {\\n    appSelect.innerHTML = `<option value=\\\"\\\">-- Choose Subscription --<\\/option>`;\\n    appSelect.disabled = true;\\n    btnSub.disabled = true;\\n    btnCreateSub.disabled = true;\\n    return;\\n  }\\n  \\n  // Package is selected! Enable the Create App button.\\n  btnCreateSub.disabled = false;\\n  \\n  // Filter developer apps that don't have the selected packageId yet\\n  const availableApps = (app.apps || []).filter(a => {\\n    const hasPackage = a.credentials && a.credentials.some(cred =>\\n      cred.products && cred.products.includes(selectedPackageId)\\n    );\\n    return !hasPackage;\\n  });\\n  \\n  appSelect.innerHTML = `<option value=\\\"\\\">-- Choose Application --<\\/option>`;\\n  if (availableApps.length > 0) {\\n    availableApps.forEach(ua => {\\n      appSelect.innerHTML += `<option value=\\\"${ua.id}\\\">${ua.name}<\\/option>`;\\n    });\\n    appSelect.disabled = false;\\n  } else {\\n    appSelect.innerHTML += `<option value=\\\"\\\" disabled>All apps subscribed to this package!<\\/option>`;\\n    appSelect.disabled = true;\\n  }\\n  \\n  // Evaluate the subscribe to app button state\\n  btnSub.disabled = !appSelect.value;\\n  \\n  appSelect.onchange = function() {\\n    btnSub.disabled = !appSelect.value;\\n  };\\n}\\n\\nfunction selectPricingPackage(packageId) {\\n  const packageSelect = document.getElementById('sub-package-select');\\n  if (!packageSelect) return;\\n  \\n  // Update dropdown value and trigger selection state sync\\n  packageSelect.value = packageId;\\n  onPackageSelectionChanged();\\n}\\n\\nfunction syncPricingCardStyles(selectedPackageId) {\\n  const cards = document.querySelectorAll('#detail-pricing-list .pricing-card');\\n  cards.forEach(card => {\\n    if (card.getAttribute('data-package-id') === selectedPackageId) {\\n      card.classList.add('selected');\\n    } else {\\n      card.classList.remove('selected');\\n    }\\n  });\\n}\\n\\nasync function subscribeProductToSelectedApp() {\\n  const packageSelect = document.getElementById('sub-package-select');\\n  const appSelect = document.getElementById('sub-app-select');\\n  \\n  const packageId = packageSelect.value;\\n  const appId = appSelect.value;\\n  \\n  if (!packageId || !appId || !currentProduct) return;\\n  \\n  const targetApp = app.apps.find(a => a.id === appId);\\n  if (!targetApp) return;\\n  \\n  // Make sure products array exists in credentials\\n  if (!targetApp.credentials || targetApp.credentials.length === 0) {\\n    targetApp.credentials = [{ clientId: '', clientSecret: '', products: [] }];\\n  }\\n  if (!targetApp.credentials[0].products) {\\n    targetApp.credentials[0].products = [];\\n  }\\n  \\n  // Push packageId\\n  if (!targetApp.credentials[0].products.includes(packageId)) {\\n    targetApp.credentials[0].products.push(packageId);\\n  }\\n  \\n  try {\\n    app.showToast(\\\"Adding product subscription...\\\", \\\"info\\\");\\n    const prodId = currentProduct.productId || currentProduct.id;\\n    \\n    if (CONFIG.demoMode) {\\n      // Save locally\\n      localStorage.setItem('prism_apps_demo', JSON.stringify(app.apps));\\n      app.showToast(`Subscribed successfully to ${targetApp.name}!`, \\\"success\\\");\\n      await handleSubscriptionStatusUI(prodId);\\n    } else {\\n      // Put to server\\n      const res = await app.makeRequest(`${CONFIG.apiHost}/api/portals/${CONFIG.portalId}/users/${app.user.email}/apps`, {\\n        method: 'PUT',\\n        headers: { 'Content-Type': 'application/json' },\\n        body: JSON.stringify(targetApp)\\n      });\\n      if (!res.ok) {\\n        const errData = await res.json().catch(() => ({}));\\n        throw new Error(errData.error || 'Server rejected subscription update');\\n      }\\n      \\n      app.showToast(`Subscribed successfully to ${targetApp.name}!`, \\\"success\\\");\\n      await handleSubscriptionStatusUI(prodId);\\n    }\\n  } catch (err) {\\n    console.error(err);\\n    app.showToast(err.message || \\\"Failed to save subscription update.\\\", \\\"error\\\");\\n  }\\n}\\n\\nfunction openCreateAppSubModal() {\\n  const packageSelect = document.getElementById('sub-package-select');\\n  const packageId = packageSelect.value;\\n  if (!packageId) {\\n    app.showToast(\\\"Please select a package tier first\\\", \\\"warning\\\");\\n    return;\\n  }\\n  \\n  const packageDisplayName = packageId.split('-').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');\\n  document.getElementById('sub-new-app-package-display').textContent = packageDisplayName;\\n  \\n  // Clear field\\n  document.getElementById('sub-new-app-name').value = '';\\n  \\n  const dialog = document.getElementById('create-app-sub-dialog');\\n  if (dialog) {\\n    dialog.showModal();\\n    lucide.createIcons();\\n  }\\n}\\n\\nfunction closeCreateAppSubModal() {\\n  const dialog = document.getElementById('create-app-sub-dialog');\\n  if (dialog) {\\n    dialog.close();\\n  }\\n}\\n\\nasync function handleCreateAppSubSubmit(event) {\\n  event.preventDefault();\\n  \\n  const name = document.getElementById('sub-new-app-name').value.trim();\\n  const packageSelect = document.getElementById('sub-package-select');\\n  const packageId = packageSelect.value;\\n  \\n  if (!name || !packageId) {\\n    app.showToast(\\\"Please enter application name and ensure package is selected.\\\", \\\"warning\\\");\\n    return;\\n  }\\n  \\n  try {\\n    app.showToast(\\\"Creating application and subscribing...\\\", \\\"info\\\");\\n    const prodId = currentProduct.productId || currentProduct.id;\\n    \\n    if (CONFIG.demoMode) {\\n      const fakeId = generateUUID();\\n      const fakeClientId = generateFakeKey(48);\\n      const fakeClientSecret = generateFakeKey(64);\\n      \\n      const newApp = {\\n        id: fakeId,\\n        name: name,\\n        description: \\\"Created via product detail subscription.\\\",\\n        credentials: [\\n          {\\n            clientId: fakeClientId,\\n            clientSecret: fakeClientSecret,\\n            products: [packageId]\\n          }\\n        ]\\n      };\\n      \\n      app.apps.push(newApp);\\n      localStorage.setItem('prism_apps_demo', JSON.stringify(app.apps));\\n      \\n      app.showToast(`Subscription \\\"${name}\\\" created and subscribed successfully!`, \\\"success\\\");\\n      closeCreateAppSubModal();\\n      document.getElementById('create-app-sub-form').reset();\\n      await handleSubscriptionStatusUI(prodId);\\n    } else {\\n      // Server Post request\\n      const payload = {\\n        name: name,\\n        description: \\\"Created via product detail subscription.\\\",\\n        credentials: [\\n          {\\n            clientId: \\\"\\\",\\n            clientSecret: \\\"\\\",\\n            products: [packageId]\\n          }\\n        ]\\n      };\\n      \\n      const res = await app.makeRequest(`${CONFIG.apiHost}/api/portals/${CONFIG.portalId}/users/${app.user.email}/apps`, {\\n        method: 'POST',\\n        headers: { 'Content-Type': 'application/json' },\\n        body: JSON.stringify(payload)\\n      });\\n      if (!res.ok) {\\n        const errData = await res.json().catch(() => ({}));\\n        throw new Error(errData.error || 'Server rejected app creation');\\n      }\\n      \\n      app.showToast(`Subscription \\\"${name}\\\" created and subscribed successfully!`, \\\"success\\\");\\n      closeCreateAppSubModal();\\n      document.getElementById('create-app-sub-form').reset();\\n      await handleSubscriptionStatusUI(prodId);\\n    }\\n  } catch (err) {\\n    console.error(err);\\n    app.showToast(err.message || \\\"Failed to create application.\\\", \\\"error\\\");\\n  }\\n}\\n\\n// Helpers\\nfunction generateUUID() {\\n  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {\\n    var r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8);\\n    return v.toString(16);\\n  });\\n}\\n\\nfunction generateFakeKey(length) {\\n  const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';\\n  let result = '';\\n  for (let i = 0; i < length; i++) {\\n    result += chars.charAt(Math.floor(Math.random() * chars.length));\\n  }\\n  return result;\\n}\\n<\\/script>\\n\",\"home\":\"<div class=\\\"landing-hero\\\">\\n  <div class=\\\"hero-content\\\">\\n    <div class=\\\"hero-tag animate-reveal\\\">\\n      <span class=\\\"pulse-dot\\\"><\\/span> Next Generation AI Portal\\n    <\\/div>\\n    <h1 class=\\\"hero-title animate-reveal\\\">Discover & Integrate <span class=\\\"gradient-text\\\">State-Of-The-Art<\\/span> AI Services<\\/h1>\\n    <p class=\\\"hero-subtitle animate-reveal\\\">A secure, scalable developer workspace powering the world's most capable AI models, tools, and autonomous business agents. Experience microsecond latencies with robust analytics.<\\/p>\\n    \\n    <div class=\\\"hero-actions animate-reveal\\\">\\n      <button class=\\\"btn btn-primary\\\" onclick=\\\"app.navigate('catalog')\\\" autofocus>\\n        Browse Catalog\\n        <i data-lucide=\\\"arrow-right\\\" style=\\\"width:1.1rem; height:1.1rem;\\\"><\\/i>\\n      <\\/button>\\n      <button class=\\\"btn btn-secondary\\\" onclick=\\\"app.openAuthModal()\\\" id=\\\"hero-btn-login\\\">\\n        Get Developer Access\\n      <\\/button>\\n    <\\/div>\\n  <\\/div>\\n  \\n  <div class=\\\"hero-graphics\\\">\\n    <div class=\\\"apigee-network\\\" aria-label=\\\"Apigee AI Gateway connecting Model Garden, Claude Code, Antigravity, Any System, and Any Model\\\">\\n      <div class=\\\"network-ring ring-outer\\\"><\\/div>\\n      <div class=\\\"network-ring ring-inner\\\"><\\/div>\\n\\n      <svg class=\\\"network-lines\\\" viewBox=\\\"0 0 420 420\\\" aria-hidden=\\\"true\\\">\\n        <defs>\\n          <linearGradient id=\\\"netGrad\\\" gradientUnits=\\\"userSpaceOnUse\\\" x1=\\\"0\\\" y1=\\\"0\\\" x2=\\\"420\\\" y2=\\\"420\\\">\\n            <stop offset=\\\"0%\\\" stop-color=\\\"#6366f1\\\" stop-opacity=\\\"0.95\\\" />\\n            <stop offset=\\\"100%\\\" stop-color=\\\"#06b6d4\\\" stop-opacity=\\\"0.95\\\" />\\n          <\\/linearGradient>\\n        <\\/defs>\\n        <line class=\\\"net-link\\\" data-node=\\\"top\\\" x1=\\\"210\\\" y1=\\\"210\\\" x2=\\\"210\\\" y2=\\\"58\\\" />\\n        <line class=\\\"net-link d1\\\" data-node=\\\"tr\\\" x1=\\\"210\\\" y1=\\\"210\\\" x2=\\\"354\\\" y2=\\\"163\\\" />\\n        <line class=\\\"net-link d2\\\" data-node=\\\"br\\\" x1=\\\"210\\\" y1=\\\"210\\\" x2=\\\"299\\\" y2=\\\"333\\\" />\\n        <line class=\\\"net-link d3\\\" data-node=\\\"bl\\\" x1=\\\"210\\\" y1=\\\"210\\\" x2=\\\"121\\\" y2=\\\"333\\\" />\\n        <line class=\\\"net-link d4\\\" data-node=\\\"tl\\\" x1=\\\"210\\\" y1=\\\"210\\\" x2=\\\"66\\\" y2=\\\"163\\\" />\\n      <\\/svg>\\n\\n      <!-- Center Hub: Apigee -->\\n      <div class=\\\"network-hub\\\" id=\\\"apigee-network-hub\\\">\\n        <div class=\\\"hub-pulse\\\"><\\/div>\\n        <div class=\\\"hub-core\\\">\\n          <i data-lucide=\\\"shield-check\\\" style=\\\"width: 1.75rem; height: 1.75rem; color: #fff\\\"><\\/i>\\n          <span class=\\\"hub-title\\\">Apigee<\\/span>\\n          <span class=\\\"hub-sub\\\">AI Gateway<\\/span>\\n        <\\/div>\\n      <\\/div>\\n\\n      <!-- Orbiting Connected Nodes -->\\n      <div class=\\\"network-node panel node-top\\\" data-node=\\\"top\\\">\\n        <span class=\\\"node-icon\\\" style=\\\"background: rgba(99, 102, 241, 0.18); color: #818cf8\\\">\\n          <i data-lucide=\\\"sparkles\\\" style=\\\"width: 1rem; height: 1rem\\\"><\\/i>\\n        <\\/span>\\n        <span>Model Garden<\\/span>\\n      <\\/div>\\n\\n      <div class=\\\"network-node panel node-tr\\\" data-node=\\\"tr\\\">\\n        <span class=\\\"node-icon\\\" style=\\\"background: rgba(168, 85, 247, 0.18); color: #c084fc\\\">\\n          <i data-lucide=\\\"terminal\\\" style=\\\"width: 1rem; height: 1rem\\\"><\\/i>\\n        <\\/span>\\n        <span>Claude Code<\\/span>\\n      <\\/div>\\n\\n      <div class=\\\"network-node panel node-br\\\" data-node=\\\"br\\\">\\n        <span class=\\\"node-icon\\\" style=\\\"background: rgba(6, 182, 212, 0.18); color: #22d3ee\\\">\\n          <i data-lucide=\\\"rocket\\\" style=\\\"width: 1rem; height: 1rem\\\"><\\/i>\\n        <\\/span>\\n        <span>Antigravity<\\/span>\\n      <\\/div>\\n\\n      <div class=\\\"network-node panel node-bl\\\" data-node=\\\"bl\\\">\\n        <span class=\\\"node-icon\\\" style=\\\"background: rgba(16, 185, 129, 0.18); color: #34d399\\\">\\n          <i data-lucide=\\\"server\\\" style=\\\"width: 1rem; height: 1rem\\\"><\\/i>\\n        <\\/span>\\n        <span>Any System<\\/span>\\n      <\\/div>\\n\\n      <div class=\\\"network-node panel node-tl\\\" data-node=\\\"tl\\\">\\n        <span class=\\\"node-icon\\\" style=\\\"background: rgba(245, 158, 11, 0.18); color: #fbbf24\\\">\\n          <i data-lucide=\\\"cpu\\\" style=\\\"width: 1rem; height: 1rem\\\"><\\/i>\\n        <\\/span>\\n        <span>Any Model<\\/span>\\n      <\\/div>\\n    <\\/div>\\n  <\\/div>\\n<\\/div>\\n\\n<div class=\\\"landing-categories\\\" style=\\\"margin-top: 6rem;\\\">\\n  <div class=\\\"section-title\\\">\\n    <div class=\\\"sec-tag\\\">CAPABILITIES<\\/div>\\n    <h2>Browse Portal Collections<\\/h2>\\n    <p>Our ecosystem delivers top-tier resources across three core architectural styles.<\\/p>\\n  <\\/div>\\n  \\n  <div class=\\\"categories-grid\\\">\\n    <div class=\\\"cat-card panel\\\" onclick=\\\"app.navigate('catalog'); localStorage.setItem('catalog_filter_cat', 'Models')\\\">\\n      <div class=\\\"cat-icon\\\" style=\\\"background: rgba(99,102,241,0.15); color: #6366f1;\\\">\\n        <i data-lucide=\\\"brain\\\"><\\/i>\\n      <\\/div>\\n      <h3>Generative Models<\\/h3>\\n      <p>High-intelligence LLMs (Gemini, Claude, DeepSeek) for text generation, embeddings, reasoning, and planning.<\\/p>\\n      <span class=\\\"cat-link\\\">Explore Models <i data-lucide=\\\"arrow-right\\\" style=\\\"width:1rem; height:1rem; display:inline-block; vertical-align:middle;\\\"><\\/i><\\/span>\\n    <\\/div>\\n\\n    <div class=\\\"cat-card panel\\\" onclick=\\\"app.navigate('catalog'); localStorage.setItem('catalog_filter_cat', 'Tools')\\\">\\n      <div class=\\\"cat-icon\\\" style=\\\"background: rgba(6,182,212,0.15); color: #06b6d4;\\\">\\n        <i data-lucide=\\\"wrench\\\"><\\/i>\\n      <\\/div>\\n      <h3>Utility Tools & MCPs<\\/h3>\\n      <p>Modular tools (BigQuery, Weather) exposed via Model Context Protocol to seamlessly ground agentic workflows.<\\/p>\\n      <span class=\\\"cat-link\\\">Explore Tools <i data-lucide=\\\"arrow-right\\\" style=\\\"width:1rem; height:1rem; display:inline-block; vertical-align:middle;\\\"><\\/i><\\/span>\\n    <\\/div>\\n\\n    <div class=\\\"cat-card panel\\\" onclick=\\\"app.navigate('catalog'); localStorage.setItem('catalog_filter_cat', 'Agents')\\\">\\n      <div class=\\\"cat-icon\\\" style=\\\"background: rgba(16,185,129,0.15); color: #10b981;\\\">\\n        <i data-lucide=\\\"bot\\\"><\\/i>\\n      <\\/div>\\n      <h3>Autonomous Agents<\\/h3>\\n      <p>Enterprise-grade A2A (Agent-to-Agent) endpoints executing complex actions, payments, and order fullfilment.<\\/p>\\n      <span class=\\\"cat-link\\\">Explore Agents <i data-lucide=\\\"arrow-right\\\" style=\\\"width:1rem; height:1rem; display:inline-block; vertical-align:middle;\\\"><\\/i><\\/span>\\n    <\\/div>\\n  <\\/div>\\n<\\/div>\\n\\n<div class=\\\"landing-features\\\" style=\\\"margin-top: 6rem; margin-bottom: 6rem;\\\">\\n  <div class=\\\"section-title\\\">\\n    <div class=\\\"sec-tag\\\">ENTERPRISE GATEWAY<\\/div>\\n    <h2>Built For Developers & Builders<\\/h2>\\n    <p>Everything you need to orchestrate state-of-the-art AI systems with ultimate governance.<\\/p>\\n  <\\/div>\\n  \\n  <div class=\\\"features-grid\\\">\\n    <div class=\\\"feature-item\\\">\\n      <div class=\\\"feat-icon\\\"><i data-lucide=\\\"key\\\"><\\/i><\\/div>\\n      <h4>Single-Credentials Hub<\\/h4>\\n      <p>Register once, allocate single API ClientIds across diverse models, tools, and endpoints.<\\/p>\\n    <\\/div>\\n    <div class=\\\"feature-item\\\">\\n      <div class=\\\"feat-icon\\\"><i data-lucide=\\\"bar-chart-3\\\"><\\/i><\\/div>\\n      <h4>Dynamic Token Tracking<\\/h4>\\n      <p>Audit system usage meticulously with exact breakdowns of prompt and response tokens per application.<\\/p>\\n    <\\/div>\\n    <div class=\\\"feature-item\\\">\\n      <div class=\\\"feat-icon\\\"><i data-lucide=\\\"shield-check\\\"><\\/i><\\/div>\\n      <h4>Identity Governance<\\/h4>\\n      <p>Seamlessly authenticated with secure OpenID Connect (OIDC) federation, OAuth 2.1 authorization, and Enterprise SSO integrations.<\\/p>\\n    <\\/div>\\n    <div class=\\\"feature-item\\\">\\n      <div class=\\\"feat-icon\\\"><i data-lucide=\\\"file-code-2\\\"><\\/i><\\/div>\\n      <h4>Scalar Specs View<\\/h4>\\n      <p>Interactive playground and SDK testing console served with built-in Scalar spec reference engine.<\\/p>\\n    <\\/div>\\n  <\\/div>\\n<\\/div>\\n\\n<style>\\n/* Landing Page Specific Styling */\\n.landing-hero {\\n  display: grid;\\n  grid-template-columns: 1fr 1fr;\\n  align-items: center;\\n  gap: 4rem;\\n  padding: 4rem 0;\\n  min-height: calc(100vh - 12rem);\\n}\\n\\n@media(max-width: 968px) {\\n  .landing-hero {\\n    grid-template-columns: 1fr;\\n    text-align: center;\\n    padding: 2rem 0;\\n  }\\n  .hero-content {\\n    display: flex;\\n    flex-direction: column;\\n    align-items: center;\\n  }\\n  .hero-graphics {\\n    margin-top: 2rem;\\n  }\\n}\\n\\n.hero-tag {\\n  display: inline-flex;\\n  align-items: center;\\n  gap: 0.5rem;\\n  background: var(--primary-light);\\n  color: var(--primary);\\n  border: 1px solid var(--border-color);\\n  padding: 0.375rem 0.875rem;\\n  border-radius: 9999px;\\n  font-size: 0.825rem;\\n  font-weight: 700;\\n  margin-bottom: 1.5rem;\\n}\\n.pulse-dot {\\n  width: 6px;\\n  height: 6px;\\n  background: var(--primary);\\n  border-radius: 50%;\\n  box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.4);\\n  animation: pulse 1.5s infinite;\\n}\\n\\n@keyframes pulse {\\n  0% { box-shadow: 0 0 0 0 rgba(99, 102, 241, 0.4); }\\n  70% { box-shadow: 0 0 0 6px rgba(99, 102, 241, 0); }\\n  100% { box-shadow: 0 0 0 0 rgba(99, 102, 241, 0); }\\n}\\n\\n.hero-title {\\n  font-size: 3.5rem;\\n  font-weight: 800;\\n  line-height: 1.15;\\n  margin-bottom: 1.5rem;\\n  letter-spacing: -0.025em;\\n}\\n.gradient-text {\\n  background: linear-gradient(135deg, #818cf8 0%, #34d399 50%, #22d3ee 100%);\\n  -webkit-background-clip: text;\\n  -webkit-text-fill-color: transparent;\\n  background-clip: text;\\n}\\nbody.light .gradient-text {\\n  background: linear-gradient(135deg, #4f46e5 0%, #059669 50%, #0891b2 100%);\\n  -webkit-background-clip: text;\\n  -webkit-text-fill-color: transparent;\\n  background-clip: text;\\n}\\n\\n.hero-subtitle {\\n  font-size: 1.125rem;\\n  color: var(--text-secondary);\\n  margin-bottom: 2rem;\\n  max-width: 600px;\\n}\\n\\n.hero-actions {\\n  display: flex;\\n  gap: 1rem;\\n}\\n\\n/* Hero Right Side visuals: Dynamic Apigee Network */\\n.hero-graphics {\\n  position: relative;\\n  min-height: 580px;\\n  display: flex;\\n  align-items: center;\\n  justify-content: center;\\n}\\n\\n.apigee-network {\\n  position: relative;\\n  width: 580px;\\n  height: 580px;\\n  max-width: 100%;\\n  user-select: none;\\n  -webkit-user-select: none;\\n  transition: transform 0.25s ease-out;\\n  will-change: transform;\\n}\\n\\n@media (max-width: 1200px) {\\n  .apigee-network {\\n    transform: scale(0.85);\\n    transform-origin: center;\\n  }\\n}\\n\\n@media (max-width: 640px) {\\n  .hero-graphics {\\n    min-height: 390px;\\n  }\\n  .apigee-network {\\n    transform: scale(0.64);\\n    transform-origin: center;\\n  }\\n}\\n\\n.network-ring {\\n  position: absolute;\\n  border-radius: 50%;\\n  top: 50%;\\n  left: 50%;\\n  transform: translate(-50%, -50%);\\n  pointer-events: none;\\n}\\n\\n.ring-outer {\\n  width: 430px;\\n  height: 430px;\\n  border: 1.5px dashed rgba(99, 102, 241, 0.35);\\n  animation: spinSlow 36s linear infinite;\\n}\\n\\n.ring-inner {\\n  width: 280px;\\n  height: 280px;\\n  border: 1px solid rgba(6, 182, 212, 0.25);\\n  animation: spinSlowReverse 24s linear infinite;\\n}\\n\\n@keyframes spinSlow {\\n  from { transform: translate(-50%, -50%) rotate(0deg); }\\n  to { transform: translate(-50%, -50%) rotate(360deg); }\\n}\\n\\n@keyframes spinSlowReverse {\\n  from { transform: translate(-50%, -50%) rotate(360deg); }\\n  to { transform: translate(-50%, -50%) rotate(0deg); }\\n}\\n\\n.network-lines {\\n  position: absolute;\\n  inset: 0;\\n  width: 100%;\\n  height: 100%;\\n  pointer-events: none;\\n}\\n\\n.net-link {\\n  stroke: url(#netGrad);\\n  stroke-width: 2;\\n  stroke-dasharray: 6 6;\\n  transition: stroke-width 0.25s ease, opacity 0.25s ease, filter 0.25s ease;\\n  animation: dashFlow 1.8s linear infinite;\\n}\\n.apigee-network.has-active .net-link {\\n  opacity: 0.28;\\n}\\n.net-link.active,\\n.apigee-network.has-active .net-link.active {\\n  opacity: 1;\\n  stroke-width: 3.2;\\n  filter: drop-shadow(0 0 6px rgba(99, 102, 241, 0.75));\\n  animation-duration: 0.75s;\\n}\\n.net-link.d1 { animation-delay: -0.35s; }\\n.net-link.d2 { animation-delay: -0.7s; }\\n.net-link.d3 { animation-delay: -1.05s; }\\n.net-link.d4 { animation-delay: -1.4s; }\\n\\n@keyframes dashFlow {\\n  to { stroke-dashoffset: -24; }\\n}\\n\\n.network-hub {\\n  position: absolute;\\n  top: 50%;\\n  left: 50%;\\n  transform: translate(-50%, -50%);\\n  z-index: 4;\\n}\\n\\n.hub-pulse {\\n  position: absolute;\\n  inset: -14px;\\n  border-radius: 50%;\\n  background: radial-gradient(circle, rgba(99, 102, 241, 0.38) 0%, rgba(6, 182, 212, 0) 70%);\\n  animation: hubPulse 2.6s ease-in-out infinite;\\n}\\n\\n@keyframes hubPulse {\\n  0%, 100% { transform: scale(0.95); opacity: 0.7; }\\n  50% { transform: scale(1.16); opacity: 1; }\\n}\\n\\n.hub-core {\\n  position: relative;\\n  width: 148px;\\n  height: 148px;\\n  border-radius: 50%;\\n  background: linear-gradient(135deg, #6366f1 0%, #06b6d4 100%);\\n  display: flex;\\n  flex-direction: column;\\n  align-items: center;\\n  justify-content: center;\\n  gap: 0.25rem;\\n  box-shadow: 0 14px 40px rgba(99, 102, 241, 0.45);\\n  border: 2px solid rgba(255, 255, 255, 0.3);\\n}\\n\\n.hub-title {\\n  color: #fff;\\n  font-weight: 800;\\n  font-size: 1.25rem;\\n  line-height: 1.1;\\n}\\n\\n.hub-sub {\\n  color: rgba(255, 255, 255, 0.85);\\n  font-size: 0.78rem;\\n  font-weight: 600;\\n  text-transform: uppercase;\\n  letter-spacing: 0.06em;\\n}\\n\\n.network-node {\\n  position: absolute;\\n  transform: translate(-50%, -50%);\\n  z-index: 5;\\n  display: inline-flex;\\n  align-items: center;\\n  gap: 0.65rem;\\n  padding: 0.65rem 1.15rem;\\n  border-radius: 9999px;\\n  font-size: 1rem;\\n  font-weight: 600;\\n  white-space: nowrap;\\n  box-shadow: var(--shadow-lg);\\n  cursor: pointer;\\n  transition: transform 0.22s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.22s ease, box-shadow 0.22s ease;\\n  animation: nodeFloat 4s ease-in-out infinite;\\n}\\n\\n.network-node:hover,\\n.network-node.active {\\n  animation-play-state: paused;\\n  transform: translate(-50%, -50%) scale(1.09);\\n  border-color: var(--primary);\\n  box-shadow: 0 10px 28px rgba(99, 102, 241, 0.32);\\n}\\n\\n.network-hub {\\n  cursor: pointer;\\n}\\n\\n.network-hub .hub-core {\\n  transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.25s ease;\\n}\\n\\n.network-hub:hover .hub-core,\\n.apigee-network.has-active .network-hub .hub-core {\\n  transform: scale(1.06);\\n  box-shadow: 0 14px 38px rgba(99, 102, 241, 0.65);\\n}\\n\\n.node-icon {\\n  width: 2rem;\\n  height: 2rem;\\n  border-radius: 50%;\\n  display: inline-flex;\\n  align-items: center;\\n  justify-content: center;\\n  flex-shrink: 0;\\n}\\n\\n.node-top { top: 13.8%; left: 50%; animation-delay: 0s; }\\n.node-tr  { top: 38.8%; left: 84.3%; animation-delay: -0.8s; }\\n.node-br  { top: 79.3%; left: 71.2%; animation-delay: -1.6s; }\\n.node-bl  { top: 79.3%; left: 28.8%; animation-delay: -2.4s; }\\n.node-tl  { top: 38.8%; left: 15.7%; animation-delay: -3.2s; }\\n\\n@keyframes nodeFloat {\\n  0%, 100% { transform: translate(-50%, -50%) translateY(0px); }\\n  50% { transform: translate(-50%, -50%) translateY(-5px); }\\n}\\n\\n/* Category Cards Section */\\n.section-title {\\n  text-align: center;\\n  max-width: 600px;\\n  margin: 0 auto 3rem auto;\\n}\\n.sec-tag {\\n  color: var(--primary);\\n  font-size: 0.75rem;\\n  font-weight: 800;\\n  letter-spacing: 0.15em;\\n  margin-bottom: 0.5rem;\\n}\\n.section-title h2 {\\n  font-size: 2.25rem;\\n  margin-bottom: 0.75rem;\\n}\\n.section-title p {\\n  color: var(--text-secondary);\\n}\\n\\n.categories-grid {\\n  display: grid;\\n  grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));\\n  gap: 2rem;\\n}\\n.cat-card {\\n  padding: 2.5rem 2rem;\\n  cursor: pointer;\\n  display: flex;\\n  flex-direction: column;\\n  align-items: flex-start;\\n  gap: 1.25rem;\\n}\\n.cat-card:hover {\\n  transform: translateY(-4px);\\n  border-color: var(--primary);\\n  box-shadow: var(--shadow-lg);\\n}\\n.cat-icon {\\n  width: 3.5rem;\\n  height: 3.5rem;\\n  border-radius: 0.75rem;\\n  display: flex;\\n  align-items: center;\\n  justify-content: center;\\n}\\n.cat-icon i {\\n  width: 1.75rem;\\n  height: 1.75rem;\\n}\\n.cat-card h3 {\\n  font-size: 1.25rem;\\n}\\n.cat-card p {\\n  color: var(--text-secondary);\\n  font-size: 0.95rem;\\n  flex-grow: 1;\\n}\\n.cat-link {\\n  font-size: 0.875rem;\\n  font-weight: 700;\\n  color: var(--primary);\\n}\\n\\n/* Features Grid */\\n.features-grid {\\n  display: grid;\\n  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));\\n  gap: 3rem;\\n}\\n.feature-item {\\n  display: flex;\\n  flex-direction: column;\\n  gap: 1rem;\\n}\\n.feat-icon {\\n  width: 2.5rem;\\n  height: 2.5rem;\\n  background: var(--primary-light);\\n  color: var(--primary);\\n  border-radius: 0.5rem;\\n  display: flex;\\n  align-items: center;\\n  justify-content: center;\\n}\\n.feat-icon i {\\n  width: 1.25rem;\\n  height: 1.25rem;\\n}\\n.feature-item h4 {\\n  font-size: 1.125rem;\\n}\\n.feature-item p {\\n  color: var(--text-secondary);\\n  font-size: 0.9rem;\\n}\\n\\n/* Animation Utilities */\\n.animate-reveal {\\n  opacity: 0;\\n  transform: translateY(16px);\\n  animation: reveal 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;\\n}\\n.hero-content .animate-reveal:nth-child(1) { animation-delay: 0.1s; }\\n.hero-content .animate-reveal:nth-child(2) { animation-delay: 0.2s; }\\n.hero-content .animate-reveal:nth-child(3) { animation-delay: 0.3s; }\\n.hero-content .animate-reveal:nth-child(4) { animation-delay: 0.4s; }\\n\\n@keyframes reveal {\\n  to {\\n    opacity: 1;\\n    transform: translateY(0);\\n  }\\n}\\n<\\/style>\\n\\n<script>\\n// Landing page script initializer\\nwindow.viewInitializers['home'] = async function() {\\n  console.log(\\\"Landing page snippet logic running...\\\");\\n  \\n  // Hide registration button if user is already signed in\\n  const heroBtnLogin = document.getElementById('hero-btn-login');\\n  if (app.user) {\\n    if (heroBtnLogin) {\\n      heroBtnLogin.textContent = \\\"Go to Subscriptions\\\";\\n      heroBtnLogin.onclick = () => app.navigate('apps');\\n    }\\n  }\\n\\n  // Interactive mouse reactions on Apigee Network hero graphic\\n  const networkEl = document.querySelector('.apigee-network');\\n  if (networkEl) {\\n    const nodes = networkEl.querySelectorAll('.network-node[data-node]');\\n    const links = networkEl.querySelectorAll('.net-link[data-node]');\\n    const hub = document.getElementById('apigee-network-hub');\\n\\n    nodes.forEach((node) => {\\n      const id = node.getAttribute('data-node');\\n      node.addEventListener('mouseenter', () => {\\n        networkEl.classList.add('has-active');\\n        node.classList.add('active');\\n        links.forEach((l) => l.classList.toggle('active', l.getAttribute('data-node') === id));\\n      });\\n      node.addEventListener('mouseleave', () => {\\n        networkEl.classList.remove('has-active');\\n        node.classList.remove('active');\\n        links.forEach((l) => l.classList.remove('active'));\\n      });\\n    });\\n\\n    if (hub) {\\n      hub.addEventListener('mouseenter', () => {\\n        networkEl.classList.add('has-active');\\n        links.forEach((l) => l.classList.add('active'));\\n      });\\n      hub.addEventListener('mouseleave', () => {\\n        networkEl.classList.remove('has-active');\\n        links.forEach((l) => l.classList.remove('active'));\\n      });\\n    }\\n\\n    networkEl.addEventListener('mousemove', (e) => {\\n      const rect = networkEl.getBoundingClientRect();\\n      const dx = ((e.clientX - rect.left) / rect.width - 0.5) * 10;\\n      const dy = ((e.clientY - rect.top) / rect.height - 0.5) * 10;\\n      networkEl.style.transform = `perspective(700px) rotateX(${(-dy).toFixed(2)}deg) rotateY(${dx.toFixed(2)}deg)`;\\n    });\\n    networkEl.addEventListener('mouseleave', () => {\\n      networkEl.style.transform = '';\\n    });\\n  }\\n};\\n<\\/script>\\n\",\"analytics\":\"<div class=\\\"analytics-container\\\">\\n  <div class=\\\"analytics-header\\\">\\n    <div>\\n      <h1 style=\\\"font-size: 2rem; margin-bottom: 0.5rem\\\">Usage & Token Analytics<\\/h1>\\n      <p style=\\\"color: var(--text-secondary)\\\">\\n        Real-time tracking of API invocation rates, LLM prompt/response token workloads, and cost\\n        distributions.\\n      <\\/p>\\n    <\\/div>\\n\\n    <!-- Controls/Filters -->\\n    <div class=\\\"analytics-filters panel\\\">\\n      <div class=\\\"filter-group\\\">\\n        <label for=\\\"filter-app\\\">Subscription:<\\/label>\\n        <select\\n          id=\\\"filter-app\\\"\\n          class=\\\"input-control select-control\\\"\\n          onchange=\\\"processAndRenderAnalytics()\\\"\\n        >\\n          <option value=\\\"all\\\">All Subscriptions<\\/option>\\n          <!-- Subscriptions filled dynamically -->\\n        <\\/select>\\n      <\\/div>\\n\\n      <div class=\\\"filter-group\\\">\\n        <label for=\\\"filter-product\\\">API Product:<\\/label>\\n        <select\\n          id=\\\"filter-product\\\"\\n          class=\\\"input-control select-control\\\"\\n          onchange=\\\"processAndRenderAnalytics()\\\"\\n        >\\n          <option value=\\\"all\\\">All Products<\\/option>\\n          <!-- Products filled dynamically -->\\n        <\\/select>\\n      <\\/div>\\n\\n      <div class=\\\"filter-group\\\">\\n        <label for=\\\"filter-model\\\">AI Model:<\\/label>\\n        <select\\n          id=\\\"filter-model\\\"\\n          class=\\\"input-control select-control\\\"\\n          onchange=\\\"processAndRenderAnalytics()\\\"\\n        >\\n          <option value=\\\"all\\\">All Models<\\/option>\\n          <!-- Models filled dynamically -->\\n        <\\/select>\\n      <\\/div>\\n    <\\/div>\\n  <\\/div>\\n\\n  <!-- Loading Placeholder -->\\n  <div\\n    id=\\\"analytics-loading-placeholder\\\"\\n    class=\\\"panel\\\"\\n    style=\\\"text-align: center; padding: 6rem 2rem; margin-top: 2rem\\\"\\n  >\\n    <div\\n      style=\\\"\\n        border: 3px solid var(--border-color);\\n        border-top-color: var(--primary);\\n        border-radius: 50%;\\n        width: 30px;\\n        height: 30px;\\n        animation: spin 1s linear infinite;\\n        margin: 0 auto 1.25rem auto;\\n      \\\"\\n    ><\\/div>\\n    <p style=\\\"color: var(--text-secondary); font-size: 1.05rem\\\">Loading analytics statistics...<\\/p>\\n  <\\/div>\\n\\n  <div id=\\\"analytics-main-content\\\" style=\\\"display: none\\\">\\n    <!-- KPI Cards -->\\n    <div class=\\\"kpi-grid\\\">\\n      <div class=\\\"kpi-card panel\\\">\\n        <div class=\\\"kpi-icon-box\\\" style=\\\"background: rgba(99, 102, 241, 0.15); color: #6366f1\\\">\\n          <i data-lucide=\\\"activity\\\" style=\\\"width: 1.5rem; height: 1.5rem\\\"><\\/i>\\n        <\\/div>\\n        <div>\\n          <span class=\\\"kpi-label\\\">Total API Requests<\\/span>\\n          <h2 class=\\\"kpi-value-text\\\" id=\\\"kpi-requests\\\">0<\\/h2>\\n          <span class=\\\"kpi-trend success\\\"\\n            ><i\\n              data-lucide=\\\"trending-up\\\"\\n              style=\\\"\\n                width: 0.875rem;\\n                height: 0.875rem;\\n                display: inline-block;\\n                vertical-align: middle;\\n              \\\"\\n            ><\\/i>\\n            +12.4% vs last period<\\/span\\n          >\\n        <\\/div>\\n      <\\/div>\\n\\n      <div class=\\\"kpi-card panel\\\">\\n        <div class=\\\"kpi-icon-box\\\" style=\\\"background: rgba(16, 185, 129, 0.15); color: #10b981\\\">\\n          <i data-lucide=\\\"database\\\" style=\\\"width: 1.5rem; height: 1.5rem\\\"><\\/i>\\n        <\\/div>\\n        <div>\\n          <span class=\\\"kpi-label\\\">Total LLM Tokens<\\/span>\\n          <h2 class=\\\"kpi-value-text\\\" id=\\\"kpi-tokens\\\">0<\\/h2>\\n          <span class=\\\"kpi-trend success\\\"\\n            ><i\\n              data-lucide=\\\"trending-up\\\"\\n              style=\\\"\\n                width: 0.875rem;\\n                height: 0.875rem;\\n                display: inline-block;\\n                vertical-align: middle;\\n              \\\"\\n            ><\\/i>\\n            +8.1% vs last period<\\/span\\n          >\\n        <\\/div>\\n      <\\/div>\\n\\n      <div class=\\\"kpi-card panel\\\">\\n        <div class=\\\"kpi-icon-box\\\" style=\\\"background: rgba(6, 182, 212, 0.15); color: #06b6d4\\\">\\n          <i data-lucide=\\\"sparkles\\\" style=\\\"width: 1.5rem; height: 1.5rem\\\"><\\/i>\\n        <\\/div>\\n        <div>\\n          <span class=\\\"kpi-label\\\">Avg Token Efficiency<\\/span>\\n          <h2 class=\\\"kpi-value-text\\\" id=\\\"kpi-efficiency\\\">0%<\\/h2>\\n          <span class=\\\"kpi-sub-text\\\">Prompt / Response Ratio<\\/span>\\n        <\\/div>\\n      <\\/div>\\n\\n      <div class=\\\"kpi-card panel\\\">\\n        <div class=\\\"kpi-icon-box\\\" style=\\\"background: rgba(245, 158, 11, 0.15); color: #f59e0b\\\">\\n          <i data-lucide=\\\"zap\\\" style=\\\"width: 1.5rem; height: 1.5rem\\\"><\\/i>\\n        <\\/div>\\n        <div>\\n          <span class=\\\"kpi-label\\\">Avg Time to First Token<\\/span>\\n          <h2 class=\\\"kpi-value-text\\\" id=\\\"kpi-ttft\\\">0 ms<\\/h2>\\n          <span class=\\\"kpi-sub-text\\\">Mean TTFT Latency<\\/span>\\n        <\\/div>\\n      <\\/div>\\n\\n      <div class=\\\"kpi-card panel\\\">\\n        <div class=\\\"kpi-icon-box\\\" style=\\\"background: rgba(236, 72, 153, 0.15); color: #ec4899\\\">\\n          <i data-lucide=\\\"circle-dollar-sign\\\" style=\\\"width: 1.5rem; height: 1.5rem\\\"><\\/i>\\n        <\\/div>\\n        <div>\\n          <span class=\\\"kpi-label\\\">Estimated Total Cost<\\/span>\\n          <h2 class=\\\"kpi-value-text\\\" id=\\\"kpi-cost\\\">$0.00<\\/h2>\\n          <span class=\\\"kpi-sub-text\\\">Based on Model Token Rates<\\/span>\\n        <\\/div>\\n      <\\/div>\\n\\n      <div class=\\\"kpi-card panel\\\">\\n        <div class=\\\"kpi-icon-box\\\" style=\\\"background: rgba(139, 92, 246, 0.15); color: #8b5cf6\\\">\\n          <i data-lucide=\\\"cpu\\\" style=\\\"width: 1.5rem; height: 1.5rem\\\"><\\/i>\\n        <\\/div>\\n        <div>\\n          <span class=\\\"kpi-label\\\">Active Models Used<\\/span>\\n          <h2 class=\\\"kpi-value-text\\\" id=\\\"kpi-models\\\">0<\\/h2>\\n          <span class=\\\"kpi-sub-text\\\">Distinct LLM Models<\\/span>\\n        <\\/div>\\n      <\\/div>\\n    <\\/div>\\n\\n    <!-- Quota & Limits Section -->\\n    <div id=\\\"app-quota-section\\\" class=\\\"panel app-quota-panel\\\" style=\\\"display: none; margin-bottom: 2.5rem\\\">\\n      <h3 style=\\\"margin-bottom: 0.5rem; display: flex; align-items: center; gap: 0.5rem\\\">\\n        <i data-lucide=\\\"gauge\\\" style=\\\"width: 1.5rem; height: 1.5rem; color: var(--primary)\\\"><\\/i>\\n        App Subscription Quotas & Limit Utilization\\n      <\\/h3>\\n      <p style=\\\"color: var(--text-secondary); margin-bottom: 1.5rem; font-size: 0.9rem\\\">\\n        Track real-time token counts and call counts against your configured subscription tier limits.\\n      <\\/p>\\n      <div class=\\\"quota-utilization-grid\\\" id=\\\"quota-utilization-list\\\"><\\/div>\\n    <\\/div>\\n\\n    <!-- Graphs Layout -->\\n    <div class=\\\"charts-layout\\\">\\n      <!-- Big Chart: Call Volume -->\\n      <div class=\\\"panel chart-card full-width-chart\\\">\\n        <h3>API Invocations Over Time<\\/h3>\\n        <div class=\\\"chart-container-box\\\">\\n          <canvas id=\\\"chart-volume\\\"><\\/canvas>\\n        <\\/div>\\n      <\\/div>\\n\\n      <!-- Small Chart 1: Token breakdown -->\\n      <div class=\\\"panel chart-card\\\">\\n        <h3>Prompt vs Response Workloads<\\/h3>\\n        <div class=\\\"chart-container-box\\\">\\n          <canvas id=\\\"chart-tokens\\\"><\\/canvas>\\n        <\\/div>\\n      <\\/div>\\n\\n      <!-- Small Chart 2: API Dist -->\\n      <div class=\\\"panel chart-card\\\">\\n        <h3>Distribution by API Product<\\/h3>\\n        <div class=\\\"chart-container-box\\\">\\n          <canvas id=\\\"chart-products\\\"><\\/canvas>\\n        <\\/div>\\n      <\\/div>\\n\\n      <!-- Small Chart 3: Usage by Model -->\\n      <div class=\\\"panel chart-card\\\">\\n        <h3>Token Usage &amp; Cost by Model<\\/h3>\\n        <div class=\\\"chart-container-box\\\">\\n          <canvas id=\\\"chart-models\\\"><\\/canvas>\\n        <\\/div>\\n      <\\/div>\\n\\n      <!-- Small Chart 4: TTFT Latency -->\\n      <div class=\\\"panel chart-card\\\">\\n        <h3>Time to First Token (ms) Over Time<\\/h3>\\n        <div class=\\\"chart-container-box\\\">\\n          <canvas id=\\\"chart-ttft\\\"><\\/canvas>\\n        <\\/div>\\n      <\\/div>\\n    <\\/div>\\n\\n    <!-- Model Usage, Latency & Cost Table -->\\n    <div class=\\\"panel explorer-table-card\\\" style=\\\"margin-top: 2rem\\\">\\n      <h3 style=\\\"margin-bottom: 1.25rem\\\">Usage, Latency &amp; Cost by Model<\\/h3>\\n      <div style=\\\"overflow-x: auto\\\">\\n        <table class=\\\"analytics-table\\\">\\n          <thead>\\n            <tr>\\n              <th>AI Model<\\/th>\\n              <th>Requests<\\/th>\\n              <th>Prompt Tokens<\\/th>\\n              <th>Response Tokens<\\/th>\\n              <th>Total Tokens<\\/th>\\n              <th>Avg TTFT<\\/th>\\n              <th>Est. Cost<\\/th>\\n            <\\/tr>\\n          <\\/thead>\\n          <tbody id=\\\"model-analytics-table-body\\\">\\n            <tr>\\n              <td colspan=\\\"7\\\" style=\\\"text-align: center; color: var(--text-muted); padding: 2rem\\\">\\n                No model data loaded\\n              <\\/td>\\n            <\\/tr>\\n          <\\/tbody>\\n        <\\/table>\\n      <\\/div>\\n    <\\/div>\\n\\n    <!-- Table summary list -->\\n    <div class=\\\"panel explorer-table-card\\\" style=\\\"margin-top: 2rem\\\">\\n      <h3 style=\\\"margin-bottom: 1.25rem\\\">Analytics Explorer Summary<\\/h3>\\n      <div style=\\\"overflow-x: auto\\\">\\n        <table class=\\\"analytics-table\\\">\\n          <thead>\\n            <tr>\\n              <th>API Product<\\/th>\\n              <th>Style/Protocol<\\/th>\\n              <th>Total Requests<\\/th>\\n              <th>Prompt Tokens<\\/th>\\n              <th>Response Tokens<\\/th>\\n              <th>Total Tokens<\\/th>\\n            <\\/tr>\\n          <\\/thead>\\n          <tbody id=\\\"analytics-table-body\\\">\\n            <tr>\\n              <td colspan=\\\"6\\\" style=\\\"text-align: center; color: var(--text-muted); padding: 2rem\\\">\\n                No data loaded\\n              <\\/td>\\n            <\\/tr>\\n          <\\/tbody>\\n        <\\/table>\\n      <\\/div>\\n    <\\/div>\\n  <\\/div>\\n  <!-- End of analytics-main-content -->\\n<\\/div>\\n<!-- End of analytics-container -->\\n\\n<style>\\n  .analytics-header {\\n    display: flex;\\n    justify-content: space-between;\\n    align-items: flex-end;\\n    gap: 2rem;\\n    margin-bottom: 2.5rem;\\n  }\\n  @media (max-width: 968px) {\\n    .analytics-header {\\n      flex-direction: column;\\n      align-items: flex-start;\\n    }\\n  }\\n\\n  .analytics-filters {\\n    display: flex;\\n    gap: 1.25rem;\\n    padding: 0.75rem 1.25rem;\\n    align-items: center;\\n  }\\n  @media (max-width: 768px) {\\n    .analytics-filters {\\n      width: 100%;\\n      flex-direction: column;\\n      align-items: stretch;\\n    }\\n  }\\n  .filter-group {\\n    display: flex;\\n    align-items: center;\\n    gap: 0.5rem;\\n  }\\n  .filter-group label {\\n    font-size: 0.875rem;\\n    font-weight: 600;\\n    color: var(--text-secondary);\\n    white-space: nowrap;\\n  }\\n\\n  /* KPI Grid */\\n  .kpi-grid {\\n    display: grid;\\n    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));\\n    gap: 1.5rem;\\n    margin-bottom: 2.5rem;\\n  }\\n  .kpi-card {\\n    padding: 1.5rem;\\n    display: flex;\\n    align-items: center;\\n    gap: 1.5rem;\\n  }\\n  .kpi-icon-box {\\n    width: 3.5rem;\\n    height: 3.5rem;\\n    border-radius: 0.75rem;\\n    display: flex;\\n    align-items: center;\\n    justify-content: center;\\n    flex-shrink: 0;\\n  }\\n  .kpi-label {\\n    font-size: 0.825rem;\\n    font-weight: 700;\\n    text-transform: uppercase;\\n    letter-spacing: 0.05em;\\n    color: var(--text-muted);\\n  }\\n  .kpi-value-text {\\n    font-size: 2.25rem;\\n    font-weight: 800;\\n    margin: 0.125rem 0;\\n  }\\n  .kpi-trend {\\n    font-size: 0.75rem;\\n    font-weight: 700;\\n  }\\n  .kpi-trend.success {\\n    color: var(--success);\\n  }\\n  .kpi-sub-text {\\n    font-size: 0.75rem;\\n    color: var(--text-muted);\\n  }\\n\\n  /* Charts layout */\\n  .charts-layout {\\n    display: grid;\\n    grid-template-columns: 1fr 1fr;\\n    gap: 2rem;\\n  }\\n  .full-width-chart {\\n    grid-column: 1 / -1;\\n  }\\n  @media (max-width: 968px) {\\n    .charts-layout {\\n      grid-template-columns: 1fr;\\n    }\\n  }\\n  .chart-card {\\n    padding: 1.5rem;\\n    display: flex;\\n    flex-direction: column;\\n    gap: 1.25rem;\\n  }\\n  .chart-card h3 {\\n    font-size: 1.125rem;\\n  }\\n  .chart-container-box {\\n    position: relative;\\n    height: 320px;\\n    width: 100%;\\n  }\\n\\n  /* Table */\\n  .analytics-table {\\n    width: 100%;\\n    border-collapse: collapse;\\n    text-align: left;\\n  }\\n  .analytics-table th,\\n  .analytics-table td {\\n    padding: 1rem 1.25rem;\\n    border-bottom: 1px solid var(--border-color);\\n  }\\n  .analytics-table th {\\n    font-weight: 700;\\n    font-size: 0.85rem;\\n    text-transform: uppercase;\\n    letter-spacing: 0.05em;\\n    color: var(--text-muted);\\n    background: rgba(0, 0, 0, 0.1);\\n  }\\n  .analytics-table tbody tr:hover {\\n    background: rgba(255, 255, 255, 0.01);\\n  }\\n  body.light .analytics-table tbody tr:hover {\\n    background: rgba(0, 0, 0, 0.01);\\n  }\\n\\n  /* Quota Section */\\n  .app-quota-panel {\\n    background: var(--panel-bg);\\n    border: 1px solid var(--border-color);\\n    border-radius: 1rem;\\n    padding: 1.75rem;\\n    backdrop-filter: var(--backdrop-blur);\\n    -webkit-backdrop-filter: var(--backdrop-blur);\\n    box-shadow: var(--shadow-lg);\\n  }\\n  .quota-utilization-grid {\\n    display: grid;\\n    grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));\\n    gap: 1.5rem;\\n  }\\n  .quota-card {\\n    background: rgba(255, 255, 255, 0.02);\\n    border: 1px solid var(--border-color);\\n    border-radius: 0.75rem;\\n    padding: 1.5rem;\\n    display: flex;\\n    flex-direction: column;\\n    gap: 1.25rem;\\n    transition: transform var(--transition-fast), border-color var(--transition-fast), box-shadow var(--transition-fast);\\n  }\\n  body.light .quota-card {\\n    background: rgba(0, 0, 0, 0.02);\\n  }\\n  .quota-card:hover {\\n    transform: translateY(-2px);\\n    border-color: var(--border-color-hover);\\n    box-shadow: var(--shadow-md);\\n  }\\n  .quota-card-header {\\n    display: flex;\\n    justify-content: space-between;\\n    align-items: flex-start;\\n    gap: 1rem;\\n    border-bottom: 1px solid var(--border-color);\\n    padding-bottom: 0.875rem;\\n  }\\n  .quota-card-title {\\n    font-size: 1.1rem;\\n    font-weight: 700;\\n    color: var(--text-primary);\\n  }\\n  .quota-card-subtitle {\\n    font-size: 0.75rem;\\n    color: var(--text-muted);\\n    margin-top: 0.125rem;\\n    text-transform: uppercase;\\n    letter-spacing: 0.05em;\\n  }\\n  .app-badge {\\n    background: var(--primary-light);\\n    color: var(--primary);\\n    padding: 0.25rem 0.625rem;\\n    border-radius: 9999px;\\n    font-size: 0.75rem;\\n    font-weight: 700;\\n    white-space: nowrap;\\n    border: 1px solid rgba(99, 102, 241, 0.2);\\n  }\\n  body.light .app-badge {\\n    background: rgba(79, 70, 229, 0.1);\\n  }\\n  .quota-limits-list {\\n    display: flex;\\n    flex-direction: column;\\n    gap: 1.15rem;\\n  }\\n  .quota-limit-item {\\n    display: flex;\\n    flex-direction: column;\\n    gap: 0.35rem;\\n  }\\n  .quota-limit-meta {\\n    display: flex;\\n    justify-content: space-between;\\n    align-items: center;\\n    font-size: 0.825rem;\\n  }\\n  .quota-limit-label {\\n    font-weight: 600;\\n    color: var(--text-secondary);\\n    display: flex;\\n    align-items: center;\\n    gap: 0.35rem;\\n  }\\n  .quota-limit-value {\\n    font-weight: 700;\\n    color: var(--text-primary);\\n  }\\n  .quota-progress-container {\\n    height: 0.625rem;\\n    background: rgba(255, 255, 255, 0.08);\\n    border-radius: 9999px;\\n    overflow: hidden;\\n    position: relative;\\n  }\\n  body.light .quota-progress-container {\\n    background: rgba(0, 0, 0, 0.08);\\n  }\\n  .quota-progress-bar {\\n    height: 100%;\\n    border-radius: 9999px;\\n    width: 0%;\\n    transition: width var(--transition-normal) ease-out, background-color var(--transition-normal);\\n  }\\n  .quota-progress-bar.success {\\n    background: linear-gradient(90deg, #10b981 0%, #059669 100%);\\n  }\\n  .quota-progress-bar.warning {\\n    background: linear-gradient(90deg, #f59e0b 0%, #d97706 100%);\\n  }\\n  .quota-progress-bar.danger {\\n    background: linear-gradient(90deg, #ef4444 0%, #dc2626 100%);\\n  }\\n  .quota-warning-badge {\\n    display: flex;\\n    align-items: center;\\n    gap: 0.25rem;\\n    color: var(--danger);\\n    font-size: 0.75rem;\\n    font-weight: 700;\\n    margin-top: 0.25rem;\\n  }\\n  .quota-empty-state {\\n    text-align: center;\\n    padding: 3rem 1.5rem;\\n    color: var(--text-muted);\\n    font-size: 0.95rem;\\n  }\\n<\\/style>\\n\\n<script>\\n  var rawAnalyticsData = null;\\n  var volumeChartInstance = null;\\n  var tokenChartInstance = null;\\n  var productChartInstance = null;\\n  var modelChartInstance = null;\\n  var ttftChartInstance = null;\\n\\n  window.viewInitializers[\\\"analytics\\\"] = async function () {\\n    console.log(\\\"Analytics loading...\\\");\\n    await fetchAnalyticsStats();\\n  };\\n\\n  async function fetchAnalyticsStats() {\\n    const loader = document.getElementById(\\\"analytics-loading-placeholder\\\");\\n    const mainContent = document.getElementById(\\\"analytics-main-content\\\");\\n\\n    // 1. Hydrate products & apps from cache immediately (zero blocking)\\n    const cachedProducts = app.getCachedData(app.getProductsCacheKey());\\n    if (Array.isArray(cachedProducts) && (!app.products || app.products.length === 0)) {\\n      app.products = cachedProducts;\\n    }\\n    const cachedApps = app.getCachedData(app.getAppsCacheKey());\\n    if (Array.isArray(cachedApps) && (!app.apps || app.apps.length === 0)) {\\n      app.apps = cachedApps;\\n    }\\n\\n    // 2. Render cached analytics immediately if available\\n    const cacheKey = `prism_analytics_cache_${app.user ? app.user.email : \\\"guest\\\"}`;\\n    const cachedStats = app.getCachedData(cacheKey);\\n    const cacheAgeMs = app.getCacheAgeMs(cacheKey);\\n    let hasCache = false;\\n\\n    if (cachedStats) {\\n      rawAnalyticsData = cachedStats;\\n      populateFilterSelectors();\\n      processAndRenderAnalytics();\\n\\n      app.hideGlobalLoader();\\n      if (loader) loader.style.display = \\\"none\\\";\\n      if (mainContent) mainContent.style.display = \\\"block\\\";\\n      hasCache = true;\\n\\n      // Skip redundant network fetch when switching tabs within 30s\\n      if (cacheAgeMs < 30000) {\\n        return;\\n      }\\n    }\\n\\n    if (!hasCache) {\\n      app.showGlobalLoader(\\\"Loading analytics...\\\");\\n      if (loader) {\\n        loader.innerHTML = `\\n          <div class=\\\"portal-loader-card\\\" style=\\\"padding: 3rem 1.5rem;\\\">\\n            <div class=\\\"portal-spinner\\\"><\\/div>\\n            <p style=\\\"color: var(--text-secondary); font-size: 1.05rem; font-weight: 500;\\\">Loading analytics statistics...<\\/p>\\n          <\\/div>\\n        `;\\n        loader.style.display = \\\"block\\\";\\n      }\\n      if (mainContent) mainContent.style.display = \\\"none\\\";\\n    }\\n\\n    // 3. Revalidate products, apps, and analytics in parallel in the background\\n    try {\\n      const [,, stats] = await Promise.all([\\n        app.getCacheAgeMs(app.getProductsCacheKey()) < 30000 ? Promise.resolve() : app.loadProductsWithCache(),\\n        app.getCacheAgeMs(app.getAppsCacheKey()) < 30000 ? Promise.resolve() : app.loadAppsWithCache(),\\n        (async () => {\\n          if (CONFIG.demoMode) {\\n            const res = await fetch(\\\"/mock-analytics.json\\\");\\n            return await res.json();\\n          }\\n          const res = await app.makeRequest(\\n            `${CONFIG.apiHost}/api/portals/${CONFIG.portalId}/users/${app.user.email}/analytics`,\\n          );\\n          if (!res.ok) throw new Error();\\n          return await res.json();\\n        })(),\\n      ]);\\n\\n      const prevJson = hasCache ? JSON.stringify(rawAnalyticsData) : \\\"\\\";\\n      const nextJson = JSON.stringify(stats);\\n\\n      rawAnalyticsData = stats;\\n      app.setCachedData(cacheKey, stats);\\n\\n      if (!hasCache || prevJson !== nextJson) {\\n        populateFilterSelectors();\\n        processAndRenderAnalytics();\\n      }\\n\\n      app.hideGlobalLoader();\\n      if (loader) loader.style.display = \\\"none\\\";\\n      if (mainContent) mainContent.style.display = \\\"block\\\";\\n    } catch (err) {\\n      console.error(err);\\n      app.hideGlobalLoader();\\n      if (!hasCache) {\\n        app.showToast(\\\"Failed to fetch analytics metrics\\\", \\\"error\\\");\\n        if (loader) loader.style.display = \\\"none\\\";\\n      }\\n    }\\n  }\\n\\n  function populateFilterSelectors() {\\n    const appSelect = document.getElementById(\\\"filter-app\\\");\\n    const productSelect = document.getElementById(\\\"filter-product\\\");\\n    const modelSelect = document.getElementById(\\\"filter-model\\\");\\n\\n    if (!appSelect || !productSelect) return;\\n\\n    // Clear dynamic options\\n    appSelect.innerHTML = `<option value=\\\"all\\\">All Subscriptions<\\/option>`;\\n    productSelect.innerHTML = `<option value=\\\"all\\\">All Products<\\/option>`;\\n    if (modelSelect) {\\n      modelSelect.innerHTML = `<option value=\\\"all\\\">All Models<\\/option>`;\\n    }\\n\\n    // Find distinct apps\\n    const appNames = new Set();\\n    if (rawAnalyticsData.app) {\\n      rawAnalyticsData.app.forEach((entry) => {\\n        if (entry.environments) {\\n          entry.environments.forEach((env) => {\\n            if (env.dimensions) {\\n              env.dimensions.forEach((dim) => {\\n                if (dim.individualNames) {\\n                  dim.individualNames.forEach((name) => appNames.add(name));\\n                }\\n              });\\n            }\\n          });\\n        }\\n      });\\n    }\\n\\n    appNames.forEach((name) => {\\n      // Add nice spaces for visual names if appropriate\\n      const friendlyName = name.replace(/([A-Z])/g, \\\" $1\\\").trim();\\n      appSelect.innerHTML += `<option value=\\\"${name}\\\">${friendlyName}<\\/option>`;\\n    });\\n\\n    // Find distinct products\\n    const productNames = new Set();\\n    if (rawAnalyticsData.product) {\\n      rawAnalyticsData.product.forEach((entry) => {\\n        if (entry.environments) {\\n          entry.environments.forEach((env) => {\\n            if (env.dimensions) {\\n              env.dimensions.forEach((dim) => {\\n                if (dim.individualNames) {\\n                  dim.individualNames.forEach((name) => productNames.add(name));\\n                }\\n              });\\n            }\\n          });\\n        }\\n      });\\n    }\\n\\n    productNames.forEach((name) => {\\n      productSelect.innerHTML += `<option value=\\\"${name}\\\">${name}<\\/option>`;\\n    });\\n\\n    // Find distinct models\\n    if (modelSelect && rawAnalyticsData.model) {\\n      const modelNames = new Set();\\n      rawAnalyticsData.model.forEach((entry) => {\\n        if (entry.environments) {\\n          entry.environments.forEach((env) => {\\n            if (env.dimensions) {\\n              env.dimensions.forEach((dim) => {\\n                if (dim.individualNames) {\\n                  dim.individualNames.forEach((name) => {\\n                    if (name && name !== \\\"(not set)\\\") modelNames.add(name);\\n                  });\\n                }\\n              });\\n            }\\n          });\\n        }\\n      });\\n      modelNames.forEach((name) => {\\n        modelSelect.innerHTML += `<option value=\\\"${name}\\\">${name}<\\/option>`;\\n      });\\n    }\\n  }\\n\\n  function processAndRenderAnalytics() {\\n    if (!rawAnalyticsData) return;\\n\\n    const selectedApp = document.getElementById(\\\"filter-app\\\").value;\\n    const selectedProd = document.getElementById(\\\"filter-product\\\").value;\\n    const selectedModel = document.getElementById(\\\"filter-model\\\")\\n      ? document.getElementById(\\\"filter-model\\\").value\\n      : \\\"all\\\";\\n\\n    // Containers for results grouping\\n    let totalRequests = 0;\\n    let totalPrompts = 0;\\n    let totalResponses = 0;\\n\\n    // Daily series mapping (timestamp -> metrics totals)\\n    const dailySeries = {};\\n\\n    // Product share counters (productName -> requests)\\n    const productShare = {};\\n\\n    // 1. Process Product logs (to capture product distribution & table explorer stats)\\n    if (rawAnalyticsData.product) {\\n      rawAnalyticsData.product.forEach((entry) => {\\n        if (entry.environments) {\\n          entry.environments.forEach((env) => {\\n            if (env.dimensions) {\\n              env.dimensions.forEach((dim) => {\\n                const prodName = dim.individualNames ? dim.individualNames[0] : \\\"\\\";\\n                if (!prodName) return;\\n\\n                // Skip if product filter doesn't match\\n                if (selectedProd !== \\\"all\\\" && selectedProd !== prodName) return;\\n\\n                // Find metrics\\n                let msgCount = 0;\\n                let promptTokens = 0;\\n                let responseTokens = 0;\\n\\n                if (dim.metrics) {\\n                  dim.metrics.forEach((m) => {\\n                    const isMsg = m.name === \\\"sum(message_count)\\\";\\n                    const isPrompt = m.name === \\\"sum(dc_ai_prompt_token_count)\\\";\\n                    const isResp = m.name === \\\"sum(dc_ai_response_token_count)\\\";\\n\\n                    if (m.values) {\\n                      m.values.forEach((v) => {\\n                        const ts = parseInt(v.timestamp);\\n                        const val = parseInt(v.value) || 0;\\n\\n                        // Filter checks: if selecting an app, we'll reconcile in step 2. But we can accumulate daily values if no App is selected.\\n                        if (selectedApp === \\\"all\\\") {\\n                          if (!dailySeries[ts])\\n                            dailySeries[ts] = { requests: 0, prompts: 0, responses: 0 };\\n                          if (isMsg) dailySeries[ts].requests += val;\\n                          if (isPrompt) dailySeries[ts].prompts += val;\\n                          if (isResp) dailySeries[ts].responses += val;\\n                        }\\n\\n                        if (isMsg) msgCount += val;\\n                        if (isPrompt) promptTokens += val;\\n                        if (isResp) responseTokens += val;\\n                      });\\n                    }\\n                  });\\n                }\\n\\n                productShare[prodName] = (productShare[prodName] || 0) + msgCount;\\n              });\\n            }\\n          });\\n        }\\n      });\\n    }\\n\\n    // 2. Process App logs (to handle App-specific filters accurately)\\n    if (rawAnalyticsData.app) {\\n      rawAnalyticsData.app.forEach((entry) => {\\n        if (entry.environments) {\\n          entry.environments.forEach((env) => {\\n            if (env.dimensions) {\\n              env.dimensions.forEach((dim) => {\\n                const appDimName = dim.individualNames ? dim.individualNames[0] : \\\"\\\";\\n                if (!appDimName) return;\\n\\n                // Skip if app filter is set and doesn't match\\n                if (selectedApp !== \\\"all\\\" && selectedApp !== appDimName) return;\\n\\n                // Re-accumulate totals for KPI cards and daily charts if App filter is active\\n                if (dim.metrics) {\\n                  dim.metrics.forEach((m) => {\\n                    const isMsg = m.name === \\\"sum(message_count)\\\";\\n                    const isPrompt = m.name === \\\"sum(dc_ai_prompt_token_count)\\\";\\n                    const isResp = m.name === \\\"sum(dc_ai_response_token_count)\\\";\\n\\n                    if (m.values) {\\n                      m.values.forEach((v) => {\\n                        const ts = parseInt(v.timestamp);\\n                        const val = parseInt(v.value) || 0;\\n\\n                        // Accumulate to KPI totals\\n                        if (isMsg) totalRequests += val;\\n                        if (isPrompt) totalPrompts += val;\\n                        if (isResp) totalResponses += val;\\n\\n                        // Re-build dailySeries for this App\\n                        if (selectedApp !== \\\"all\\\") {\\n                          if (!dailySeries[ts])\\n                            dailySeries[ts] = { requests: 0, prompts: 0, responses: 0 };\\n                          if (isMsg) dailySeries[ts].requests += val;\\n                          if (isPrompt) dailySeries[ts].prompts += val;\\n                          if (isResp) dailySeries[ts].responses += val;\\n                        }\\n                      });\\n                    }\\n                  });\\n                }\\n              });\\n            }\\n          });\\n        }\\n      });\\n    }\\n\\n    // If app filter is 'all', KPI totals should be drawn from product totals to avoid double counting across filters\\n    if (selectedApp === \\\"all\\\") {\\n      Object.values(dailySeries).forEach((day) => {\\n        totalRequests += day.requests;\\n        totalPrompts += day.prompts;\\n        totalResponses += day.responses;\\n      });\\n    }\\n\\n    // 3. Process Model logs (usage by model, TTFT latency, and estimated cost)\\n    const modelStats = {};\\n    const dailyTtft = {};\\n    let totalCost = 0;\\n    let ttftSum = 0;\\n    let ttftCount = 0;\\n\\n    if (rawAnalyticsData.model) {\\n      rawAnalyticsData.model.forEach((entry) => {\\n        if (entry.environments) {\\n          entry.environments.forEach((env) => {\\n            if (env.dimensions) {\\n              env.dimensions.forEach((dim) => {\\n                const mName = dim.individualNames ? dim.individualNames[0] : \\\"\\\";\\n                if (!mName || mName === \\\"(not set)\\\") return;\\n                if (selectedModel !== \\\"all\\\" && selectedModel !== mName) return;\\n\\n                if (!modelStats[mName]) {\\n                  modelStats[mName] = {\\n                    requests: 0,\\n                    prompts: 0,\\n                    responses: 0,\\n                    ttftSum: 0,\\n                    ttftCount: 0,\\n                    cost: 0,\\n                  };\\n                }\\n\\n                if (dim.metrics) {\\n                  dim.metrics.forEach((m) => {\\n                    const isMsg = m.name === \\\"sum(message_count)\\\";\\n                    const isPrompt = m.name === \\\"sum(dc_ai_prompt_token_count)\\\";\\n                    const isResp = m.name === \\\"sum(dc_ai_response_token_count)\\\";\\n                    const isTtft = m.name === \\\"avg(dc_ai_time_first_token)\\\";\\n\\n                    if (m.values) {\\n                      m.values.forEach((v) => {\\n                        const ts = parseInt(v.timestamp);\\n                        const val = parseFloat(v.value) || 0;\\n                        if (isMsg) modelStats[mName].requests += Math.round(val);\\n                        if (isPrompt) modelStats[mName].prompts += Math.round(val);\\n                        if (isResp) modelStats[mName].responses += Math.round(val);\\n                        if (isTtft && val > 0) {\\n                          modelStats[mName].ttftSum += val;\\n                          modelStats[mName].ttftCount += 1;\\n                          ttftSum += val;\\n                          ttftCount += 1;\\n                          if (!dailyTtft[ts]) dailyTtft[ts] = { sum: 0, count: 0 };\\n                          dailyTtft[ts].sum += val;\\n                          dailyTtft[ts].count += 1;\\n                        }\\n                      });\\n                    }\\n                  });\\n                }\\n\\n                modelStats[mName].cost = app.estimateModelCost(\\n                  mName,\\n                  modelStats[mName].prompts,\\n                  modelStats[mName].responses,\\n                );\\n                totalCost += modelStats[mName].cost;\\n              });\\n            }\\n          });\\n        }\\n      });\\n    }\\n\\n    // If a specific model is selected and no app/product filter overrides, reflect model totals\\n    if (selectedModel !== \\\"all\\\" && selectedApp === \\\"all\\\" && selectedProd === \\\"all\\\") {\\n      totalRequests = 0;\\n      totalPrompts = 0;\\n      totalResponses = 0;\\n      Object.values(modelStats).forEach((ms) => {\\n        totalRequests += ms.requests;\\n        totalPrompts += ms.prompts;\\n        totalResponses += ms.responses;\\n      });\\n    }\\n\\n    // Update KPI displays\\n    document.getElementById(\\\"kpi-requests\\\").textContent = Number(totalRequests).toLocaleString();\\n    document.getElementById(\\\"kpi-tokens\\\").textContent = formatTokensNumber(\\n      totalPrompts + totalResponses,\\n    );\\n\\n    const efficiency = totalPrompts > 0 ? Math.round((totalResponses / totalPrompts) * 100) : 0;\\n    document.getElementById(\\\"kpi-efficiency\\\").textContent = `${efficiency}%`;\\n\\n    const avgTtft = ttftCount > 0 ? Math.round(ttftSum / ttftCount) : 0;\\n    const kpiTtftEl = document.getElementById(\\\"kpi-ttft\\\");\\n    if (kpiTtftEl) {\\n      kpiTtftEl.textContent = avgTtft >= 1000 ? `${(avgTtft / 1000).toFixed(2)} s` : `${avgTtft} ms`;\\n    }\\n\\n    const kpiCostEl = document.getElementById(\\\"kpi-cost\\\");\\n    if (kpiCostEl) {\\n      kpiCostEl.textContent = `$${totalCost.toFixed(2)}`;\\n    }\\n\\n    const activeModelsCount = Object.values(modelStats).filter(\\n      (m) => m.requests > 0 || m.prompts > 0 || m.responses > 0,\\n    ).length;\\n    const kpiModelsEl = document.getElementById(\\\"kpi-models\\\");\\n    if (kpiModelsEl) {\\n      kpiModelsEl.textContent = activeModelsCount.toLocaleString();\\n    }\\n\\n    // Re-build tables\\n    buildAnalyticsExplorerTable(selectedProd, selectedApp);\\n    buildModelAnalyticsTable(modelStats);\\n\\n    // Process chart series sorted chronologically\\n    const sortedTimestamps = Object.keys(dailySeries)\\n      .map(Number)\\n      .sort((a, b) => a - b);\\n    const labels = sortedTimestamps.map((ts) => {\\n      const d = new Date(ts);\\n      return d.toLocaleDateString(undefined, { month: \\\"short\\\", day: \\\"numeric\\\" });\\n    });\\n\\n    const volumeData = sortedTimestamps.map((ts) => dailySeries[ts].requests);\\n    const promptsData = sortedTimestamps.map((ts) => dailySeries[ts].prompts);\\n    const responsesData = sortedTimestamps.map((ts) => dailySeries[ts].responses);\\n    const ttftData = sortedTimestamps.map((ts) =>\\n      dailyTtft[ts] && dailyTtft[ts].count > 0 ? Math.round(dailyTtft[ts].sum / dailyTtft[ts].count) : 0,\\n    );\\n\\n    // Render Charts\\n    renderVolumeChart(labels, volumeData);\\n    renderTokenChart(labels, promptsData, responsesData);\\n    renderProductsChart(productShare);\\n    renderModelChart(modelStats);\\n    renderTtftChart(labels, ttftData);\\n\\n    // Render Quota Limits\\n    renderAppQuotaLimits();\\n  }\\n\\n  function buildAnalyticsExplorerTable(filterProd, filterApp) {\\n    const tbody = document.getElementById(\\\"analytics-table-body\\\");\\n    if (!tbody) return;\\n\\n    let html = \\\"\\\";\\n    const productsRows = {};\\n\\n    // Accumulate metrics row by row\\n    if (rawAnalyticsData.product) {\\n      rawAnalyticsData.product.forEach((entry) => {\\n        if (entry.environments) {\\n          entry.environments.forEach((env) => {\\n            if (env.dimensions) {\\n              env.dimensions.forEach((dim) => {\\n                const pName = dim.individualNames ? dim.individualNames[0] : \\\"\\\";\\n                if (!pName) return;\\n\\n                if (filterProd !== \\\"all\\\" && filterProd !== pName) return;\\n\\n                if (!productsRows[pName]) {\\n                  productsRows[pName] = { requests: 0, prompts: 0, responses: 0 };\\n                }\\n\\n                dim.metrics.forEach((m) => {\\n                  const isMsg = m.name === \\\"sum(message_count)\\\";\\n                  const isPrompt = m.name === \\\"sum(dc_ai_prompt_token_count)\\\";\\n                  const isResp = m.name === \\\"sum(dc_ai_response_token_count)\\\";\\n\\n                  m.values.forEach((v) => {\\n                    const val = parseInt(v.value) || 0;\\n                    if (isMsg) productsRows[pName].requests += val;\\n                    if (isPrompt) productsRows[pName].prompts += val;\\n                    if (isResp) productsRows[pName].responses += val;\\n                  });\\n                });\\n              });\\n            }\\n          });\\n        }\\n      });\\n    }\\n\\n    const rowKeys = Object.keys(productsRows);\\n    if (rowKeys.length === 0) {\\n      tbody.innerHTML = `<tr><td colspan=\\\"6\\\" style=\\\"text-align:center; color:var(--text-muted); padding:2rem;\\\">No usage data matches your current filters.<\\/td><\\/tr>`;\\n      return;\\n    }\\n\\n    rowKeys.forEach((pId) => {\\n      // Resolve protocol\\n      const pObj = app.products.find((item) => item.productId === pId || item.id === pId);\\n      const style = pObj ? pObj.displayStyle : \\\"REST\\\";\\n      const row = productsRows[pId];\\n      const totalTokens = row.prompts + row.responses;\\n\\n      html += `\\n      <tr>\\n        <td style=\\\"font-weight:600;\\\">${pId}<\\/td>\\n        <td><span class=\\\"style-badge ${(style || \\\"\\\").toLowerCase()}\\\">${style}<\\/span><\\/td>\\n        <td>${Number(row.requests).toLocaleString()}<\\/td>\\n        <td>${Number(row.prompts).toLocaleString()}<\\/td>\\n        <td>${Number(row.responses).toLocaleString()}<\\/td>\\n        <td style=\\\"font-weight:700;\\\">${Number(totalTokens).toLocaleString()}<\\/td>\\n      <\\/tr>\\n    `;\\n    });\\n\\n    tbody.innerHTML = html;\\n  }\\n\\n  function buildModelAnalyticsTable(modelStats) {\\n    const tbody = document.getElementById(\\\"model-analytics-table-body\\\");\\n    if (!tbody) return;\\n\\n    const entries = Object.entries(modelStats).sort(\\n      (a, b) => b[1].prompts + b[1].responses - (a[1].prompts + a[1].responses),\\n    );\\n    if (entries.length === 0) {\\n      tbody.innerHTML = `<tr><td colspan=\\\"7\\\" style=\\\"text-align:center; color:var(--text-muted); padding:2rem;\\\">No model usage data matches your current filters.<\\/td><\\/tr>`;\\n      return;\\n    }\\n\\n    tbody.innerHTML = entries\\n      .map(([modelName, row]) => {\\n        const totalTokens = row.prompts + row.responses;\\n        const avgTtft = row.ttftCount > 0 ? Math.round(row.ttftSum / row.ttftCount) : 0;\\n        return `\\n        <tr>\\n          <td style=\\\"font-weight:600;\\\">${modelName}<\\/td>\\n          <td>${Number(row.requests).toLocaleString()}<\\/td>\\n          <td>${Number(row.prompts).toLocaleString()}<\\/td>\\n          <td>${Number(row.responses).toLocaleString()}<\\/td>\\n          <td style=\\\"font-weight:700;\\\">${Number(totalTokens).toLocaleString()}<\\/td>\\n          <td>${avgTtft} ms<\\/td>\\n          <td style=\\\"font-weight:600; color:var(--success);\\\">$${row.cost.toFixed(4)}<\\/td>\\n        <\\/tr>\\n      `;\\n      })\\n      .join(\\\"\\\");\\n  }\\n\\n  function renderModelChart(modelStats) {\\n    const canvas = document.getElementById(\\\"chart-models\\\");\\n    if (!canvas) return;\\n    const ctx = canvas.getContext(\\\"2d\\\");\\n    if (modelChartInstance) modelChartInstance.destroy();\\n\\n    const isLight = app.theme === \\\"light\\\";\\n    const sorted = Object.entries(modelStats)\\n      .sort((a, b) => b[1].prompts + b[1].responses - (a[1].prompts + a[1].responses))\\n      .slice(0, 8);\\n\\n    const labels = sorted.map(([name]) => name);\\n    const tokenValues = sorted.map(([, s]) => s.prompts + s.responses);\\n\\n    modelChartInstance = new Chart(ctx, {\\n      type: \\\"bar\\\",\\n      data: {\\n        labels: labels,\\n        datasets: [\\n          {\\n            label: \\\"Total Tokens\\\",\\n            data: tokenValues,\\n            backgroundColor: \\\"#8b5cf6\\\",\\n            borderRadius: 4,\\n          },\\n        ],\\n      },\\n      options: {\\n        indexAxis: \\\"y\\\",\\n        responsive: true,\\n        maintainAspectRatio: false,\\n        plugins: {\\n          legend: { display: false },\\n        },\\n        scales: {\\n          x: {\\n            grid: { color: isLight ? \\\"rgba(0,0,0,0.05)\\\" : \\\"rgba(255,255,255,0.05)\\\" },\\n            ticks: { color: isLight ? \\\"#475569\\\" : \\\"#9ca3af\\\" },\\n          },\\n          y: {\\n            grid: { color: isLight ? \\\"rgba(0,0,0,0.05)\\\" : \\\"rgba(255,255,255,0.05)\\\" },\\n            ticks: { color: isLight ? \\\"#475569\\\" : \\\"#9ca3af\\\" },\\n          },\\n        },\\n      },\\n    });\\n  }\\n\\n  function renderTtftChart(labels, ttftData) {\\n    const canvas = document.getElementById(\\\"chart-ttft\\\");\\n    if (!canvas) return;\\n    const ctx = canvas.getContext(\\\"2d\\\");\\n    if (ttftChartInstance) ttftChartInstance.destroy();\\n\\n    const isLight = app.theme === \\\"light\\\";\\n\\n    ttftChartInstance = new Chart(ctx, {\\n      type: \\\"line\\\",\\n      data: {\\n        labels: labels,\\n        datasets: [\\n          {\\n            label: \\\"Avg TTFT (ms)\\\",\\n            data: ttftData,\\n            borderColor: \\\"#f59e0b\\\",\\n            backgroundColor: \\\"rgba(245, 158, 11, 0.12)\\\",\\n            fill: true,\\n            tension: 0.35,\\n            borderWidth: 2,\\n            pointRadius: 3,\\n          },\\n        ],\\n      },\\n      options: {\\n        responsive: true,\\n        maintainAspectRatio: false,\\n        plugins: {\\n          legend: { display: false },\\n        },\\n        scales: {\\n          x: {\\n            grid: { color: isLight ? \\\"rgba(0,0,0,0.05)\\\" : \\\"rgba(255,255,255,0.05)\\\" },\\n            ticks: { color: isLight ? \\\"#475569\\\" : \\\"#9ca3af\\\" },\\n          },\\n          y: {\\n            grid: { color: isLight ? \\\"rgba(0,0,0,0.05)\\\" : \\\"rgba(255,255,255,0.05)\\\" },\\n            ticks: { color: isLight ? \\\"#475569\\\" : \\\"#9ca3af\\\" },\\n          },\\n        },\\n      },\\n    });\\n  }\\n\\n  // Chart.js Generators\\n  function renderVolumeChart(labels, data) {\\n    const ctx = document.getElementById(\\\"chart-volume\\\").getContext(\\\"2d\\\");\\n    if (volumeChartInstance) volumeChartInstance.destroy();\\n\\n    const isLight = app.theme === \\\"light\\\";\\n\\n    volumeChartInstance = new Chart(ctx, {\\n      type: \\\"line\\\",\\n      data: {\\n        labels: labels,\\n        datasets: [\\n          {\\n            label: \\\"Invocations\\\",\\n            data: data,\\n            borderColor: \\\"#6366f1\\\",\\n            backgroundColor: \\\"rgba(99, 102, 241, 0.1)\\\",\\n            fill: true,\\n            tension: 0.35,\\n            borderWidth: 2.5,\\n            pointBackgroundColor: \\\"#6366f1\\\",\\n            pointRadius: 4,\\n            pointHoverRadius: 6,\\n          },\\n        ],\\n      },\\n      options: {\\n        responsive: true,\\n        maintainAspectRatio: false,\\n        plugins: {\\n          legend: { display: false },\\n        },\\n        scales: {\\n          x: {\\n            grid: { color: isLight ? \\\"rgba(0,0,0,0.05)\\\" : \\\"rgba(255,255,255,0.05)\\\" },\\n            ticks: { color: isLight ? \\\"#475569\\\" : \\\"#9ca3af\\\" },\\n          },\\n          y: {\\n            grid: { color: isLight ? \\\"rgba(0,0,0,0.05)\\\" : \\\"rgba(255,255,255,0.05)\\\" },\\n            ticks: { color: isLight ? \\\"#475569\\\" : \\\"#9ca3af\\\" },\\n          },\\n        },\\n      },\\n    });\\n  }\\n\\n  function renderTokenChart(labels, prompts, responses) {\\n    const ctx = document.getElementById(\\\"chart-tokens\\\").getContext(\\\"2d\\\");\\n    if (tokenChartInstance) tokenChartInstance.destroy();\\n\\n    const isLight = app.theme === \\\"light\\\";\\n\\n    tokenChartInstance = new Chart(ctx, {\\n      type: \\\"bar\\\",\\n      data: {\\n        labels: labels,\\n        datasets: [\\n          {\\n            label: \\\"Prompt Tokens\\\",\\n            data: prompts,\\n            backgroundColor: \\\"#3b82f6\\\",\\n            borderRadius: 4,\\n          },\\n          {\\n            label: \\\"Response Tokens\\\",\\n            data: responses,\\n            backgroundColor: \\\"#10b981\\\",\\n            borderRadius: 4,\\n          },\\n        ],\\n      },\\n      options: {\\n        responsive: true,\\n        maintainAspectRatio: false,\\n        plugins: {\\n          legend: {\\n            position: \\\"bottom\\\",\\n            labels: { color: isLight ? \\\"#0f172a\\\" : \\\"#f9fafb\\\" },\\n          },\\n        },\\n        scales: {\\n          x: {\\n            stacked: true,\\n            grid: { color: isLight ? \\\"rgba(0,0,0,0.05)\\\" : \\\"rgba(255,255,255,0.05)\\\" },\\n            ticks: { color: isLight ? \\\"#475569\\\" : \\\"#9ca3af\\\" },\\n          },\\n          y: {\\n            stacked: true,\\n            grid: { color: isLight ? \\\"rgba(0,0,0,0.05)\\\" : \\\"rgba(255,255,255,0.05)\\\" },\\n            ticks: { color: isLight ? \\\"#475569\\\" : \\\"#9ca3af\\\" },\\n          },\\n        },\\n      },\\n    });\\n  }\\n\\n  function renderProductsChart(shares) {\\n    const ctx = document.getElementById(\\\"chart-products\\\").getContext(\\\"2d\\\");\\n    if (productChartInstance) productChartInstance.destroy();\\n\\n    const isLight = app.theme === \\\"light\\\";\\n    const labels = Object.keys(shares);\\n    const data = Object.values(shares);\\n\\n    productChartInstance = new Chart(ctx, {\\n      type: \\\"doughnut\\\",\\n      data: {\\n        labels: labels,\\n        datasets: [\\n          {\\n            data: data,\\n            backgroundColor: [\\n              \\\"#6366f1\\\",\\n              \\\"#10b981\\\",\\n              \\\"#06b6d4\\\",\\n              \\\"#f59e0b\\\",\\n              \\\"#ec4899\\\",\\n              \\\"#8b5cf6\\\",\\n              \\\"#ef4444\\\",\\n            ],\\n            borderWidth: isLight ? 2 : 0,\\n            borderColor: isLight ? \\\"#fff\\\" : \\\"\\\",\\n          },\\n        ],\\n      },\\n      options: {\\n        responsive: true,\\n        maintainAspectRatio: false,\\n        plugins: {\\n          legend: {\\n            position: \\\"bottom\\\",\\n            labels: { color: isLight ? \\\"#0f172a\\\" : \\\"#f9fafb\\\", boxWidth: 12 },\\n          },\\n        },\\n      },\\n    });\\n  }\\n\\n  // Visual formats\\n  function formatTokensNumber(num) {\\n    if (num >= 1000000) return `${(num / 1000000).toFixed(1)}M`;\\n    if (num >= 1000) return `${(num / 1000).toFixed(0)}k`;\\n    return num.toLocaleString();\\n  }\\n\\n  // Quota Limits Render Logic\\n  function renderAppQuotaLimits() {\\n    const quotaSection = document.getElementById(\\\"app-quota-section\\\");\\n    const quotaList = document.getElementById(\\\"quota-utilization-list\\\");\\n    if (!quotaSection || !quotaList) return;\\n\\n    quotaList.innerHTML = \\\"\\\";\\n    quotaSection.style.display = \\\"block\\\";\\n\\n    const selectedApp = document.getElementById(\\\"filter-app\\\").value;\\n\\n    // Determine which apps we need to display\\n    let appsToProcess = [];\\n    if (selectedApp === \\\"all\\\") {\\n      const appNames = new Set();\\n      if (rawAnalyticsData.app) {\\n        rawAnalyticsData.app.forEach((entry) => {\\n          if (entry.environments) {\\n            entry.environments.forEach((env) => {\\n              if (env.dimensions) {\\n                env.dimensions.forEach((dim) => {\\n                  if (dim.individualNames) {\\n                    dim.individualNames.forEach((name) => appNames.add(name));\\n                  }\\n                });\\n              }\\n            });\\n          }\\n        });\\n      }\\n      if (app.apps) {\\n        app.apps.forEach(a => appNames.add(a.name));\\n      }\\n      appsToProcess = Array.from(appNames);\\n    } else {\\n      appsToProcess = [selectedApp];\\n    }\\n\\n    let cardsHtml = \\\"\\\";\\n    let totalCardsRendered = 0;\\n\\n    appsToProcess.forEach(appName => {\\n      const subscribedProdIds = resolveProductsForApp(appName);\\n      if (!subscribedProdIds || subscribedProdIds.length === 0) return;\\n\\n      const usage = getAppUsage(appName);\\n\\n      subscribedProdIds.forEach(prodId => {\\n        const prodObj = (app.products || []).find(p => \\n          p.id === prodId || \\n          p.productId === prodId || \\n          p.name === prodId || \\n          (p.packages && p.packages.some(pkg => pkg.packageId === prodId))\\n        );\\n        if (!prodObj) return;\\n\\n        if (prodObj.packages && prodObj.packages.length > 0) {\\n          prodObj.packages.forEach(pkg => {\\n            const matchesPackageId = pkg.packageId === prodId;\\n            const matchesLegacyProductId = prodObj.id === prodId || prodObj.productId === prodId || prodObj.name === prodId;\\n            if (!matchesPackageId && !matchesLegacyProductId) return;\\n\\n            const hasTokenLimits = pkg.tokenLimits && pkg.tokenLimits.length > 0;\\n            const hasCallLimits = pkg.callLimits && pkg.callLimits.length > 0;\\n\\n            if (!hasTokenLimits && !hasCallLimits) return;\\n\\n            totalCardsRendered++;\\n\\n            const friendlyAppName = appName.replace(/([A-Z])/g, \\\" $1\\\").trim();\\n            const friendlyPackageName = pkg.packageId.split('-').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');\\n\\n            let limitsHtml = \\\"\\\";\\n\\n            if (hasTokenLimits) {\\n               pkg.tokenLimits.forEach(lim => {\\n                 const limitVal = parseFloat(lim.tokenLimit);\\n                 const consumedVal = usage.totalTokens;\\n                 const percent = Math.min(100, limitVal > 0 ? (consumedVal / limitVal) * 100 : 0);\\n                 const percentText = (limitVal > 0 ? (consumedVal / limitVal) * 100 : 0).toFixed(1);\\n\\n                 let progressClass = \\\"success\\\";\\n                 if (percent > 85) progressClass = \\\"danger\\\";\\n                 else if (percent > 50) progressClass = \\\"warning\\\";\\n\\n                 const warningMsg = percent >= 85 ? `\\n                   <div class=\\\"quota-warning-badge\\\">\\n                     <i data-lucide=\\\"alert-triangle\\\" style=\\\"width:0.875rem; height:0.875rem;\\\"><\\/i>\\n                     Approaching limit (>${percentText}%)\\n                   <\\/div>\\n                 ` : \\\"\\\";\\n\\n                 limitsHtml += `\\n                   <div class=\\\"quota-limit-item\\\">\\n                     <div class=\\\"quota-limit-meta\\\">\\n                       <span class=\\\"quota-limit-label\\\">\\n                         <i data-lucide=\\\"cpu\\\" style=\\\"width:0.875rem; height:0.875rem; color:var(--info);\\\"><\\/i>\\n                         Tokens (${lim.modelName}) <span class=\\\"style-badge\\\" style=\\\"font-size:0.65rem; padding:0.1rem 0.35rem;\\\">${lim.type}<\\/span>\\n                       <\\/span>\\n                       <span class=\\\"quota-limit-value\\\">${formatTokensNumber(consumedVal)} / ${formatTokensNumber(limitVal)}<\\/span>\\n                     <\\/div>\\n                     <div class=\\\"quota-progress-container\\\">\\n                       <div class=\\\"quota-progress-bar ${progressClass}\\\" style=\\\"width: ${percent}%;\\\"><\\/div>\\n                     <\\/div>\\n                     <div style=\\\"display:flex; justify-content:space-between; align-items:center; margin-top:0.125rem;\\\">\\n                       <span style=\\\"font-size:0.75rem; color:var(--text-muted);\\\">${percentText}% consumed<\\/span>\\n                       ${warningMsg}\\n                     <\\/div>\\n                   <\\/div>\\n                 `;\\n               });\\n            }\\n\\n            if (hasCallLimits) {\\n               pkg.callLimits.forEach(lim => {\\n                 const limitVal = parseFloat(lim.callLimit);\\n                 const consumedVal = usage.totalCalls;\\n                 const percent = Math.min(100, limitVal > 0 ? (consumedVal / limitVal) * 100 : 0);\\n                 const percentText = (limitVal > 0 ? (consumedVal / limitVal) * 100 : 0).toFixed(1);\\n\\n                 let progressClass = \\\"success\\\";\\n                 if (percent > 85) progressClass = \\\"danger\\\";\\n                 else if (percent > 50) progressClass = \\\"warning\\\";\\n\\n                 const warningMsg = percent >= 85 ? `\\n                   <div class=\\\"quota-warning-badge\\\">\\n                     <i data-lucide=\\\"alert-triangle\\\" style=\\\"width:0.875rem; height:0.875rem;\\\"><\\/i>\\n                     Approaching limit (>${percentText}%)\\n                   <\\/div>\\n                 ` : \\\"\\\";\\n\\n                 limitsHtml += `\\n                   <div class=\\\"quota-limit-item\\\">\\n                     <div class=\\\"quota-limit-meta\\\">\\n                       <span class=\\\"quota-limit-label\\\">\\n                         <i data-lucide=\\\"activity\\\" style=\\\"width:0.875rem; height:0.875rem; color:var(--primary);\\\"><\\/i>\\n                         Invocations / Calls <span class=\\\"style-badge\\\" style=\\\"font-size:0.65rem; padding:0.1rem 0.35rem;\\\">${lim.type}<\\/span>\\n                       <\\/span>\\n                       <span class=\\\"quota-limit-value\\\">${Number(consumedVal).toLocaleString()} / ${Number(limitVal).toLocaleString()}<\\/span>\\n                     <\\/div>\\n                     <div class=\\\"quota-progress-container\\\">\\n                       <div class=\\\"quota-progress-bar ${progressClass}\\\" style=\\\"width: ${percent}%;\\\"><\\/div>\\n                     <\\/div>\\n                     <div style=\\\"display:flex; justify-content:space-between; align-items:center; margin-top:0.125rem;\\\">\\n                       <span style=\\\"font-size:0.75rem; color:var(--text-muted);\\\">${percentText}% consumed<\\/span>\\n                       ${warningMsg}\\n                     <\\/div>\\n                   <\\/div>\\n                 `;\\n               });\\n            }\\n\\n            cardsHtml += `\\n              <div class=\\\"quota-card\\\">\\n                <div class=\\\"quota-card-header\\\">\\n                  <div>\\n                    <h4 class=\\\"quota-card-title\\\">${friendlyPackageName}<\\/h4>\\n                    <div class=\\\"quota-card-subtitle\\\">${prodObj.displayName}<\\/div>\\n                  <\\/div>\\n                  <span class=\\\"app-badge\\\">${friendlyAppName}<\\/span>\\n                <\\/div>\\n                <div class=\\\"quota-limits-list\\\">\\n                  ${limitsHtml}\\n                <\\/div>\\n              <\\/div>\\n            `;\\n          });\\n        }\\n      });\\n    });\\n\\n    if (totalCardsRendered === 0) {\\n      quotaList.innerHTML = `\\n        <div class=\\\"quota-empty-state\\\">\\n          <i data-lucide=\\\"gauge-off\\\" style=\\\"width:2rem; height:2rem; color:var(--text-muted); margin-bottom:0.75rem; display:block; margin-left:auto; margin-right:auto;\\\"><\\/i>\\n          No active subscription limit packages configured for this application.\\n        <\\/div>\\n      `;\\n    } else {\\n      quotaList.innerHTML = cardsHtml;\\n    }\\n\\n    if (window.lucide) {\\n      lucide.createIcons();\\n    }\\n  }\\n\\n  function matchAppName(dimName, appName) {\\n    if (!dimName || !appName) return false;\\n    return dimName.toLowerCase().replace(/\\\\s/g, '') === appName.toLowerCase().replace(/\\\\s/g, '');\\n  }\\n\\n  function resolveProductsForApp(appName) {\\n    let subscribedProductIds = [];\\n    const matchedApp = (app.apps || []).find(a => matchAppName(appName, a.name));\\n    if (matchedApp && matchedApp.credentials && matchedApp.credentials[0] && matchedApp.credentials[0].products) {\\n      subscribedProductIds = [...matchedApp.credentials[0].products];\\n    }\\n    \\n    if (subscribedProductIds.length === 0) {\\n      const cleanApp = appName.toLowerCase().replace(/app/g, '').replace(/\\\\s/g, '');\\n      if (cleanApp.length >= 3) {\\n        (app.products || []).forEach(p => {\\n          const cleanProdId = p.id.toLowerCase().replace(/\\\\s/g, '');\\n          const cleanProdName = p.displayName.toLowerCase().replace(/\\\\s/g, '');\\n          if (cleanProdId.includes(cleanApp) || cleanProdName.includes(cleanApp)) {\\n            subscribedProductIds.push(p.id);\\n          }\\n        });\\n      }\\n    }\\n    \\n    if (subscribedProductIds.length === 0 && appName.toLowerCase().includes(\\\"ai\\\")) {\\n      const geminiProd = (app.products || []).find(p => p.id.includes(\\\"gemini\\\"));\\n      if (geminiProd) subscribedProductIds.push(geminiProd.id);\\n    }\\n    \\n    return subscribedProductIds;\\n  }\\n\\n  function getAppUsage(appName) {\\n    let totalCalls = 0;\\n    let totalTokens = 0;\\n    \\n    if (rawAnalyticsData && rawAnalyticsData.app) {\\n      rawAnalyticsData.app.forEach(entry => {\\n        if (entry.environments) {\\n          entry.environments.forEach(env => {\\n            if (env.dimensions) {\\n              env.dimensions.forEach(dim => {\\n                const appDimName = dim.individualNames ? dim.individualNames[0] : \\\"\\\";\\n                if (matchAppName(appDimName, appName)) {\\n                  if (dim.metrics) {\\n                    dim.metrics.forEach(m => {\\n                      const isMsg = m.name === \\\"sum(message_count)\\\";\\n                      const isPrompt = m.name === \\\"sum(dc_ai_prompt_token_count)\\\";\\n                      const isResp = m.name === \\\"sum(dc_ai_response_token_count)\\\";\\n                      \\n                      if (m.values) {\\n                        m.values.forEach(v => {\\n                          const val = parseFloat(v.value) || 0;\\n                          if (isMsg) totalCalls += val;\\n                          if (isPrompt || isResp) totalTokens += val;\\n                        });\\n                      }\\n                    });\\n                  }\\n                }\\n              });\\n            }\\n          });\\n        }\\n      });\\n    }\\n    return { totalCalls, totalTokens };\\n  }\\n<\\/script>\\n\",\"ard\":\"<div class=\\\"ard-container\\\">\\n  <div class=\\\"ard-header panel\\\">\\n    <div class=\\\"ard-header-info\\\">\\n      <div class=\\\"ard-badge\\\">\\n        <i data-lucide=\\\"compass\\\" style=\\\"width: 1rem; height: 1rem;\\\"><\\/i>\\n        <span>ARD Spec Standard v1.0<\\/span>\\n      <\\/div>\\n      <h1>Agentic Resource Discovery<\\/h1>\\n      <p>The machine-readable capability manifest (<code>ai-catalog.json<\\/code>) that allows autonomous AI agents to dynamically discover, verify, and call this AI portal's API Hub resources.<\\/p>\\n    <\\/div>\\n    <div class=\\\"ard-header-actions\\\">\\n      <button class=\\\"btn btn-secondary btn-sm\\\" id=\\\"btn-refresh-catalog\\\" onclick=\\\"loadArdCatalog()\\\">\\n        <i data-lucide=\\\"refresh-cw\\\" style=\\\"width: 1rem; height: 1rem;\\\"><\\/i>\\n        <span>Refresh Catalog<\\/span>\\n      <\\/button>\\n    <\\/div>\\n  <\\/div>\\n\\n  <div class=\\\"ard-grid\\\">\\n    <!-- Left Sidebar: Publisher Info & Metadata -->\\n    <div class=\\\"ard-sidebar\\\">\\n      <div class=\\\"panel metadata-panel\\\">\\n        <h3>Publisher Identity<\\/h3>\\n        <div class=\\\"meta-item\\\">\\n          <span class=\\\"meta-label\\\">Display Name<\\/span>\\n          <strong id=\\\"meta-display-name\\\" class=\\\"meta-value\\\">Loading...<\\/strong>\\n        <\\/div>\\n        <div class=\\\"meta-item\\\">\\n          <span class=\\\"meta-label\\\">Identifier (DID/URI)<\\/span>\\n          <a id=\\\"meta-identifier\\\" class=\\\"meta-value meta-link\\\" href=\\\"#\\\" target=\\\"_blank\\\">Loading...<\\/a>\\n        <\\/div>\\n        <div class=\\\"meta-item\\\">\\n          <span class=\\\"meta-label\\\">Documentation<\\/span>\\n          <a id=\\\"meta-doc-url\\\" class=\\\"meta-value meta-link\\\" href=\\\"#\\\" target=\\\"_blank\\\">Loading...<\\/a>\\n        <\\/div>\\n      <\\/div>\\n\\n      <div class=\\\"panel meta-help-panel\\\">\\n        <div class=\\\"help-header\\\">\\n          <i data-lucide=\\\"info\\\" style=\\\"color: var(--primary); width: 1.25rem; height: 1.25rem;\\\"><\\/i>\\n          <h4>How Agents Use ARD<\\/h4>\\n        <\\/div>\\n        <p>AI agents (like Gemini, Claude, or customized enterprise assistants) fetch this manifest from <code>/.well-known/ai-catalog.json<\\/code> to:<\\/p>\\n        <ul class=\\\"help-list\\\">\\n          <li><strong>Identify<\\/strong> what capabilities are hosted on your domain.<\\/li>\\n          <li><strong>Understand<\\/strong> what protocols (MCP vs REST) are required.<\\/li>\\n          <li><strong>Select<\\/strong> the correct tools dynamically based on natural language task descriptions.<\\/li>\\n        <\\/ul>\\n      <\\/div>\\n    <\\/div>\\n\\n    <!-- Right Sidebar: Explorer & Code View -->\\n    <div class=\\\"ard-main-panel panel\\\">\\n      <div class=\\\"panel-tabs\\\">\\n        <button class=\\\"tab-btn active\\\" id=\\\"tab-visual\\\" onclick=\\\"switchArdTab('visual')\\\">\\n          <i data-lucide=\\\"eye\\\" style=\\\"width: 1rem; height: 1rem;\\\"><\\/i>\\n          <span>Visual Explorer<\\/span>\\n        <\\/button>\\n        <button class=\\\"tab-btn\\\" id=\\\"tab-code\\\" onclick=\\\"switchArdTab('code')\\\">\\n          <i data-lucide=\\\"code\\\" style=\\\"width: 1rem; height: 1rem;\\\"><\\/i>\\n          <span>Raw Spec (ai-catalog.json)<\\/span>\\n        <\\/button>\\n      <\\/div>\\n\\n      <div id=\\\"ard-content-visual\\\" class=\\\"tab-content active\\\">\\n        <div class=\\\"catalog-summary\\\">\\n          <div class=\\\"summary-stat\\\">\\n            <span id=\\\"stat-total-entries\\\">0<\\/span>\\n            <label>Registered Capabilities<\\/label>\\n          <\\/div>\\n          <div class=\\\"summary-stat\\\">\\n            <span id=\\\"stat-mcp-entries\\\">0<\\/span>\\n            <label>MCP Servers<\\/label>\\n          <\\/div>\\n          <div class=\\\"summary-stat\\\">\\n            <span id=\\\"stat-rest-entries\\\">0<\\/span>\\n            <label>REST OpenAPI Specs<\\/label>\\n          <\\/div>\\n        <\\/div>\\n\\n        <div id=\\\"visual-entries-container\\\" class=\\\"entries-list\\\">\\n          <!-- Dynamic entries inserted here -->\\n          <div class=\\\"loader-container\\\">\\n            <div class=\\\"loader\\\">Loading ARD Catalog...<\\/div>\\n          <\\/div>\\n        <\\/div>\\n      <\\/div>\\n\\n      <div id=\\\"ard-content-code\\\" class=\\\"tab-content\\\">\\n        <div class=\\\"code-view-wrapper\\\">\\n          <div class=\\\"code-header\\\">\\n            <span class=\\\"code-filename\\\">ai-catalog.json<\\/span>\\n            <button class=\\\"copy-btn\\\" onclick=\\\"copyCatalogJson()\\\">\\n              <i data-lucide=\\\"copy\\\" id=\\\"copy-icon\\\" style=\\\"width: 1rem; height: 1rem;\\\"><\\/i>\\n              <span id=\\\"copy-text\\\">Copy JSON<\\/span>\\n            <\\/button>\\n          <\\/div>\\n          <pre id=\\\"raw-json-block\\\"><code class=\\\"json-code\\\">Loading...<\\/code><\\/pre>\\n        <\\/div>\\n      <\\/div>\\n    <\\/div>\\n  <\\/div>\\n<\\/div>\\n\\n<style>\\n.ard-container {\\n  max-width: 1200px;\\n  margin: 0 auto;\\n  padding: 1.5rem 0;\\n  display: flex;\\n  flex-direction: column;\\n  gap: 1.5rem;\\n}\\n\\n.ard-header {\\n  display: flex;\\n  justify-content: space-between;\\n  align-items: center;\\n  gap: 2rem;\\n  padding: 2rem;\\n}\\n\\n@media (max-width: 768px) {\\n  .ard-header {\\n    flex-direction: column;\\n    align-items: flex-start;\\n  }\\n}\\n\\n.ard-badge {\\n  display: inline-flex;\\n  align-items: center;\\n  gap: 0.375rem;\\n  background: var(--primary-light);\\n  color: var(--primary);\\n  padding: 0.375rem 0.75rem;\\n  border-radius: 9999px;\\n  font-size: 0.75rem;\\n  font-weight: 700;\\n  text-transform: uppercase;\\n  letter-spacing: 0.05em;\\n  margin-bottom: 0.75rem;\\n}\\n\\n.ard-header-info h1 {\\n  font-size: 2.25rem;\\n  margin-bottom: 0.5rem;\\n  background: linear-gradient(135deg, var(--text-primary) 30%, var(--primary) 100%);\\n  -webkit-background-clip: text;\\n  -webkit-text-fill-color: transparent;\\n}\\n\\n.ard-header-info p {\\n  color: var(--text-secondary);\\n  font-size: 1rem;\\n  line-height: 1.6;\\n  max-width: 800px;\\n}\\n\\n.ard-grid {\\n  display: grid;\\n  grid-template-columns: 320px 1fr;\\n  gap: 1.5rem;\\n}\\n\\n@media (max-width: 992px) {\\n  .ard-grid {\\n    grid-template-columns: 1fr;\\n  }\\n}\\n\\n.ard-sidebar {\\n  display: flex;\\n  flex-direction: column;\\n  gap: 1.5rem;\\n}\\n\\n.metadata-panel h3, .meta-help-panel h4 {\\n  font-size: 1.125rem;\\n  margin-bottom: 1.25rem;\\n  border-bottom: 1px solid var(--border-color);\\n  padding-bottom: 0.5rem;\\n}\\n\\n.meta-item {\\n  display: flex;\\n  flex-direction: column;\\n  gap: 0.25rem;\\n  margin-bottom: 1rem;\\n}\\n.meta-item:last-child {\\n  margin-bottom: 0;\\n}\\n\\n.meta-label {\\n  font-size: 0.75rem;\\n  color: var(--text-muted);\\n  text-transform: uppercase;\\n  letter-spacing: 0.05em;\\n  font-weight: 700;\\n}\\n\\n.meta-value {\\n  font-size: 0.95rem;\\n  color: var(--text-primary);\\n  word-break: break-all;\\n}\\n\\n.meta-link {\\n  color: var(--primary);\\n  text-decoration: none;\\n}\\n.meta-link:hover {\\n  text-decoration: underline;\\n}\\n\\n.meta-help-panel {\\n  padding: 1.5rem;\\n}\\n\\n.help-header {\\n  display: flex;\\n  align-items: center;\\n  gap: 0.5rem;\\n  margin-bottom: 1rem;\\n}\\n\\n.help-header h4 {\\n  margin: 0;\\n  border: none;\\n  padding: 0;\\n}\\n\\n.meta-help-panel p {\\n  font-size: 0.875rem;\\n  color: var(--text-secondary);\\n  line-height: 1.5;\\n  margin-bottom: 1rem;\\n}\\n\\n.help-list {\\n  list-style: none;\\n  display: flex;\\n  flex-direction: column;\\n  gap: 0.75rem;\\n}\\n\\n.help-list li {\\n  font-size: 0.875rem;\\n  position: relative;\\n  padding-left: 1.25rem;\\n  color: var(--text-secondary);\\n}\\n\\n.help-list li::before {\\n  content: \\\"•\\\";\\n  position: absolute;\\n  left: 0.25rem;\\n  color: var(--primary);\\n  font-weight: bold;\\n}\\n\\n.panel-tabs {\\n  display: flex;\\n  border-bottom: 1px solid var(--border-color);\\n  margin-bottom: 1.5rem;\\n}\\n\\n.tab-btn {\\n  background: none;\\n  border: none;\\n  border-bottom: 2px solid transparent;\\n  padding: 1rem 1.5rem;\\n  color: var(--text-secondary);\\n  font-weight: 600;\\n  display: flex;\\n  align-items: center;\\n  gap: 0.5rem;\\n  cursor: pointer;\\n  transition: all var(--transition-fast);\\n}\\n\\n.tab-btn:hover {\\n  color: var(--text-primary);\\n}\\n\\n.tab-btn.active {\\n  color: var(--primary);\\n  border-color: var(--primary);\\n}\\n\\n.tab-content {\\n  display: none;\\n}\\n\\n.tab-content.active {\\n  display: block;\\n}\\n\\n.catalog-summary {\\n  display: grid;\\n  grid-template-columns: repeat(3, 1fr);\\n  gap: 1rem;\\n  margin-bottom: 1.5rem;\\n}\\n\\n.summary-stat {\\n  background: rgba(0,0,0,0.15);\\n  border: 1px solid var(--border-color);\\n  border-radius: 0.5rem;\\n  padding: 1rem;\\n  text-align: center;\\n}\\n\\n.summary-stat span {\\n  display: block;\\n  font-size: 1.75rem;\\n  font-weight: 800;\\n  color: var(--primary);\\n  margin-bottom: 0.25rem;\\n}\\n\\n.summary-stat label {\\n  font-size: 0.75rem;\\n  color: var(--text-secondary);\\n  text-transform: uppercase;\\n  letter-spacing: 0.05em;\\n  font-weight: 600;\\n}\\n\\n.entries-list {\\n  display: flex;\\n  flex-direction: column;\\n  gap: 1rem;\\n}\\n\\n.entry-card {\\n  background: var(--input-bg);\\n  border: 1px solid var(--border-color);\\n  border-radius: 0.5rem;\\n  padding: 1.25rem;\\n  transition: all var(--transition-fast);\\n}\\n\\n.entry-card:hover {\\n  border-color: var(--border-color-hover);\\n  background: rgba(255,255,255,0.02);\\n}\\n\\n.entry-card-header {\\n  display: flex;\\n  justify-content: space-between;\\n  align-items: flex-start;\\n  gap: 1rem;\\n  margin-bottom: 0.75rem;\\n}\\n\\n.entry-title-box h4 {\\n  font-size: 1.15rem;\\n  margin-bottom: 0.25rem;\\n  color: var(--text-primary);\\n}\\n\\n.entry-id {\\n  font-family: monospace;\\n  font-size: 0.8rem;\\n  color: var(--text-muted);\\n}\\n\\n.entry-type-badge {\\n  padding: 0.25rem 0.5rem;\\n  border-radius: 0.25rem;\\n  font-size: 0.75rem;\\n  font-weight: 700;\\n  font-family: monospace;\\n}\\n\\n.entry-type-badge.mcp {\\n  background: var(--info-light);\\n  color: var(--info);\\n}\\n\\n.entry-type-badge.rest {\\n  background: var(--success-light);\\n  color: var(--success);\\n}\\n\\n.entry-description {\\n  font-size: 0.9rem;\\n  color: var(--text-secondary);\\n  line-height: 1.5;\\n  margin-bottom: 1rem;\\n}\\n\\n.entry-section-title {\\n  font-size: 0.75rem;\\n  color: var(--text-muted);\\n  text-transform: uppercase;\\n  letter-spacing: 0.05em;\\n  font-weight: 700;\\n  margin-bottom: 0.5rem;\\n}\\n\\n.entry-queries {\\n  display: flex;\\n  flex-direction: column;\\n  gap: 0.375rem;\\n  margin-bottom: 1rem;\\n}\\n\\n.query-bubble {\\n  background: rgba(0,0,0,0.2);\\n  border-radius: 0.375rem;\\n  padding: 0.5rem 0.75rem;\\n  font-size: 0.825rem;\\n  color: var(--text-secondary);\\n  display: flex;\\n  align-items: center;\\n  gap: 0.5rem;\\n}\\n\\n.entry-tags {\\n  display: flex;\\n  flex-wrap: wrap;\\n  gap: 0.5rem;\\n}\\n\\n.entry-tag {\\n  background: rgba(255,255,255,0.04);\\n  border: 1px solid var(--border-color);\\n  color: var(--text-muted);\\n  font-size: 0.75rem;\\n  font-weight: 600;\\n  padding: 0.25rem 0.5rem;\\n  border-radius: 0.25rem;\\n}\\n\\n/* Code Panel */\\n.code-view-wrapper {\\n  background: #060913;\\n  border: 1px solid var(--border-color);\\n  border-radius: 0.5rem;\\n  overflow: hidden;\\n}\\n\\n.code-header {\\n  background: rgba(255,255,255,0.03);\\n  border-bottom: 1px solid var(--border-color);\\n  padding: 0.75rem 1.25rem;\\n  display: flex;\\n  justify-content: space-between;\\n  align-items: center;\\n}\\n\\n.code-filename {\\n  font-family: monospace;\\n  font-size: 0.85rem;\\n  color: var(--text-secondary);\\n  font-weight: 600;\\n}\\n\\n.copy-btn {\\n  background: none;\\n  border: 1px solid var(--border-color);\\n  border-radius: 0.375rem;\\n  color: var(--text-secondary);\\n  padding: 0.375rem 0.75rem;\\n  font-size: 0.8rem;\\n  cursor: pointer;\\n  display: flex;\\n  align-items: center;\\n  gap: 0.375rem;\\n  font-weight: 500;\\n  transition: all var(--transition-fast);\\n}\\n\\n.copy-btn:hover {\\n  background: rgba(255,255,255,0.05);\\n  color: var(--text-primary);\\n}\\n\\n#raw-json-block {\\n  margin: 0;\\n  padding: 1.5rem;\\n  overflow-x: auto;\\n  font-family: 'Courier New', Courier, monospace;\\n  font-size: 0.9rem;\\n  line-height: 1.5;\\n  color: #a9b2c3;\\n  max-height: 500px;\\n}\\n\\n/* Beautiful native JSON coloring styles */\\n.json-key { color: #f43f5e; font-weight: 600; }\\n.json-string { color: #10b981; }\\n.json-value { color: #06b6d4; }\\n.json-boolean { color: #f59e0b; font-weight: bold; }\\n.json-number { color: #6366f1; }\\n<\\/style>\\n\\n<script>\\n(function() {\\n  let loadedCatalog = null;\\n\\n  async function loadArdCatalog() {\\n    const visualContainer = document.getElementById(\\\"visual-entries-container\\\");\\n    const jsonBlock = document.querySelector(\\\".json-code\\\");\\n\\n    try {\\n      // 1. Determine if we are in Demo mode or Live mode\\n      let catalog = null;\\n      if (CONFIG.demoMode) {\\n        // Fetch local mockup data structured precisely like API Hub ARD response\\n        catalog = {\\n          \\\"specVersion\\\": \\\"1.0\\\",\\n          \\\"host\\\": {\\n            \\\"displayName\\\": \\\"Apigee AI Portal Local Identity Provider (MOCK MODE)\\\",\\n            \\\"identifier\\\": \\\"https://localhost:8080\\\",\\n            \\\"documentationUrl\\\": \\\"https://localhost:8080/docs\\\"\\n          },\\n          \\\"entries\\\": [\\n            {\\n              \\\"id\\\": \\\"mcp-sap-billing\\\",\\n              \\\"displayName\\\": \\\"MCP-SAP-Billing\\\",\\n              \\\"description\\\": \\\"Model Context Protocol interface for querying billing history and submitting billing disputes directly into SAP S/4HANA.\\\",\\n              \\\"type\\\": \\\"application/mcp+json\\\",\\n              \\\"url\\\": window.location.origin + \\\"/api/portals/default/products/mcp-sap-billing\\\",\\n              \\\"representativeQueries\\\": [\\n                \\\"Query my billing history or invoices\\\",\\n                \\\"Submit an invoice dispute case or billing contest request\\\",\\n                \\\"Retrieve detailed invoice amounts and line-items\\\"\\n              ],\\n              \\\"tags\\\": [\\\"mcp\\\", \\\"sap\\\", \\\"billing\\\"]\\n            },\\n            {\\n              \\\"id\\\": \\\"ai-vertexqwen-1\\\",\\n              \\\"displayName\\\": \\\"Vertex Qwen Model API\\\",\\n              \\\"description\\\": \\\"REST OpenAPI spec interface for Vertex AI foundation language and classification models.\\\",\\n              \\\"type\\\": \\\"application/openapi+json\\\",\\n              \\\"url\\\": window.location.origin + \\\"/api/portals/default/products/ai-vertexqwen-1\\\",\\n              \\\"representativeQueries\\\": [\\n                \\\"Summarize text data in bullet points\\\",\\n                \\\"Perform custom zero-shot classification on support logs\\\"\\n              ],\\n              \\\"tags\\\": [\\\"rest\\\", \\\"vertex\\\", \\\"qwen\\\"]\\n            }\\n          ]\\n        };\\n      } else {\\n        // Fetch from live API gateway IDP route\\n        const oidcHost = CONFIG.oidcEndpoint || window.location.origin;\\n        const res = await fetch(`${oidcHost}/.well-known/ai-catalog.json`);\\n        if (!res.ok) throw new Error(\\\"Could not retrieve AI catalog from gateway.\\\");\\n        catalog = await res.json();\\n      }\\n\\n      loadedCatalog = catalog;\\n\\n      // 2. Render Left Sidebar metadata\\n      document.getElementById(\\\"meta-display-name\\\").textContent = catalog.host.displayName;\\n      const metaId = document.getElementById(\\\"meta-identifier\\\");\\n      metaId.textContent = catalog.host.identifier;\\n      metaId.href = catalog.host.identifier;\\n      const metaDoc = document.getElementById(\\\"meta-doc-url\\\");\\n      metaDoc.textContent = catalog.host.documentationUrl || \\\"View Specs Docs\\\";\\n      metaDoc.href = catalog.host.documentationUrl || \\\"#catalog\\\";\\n\\n      // 3. Render Visual Catalog and Counters\\n      const entries = catalog.entries || [];\\n      document.getElementById(\\\"stat-total-entries\\\").textContent = entries.length;\\n\\n      let mcpCount = 0;\\n      let restCount = 0;\\n\\n      visualContainer.innerHTML = \\\"\\\";\\n      if (entries.length === 0) {\\n        visualContainer.innerHTML = `\\n          <div style=\\\"text-align:center; padding:3rem; color:var(--text-secondary);\\\">\\n            <i data-lucide=\\\"compass\\\" style=\\\"width:3rem; height:3rem; margin-bottom:1rem; color:var(--text-muted);\\\"><\\/i>\\n            <p>No agentic capabilities are currently published in the catalog.<\\/p>\\n          <\\/div>\\n        `;\\n      } else {\\n        entries.forEach(entry => {\\n          const isMcp = entry.type === \\\"application/mcp+json\\\";\\n          if (isMcp) mcpCount++; else restCount++;\\n\\n          const typeBadgeText = isMcp ? \\\"MCP API\\\" : \\\"OpenAPI\\\";\\n          const typeBadgeClass = isMcp ? \\\"mcp\\\" : \\\"rest\\\";\\n\\n          const queryBubbles = (entry.representativeQueries || [])\\n            .map(q => `\\n              <div class=\\\"query-bubble\\\">\\n                <i data-lucide=\\\"message-square\\\" style=\\\"width:0.875rem; height:0.875rem; color:var(--primary);\\\"><\\/i>\\n                <span>\\\"${q}\\\"<\\/span>\\n              <\\/div>\\n            `).join(\\\"\\\");\\n\\n          const tagBadges = (entry.tags || [])\\n            .map(t => `<span class=\\\"entry-tag\\\">${t}<\\/span>`).join(\\\"\\\");\\n\\n          const card = document.createElement(\\\"div\\\");\\n          card.className = \\\"entry-card\\\";\\n          card.innerHTML = `\\n            <div class=\\\"entry-card-header\\\">\\n              <div class=\\\"entry-title-box\\\">\\n                <h4>${entry.displayName}<\\/h4>\\n                <div class=\\\"entry-id\\\">ID: ${entry.id || entry.displayName.toLowerCase()}<\\/div>\\n              <\\/div>\\n              <span class=\\\"entry-type-badge ${typeBadgeClass}\\\">${typeBadgeText}<\\/span>\\n            <\\/div>\\n            <p class=\\\"entry-description\\\">${entry.description || \\\"No description provided.\\\"}<\\/p>\\n\\n            <div class=\\\"entry-section-title\\\">Example Agent Prompts<\\/div>\\n            <div class=\\\"entry-queries\\\">\\n              ${queryBubbles || '<div style=\\\"color:var(--text-muted); font-size:0.85rem;\\\">No prompts configured.<\\/div>'}\\n            <\\/div>\\n\\n            <div class=\\\"entry-section-title\\\">Keywords & Tags<\\/div>\\n            <div class=\\\"entry-tags\\\">\\n              ${tagBadges || '<span style=\\\"color:var(--text-muted); font-size:0.85rem;\\\">No tags.<\\/span>'}\\n            <\\/div>\\n          `;\\n          visualContainer.appendChild(card);\\n        });\\n      }\\n\\n      document.getElementById(\\\"stat-mcp-entries\\\").textContent = mcpCount;\\n      document.getElementById(\\\"stat-rest-entries\\\").textContent = restCount;\\n\\n      // 4. Render Raw Spec with native vanilla syntax highlighting\\n      const catalogStr = JSON.stringify(catalog, null, 2);\\n      jsonBlock.innerHTML = syntaxHighlightJson(catalogStr);\\n\\n      lucide.createIcons();\\n\\n    } catch (e) {\\n      console.error(e);\\n      visualContainer.innerHTML = `\\n        <div style=\\\"text-align:center; padding:3rem; color:var(--danger);\\\">\\n          <i data-lucide=\\\"alert-triangle\\\" style=\\\"width:3rem; height:3rem; margin-bottom:1rem;\\\"><\\/i>\\n          <p>Failed to load Agentic Resource Discovery Catalog: ${e.message}<\\/p>\\n        <\\/div>\\n      `;\\n      lucide.createIcons();\\n    }\\n  }\\n\\n  // Pure JavaScript syntax highlighter helper\\n  function syntaxHighlightJson(json) {\\n    if (typeof json !== 'string') {\\n      json = JSON.stringify(json, undefined, 2);\\n    }\\n    json = json.replace(/&/g, '&amp;').replace(/<\\/g, '&lt;').replace(/>/g, '&gt;');\\n    return json.replace(/(\\\"(\\\\\\\\u[a-zA-Z0-9]{4}|\\\\\\\\[^u]|[^\\\\\\\\\\\"])*\\\"(\\\\s*:)?|\\\\b(true|false|null)\\\\b|-?\\\\d+(?:\\\\.\\\\d*)?(?:[eE][+-]?\\\\d+)?)/g, function (match) {\\n      let cls = 'json-value';\\n      if (/^\\\"/.test(match)) {\\n        if (/:$/.test(match)) {\\n          cls = 'json-key';\\n        } else {\\n          cls = 'json-string';\\n        }\\n      } else if (/true|false/.test(match)) {\\n        cls = 'json-boolean';\\n      } else if (/null/.test(match)) {\\n        cls = 'json-value';\\n      } else {\\n        cls = 'json-number';\\n      }\\n      return '<span class=\\\"' + cls + '\\\">' + match + '<\\/span>';\\n    });\\n  }\\n\\n  function switchArdTab(tab) {\\n    document.querySelectorAll(\\\".tab-btn\\\").forEach(btn => btn.classList.remove(\\\"active\\\"));\\n    document.querySelectorAll(\\\".tab-content\\\").forEach(c => c.classList.remove(\\\"active\\\"));\\n\\n    if (tab === 'visual') {\\n      document.getElementById(\\\"tab-visual\\\").classList.add(\\\"active\\\");\\n      document.getElementById(\\\"ard-content-visual\\\").classList.add(\\\"active\\\");\\n    } else {\\n      document.getElementById(\\\"tab-code\\\").classList.add(\\\"active\\\");\\n      document.getElementById(\\\"ard-content-code\\\").classList.add(\\\"active\\\");\\n    }\\n  }\\n\\n  function copyCatalogJson() {\\n    if (!loadedCatalog) return;\\n    const jsonStr = JSON.stringify(loadedCatalog, null, 2);\\n    navigator.clipboard.writeText(jsonStr).then(() => {\\n      const copyText = document.getElementById(\\\"copy-text\\\");\\n      const copyIcon = document.getElementById(\\\"copy-icon\\\");\\n\\n      copyText.textContent = \\\"Copied!\\\";\\n      copyIcon.setAttribute(\\\"data-lucide\\\", \\\"check\\\");\\n      lucide.createIcons();\\n\\n      setTimeout(() => {\\n        copyText.textContent = \\\"Copy JSON\\\";\\n        copyIcon.setAttribute(\\\"data-lucide\\\", \\\"copy\\\");\\n        lucide.createIcons();\\n      }, 2000);\\n    }).catch(err => {\\n      console.error(\\\"Could not copy text: \\\", err);\\n    });\\n  }\\n\\n  // Register view initializer globally\\n  window.viewInitializers = window.viewInitializers || {};\\n  window.viewInitializers.ard = loadArdCatalog;\\n\\n  // Expose triggers\\n  window.loadArdCatalog = loadArdCatalog;\\n  window.switchArdTab = switchArdTab;\\n  window.copyCatalogJson = copyCatalogJson;\\n\\n  // Auto load immediately on mount\\n  loadArdCatalog();\\n})();\\n<\\/script>\\n\",\"catalog\":\"<div class=\\\"catalog-container\\\">\\n  <div class=\\\"catalog-header\\\">\\n    <div style=\\\"flex-grow:1;\\\">\\n      <h1 style=\\\"font-size:2rem; margin-bottom:0.5rem;\\\">AI Product Catalog<\\/h1>\\n      <p style=\\\"color:var(--text-secondary);\\\">Browse, search, and integrate with state-of-the-art AI foundation models, custom tools, and automated business agents.<\\/p>\\n    <\\/div>\\n    <div class=\\\"view-toggles\\\">\\n      <button class=\\\"view-toggle-btn active\\\" id=\\\"btn-grid-view\\\" onclick=\\\"setCatalogViewLayout('grid')\\\" title=\\\"Grid Layout\\\">\\n        <i data-lucide=\\\"grid\\\" style=\\\"width:1.2rem; height:1.1rem;\\\"><\\/i>\\n      <\\/button>\\n      <button class=\\\"view-toggle-btn\\\" id=\\\"btn-list-view\\\" onclick=\\\"setCatalogViewLayout('list')\\\" title=\\\"List Layout\\\">\\n        <i data-lucide=\\\"list\\\" style=\\\"width:1.2rem; height:1.1rem;\\\"><\\/i>\\n      <\\/button>\\n    <\\/div>\\n  <\\/div>\\n\\n  <!-- Search and Filtering bar -->\\n  <div class=\\\"filter-bar panel\\\">\\n    <div class=\\\"search-box\\\">\\n      <i data-lucide=\\\"search\\\" class=\\\"search-icon\\\"><\\/i>\\n      <input type=\\\"text\\\" id=\\\"catalog-search\\\" class=\\\"input-control\\\" placeholder=\\\"Search APIs by name, tags, description...\\\" oninput=\\\"filterCatalogProducts()\\\" autocomplete=\\\"off\\\">\\n    <\\/div>\\n    \\n    <div class=\\\"sorting-box\\\">\\n      <label for=\\\"catalog-sort\\\" style=\\\"font-size:0.875rem; color:var(--text-secondary);\\\">Sort by:<\\/label>\\n      <select id=\\\"catalog-sort\\\" class=\\\"input-control select-control\\\" onchange=\\\"filterCatalogProducts()\\\">\\n        <option value=\\\"name-asc\\\">Name (A-Z)<\\/option>\\n        <option value=\\\"name-desc\\\">Name (Z-A)<\\/option>\\n        <option value=\\\"style\\\">Protocol / Style<\\/option>\\n      <\\/select>\\n    <\\/div>\\n  <\\/div>\\n\\n  <!-- Category Selection Chips -->\\n  <div class=\\\"category-chips\\\" id=\\\"category-chips-container\\\">\\n    <button class=\\\"chip active\\\" data-category=\\\"all\\\" onclick=\\\"selectCatalogCategory('all')\\\">All Products<\\/button>\\n    <!-- Dynamic chips injected here -->\\n  <\\/div>\\n\\n  <!-- Catalog Results -->\\n  <div id=\\\"catalog-results\\\" class=\\\"catalog-grid\\\">\\n    <!-- Dynamic products list injected here -->\\n  <\\/div>\\n<\\/div>\\n\\n<style>\\n.catalog-header {\\n  display: flex;\\n  justify-content: space-between;\\n  align-items: flex-end;\\n  gap: 2rem;\\n  margin-bottom: 2rem;\\n}\\n@media (max-width: 768px) {\\n  .catalog-header {\\n    flex-direction: column;\\n    align-items: flex-start;\\n  }\\n}\\n\\n.view-toggles {\\n  display: flex;\\n  background: var(--panel-bg);\\n  border: 1px solid var(--border-color);\\n  border-radius: 0.5rem;\\n  padding: 0.25rem;\\n}\\n.view-toggle-btn {\\n  background: none;\\n  border: none;\\n  cursor: pointer;\\n  width: 2.25rem;\\n  height: 2.25rem;\\n  border-radius: 0.375rem;\\n  color: var(--text-secondary);\\n  display: flex;\\n  align-items: center;\\n  justify-content: center;\\n  transition: all var(--transition-fast);\\n}\\n.view-toggle-btn.active {\\n  background: var(--primary);\\n  color: #fff;\\n}\\n\\n/* Filter Bar styles */\\n.filter-bar {\\n  display: flex;\\n  gap: 1.5rem;\\n  padding: 1rem 1.25rem;\\n  margin-bottom: 1.5rem;\\n  align-items: center;\\n}\\n@media (max-width: 768px) {\\n  .filter-bar {\\n    flex-direction: column;\\n    align-items: stretch;\\n  }\\n}\\n.search-box {\\n  position: relative;\\n  flex-grow: 1;\\n}\\n.search-icon {\\n  position: absolute;\\n  left: 1rem;\\n  top: 50%;\\n  transform: translateY(-50%);\\n  color: var(--text-muted);\\n  width: 1.15rem;\\n  height: 1.15rem;\\n}\\n#catalog-search {\\n  padding-left: 2.75rem;\\n}\\n.sorting-box {\\n  display: flex;\\n  align-items: center;\\n  gap: 0.75rem;\\n  flex-shrink: 0;\\n}\\n.select-control {\\n  padding: 0.5rem 2rem 0.5rem 1rem;\\n  width: auto;\\n  background-color: var(--input-bg);\\n  cursor: pointer;\\n}\\n\\n/* Category Chips */\\n.category-chips {\\n  display: flex;\\n  flex-wrap: wrap;\\n  gap: 0.75rem;\\n  margin-bottom: 2rem;\\n}\\n.chip {\\n  background: var(--panel-bg);\\n  border: 1px solid var(--border-color);\\n  color: var(--text-secondary);\\n  padding: 0.5rem 1.25rem;\\n  border-radius: 9999px;\\n  cursor: pointer;\\n  font-weight: 500;\\n  transition: all var(--transition-fast);\\n}\\n.chip:hover, .chip.active {\\n  background: var(--primary-light);\\n  border-color: var(--primary);\\n  color: var(--text-primary);\\n}\\n\\n/* Catalog Grid/List Layouts */\\n.catalog-grid {\\n  display: grid;\\n  grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));\\n  gap: 1.5rem;\\n  transition: all var(--transition-normal);\\n}\\n.catalog-grid.list-view {\\n  grid-template-columns: 1fr;\\n}\\n\\n/* Cards styling */\\n.product-card {\\n  padding: 1.75rem;\\n  cursor: pointer;\\n  display: flex;\\n  flex-direction: column;\\n  gap: 1.25rem;\\n  position: relative;\\n  overflow: hidden;\\n  height: 100%;\\n}\\n.product-card:hover {\\n  transform: translateY(-3px);\\n  border-color: var(--primary);\\n  box-shadow: var(--shadow-xl);\\n}\\n.catalog-grid.list-view .product-card {\\n  flex-direction: row;\\n  align-items: center;\\n  gap: 2rem;\\n  padding: 1.25rem 2rem;\\n}\\n@media (max-width: 768px) {\\n  .catalog-grid.list-view .product-card {\\n    flex-direction: column;\\n    align-items: stretch;\\n    gap: 1.25rem;\\n  }\\n}\\n\\n.prod-header {\\n  display: flex;\\n  justify-content: space-between;\\n  align-items: flex-start;\\n  gap: 1rem;\\n}\\n.prod-icon {\\n  width: 2.75rem;\\n  height: 2.75rem;\\n  background: var(--primary-light);\\n  color: var(--primary);\\n  border-radius: 0.5rem;\\n  display: flex;\\n  align-items: center;\\n  justify-content: center;\\n  flex-shrink: 0;\\n}\\n.style-badge {\\n  font-size: 0.7rem;\\n  font-weight: 800;\\n  letter-spacing: 0.05em;\\n  padding: 0.25rem 0.5rem;\\n  border-radius: 0.25rem;\\n  text-transform: uppercase;\\n}\\n.style-badge.rest {\\n  background: rgba(6, 182, 212, 0.15);\\n  color: #06b6d4;\\n  border: 1px solid rgba(6, 182, 212, 0.3);\\n}\\n.style-badge.mcp {\\n  background: rgba(99, 102, 241, 0.15);\\n  color: #818cf8;\\n  border: 1px solid rgba(99, 102, 241, 0.3);\\n}\\n.style-badge.a2a {\\n  background: rgba(16, 185, 129, 0.15);\\n  color: #34d399;\\n  border: 1px solid rgba(16, 185, 129, 0.3);\\n}\\n\\n.prod-body {\\n  display: flex;\\n  flex-direction: column;\\n  gap: 0.5rem;\\n  flex-grow: 1;\\n}\\n.prod-title {\\n  font-size: 1.25rem;\\n  font-weight: 700;\\n}\\n.prod-desc {\\n  color: var(--text-secondary);\\n  font-size: 0.9rem;\\n  display: -webkit-box;\\n  -webkit-line-clamp: 2;\\n  -webkit-box-orient: vertical;\\n  overflow: hidden;\\n}\\n.catalog-grid.list-view .prod-desc {\\n  -webkit-line-clamp: 1;\\n}\\n\\n.prod-footer {\\n  display: flex;\\n  justify-content: space-between;\\n  align-items: center;\\n  border-top: 1px solid var(--border-color);\\n  padding-top: 1rem;\\n  margin-top: auto;\\n  font-size: 0.8rem;\\n}\\n.catalog-grid.list-view .prod-footer {\\n  border-top: none;\\n  padding-top: 0;\\n  margin-top: 0;\\n  flex-shrink: 0;\\n  width: 250px;\\n  flex-direction: column;\\n  align-items: flex-end;\\n  gap: 0.5rem;\\n}\\n@media (max-width: 768px) {\\n  .catalog-grid.list-view .prod-footer {\\n    width: auto;\\n    align-items: flex-start;\\n    border-top: 1px solid var(--border-color);\\n    padding-top: 1rem;\\n  }\\n}\\n\\n.tag-list {\\n  display: flex;\\n  gap: 0.5rem;\\n  flex-wrap: wrap;\\n}\\n.tag-badge {\\n  background: var(--border-color);\\n  color: var(--text-secondary);\\n  font-size: 0.725rem;\\n  padding: 0.125rem 0.375rem;\\n  border-radius: 0.25rem;\\n}\\n<\\/style>\\n\\n<script>\\n// Catalog Logic scoped state\\nvar catalogLayout = 'grid';\\nvar catalogSelectedCategory = 'all';\\n\\n// Initialize catalog products loader\\nwindow.viewInitializers['catalog'] = async function() {\\n  console.log(\\\"Catalog initialization running...\\\");\\n  \\n  // Clean filter categories loaded from home redirects\\n  const redirectedFilter = localStorage.getItem('catalog_filter_cat');\\n  if (redirectedFilter) {\\n    catalogSelectedCategory = redirectedFilter;\\n    localStorage.removeItem('catalog_filter_cat');\\n  } else {\\n    catalogSelectedCategory = 'all';\\n  }\\n  \\n  await loadCatalogProducts();\\n};\\n\\nasync function loadCatalogProducts() {\\n  const container = document.getElementById('catalog-results');\\n  await app.loadProductsWithCache({\\n    onLoading: () => {\\n      app.showGlobalLoader(\\\"Loading API catalog...\\\");\\n      if (container) {\\n        container.innerHTML = Array.from({ length: 6 }, () => `\\n          <div class=\\\"panel skeleton-card\\\">\\n            <div class=\\\"skeleton-line short\\\"><\\/div>\\n            <div class=\\\"skeleton-line title\\\"><\\/div>\\n            <div class=\\\"skeleton-line full\\\"><\\/div>\\n            <div class=\\\"skeleton-line full\\\"><\\/div>\\n          <\\/div>\\n        `).join('');\\n      }\\n    },\\n    onData: () => {\\n      app.hideGlobalLoader();\\n      buildCategoryChips();\\n      filterCatalogProducts();\\n    },\\n    onError: () => {\\n      app.hideGlobalLoader();\\n      app.showToast(\\\"Failed to load catalog products\\\", \\\"error\\\");\\n      if (container) {\\n        container.innerHTML = `<div class=\\\"panel\\\" style=\\\"grid-column:1/-1; text-align:center; padding:3rem;\\\">Failed to load catalog products.<\\/div>`;\\n      }\\n    }\\n  });\\n}\\n\\nfunction buildCategoryChips() {\\n  const container = document.getElementById('category-chips-container');\\n  if (!container) return;\\n  \\n  // Find all unique categories\\n  const categories = new Set();\\n  app.products.forEach(p => {\\n    if (p.categories && Array.isArray(p.categories)) {\\n      p.categories.forEach(c => categories.add(c));\\n    }\\n  });\\n  \\n  let html = `<button class=\\\"chip ${catalogSelectedCategory === 'all' ? 'active' : ''}\\\" data-category=\\\"all\\\" onclick=\\\"selectCatalogCategory('all')\\\">All Products<\\/button>`;\\n  categories.forEach(cat => {\\n    html += `<button class=\\\"chip ${catalogSelectedCategory === cat ? 'active' : ''}\\\" data-category=\\\"${cat}\\\" onclick=\\\"selectCatalogCategory('${cat}')\\\">${cat}<\\/button>`;\\n  });\\n  \\n  container.innerHTML = html;\\n}\\n\\nfunction selectCatalogCategory(cat) {\\n  catalogSelectedCategory = cat;\\n  document.querySelectorAll('#category-chips-container .chip').forEach(btn => {\\n    if (btn.getAttribute('data-category') === cat) {\\n      btn.classList.add('active');\\n    } else {\\n      btn.classList.remove('active');\\n    }\\n  });\\n  filterCatalogProducts();\\n}\\n\\nfunction setCatalogViewLayout(layout) {\\n  catalogLayout = layout;\\n  const grid = document.getElementById('catalog-results');\\n  const btnGrid = document.getElementById('btn-grid-view');\\n  const btnList = document.getElementById('btn-list-view');\\n  \\n  if (layout === 'list') {\\n    grid.classList.add('list-view');\\n    btnList.classList.add('active');\\n    btnGrid.classList.remove('active');\\n  } else {\\n    grid.classList.remove('list-view');\\n    btnGrid.classList.add('active');\\n    btnList.classList.remove('active');\\n  }\\n}\\n\\nfunction filterCatalogProducts() {\\n  const searchInput = document.getElementById('catalog-search');\\n  const query = searchInput ? searchInput.value.toLowerCase().trim() : '';\\n  const sort = document.getElementById('catalog-sort').value;\\n  \\n  let filtered = [...app.products];\\n  \\n  // 1. Filter by category selection\\n  if (catalogSelectedCategory !== 'all') {\\n    filtered = filtered.filter(p => p.categories && p.categories.includes(catalogSelectedCategory));\\n  }\\n  \\n  // 2. Filter by search query\\n  if (query) {\\n    filtered = filtered.filter(p => {\\n      const matchName = p.displayName && p.displayName.toLowerCase().includes(query);\\n      const matchDesc = p.displayDescription && p.displayDescription.toLowerCase().includes(query);\\n      const matchStyle = p.displayStyle && p.displayStyle.toLowerCase().includes(query);\\n      const matchTags = p.tags && p.tags.some(t => t.toLowerCase().includes(query));\\n      return matchName || matchDesc || matchStyle || matchTags;\\n    });\\n  }\\n  \\n  // 3. Sorting logic\\n  if (sort === 'name-asc') {\\n    filtered.sort((a, b) => (a.displayName || '').localeCompare(b.displayName || ''));\\n  } else if (sort === 'name-desc') {\\n    filtered.sort((a, b) => (b.displayName || '').localeCompare(a.displayName || ''));\\n  } else if (sort === 'style') {\\n    filtered.sort((a, b) => (a.displayStyle || '').localeCompare(b.displayStyle || ''));\\n  }\\n  \\n  renderCatalogProducts(filtered);\\n}\\n\\nfunction renderCatalogProducts(products) {\\n  const container = document.getElementById('catalog-results');\\n  if (!container) return;\\n  \\n  if (products.length === 0) {\\n    container.innerHTML = `\\n      <div class=\\\"panel\\\" style=\\\"grid-column: 1 / -1; text-align:center; padding: 4rem 2rem;\\\">\\n        <i data-lucide=\\\"help-circle\\\" style=\\\"width:2.5rem; height:2.5rem; color:var(--text-muted); margin-bottom:1rem;\\\"><\\/i>\\n        <h3>No Products Found<\\/h3>\\n        <p style=\\\"color:var(--text-secondary); margin-top:0.5rem;\\\">We couldn't find any API matching your criteria. Try resetting filters.<\\/p>\\n      <\\/div>\\n    `;\\n    lucide.createIcons();\\n    return;\\n  }\\n  \\n  let html = '';\\n  products.forEach(p => {\\n    // Pick standard icons based on style\\n    let icon = 'api';\\n    if (p.displayStyle === 'REST') icon = 'globe';\\n    if (p.displayStyle === 'MCP') icon = 'wrench';\\n    if (p.displayStyle === 'A2A') icon = 'bot';\\n    \\n    const styleClass = (p.displayStyle || '').toLowerCase();\\n    \\n    const tagsHtml = p.tags ? p.tags.map(t => `<span class=\\\"tag-badge\\\">${t}<\\/span>`).join('') : '';\\n    \\n    html += `\\n      <div class=\\\"product-card panel\\\" onclick=\\\"app.navigate('product/${p.productId || p.id}')\\\">\\n        <div class=\\\"prod-header\\\">\\n          <div class=\\\"prod-icon\\\">\\n            <i data-lucide=\\\"${icon}\\\" style=\\\"width:1.5rem; height:1.5rem;\\\"><\\/i>\\n          <\\/div>\\n          <span class=\\\"style-badge ${styleClass}\\\">${p.displayStyle || 'API'}<\\/span>\\n        <\\/div>\\n        \\n        <div class=\\\"prod-body\\\">\\n          <h3 class=\\\"prod-title\\\">${p.displayName || p.name}<\\/h3>\\n          <p class=\\\"prod-desc\\\">${p.displayDescription || 'Access is available for this product on the enterprise platform.'}<\\/p>\\n        <\\/div>\\n        \\n        <div class=\\\"prod-footer\\\">\\n          <div class=\\\"tag-list\\\">\\n            ${tagsHtml}\\n          <\\/div>\\n          <div style=\\\"display:flex; align-items:center; gap:0.5rem;\\\">\\n            ${app.user ? `<button type=\\\"button\\\" class=\\\"btn btn-secondary btn-sm\\\" style=\\\"padding:0.25rem 0.6rem; font-size:0.75rem;\\\" onclick=\\\"event.stopPropagation(); app.navigate('admin/edit/${encodeURIComponent(p.productId || p.id)}')\\\" title=\\\"Edit API Hub metadata\\\"><i data-lucide=\\\"pencil\\\" style=\\\"width:0.8rem; height:0.8rem;\\\"><\\/i> Edit<\\/button>` : ''}\\n            <div style=\\\"color:var(--text-muted); display:flex; align-items:center; gap:0.25rem;\\\">\\n              <span>Details<\\/span>\\n              <i data-lucide=\\\"chevron-right\\\" style=\\\"width:1rem; height:1rem;\\\"><\\/i>\\n            <\\/div>\\n          <\\/div>\\n        <\\/div>\\n      <\\/div>\\n    `;\\n  });\\n  \\n  container.innerHTML = html;\\n  lucide.createIcons();\\n}\\n<\\/script>\\n\",\"apps\":\"<div class=\\\"apps-container\\\">\\n  <div class=\\\"apps-header\\\">\\n    <div>\\n      <h1 style=\\\"font-size:2rem; margin-bottom:0.5rem;\\\">Subscriptions<\\/h1>\\n      <p style=\\\"color:var(--text-secondary);\\\">Manage your subscriptions, API credentials, and client keys for integrations.<\\/p>\\n    <\\/div>\\n    \\n    <button class=\\\"btn btn-primary\\\" onclick=\\\"openCreateAppModal()\\\">\\n      <i data-lucide=\\\"plus\\\" style=\\\"width:1.1rem; height:1.1rem;\\\"><\\/i>\\n      Create Subscription\\n    <\\/button>\\n  <\\/div>\\n\\n  <div class=\\\"apps-layout\\\">\\n    <!-- Left Column: Active Subscriptions -->\\n    <div class=\\\"apps-list-column\\\" id=\\\"apps-list-column\\\">\\n      <div style=\\\"text-align:center; padding: 4rem 2rem;\\\" class=\\\"panel\\\">\\n        <div style=\\\"border: 3px solid var(--border-color); border-top-color: var(--primary); border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin:0 auto 1rem auto;\\\"><\\/div>\\n        <p style=\\\"color:var(--text-secondary);\\\">Loading subscriptions...<\\/p>\\n      <\\/div>\\n    <\\/div>\\n\\n    <!-- Right Column: Context Instructions -->\\n    <div class=\\\"apps-sidebar-instructions\\\">\\n      <div class=\\\"panel\\\" style=\\\"padding:1.5rem; display:flex; flex-direction:column; gap:1rem;\\\">\\n        <h3 style=\\\"font-size:1.1rem; display:flex; align-items:center; gap:0.5rem; border-bottom: 1px solid var(--border-color); padding-bottom:0.5rem;\\\">\\n          <i data-lucide=\\\"help-circle\\\" style=\\\"width:1.2rem; height:1.2rem; color:var(--info);\\\"><\\/i>\\n          Quick Guides\\n        <\\/h3>\\n        \\n        <div class=\\\"guide-tip\\\">\\n          <strong>Security Notice<\\/strong>\\n          <p style=\\\"font-size:0.825rem; color:var(--text-secondary); margin-top:0.25rem;\\\">Always treat Client Secrets like password credentials. Never check them into public git repositories or expose them on client-side JS.<\\/p>\\n        <\\/div>\\n        \\n        <div class=\\\"guide-tip\\\">\\n          <strong>Key Rotation<\\/strong>\\n          <p style=\\\"font-size:0.825rem; color:var(--text-secondary); margin-top:0.25rem;\\\">To rotate credential keys, delete the current subscription and create a new one. Old credentials will instantly revoke.<\\/p>\\n        <\\/div>\\n      <\\/div>\\n    <\\/div>\\n  <\\/div>\\n<\\/div>\\n\\n<!-- Create Subscription Dialog (Modal) -->\\n<dialog id=\\\"create-app-dialog\\\" class=\\\"auth-dialog\\\" style=\\\"max-width:550px;\\\">\\n  <div class=\\\"auth-header\\\">\\n    <h3>Create New Subscription<\\/h3>\\n    <button class=\\\"close-btn\\\" onclick=\\\"closeCreateAppModal()\\\">\\n      <i data-lucide=\\\"x\\\" style=\\\"width:1.5rem; height:1.5rem;\\\"><\\/i>\\n    <\\/button>\\n  <\\/div>\\n  \\n  <form id=\\\"create-app-form\\\" onsubmit=\\\"handleCreateAppSubmit(event)\\\">\\n    <div class=\\\"auth-form-group\\\">\\n      <label for=\\\"new-app-name\\\">Subscription Name<\\/label>\\n      <input type=\\\"text\\\" id=\\\"new-app-name\\\" class=\\\"input-control\\\" placeholder=\\\"Inference Dashboard Client\\\" required autocomplete=\\\"off\\\">\\n    <\\/div>\\n    \\n    <div class=\\\"auth-form-group\\\">\\n      <label for=\\\"new-app-desc\\\">Description (Optional)<\\/label>\\n      <input type=\\\"text\\\" id=\\\"new-app-desc\\\" class=\\\"input-control\\\" placeholder=\\\"Integrates our LLM chatbot with Weather & BigQuery groundings.\\\" autocomplete=\\\"off\\\">\\n    <\\/div>\\n    \\n    <div class=\\\"auth-form-group\\\">\\n      <label style=\\\"margin-bottom:0.75rem; display:block;\\\">Select API Products to Subscribe<\\/label>\\n      <div class=\\\"products-checklist-box\\\" id=\\\"new-app-products-checklist\\\">\\n        <!-- Products checkbox checklist dynamically generated -->\\n      <\\/div>\\n    <\\/div>\\n    \\n    <div style=\\\"margin-top:2rem; display:flex; justify-content:flex-end; gap:1rem;\\\">\\n      <button type=\\\"button\\\" class=\\\"btn btn-secondary btn-sm\\\" onclick=\\\"closeCreateAppModal()\\\">Cancel<\\/button>\\n      <button type=\\\"submit\\\" class=\\\"btn btn-primary btn-sm\\\">Create Subscription<\\/button>\\n    <\\/div>\\n  <\\/form>\\n<\\/dialog>\\n\\n<style>\\n.apps-header {\\n  display: flex;\\n  justify-content: space-between;\\n  align-items: center;\\n  gap: 2rem;\\n  margin-bottom: 2.5rem;\\n}\\n@media (max-width: 768px) {\\n  .apps-header {\\n    flex-direction: column;\\n    align-items: flex-start;\\n    gap: 1rem;\\n  }\\n}\\n\\n.apps-layout {\\n  display: grid;\\n  grid-template-columns: 2.2fr 1fr;\\n  gap: 2rem;\\n  align-items: flex-start;\\n}\\n@media (max-width: 968px) {\\n  .apps-layout {\\n    grid-template-columns: 1fr;\\n  }\\n}\\n\\n.apps-list-column {\\n  display: flex;\\n  flex-direction: column;\\n  gap: 1.5rem;\\n}\\n\\n/* Individual App Card */\\n.app-card {\\n  padding: 1.75rem;\\n  display: flex;\\n  flex-direction: column;\\n  gap: 1.5rem;\\n}\\n.app-card-title-bar {\\n  display: flex;\\n  justify-content: space-between;\\n  align-items: center;\\n  border-bottom: 1px solid var(--border-color);\\n  padding-bottom: 1rem;\\n}\\n.app-card-title {\\n  font-size: 1.35rem;\\n  font-weight: 700;\\n}\\n\\n/* Keys/Credentials */\\n.keys-grid {\\n  display: grid;\\n  grid-template-columns: 1fr 1fr;\\n  gap: 1.5rem;\\n}\\n@media (max-width: 768px) {\\n  .keys-grid {\\n    grid-template-columns: 1fr;\\n  }\\n}\\n.key-container {\\n  display: flex;\\n  flex-direction: column;\\n  gap: 0.5rem;\\n}\\n.key-title {\\n  font-size: 0.8rem;\\n  font-weight: 700;\\n  text-transform: uppercase;\\n  letter-spacing: 0.05em;\\n  color: var(--text-muted);\\n}\\n.key-box {\\n  display: flex;\\n  background: var(--input-bg);\\n  border: 1px solid var(--border-color);\\n  border-radius: 0.5rem;\\n  padding: 0.5rem 0.75rem;\\n  align-items: center;\\n  justify-content: space-between;\\n  gap: 0.5rem;\\n}\\n.key-value {\\n  font-family: monospace;\\n  font-size: 0.825rem;\\n  overflow: hidden;\\n  text-overflow: ellipsis;\\n  white-space: nowrap;\\n  user-select: all;\\n  flex-grow: 1;\\n}\\n.key-action-btn {\\n  background: none;\\n  border: none;\\n  color: var(--text-secondary);\\n  cursor: pointer;\\n  padding: 0.25rem;\\n  border-radius: 0.25rem;\\n  display: flex;\\n  align-items: center;\\n  justify-content: center;\\n  transition: all var(--transition-fast);\\n}\\n.key-action-btn:hover {\\n  color: var(--text-primary);\\n  background: var(--border-color);\\n}\\n\\n/* Product list inside application card */\\n.app-products-box {\\n  background: rgba(255, 255, 255, 0.02);\\n  border: 1px solid var(--border-color);\\n  border-radius: 0.75rem;\\n  padding: 1.25rem;\\n}\\n.subscribed-tags {\\n  display: flex;\\n  flex-wrap: wrap;\\n  gap: 0.5rem;\\n  margin-top: 1rem;\\n}\\n.subscribed-tag {\\n  background: var(--primary-light);\\n  color: var(--text-primary);\\n  border: 1px solid rgba(99, 102, 241, 0.2);\\n  font-size: 0.8rem;\\n  font-weight: 600;\\n  padding: 0.375rem 0.75rem;\\n  border-radius: 0.5rem;\\n  display: inline-flex;\\n  align-items: center;\\n  gap: 0.375rem;\\n}\\n.subscribed-tag-remove {\\n  cursor: pointer;\\n  color: var(--text-secondary);\\n  display: flex;\\n  align-items: center;\\n  border-radius: 50%;\\n  padding: 1px;\\n}\\n.subscribed-tag-remove:hover {\\n  color: var(--danger);\\n  background: var(--danger-light);\\n}\\n\\n.add-subscription-row {\\n  display: flex;\\n  gap: 0.75rem;\\n  margin-top: 1rem;\\n  align-items: center;\\n}\\n.add-sub-select {\\n  flex-grow: 1;\\n  font-size: 0.875rem;\\n  padding: 0.5rem;\\n  background: var(--input-bg);\\n}\\n\\n/* Guide Tips */\\n.guide-tip {\\n  border-left: 3px solid var(--info);\\n  padding-left: 0.75rem;\\n}\\n\\n/* Dialog selection checkbox box */\\n.products-checklist-box {\\n  background: var(--input-bg);\\n  border: 1px solid var(--border-color);\\n  border-radius: 0.5rem;\\n  max-height: 200px;\\n  overflow-y: auto;\\n  padding: 0.75rem;\\n  display: flex;\\n  flex-direction: column;\\n  gap: 0.5rem;\\n}\\n.checklist-item {\\n  display: flex;\\n  align-items: center;\\n  gap: 0.5rem;\\n  cursor: pointer;\\n  font-size: 0.9rem;\\n}\\n.checklist-item input {\\n  cursor: pointer;\\n}\\n<\\/style>\\n\\n<script>\\nwindow.viewInitializers['apps'] = async function() {\\n  console.log(\\\"Apps view initialization running...\\\");\\n  // Load products in background without blocking cached apps rendering\\n  app.loadProductsWithCache({\\n    onData: () => {\\n      if (Array.isArray(app.apps) && app.apps.length > 0) {\\n        renderUserApplications();\\n      }\\n    }\\n  });\\n  await loadUserApplications();\\n};\\n\\nasync function loadUserApplications() {\\n  const container = document.getElementById('apps-list-column');\\n  await app.loadAppsWithCache({\\n    onLoading: () => {\\n      app.showGlobalLoader(\\\"Loading your subscriptions...\\\");\\n      if (container) {\\n        container.innerHTML = `\\n          <div class=\\\"panel portal-loader-card\\\">\\n            <div class=\\\"portal-spinner\\\"><\\/div>\\n            <p style=\\\"color:var(--text-secondary); font-weight:500;\\\">Loading your subscriptions...<\\/p>\\n          <\\/div>\\n        `;\\n      }\\n    },\\n    onData: () => {\\n      app.hideGlobalLoader();\\n      renderUserApplications();\\n    },\\n    onError: () => {\\n      app.hideGlobalLoader();\\n      app.showToast(\\\"Failed to load subscriptions\\\", \\\"error\\\");\\n    }\\n  });\\n}\\n\\nfunction renderUserApplications() {\\n  const container = document.getElementById('apps-list-column');\\n  if (!container) return;\\n  \\n  if (app.apps.length === 0) {\\n    container.innerHTML = `\\n      <div class=\\\"panel\\\" style=\\\"text-align:center; padding: 4rem 2rem;\\\">\\n        <i data-lucide=\\\"layers-3\\\" style=\\\"width:3rem; height:3rem; color:var(--text-muted); margin-bottom:1.5rem;\\\"><\\/i>\\n        <h2>No Subscriptions Registered<\\/h2>\\n        <p style=\\\"color:var(--text-secondary); margin: 0.75rem 0 1.5rem 0; font-size:0.95rem;\\\">You do not have any registered API credentials. Create a subscription to access packages and generate authorization keys.<\\/p>\\n        <button class=\\\"btn btn-primary btn-sm\\\" onclick=\\\"openCreateAppModal()\\\">Create First Subscription<\\/button>\\n      <\\/div>\\n    `;\\n    lucide.createIcons();\\n    return;\\n  }\\n  \\n  let html = '';\\n  app.apps.forEach(appEntry => {\\n    // Get credentials details\\n    let clientId = '(N/A)';\\n    let clientSecret = '(N/A)';\\n    let productsList = [];\\n    \\n    if (appEntry.credentials && appEntry.credentials.length > 0) {\\n      clientId = appEntry.credentials[0].clientId || '(N/A)';\\n      clientSecret = appEntry.credentials[0].clientSecret || '(N/A)';\\n      productsList = appEntry.credentials[0].products || [];\\n    }\\n    \\n    // Generate list of available packages that aren't in this app yet\\n    let addProductsOptionsHtml = '<option value=\\\"\\\">-- Subscribe new Package --<\\/option>';\\n    let productsAvailableToAdd = false;\\n    \\n    if (app.products && app.products.length > 0) {\\n      app.products.forEach(p => {\\n        if (p.packages) {\\n          p.packages.forEach(pkg => {\\n            const pkgId = pkg.packageId;\\n            if (!productsList.includes(pkgId)) {\\n              addProductsOptionsHtml += `<option value=\\\"${pkgId}\\\">${p.displayName || p.name} (${pkgId})<\\/option>`;\\n              productsAvailableToAdd = true;\\n            }\\n          });\\n        }\\n      });\\n    }\\n    \\n    // Build tags HTML\\n    let tagsHtml = '';\\n    if (productsList.length > 0) {\\n      productsList.forEach(pId => {\\n        // Resolve display name by looking up packageId\\n        let displayName = pId;\\n        if (app.products) {\\n          for (const p of app.products) {\\n            if (p.packages) {\\n              const found = p.packages.find(pkg => pkg.packageId === pId);\\n              if (found) {\\n                displayName = `${p.displayName || p.name} (${found.packageId})`;\\n                break;\\n              }\\n            }\\n          }\\n        }\\n        \\n        tagsHtml += `\\n          <span class=\\\"subscribed-tag\\\">\\n            <i data-lucide=\\\"check\\\" style=\\\"width:0.875rem; height:0.875rem; color:var(--success);\\\"><\\/i>\\n            <span>${displayName}<\\/span>\\n            <span class=\\\"subscribed-tag-remove\\\" onclick=\\\"removeProductSubscription('${appEntry.id}', '${pId}')\\\" title=\\\"Unsubscribe package\\\">\\n              <i data-lucide=\\\"x\\\" style=\\\"width:0.875rem; height:0.875rem;\\\"><\\/i>\\n            <\\/span>\\n          <\\/span>\\n        `;\\n      });\\n    } else {\\n      tagsHtml = `<div style=\\\"font-size:0.875rem; color:var(--text-muted);\\\">No packages subscribed. Add packages below.<\\/div>`;\\n    }\\n    \\n    html += `\\n      <div class=\\\"panel app-card\\\">\\n        <div class=\\\"app-card-title-bar\\\">\\n          <div>\\n            <h3 class=\\\"app-card-title\\\">${appEntry.name}<\\/h3>\\n            <p style=\\\"color:var(--text-secondary); font-size:0.875rem; margin-top:0.25rem;\\\">${appEntry.description || 'No description provided.'}<\\/p>\\n          <\\/div>\\n          \\n          <button class=\\\"btn btn-secondary btn-danger btn-sm\\\" onclick=\\\"deleteApplication('${appEntry.id}', '${appEntry.name}')\\\">\\n            <i data-lucide=\\\"trash-2\\\" style=\\\"width:1rem; height:1rem;\\\"><\\/i>\\n            Delete Subscription\\n          <\\/button>\\n        <\\/div>\\n        \\n        <!-- Credentials box -->\\n        <div class=\\\"keys-grid\\\">\\n          <div class=\\\"key-container\\\">\\n            <span class=\\\"key-title\\\">Client ID<\\/span>\\n            <div class=\\\"key-box\\\">\\n              <span class=\\\"key-value\\\" id=\\\"clientid-${appEntry.id}\\\">${clientId}<\\/span>\\n              <button class=\\\"key-action-btn\\\" onclick=\\\"copyToClipboard('${clientId}', 'Client ID')\\\" title=\\\"Copy Client ID\\\">\\n                <i data-lucide=\\\"copy\\\" style=\\\"width:1rem; height:1rem;\\\"><\\/i>\\n              <\\/button>\\n            <\\/div>\\n          <\\/div>\\n          \\n          <div class=\\\"key-container\\\">\\n            <span class=\\\"key-title\\\">Client Secret<\\/span>\\n            <div class=\\\"key-box\\\">\\n              <span class=\\\"key-value\\\" id=\\\"secret-${appEntry.id}\\\" style=\\\"font-family:password; -webkit-text-security:disc;\\\">${clientSecret}<\\/span>\\n              <div style=\\\"display:flex; gap:0.25rem;\\\">\\n                <button class=\\\"key-action-btn\\\" onclick=\\\"toggleSecretVisibility('${appEntry.id}')\\\" id=\\\"toggle-btn-${appEntry.id}\\\" title=\\\"Toggle Secret Visibility\\\">\\n                  <i data-lucide=\\\"eye\\\" style=\\\"width:1rem; height:1rem;\\\"><\\/i>\\n                <\\/button>\\n                <button class=\\\"key-action-btn\\\" onclick=\\\"copyToClipboard('${clientSecret}', 'Client Secret')\\\" title=\\\"Copy Client Secret\\\">\\n                  <i data-lucide=\\\"copy\\\" style=\\\"width:1rem; height:1rem;\\\"><\\/i>\\n                <\\/button>\\n              <\\/div>\\n            <\\/div>\\n          <\\/div>\\n        <\\/div>\\n        \\n        <!-- Packages subscriptions box -->\\n        <div class=\\\"app-products-box\\\">\\n          <h4 style=\\\"font-size:0.9rem; text-transform:uppercase; letter-spacing:0.05em; color:var(--text-muted); display:flex; align-items:center; gap:0.5rem;\\\">\\n            <i data-lucide=\\\"layers\\\" style=\\\"width:1rem; height:1rem; color:var(--primary);\\\"><\\/i>\\n            Subscribed Packages\\n          <\\/h4>\\n          \\n          <div class=\\\"subscribed-tags\\\">\\n            ${tagsHtml}\\n          <\\/div>\\n          \\n          <!-- Add Subscription control -->\\n          <div class=\\\"add-subscription-row\\\">\\n            <select class=\\\"input-control select-control add-sub-select\\\" id=\\\"add-sub-select-${appEntry.id}\\\" ${productsAvailableToAdd ? '' : 'disabled'}>\\n              ${addProductsOptionsHtml}\\n            <\\/select>\\n            <button class=\\\"btn btn-primary btn-sm\\\" onclick=\\\"addNewProductSubscription('${appEntry.id}')\\\" ${productsAvailableToAdd ? '' : 'disabled'}>\\n              Subscribe\\n            <\\/button>\\n          <\\/div>\\n        <\\/div>\\n      <\\/div>\\n    `;\\n  });\\n  \\n  container.innerHTML = html;\\n  lucide.createIcons();\\n}\\n\\nfunction copyToClipboard(text, name) {\\n  navigator.clipboard.writeText(text);\\n  app.showToast(`${name} copied to clipboard!`, 'success');\