pps\" style=\"display: none\"\n            >Subscriptions</a\n          >\n          <a\n            href=\"#analytics\"\n            class=\"nav-link auth-required\"\n            id=\"nav-analytics\"\n            style=\"display: none\"\n            >Analytics</a\n          >\n          <a\n            href=\"#admin\"\n            class=\"nav-link auth-required\"\n            id=\"nav-admin\"\n            style=\"display: none\"\n            >Admin</a\n          >\n        </nav>\n\n        <div class=\"header-actions\">\n          <button\n            class=\"theme-toggle\"\n            id=\"theme-toggle\"\n            title=\"Toggle Theme\"\n            aria-label=\"Toggle light and dark mode\"\n          >\n            <i\n              data-lucide=\"sun\"\n              id=\"sun-icon\"\n              style=\"display: none; width: 1.25rem; height: 1.25rem\"\n            ></i>\n            <i data-lucide=\"moon\" id=\"moon-icon\" style=\"width: 1.25rem; height: 1.25rem\"></i>\n          </button>\n\n          <div id=\"auth-section\">\n            <button class=\"btn btn-primary btn-sm\" id=\"btn-show-login\">Sign In</button>\n          </div>\n        </div>\n      </div>\n    </header>\n\n    <!-- Main Content View -->\n    <main id=\"main-content\"></main>\n\n    <!-- Footer -->\n    <footer>\n      <div class=\"footer-container\">\n        <div>\n          &copy; 2026 <span id=\"footer-portal-title\">Apigee AI Portal</span>. All rights reserved.\n        </div>\n        <div style=\"display: flex; gap: 1.5rem; font-size: 0.875rem\">\n          <a href=\"#\">Privacy Policy</a>\n          <a href=\"#\">Terms of Service</a>\n          <a href=\"#\">Support</a>\n        </div>\n      </div>\n    </footer>\n\n    <!-- Authentication Dialog -->\n    <dialog id=\"auth-dialog\" class=\"auth-dialog\">\n      <div class=\"auth-header\">\n        <h3 id=\"auth-dialog-title\" style=\"font-size: 1.25rem\">Developer Sign In</h3>\n        <button class=\"close-btn\" id=\"btn-close-auth\" aria-label=\"Close modal\">\n          <i data-lucide=\"x\" style=\"width: 1.5rem; height: 1.5rem\"></i>\n        </button>\n      </div>\n\n      <!-- Tabs and form only shown in Demo Mode -->\n      <div id=\"demo-auth-tabs-container\">\n        <div class=\"auth-tabs\">\n          <div class=\"auth-tab active\" id=\"tab-login\" onclick=\"app.setAuthTab('login')\">Sign In</div>\n          <div class=\"auth-tab\" id=\"tab-register\" onclick=\"app.setAuthTab('register')\">Register</div>\n        </div>\n      </div>\n\n      <!-- Sign In & Register Form for Demo Mode -->\n      <form id=\"auth-form\" onsubmit=\"app.handleAuthSubmit(event)\">\n        <div class=\"auth-form-group\" id=\"register-names\" style=\"display: none; gap: 1rem\">\n          <div style=\"flex: 1\">\n            <label for=\"auth-first-name\">First Name</label>\n            <input type=\"text\" id=\"auth-first-name\" class=\"input-control\" placeholder=\"John\" />\n          </div>\n          <div style=\"flex: 1\">\n            <label for=\"auth-last-name\">Last Name</label>\n            <input type=\"text\" id=\"auth-last-name\" class=\"input-control\" placeholder=\"Doe\" />\n          </div>\n        </div>\n\n        <div class=\"auth-form-group\">\n          <label for=\"auth-email\">Email Address</label>\n          <input\n            type=\"email\"\n            id=\"auth-email\"\n            class=\"input-control\"\n            placeholder=\"developer@company.com\"\n            required\n            autocomplete=\"username\"\n          />\n        </div>\n\n        <div class=\"auth-form-group\">\n          <label for=\"auth-password\">Password</label>\n          <input\n            type=\"password\"\n            id=\"auth-password\"\n            class=\"input-control\"\n            placeholder=\"••••••••\"\n            required\n            autocomplete=\"current-password\"\n          />\n        </div>\n\n        <div style=\"margin-top: 1.5rem\">\n          <button type=\"submit\" class=\"btn btn-primary\" id=\"btn-auth-submit\" style=\"width: 100%\">\n            Sign In\n          </button>\n        </div>\n      </form>\n\n      <!-- OIDC Live Login Section -->\n      <div id=\"oidc-auth-section\" style=\"display: none; padding: 1.5rem 0; text-align: center;\">\n        <p style=\"color: var(--text-secondary); margin-bottom: 1.5rem; font-size: 0.95rem; line-height: 1.5;\">\n          Secure identity federation and single sign-on (SSO) powered by OpenID Connect (OIDC).\n        </p>\n        <button class=\"btn btn-primary\" id=\"btn-oidc-login\" onclick=\"app.loginOidc()\" style=\"width: 100%; display: flex; align-items: center; justify-content: center; gap: 0.5rem;\">\n          <i data-lucide=\"shield\" style=\"width: 1.25rem; height: 1.25rem\"></i>\n          Continue to Secure Sign In / Registration\n        </button>\n      </div>\n\n      <!-- Social / SAML logins (hidden in Live OIDC mode as OIDC manages them) -->\n      <div id=\"social-auth-section\">\n        <div class=\"auth-divider\">or continue with</div>\n\n        <div style=\"display: flex; flex-direction: column; gap: 0.75rem\">\n          <button class=\"social-auth-btn\" id=\"btn-google-auth\">\n            <svg style=\"width: 1.25rem; height: 1.25rem\" viewBox=\"0 0 24 24\">\n              <path\n                fill=\"#4285F4\"\n                d=\"M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z\"\n              />\n              <path\n                fill=\"#34A853\"\n                d=\"M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z\"\n              />\n              <path\n                fill=\"#FBBC05\"\n                d=\"M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22c-.22-.66-.35-1.36-.35-2.09z\"\n              />\n     