          continueOnError: "false"
          enabled: "true"
          timeLimit: "200"
          name: JS-SetAnalyticsResponse
        DisplayName: JS-SetAnalyticsResponse
        Properties: {}
        Source: "\n    var responsePayload = {};\n    var appResponse = context.getVariable(\"analyticsAppResponse.content\");\n    var modelResponse = context.getVariable(\"analyticsModelResponse.content\");\n    var productResponse = context.getVariable(\"analyticsProductResponse.content\");\n    responsePayload[\"app\"] = [JSON.parse(appResponse)];\n    responsePayload[\"model\"] = [JSON.parse(modelResponse)];\n    responsePayload[\"product\"] = [JSON.parse(productResponse)];\n\n    context.setVariable(\"response.content\", JSON.stringify(responsePayload));\n    context.setVariable(\"response.header.content-type\", \"application/json\");\n  "
  - name: JS-SetApp
    type: Javascript
    content:
      Javascript:
        metadata:
          continueOnError: "false"
          enabled: "true"
          timeLimit: "200"
          name: JS-SetApp
        DisplayName: JS-SetApp
        Properties: {}
        Source: "\nvar originalApp = response.content.asJSON;\nvar updateApp = request.content.asJSON;\n\nprint(response.content);\nprint(request.content);\n\nif (context.proxyRequest.method == \"PUT\") {\n  print(\"Now doing update...\");\n  var changes = checkAppCredentials(updateApp, originalApp);\n  print(JSON.stringify(changes));\n  if (changes[0]) {\n    context.setVariable(\"appOperation\", changes[0].operationName);\n    context.setVariable(\"appApiProduct\", changes[0].apiProduct);\n    context.setVariable(\"appClientId\", changes[0].clientId);\n    context.setVariable(\"appUpdatedCredential\", JSON.stringify({\"apiProducts\": changes[0].apiProducts}));\n  }\n} else {\n  context.setVariable(\"appPayload\", JSON.stringify(transformAppToApigee(request.content.asJSON)));\n}\n  "
        IncludeURL: jsc://transformations.js
  - name: JS-ResolveTargetUser
