# yaml-language-server: $schema=https://raw.githubusercontent.com/apigee/apigee-templater/main/schema/gateway.schema.1.0.json
name: REST-Portals
displayName: REST-Portals
type: proxy
gateway: apigee
schemaVersion: 1.0.0
categories: []
description: REST-Portals
documentation: ""
parameters:
  - name: DISPLAY_NAME
    displayName: DISPLAY_NAME
    description: Configuration input for DISPLAY_NAME
    default: Apigee AI Portal
    examples: []
    maps: {}
  - name: AUTH_API_KEY
    displayName: AUTH_API_KEY
    description: Configuration input for AUTH_API_KEY
    default: null
    examples: []
    maps: {}
  - name: AUTH_DOMAIN
    displayName: AUTH_DOMAIN
    description: Configuration input for AUTH_DOMAIN
    default: null
    examples: []
    maps: {}
  - name: APIHUB_LOCATION
    displayName: APIHUB_LOCATION
    description: Google Cloud region where API Hub is provisioned
    default: europe-west1
endpoints:
  - name: default
    basePath: /api/portals
    routes:
      - name: default
    flows:
      - name: PreFlow
        mode: Request
        steps:
          - name: CORS-SetCors
          - name: RC-ResponseCache
          - name: AM-SetVariables
          - name: KVM-LoadConfig
          - name: JS-SetSecurityKeyNames
          - name: KVM-GetPublicKey
      - name: GET Products
        mode: Response
        condition: "(proxy.pathsuffix MatchesPath \"/*/products\") and (request.verb = \"GET\")"
        steps:
          - name: SC-GetAPIs
          - name: SC-GetProducts
          - name: JS-TransformProducts
          - name: RC-ResponseCache
      - name: GET Product Detail
        mode: Request
        condition: "(proxy.pathsuffix MatchesPath \"/*/products/*\") and (request.verb = \"GET\")"
        steps:
          - name: SC-GetAPIs
          - name: SC-GetProducts
          - name: JS-FindProductAndSetVersion
      - name: GET Product Detail
        mode: Response
        condition: "(proxy.pathsuffix MatchesPath \"/*/products/*\") and (request.verb = \"GET\")"
        steps:
          - name: SC-GetDeployment
          - name: SC-GetVersion
          - name: JS-ParseSpecName
          - name: SC-GetSpecContents
            condition: "has_specs = \"true\""
          - name: JS-TransformProductDetail
      - name: POST Login
        mode: Request
        condition: "(proxy.pathsuffix MatchesPath \"/*/users/*/login\") and (request.verb = \"POST\")"
        steps:
          - name: JS-ExtractToken
          - name: JWT-AccessToken
      - name: POST Login
        mode: Response
        condition: "(proxy.pathsuffix MatchesPath \"/*/users/*/login\") and (request.verb = \"POST\")"
        steps:
          - name: SC-CreateUser
      - name: GET Apps
        mode: Request
        condition: "(proxy.pathsuffix MatchesPath \"/*/users/*/apps\") and (request.verb = \"GET\")"
        steps:
          - name: JS-ExtractToken
          - name: JWT-AccessToken
          - name: EV-ParseUrl
          - name: JS-ResolveTargetUser
      - name: GET Apps
        mode: Response
        condition: "(proxy.pathsuffix MatchesPath \"/*/users/*/apps\") and (request.verb = \"GET\")"
        steps:
          - name: SC-GetApps
          - name: JS-TransformApps
      - name: POST Apps
        mode: Request
        condition: "(proxy.pathsuffix MatchesPath \"/*/users/*/apps\") and (request.verb = \"POST\")"
        steps:
          - name: JS-ExtractToken
          - name: JWT-AccessToken
          - name: EV-ParseUrl
          - name: JS-ResolveTargetUser
      - name: POST Apps
        mode: Response
        condition: "(proxy.pathsuffix MatchesPath \"/*/users/*/apps\") and (request.verb = \"POST\")"
        steps:
          - name: JS-SetApp
          - name: SC-CreateApp
          - name: JS-TransformApps
      - name: PUT App
        mode: Request
        condition: "(proxy.pathsuffix MatchesPath \"/*/users/*/apps/*\") and (request.verb = \"PUT\")"
        steps:
          - name: JS-ExtractToken
          - name: JWT-AccessToken
          - name: EV-ParseUrl
          - name: JS-ResolveTargetUser
      - name: PUT App
        mode: Response
        condition: "(proxy.pathsuffix MatchesPath \"/*/users/*/apps/*\") and (request.verb = \"PUT\")"
        steps:
          - name: SC-GetApp
          - name: JS-SetApp
          - name: SC-AddAppProduct
            condition: "appOperation = \"ADDED\""
          - name: SC-RemoveAppProduct
            condition: "appOperation = \"REMOVED\""
          - name: JS-TransformApps
      - name: DELETE App
        mode: Request
        condition: "((proxy.pathsuffix MatchesPath \"/*/users/*/apps\") or (proxy.pathsuffix MatchesPath \"/*/users/*/apps/*\")) and (request.verb = \"DELETE\")"
        steps:
          - name: JS-ExtractToken
          - name: JWT-AccessToken
          - name: EV-ParseUrl
          - name: JS-ResolveTargetUser
          - name: JS-SetDeleteAppName
      - name: DELETE App
        mode: Response
        condition: "((proxy.pathsuffix MatchesPath \"/*/users/*/apps\") or (proxy.pathsuffix MatchesPath \"/*/users/*/apps/*\")) and (request.verb = \"DELETE\")"
        steps:
          - name: SC-DeleteApp
          - name: JS-SetDeleteAppResponse
      - name: GET Analytics
        mode: Request
        condition: "(proxy.pathsuffix MatchesPath \"/*/users/*/analytics\") and (request.verb = \"GET\")"
        steps:
          - name: JS-ExtractToken
          - name: JWT-AccessToken
          - name: EV-ParseUrl
          - name: JS-ResolveTargetUser
      - name: GET Analytics
        mode: Response
        condition: "(proxy.pathsuffix MatchesPath \"/*/users/*/analytics\") and (request.verb = \"GET\")"
        steps:
          - name: JS-SetTimeRange
          - name: SC-GetAnalyticsApp
          - name: SC-GetAnalyticsProduct
          - name: SC-GetAnalyticsModel
          - name: JS-SetAnalyticsResponse
      - name: GET Admin APIs
        mode: Request
        condition: "(proxy.pathsuffix MatchesPath \"/*/admin/apis\") and (request.verb = \"GET\")"
        steps:
          - name: JS-ExtractToken
          - name: JWT-AccessToken
      - name: GET Admin APIs
        mode: Response
        condition: "(proxy.pathsuffix MatchesPath \"/*/admin/apis\") and (request.verb = \"GET\")"
        steps:
          - name: SC-GetAPIs
          - name: SC-GetDeployment
          - name: SC-GetProducts
          - name: JS-TransformAdminApis
      - name: PATCH Admin API
        mode: Request
        condition: "(proxy.pathsuffix MatchesPath \"/*/admin/apis/*\") and (request.verb = \"PATCH\")"
        steps:
          - name: JS-ExtractToken
          - name: JWT-AccessToken
          - name: JS-PrepareAdminApiPatch
      - name: PATCH Admin API
        mode: Response
        condition: "(proxy.pathsuffix MatchesPath \"/*/admin/apis/*\") and (request.verb = \"PATCH\")"
        steps:
          - name: SC-PatchAPI
          - name: SC-PatchDeployment
            condition: "has_deployment_patch = \"true\""
          - name: JS-SetAdminPatchResponse
      - name: GET Admin Analytics
        mode: Request
        condition: "(proxy.pathsuffix MatchesPath \"/*/admin/analytics\") and (request.verb = \"GET\")"
        steps:
          - name: JS-ExtractToken
          - name: JWT-AccessToken
      - name: GET Admin Analytics
        mode: Response
        condition: "(proxy.pathsuffix MatchesPath \"/*/admin/analytics\") and (request.verb = \"GET\")"
        steps:
          - name: JS-SetGlobalAnalyticsParams
          - name: SC-GetGlobalAnalyticsUserModel
          - name: SC-GetGlobalAnalyticsModel
          - name: SC-GetGlobalAnalyticsUser
          - name: SC-GetGlobalAnalyticsProduct
          - name: SC-GetGlobalAnalyticsApp
          - name: JS-SetGlobalAnalyticsResponse
      - name: GET Admin Prices
        mode: Request
        condition: "(proxy.pathsuffix MatchesPath \"/*/admin/prices\") and (request.verb = \"GET\")"
        steps:
          - name: JS-ExtractToken
          - name: JWT-AccessToken
      - name: GET Admin Prices
        mode: Response
        condition: "(proxy.pathsuffix MatchesPath \"/*/admin/prices\") and (request.verb = \"GET\")"
        steps:
          - name: SC-GetPriceListKvm
          - name: JS-GetPriceListResponse
      - name: PUT Admin Prices
        mode: Request
        condition: "(proxy.pathsuffix MatchesPath \"/*/admin/prices\") and (request.verb = \"PUT\")"
        steps:
          - name: JS-ExtractToken
          - name: JWT-AccessToken
          - name: JS-PreparePriceListSave
      - name: PUT Admin Prices
        mode: Response
        condition: "(proxy.pathsuffix MatchesPath \"/*/admin/prices\") and (request.verb = \"PUT\")"
        steps:
          - name: SC-EnsureAiConfigKvm
          - name: SC-PutPriceListKvm
          - name: SC-PostPriceListKvm
            condition: "putPriceResponse.status.code >= 400"
          - name: JS-SetPriceListSaveResponse
      - name: GET Portals
        mode: Response
        condition: "(proxy.pathsuffix MatchesPath \"/*\") and (request.verb = \"GET\")"
        steps:
          - name: JS-GetPortal
      - name: POST MCP
        mode: Request
        condition: "(proxy.pathsuffix MatchesPath \"/mcp\") and (request.verb = \"POST\")"
        steps:
          - name: JS-ExtractToken
          - name: JWT-AccessToken
          - name: JS-MCP-ParseRequest
      - name: POST MCP
        mode: Response
        condition: "(proxy.pathsuffix MatchesPath \"/mcp\") and (request.verb = \"POST\")"
        steps:
          - name: SC-GetAPIs
            condition: "mcp_action = \"catalog\""
          - name: SC-GetProducts
            condition: "mcp_action = \"catalog\""
          - name: SC-GetApps
            condition: "mcp_action = \"get_apps\""
          - name: SC-CreateApp
            condition: "mcp_action = \"create_app\""
          - name: SC-GetApp
            condition: "(mcp_action = \"subscribe\") or (mcp_action = \"unsubscribe\")"
          - name: JS-MCP-PrepareSubscription
            condition: "(mcp_action = \"subscribe\") or (mcp_action = \"unsubscribe\")"
          - name: SC-AddAppProduct
            condition: "(mcp_action = \"subscribe\") and (mcp_sub_ready = \"true\")"
          - name: SC-RemoveAppProduct
            condition: "(mcp_action = \"unsubscribe\") and (mcp_sub_ready = \"true\")"
          - name: JS-MCP
      - name: GET WellKnown
        mode: Response
        condition: "(proxy.pathsuffix MatchesPath \"/.well-known/oauth-protected-resource\") and (request.verb = \"GET\")"
        steps:
          - name: JS-SetWellKnown
    faultRules: []
    defaultFaultRule:
      name: default-fault
      alwaysEnforce: true
      steps:
        - name: CORS-SetCors
        - name: AM-SetWellKnown
  - name: portal
    basePath: /portal
    routes:
      - name: default
    flows:
      - name: PreFlow
        mode: Request
        steps:
          - name: CORS-SetCors
      - name: GET Portal UI
        mode: Response
        condition: "(request.verb = \"GET\")"
        steps:
          - name: JS-ServePortal
targets: []
policies:
  - name: AM-SetVariables
    type: AssignMessage
    content:
      AssignMessage:
        metadata:
          continueOnError: "false"
          enabled: "true"
          name: AM-SetVariables
        DisplayName: AM-SetVariables
        Properties: {}
        AssignVariable:
          Name: jwt.issuer
          Template: "https://securetoken.google.com/{organization.name}"
        IgnoreUnresolvedVariables: "true"
        AssignTo:
          metadata:
            createNew: "false"
            transport: http
            type: request
  - name: AM-SetWellKnown
    type: AssignMessage
    content:
      AssignMessage:
        metadata:
          continueOnError: "false"
          enabled: "true"
          name: AM-SetWellKnown
        DisplayName: AM-SetWellKnown
        Properties: {}
        Set:
          Headers:
            Header:
              metadata:
                name: WWW-Authenticate
              _text: "Bearer resource_metadata=\"{client.scheme}://{request.header.host}/.well-known/oauth-protected-resource\""
        Comment: " Crucial step: Assign this to the error context "
        AssignTo:
          metadata:
            createNew: "false"
            transport: http
            type: response
          _text: error
  - name: CORS-SetCors
    type: CORS
    content:
      CORS:
        metadata:
          continueOnError: "false"
          enabled: "true"
          name: CORS-SetCors
        DisplayName: CORS-SetCors
        AllowOrigins: "{request.header.origin}"
        AllowMethods: "GET, PUT, PATCH, POST, DELETE"
        AllowHeaders: "*"
        ExposeHeaders: "*"
        MaxAge: "3628800"
        AllowCredentials: "false"
        GeneratePreflightResponse: "true"
        IgnoreUnresolvedVariables: "true"
  - name: EV-ParseUrl
    type: ExtractVariables
    content:
      ExtractVariables:
        metadata:
          continueOnError: "false"
          enabled: "true"
          name: EV-ParseUrl
        DisplayName: EV-ParseUrl
        Properties: {}
        URIPath:
          Pattern:
            - metadata:
                ignoreCase: "false"
              _text: "/{portalId}/users/{target_user_email}/apps/{appName}"
            - metadata:
                ignoreCase: "false"
              _text: "/{portalId}/users/{target_user_email}/apps"
            - metadata:
                ignoreCase: "false"
              _text: "/{portalId}/users/{target_user_email}/analytics"
            - metadata:
                ignoreCase: "false"
              _text: "/{portalId}/users/{target_user_email}/login"
        IgnoreUnresolvedVariables: "true"
        Source:
          metadata:
            clearPayload: "false"
          _text: request
        VariablePrefix: {}
  - name: JS-ExtractToken
    type: Javascript
    content:
      Javascript:
        metadata:
          continueOnError: "false"
          enabled: "true"
          timeLimit: "200"
          name: JS-ExtractToken
        DisplayName: JS-ExtractToken
        Properties: {}
        Source: "var authHeader = context.getVariable(\"request.header.Authorization\");\nif (authHeader) {\n  var token = authHeader.trim();\n  if (token.toLowerCase().indexOf(\"bearer \") === 0) {\n    token = token.slice(7).trim();\n  }\n  context.setVariable(\"extracted_access_token\", token);\n}\n"
  - name: JS-FindProductAndSetVersion
    type: Javascript
    content:
      Javascript:
        metadata:
          continueOnError: "false"
          enabled: "true"
          timeLimit: "200"
          name: JS-FindProductAndSetVersion
        DisplayName: JS-FindProductAndSetVersion
        Properties: {}
        Source: "var paths = context.getVariable(\"proxy.pathsuffix\").split(\"/\");\nvar productId = paths[paths.length - 1];\ncontext.setVariable(\"productId\", productId);\n\nvar apisRaw = context.getVariable(\"response.content\");\nvar productsRaw = context.getVariable(\"productResponse.content\");\n\nif (apisRaw && productsRaw) {\n  try {\n    var apisObject = JSON.parse(apisRaw);\n    var productsObject = JSON.parse(productsRaw);\n    var result = transformApisToProducts(apisObject, productsObject);\n    if (result && Array.isArray(result.products)) {\n      var foundProduct = null;\n      for (var i = 0; i < result.products.length; i++) {\n        var p = result.products[i];\n        if (p && (p.id === productId || p.productId === productId)) {\n          foundProduct = p;\n          break;\n        }\n      }\n\n      if (foundProduct) {\n        context.setVariable(\"apihub_version_name\", foundProduct.sourceId);\n        context.setVariable(\"product_display_style\", foundProduct.displayStyle);\n        context.setVariable(\"realProductJson\", JSON.stringify(foundProduct));\n      }\n    }\n  } catch (e) {\n    print(\"Error in JS-FindProductAndSetVersion: \" + e);\n  }\n}\n"
        IncludeURL: jsc://transformations.js
  - name: JS-GetPortal
    type: Javascript
    content:
      Javascript:
        metadata:
          continueOnError: "false"
          enabled: "true"
          timeLimit: "200"
          name: JS-GetPortal
        DisplayName: JS-GetPortal
        Properties: {}
        Source: "\n    var urlParts = context.getVariable(\"request.path\").split(\"/\");\n    var portalId = urlParts[urlParts.length - 1];\n    // var match = portalsConfig.filter(function(portal) {\n    //  return portal.id == urlParts[urlParts.length - 1];\n    //})[0];\n\n    // var displayName = context.getVariable(\"propertyset.portals.DISPLAY_NAME\");\n    var authApiKey = context.getVariable(\"portalAuthApiKey\");\n    var authDomain = context.getVariable(\"portalAuthDomain\");\n    var portalTitle = context.getVariable(\"portalTitle\");\n\n    if (!authDomain) authDomain = context.getVariable(\"organization.name\") + \".firebaseapp.com\";\n\n    var result = {\n      name: portalTitle,\n      authApiKey: authApiKey,\n      authDomain: authDomain\n    };\n    context.setVariable(\"response.content\", JSON.stringify(result));\n\n    //if (match) {\n    //  if (displayName) match.name = displayName;\n    //  if (authApiKey) match.authApiKey = authApiKey;\n    //  if (authDomain) match.authDomain = authDomain;\n    //  context.setVariable(\"response.content\", JSON.stringify(match));\n    //} else {\n    //  context.setVariable(\"response.status.code\", 404);\n    //}\n  "
  - name: JS-MCP-ParseRequest
    type: Javascript
    content:
      Javascript:
        metadata:
          continueOnError: "false"
          enabled: "true"
          timeLimit: "200"
          name: JS-MCP-ParseRequest
        DisplayName: JS-MCP-ParseRequest
        Properties: {}
        Source: |
          var claimEmail = context.getVariable("jwt.JWT-AccessToken.claim.email") || "";
          var scope = context.getVariable("jwt.JWT-AccessToken.claim.scope") || "";
          var scopes = scope.split(/\s+/);
          var req = {};
          try {
            req = JSON.parse(context.getVariable("request.content") || "{}");
          } catch (e) {}

          var method = req.method || "";
          var params = req.params || {};
          var toolName = params.name || "";
          var args = params.arguments || {};

          var targetEmail = claimEmail;
          if (scopes.indexOf("portal:admin") !== -1 && args.developerEmail) {
            targetEmail = args.developerEmail;
          }
          context.setVariable("target_user_email", targetEmail);

          var action = "none";
          if (method === "tools/call") {
            if (toolName === "getCatalog" || toolName === "searchCatalog") {
              action = "catalog";
            } else if (toolName === "getApps" || toolName === "getCredentials") {
              action = "get_apps";
            } else if (toolName === "createApp" && args.appName) {
              action = "create_app";
              var prods = [];
              if (Array.isArray(args.apiProducts)) prods = args.apiProducts;
              else if (args.apiProduct) prods = [args.apiProduct];
              var payload = { name: args.appName, apiProducts: prods };
              if (args.description) {
                payload.attributes = [{ name: "description", value: args.description }];
              }
              context.setVariable("appPayload", JSON.stringify(payload));
            } else if (toolName === "subscribe" && args.appName && args.apiProduct) {
              action = "subscribe";
              context.setVariable("appName", args.appName);
              context.setVariable("appApiProduct", args.apiProduct);
            } else if (toolName === "unsubscribe" && args.appName && args.apiProduct) {
              action = "unsubscribe";
              context.setVariable("appName", args.appName);
              context.setVariable("appApiProduct", args.apiProduct);
            }
          }
          context.setVariable("mcp_action", action);
  - name: JS-MCP-PrepareSubscription
    type: Javascript
    content:
      Javascript:
        metadata:
          continueOnError: "false"
          enabled: "true"
          timeLimit: "200"
          name: JS-MCP-PrepareSubscription
        DisplayName: JS-MCP-PrepareSubscription
        Properties: {}
        Source: |
          var action = context.getVariable("mcp_action");
          var apiProduct = context.getVariable("appApiProduct");
          var appRaw = context.getVariable("response.content") || "";
          context.setVariable("mcp_sub_ready", "false");
          try {
            var appObj = JSON.parse(appRaw);
            var creds = Array.isArray(appObj.credentials) ? appObj.credentials : [];
            if (creds.length > 0 && creds[0].consumerKey) {
              var cred = creds[0];
              context.setVariable("appClientId", cred.consumerKey);
              if (action === "subscribe") {
                var existing = (cred.apiProducts || []).map(function (p) { return p.apiproduct; }).filter(Boolean);
                if (existing.indexOf(apiProduct) === -1) {
                  existing.push(apiProduct);
                }
                context.setVariable("appUpdatedCredential", JSON.stringify({ apiProducts: existing }));
              }
              context.setVariable("mcp_sub_ready", "true");
            } else {
              context.setVariable("mcp_error", "No credentials found on application.");
            }
          } catch (e) {
            context.setVariable("mcp_error", "Failed to load application: " + e.message);
          }
  - name: JS-MCP
    type: Javascript
    content:
      Javascript:
        metadata:
          continueOnError: "false"
          enabled: "true"
          timeLimit: "200"
          name: JS-MCP
        DisplayName: JS-MCP
        Properties: {}
        Source: |
          var req = {};
          try {
            req = JSON.parse(context.getVariable("request.content") || "{}");
          } catch (e) {}

          var id = req.id;
          var method = req.method || "";

          if (method === "notifications/initialized" || (method.indexOf("notifications/") === 0 && id === undefined)) {
            context.setVariable("response.status.code", 202);
            context.setVariable("response.content", "");
          } else if (method === "ping") {
            context.setVariable("response.content", JSON.stringify({ jsonrpc: "2.0", id: id, result: {} }));
            context.setVariable("response.header.Content-Type", "application/json");
          } else if (method === "initialize") {
            context.setVariable("response.content", JSON.stringify({
              jsonrpc: "2.0",
              id: id,
              result: initialize(req)
            }));
            context.setVariable("response.header.Content-Type", "application/json");
          } else if (method === "tools/list") {
            context.setVariable("response.content", JSON.stringify({
              jsonrpc: "2.0",
              id: id,
              result: toolsList(req)
            }));
            context.setVariable("response.header.Content-Type", "application/json");
          } else if (method === "tools/call") {
            var action = context.getVariable("mcp_action") || "none";
            var liveContext = {
              developerEmail: context.getVariable("target_user_email") || "",
              error: context.getVariable("mcp_error") || ""
            };
            function safeJson(v) {
              if (!v) return null;
              try { return JSON.parse(v); } catch (e) { return null; }
            }
            if (action === "catalog") {
              liveContext.apis = safeJson(context.getVariable("response.content"));
              liveContext.products = safeJson(context.getVariable("productResponse.content"));
            } else if (action === "get_apps") {
              liveContext.apps = safeJson(context.getVariable("response.content"));
            } else if (action === "create_app") {
              liveContext.createdApp = safeJson(context.getVariable("response.content"));
            }
            var params = req.params || {};
            context.setVariable("response.content", JSON.stringify({
              jsonrpc: "2.0",
              id: id,
              result: callTool(params.name, params.arguments || {}, liveContext)
            }));
            context.setVariable("response.header.Content-Type", "application/json");
          } else {
            context.setVariable("response.content", JSON.stringify({
              jsonrpc: "2.0",
              id: id !== undefined ? id : null,
              error: { code: -32601, message: "Method not found: " + method }
            }));
            context.setVariable("response.header.Content-Type", "application/json");
          }
        IncludeURL: jsc://mcp.js
  - name: JS-ServePortal
    type: Javascript
    content:
      Javascript:
        metadata:
          continueOnError: "false"
          enabled: "true"
          timeLimit: "200"
          name: JS-ServePortal
        DisplayName: JS-ServePortal
        Properties: {}
        Source: "response.content = PORTAL_HTML;\ncontext.setVariable(\"response.header.Content-Type\", \"text/html; charset=utf-8\");\ncontext.setVariable(\"response.status.code\", 200);\n"
        IncludeURL: jsc://portal-html.js
  - name: JS-ParseSpecName
    type: Javascript
    content:
      Javascript:
        metadata:
          continueOnError: "true"
          enabled: "true"
          timeLimit: "200"
          name: JS-ParseSpecName
        DisplayName: JS-ParseSpecName
        Properties: {}
        Source: "try {\n  var raw = context.getVariable(\"versionResponse.content\");\n  if (raw) {\n    var versionData = JSON.parse(raw);\n    if (versionData && versionData.specs && versionData.specs.length > 0) {\n      var firstSpec = versionData.specs[0];\n      if (firstSpec && firstSpec.name) {\n        context.setVariable(\"apihub_spec_contents_url\", firstSpec.name);\n        context.setVariable(\"has_specs\", \"true\");\n      } else {\n        context.setVariable(\"has_specs\", \"false\");\n      }\n    } else {\n      context.setVariable(\"has_specs\", \"false\");\n    }\n  } else {\n    context.setVariable(\"has_specs\", \"false\");\n  }\n} catch(e) {\n  context.setVariable(\"has_specs\", \"false\");\n}\n"
  - name: JS-PrepareAdminApiPatch
    type: Javascript
    content:
      Javascript:
        metadata:
          continueOnError: "false"
          enabled: "true"
          timeLimit: "200"
          name: JS-PrepareAdminApiPatch
        DisplayName: JS-PrepareAdminApiPatch
        Properties: {}
        Source: |
          var paths = (context.getVariable("proxy.pathsuffix") || "").split("/");
          var apiId = paths[paths.length - 1] || "";
          context.setVariable("apihub_api_id", apiId);

          var bodyStr = context.getVariable("request.content") || "{}";
          var body = {};
          try {
            body = JSON.parse(bodyStr);
          } catch (e) {}

          var apiPatch = {};
          var masks = [];
          if (body.displayName !== undefined) {
            apiPatch.displayName = String(body.displayName);
            masks.push("display_name");
          }
          if (body.description !== undefined) {
            apiPatch.description = String(body.description);
            masks.push("description");
          }

          if (masks.length === 0) {
            apiPatch.displayName = "";
            masks.push("display_name");
          }

          context.setVariable("apihub_api_update_mask", masks.join(","));
          context.setVariable("apihub_api_patch_body", JSON.stringify(apiPatch));

          if (body.deploymentId && body.deploymentState !== undefined) {
            context.setVariable("has_deployment_patch", "true");
            context.setVariable("apihub_deployment_id", String(body.deploymentId));
            context.setVariable("apihub_deployment_patch_body", JSON.stringify({
              sourceEnvironment: String(body.deploymentState)
            }));
          } else {
            context.setVariable("has_deployment_patch", "false");
          }
  - name: JS-SetAdminPatchResponse
    type: Javascript
    content:
      Javascript:
        metadata:
          continueOnError: "false"
          enabled: "true"
          timeLimit: "200"
          name: JS-SetAdminPatchResponse
        DisplayName: JS-SetAdminPatchResponse
        Properties: {}
        Source: |
          var apiRespRaw = context.getVariable("patchApiResponse.content") || "{}";
          var depRespRaw = context.getVariable("patchDeploymentResponse.content") || "";
          var apiStatus = context.getVariable("patchApiResponse.status.code") || 200;
          var payload = {
            api: {},
            deployment: null
          };
          try {
            payload.api = JSON.parse(apiRespRaw);
          } catch (e) {
            payload.api = { raw: apiRespRaw };
          }
          if (depRespRaw) {
            try {
              payload.deployment = JSON.parse(depRespRaw);
            } catch (e) {
              payload.deployment = { raw: depRespRaw };
            }
          }
          context.setVariable("response.content", JSON.stringify(payload));
          context.setVariable("response.header.content-type", "application/json");
          context.setVariable("response.status.code", apiStatus >= 400 ? apiStatus : 200);
  - name: JS-TransformAdminApis
    type: Javascript
    content:
      Javascript:
        metadata:
          continueOnError: "false"
          enabled: "true"
          timeLimit: "200"
          name: JS-TransformAdminApis
        DisplayName: JS-TransformAdminApis
        Properties: {}
        Source: |
          var apisRaw = context.getVariable("response.content") || "{}";
          var depRaw = context.getVariable("deploymentResponse.content") || "{}";
          var prodRaw = context.getVariable("productResponse.content") || "{}";

          var apisObj = {};
          var depObj = {};
          var prodObj = {};
          try { apisObj = JSON.parse(apisRaw); } catch (e) {}
          try { depObj = JSON.parse(depRaw); } catch (e) {}
          try { prodObj = JSON.parse(prodRaw); } catch (e) {}

          var apisList = Array.isArray(apisObj.apis) ? apisObj.apis : [];
          var deployments = Array.isArray(depObj.deployments) ? depObj.deployments : [];
          var apigeeProducts = Array.isArray(prodObj.apiProduct) ? prodObj.apiProduct : [];

          var result = apisList.map(function (api) {
            var id = api.name ? api.name.split("/").pop() : "";
            var displayName = api.displayName || id;
            var description = api.description || "";
            var versions = Array.isArray(api.versions) ? api.versions : [];

            var matchedDeployment = null;
            for (var d = 0; d < deployments.length; d++) {
              var dep = deployments[d];
              if (!dep) continue;
              if (dep.apiVersions && Array.isArray(dep.apiVersions)) {
                for (var v = 0; v < versions.length; v++) {
                  if (dep.apiVersions.indexOf(versions[v]) !== -1) {
                    matchedDeployment = dep;
                    break;
                  }
                }
              }
              if (matchedDeployment) break;
            }

            var depInfo = null;
            if (matchedDeployment) {
              var depId = matchedDeployment.name ? matchedDeployment.name.split("/").pop() : "";
              var envState = matchedDeployment.sourceEnvironment || "";
              if (!envState && matchedDeployment.environment && matchedDeployment.environment.enumValues && matchedDeployment.environment.enumValues.values && matchedDeployment.environment.enumValues.values[0]) {
                envState = matchedDeployment.environment.enumValues.values[0].displayName || matchedDeployment.environment.enumValues.values[0].id || "";
              }
              if (!envState && matchedDeployment.deploymentType && matchedDeployment.deploymentType.enumValues && matchedDeployment.deploymentType.enumValues.values && matchedDeployment.deploymentType.enumValues.values[0]) {
                envState = matchedDeployment.deploymentType.enumValues.values[0].displayName || matchedDeployment.deploymentType.enumValues.values[0].id || "";
              }
              depInfo = {
                id: depId,
                name: matchedDeployment.name || "",
                displayName: matchedDeployment.displayName || depId,
                sourceEnvironment: matchedDeployment.sourceEnvironment || "",
                state: envState || "active",
                endpoints: matchedDeployment.endpoints || []
              };
            }

            var linkedProducts = [];
            for (var p = 0; p < apigeeProducts.length; p++) {
              var prod = apigeeProducts[p];
              if (!prod) continue;
              var matched = false;
              var groups = [prod.operationGroup, prod.llmOperationGroup, prod.payloadOperationGroup];
              for (var g = 0; g < groups.length; g++) {
                var grp = groups[g];
                if (grp && Array.isArray(grp.operationConfigs)) {
                  for (var c = 0; c < grp.operationConfigs.length; c++) {
                    if (grp.operationConfigs[c] && grp.operationConfigs[c].apiSource === displayName) {
                      matched = true;
                      break;
                    }
                  }
                }
                if (matched) break;
              }
              if (matched) {
                linkedProducts.push(prod.name);
              }
            }

            return {
              id: id,
              name: api.name || "",
              displayName: displayName,
              description: description,
              versions: versions,
              createTime: api.createTime || "",
              updateTime: api.updateTime || "",
              deployment: depInfo,
              deploymentState: depInfo ? depInfo.state : "unassigned",
              linkedProducts: linkedProducts
            };
          });

          context.setVariable("response.content", JSON.stringify({ apis: result }));
          context.setVariable("response.header.content-type", "application/json");
  - name: JS-GetPriceListResponse
    type: Javascript
    content:
      Javascript:
        metadata:
          continueOnError: "false"
          enabled: "true"
          timeLimit: "200"
          name: JS-GetPriceListResponse
        DisplayName: JS-GetPriceListResponse
        Properties: {}
        Source: |
          var status = context.getVariable("getPriceResponse.status.code") || 404;
          var raw = context.getVariable("getPriceResponse.content") || "";
          var defaults = {
            "default": { requestPerMillionTokens: 1.0, responsePerMillionTokens: 3.0, cachedRequestPerMillionTokens: 0.25 },
            "gemini-2.5-flash": { requestPerMillionTokens: 0.10, responsePerMillionTokens: 0.40, cachedRequestPerMillionTokens: 0.025 },
            "gemini-2.5-pro": { requestPerMillionTokens: 1.25, responsePerMillionTokens: 5.0, cachedRequestPerMillionTokens: 0.3125 },
            "gemini-3-flash-preview": { requestPerMillionTokens: 0.15, responsePerMillionTokens: 0.60, cachedRequestPerMillionTokens: 0.0375 },
            "claude-sonnet-4-6": { requestPerMillionTokens: 3.0, responsePerMillionTokens: 15.0, cachedRequestPerMillionTokens: 0.30 },
            "claude-opus-4-6": { requestPerMillionTokens: 15.0, responsePerMillionTokens: 75.0, cachedRequestPerMillionTokens: 1.50 },
            "claude-haiku-4-5": { requestPerMillionTokens: 0.80, responsePerMillionTokens: 4.0, cachedRequestPerMillionTokens: 0.08 },
            "qwen3-next-80b-a3b-thinking-maas": { requestPerMillionTokens: 0.40, responsePerMillionTokens: 1.20, cachedRequestPerMillionTokens: 0.10 },
            "deepseek-v3.2-maas": { requestPerMillionTokens: 0.27, responsePerMillionTokens: 1.10, cachedRequestPerMillionTokens: 0.07 }
          };
          var result = {
            environment: context.getVariable("environment.name") || "",
            kvm: "AI-Config",
            entry: "PriceList",
            exists: false,
            prices: defaults
          };
          if (status >= 200 && status < 300 && raw) {
            try {
              var entry = JSON.parse(raw);
              if (entry && entry.value) {
                result.prices = JSON.parse(entry.value);
                result.exists = true;
              }
            } catch (e) {}
          }
          context.setVariable("response.status.code", 200);
          context.setVariable("response.content", JSON.stringify(result));
          context.setVariable("response.header.content-type", "application/json");
