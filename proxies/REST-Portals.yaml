            model: [safeParse(context.getVariable("globalAnalyticsModelResponse.content"))],
            user: [safeParse(context.getVariable("globalAnalyticsUserResponse.content"))],
            product: [safeParse(context.getVariable("globalAnalyticsProductResponse.content"))],
            app: [safeParse(context.getVariable("globalAnalyticsAppResponse.content"))]
          };
          context.setVariable("response.content", JSON.stringify(payload));
          context.setVariable("response.header.content-type", "application/json");
