  - name: JS-AuthenticateUser
    type: Javascript
    content:
      Javascript:
        metadata:
          name: JS-AuthenticateUser
        DisplayName: JS-AuthenticateUser
        Properties: {}
        Source: "var userPayload = context.getVariable(\"user_json_payload\");\nvar passwordSubmitted = context.getVariable(\"request.formparam.password\");\n\nvar authSuccess = false;\nvar userProfile = null;\n\nif (userPayload) {\n  try {\n    userProfile = JSON.parse(userPayload);\n    if (userProfile.password === passwordSubmitted) {\n      authSuccess = true;\n    } else {\n      // Clean pure JS SHA-256 implementation\n      function sha256(ascii) {\n          function rotateRight(n, x) {\n              return (n >>> x) | (n << (32 - x));\n          }\n\n          var h0 = 0x6a09e667, h1 = 0xbb67ae85, h2 = 0x3c6ef372, h3 = 0xa54ff53a;\n          var h4 = 0x510e527f, h5 = 0x9b05688c, h6 = 0x1f83d9ab, h7 = 0x5be0cd19;\n\n          var k = [\n              0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5,\n              0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174,\n              0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da,\n              0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967,\n              0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85,\n              0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070,\n              0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3,\n              0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2\n          ];\n\n          var msgBytes = [];\n          for (var i = 0; i < ascii.length; i++) {\n              msgBytes.push(ascii.charCodeAt(i) & 0xFF);\n          }\n\n          var msgLenBits = msgBytes.length * 8;\n          msgBytes.push(0x80);\n          while ((msgBytes.length + 8) % 64 !== 0) {\n              msgBytes.push(0x00);\n          }\n\n          msgBytes.push(0x00);\n          msgBytes.push(0x00);\n          msgBytes.push(0x00);\n          msgBytes.push(0x00);\n          msgBytes.push((msgLenBits >>> 24) & 0xFF);\n          msgBytes.push((msgLenBits >>> 16) & 0xFF);\n          msgBytes.push((msgLenBits >>> 8) & 0xFF);\n          msgBytes.push(msgLenBits & 0xFF);\n\n          for (var chunkStart = 0; chunkStart < msgBytes.length; chunkStart += 64) {\n              var w = new Array(64);\n              for (var i = 0; i < 16; i++) {\n                  w[i] = (msgBytes[chunkStart + i * 4] << 24) |\n                         (msgBytes[chunkStart + i * 4 + 1] << 16) |\n                         (msgBytes[chunkStart + i * 4 + 2] << 8) |\n                         msgBytes[chunkStart + i * 4 + 3];\n              }\n\n              for (var i = 16; i < 64; i++) {\n                  var s0 = rotateRight(w[i - 15], 7) ^ rotateRight(w[i - 15], 18) ^ (w[i - 15] >>> 3);\n                  var s1 = rotateRight(w[i - 2], 17) ^ rotateRight(w[i - 2], 19) ^ (w[i - 2] >>> 10);\n                  w[i] = (w[i - 16] + s0 + w[i - 7] + s1) | 0;\n              }\n\n              var a = h0, b = h1, c = h2, d = h3, e = h4, f = h5, g = h6, h = h7;\n\n              for (var i = 0; i < 64; i++) {\n                  var s1_e = rotateRight(e, 6) ^ rotateRight(e, 11) ^ rotateRight(e, 25);\n                  var ch = (e & f) ^ (~e & g);\n                  var temp1 = (h + s1_e + ch + k[i] + w[i]) | 0;\n                  var s0_a = rotateRight(a, 2) ^ rotateRight(a, 13) ^ rotateRight(a, 22);\n                  var maj = (a & b) ^ (a & c) ^ (b & c);\n                  var temp2 = (s0_a + maj) | 0;\n\n                  h = g;\n                  g = f;\n                  f = e;\n                  e = (d + temp1) | 0;\n                  d = c;\n                  c = b;\n                  b = a;\n                  a = (temp1 + temp2) | 0;\n              }\n\n              h0 = (h0 + a) | 0;\n              h1 = (h1 + b) | 0;\n              h2 = (h2 + c) | 0;\n              h3 = (h3 + d) | 0;\n              h4 = (h4 + e) | 0;\n              h5 = (h5 + f) | 0;\n              h6 = (h6 + g) | 0;\n              h7 = (h7 + h) | 0;\n          }\n\n          var bytes = [];\n          var words = [h0, h1, h2, h3, h4, h5, h6, h7];\n          for (var i = 0; i < 8; i++) {\n              bytes.push((words[i] >>> 24) & 0xFF);\n              bytes.push((words[i] >>> 16) & 0xFF);\n              bytes.push((words[i] >>> 8) & 0xFF);\n              bytes.push(words[i] & 0xFF);\n          }\n\n          var hex = \"\";\n          for (var i = 0; i < bytes.length; i++) {\n              var h = bytes[i].toString(16);\n              if (h.length < 2) h = \"0\" + h;\n              hex += h;\n          }\n          return hex;\n      }\n\n      var salt = \"Apigee-IDP-Salt-\";\n      var hashedSubmitted = sha256(salt + userProfile.username + \":\" + passwordSubmitted);\n      if (userProfile.password === hashedSubmitted) {\n        authSuccess = true;\n      }\n    }\n  } catch(e) {}\n}\n\nif (authSuccess && userProfile) {\n  context.setVariable(\"auth_success\", \"true\");\n  context.setVariable(\"auth_failed\", \"false\");\n  context.setVariable(\"auth_error_message\", \"\");\n\n  // Generate cryptographically random code\n  var chars = \"0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ\";\n  var authCode = \"code_\";\n  for (var i = 0; i < 24; i++) {\n    authCode += chars.charAt(Math.floor(Math.random() * chars.length));\n  }\n  context.setVariable(\"auth_code\", authCode);\n\n  // Package authorization code parameters for cache storage\n  var codeData = {\n    username: userProfile.username,\n    email: userProfile.email,\n    name: userProfile.name,\n    client_id: context.getVariable(\"auth_client_id\"),\n    redirect_uri: context.getVariable(\"auth_redirect_uri\"),\n    scope: context.getVariable(\"auth_scope\"),\n    code_challenge: context.getVariable(\"auth_code_challenge\"),\n    code_challenge_method: context.getVariable(\"auth_code_challenge_method\")\n  };\n\n  context.setVariable(\"auth_code_data\", JSON.stringify(codeData));\n} else {\n  context.setVariable(\"auth_success\", \"false\");\n  context.setVariable(\"auth_failed\", \"true\");\n  context.setVariable(\"auth_error_message\", \"Invalid username or password\");\n}\n"
  - name: JS-CreateRefreshToken
    type: Javascript
    content:
      Javascript:
        metadata:
          name: JS-CreateRefreshToken
        DisplayName: JS-CreateRefreshToken
        Properties: {}
        Source: "// Generate a cryptographically secure random refresh token string\nvar chars = \"0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ\";\nvar rToken = \"rt_\";\nfor (var i = 0; i < 32; i++) {\n  rToken += chars.charAt(Math.floor(Math.random() * chars.length));\n}\ncontext.setVariable(\"token_refresh_token\", rToken);\n\nvar refreshData = {\n  username: context.getVariable(\"token_username\"),\n  email: context.getVariable(\"token_email\"),\n  name: context.getVariable(\"token_name\"),\n  client_id: context.getVariable(\"token_client_id\"),\n  scope: context.getVariable(\"token_scope\")\n};\n\ncontext.setVariable(\"refresh_token_data\", JSON.stringify(refreshData));\n"
  - name: JS-ExtractClientAndSetKey
    type: Javascript
    content:
      Javascript:
        metadata:
          name: JS-ExtractClientAndSetKey
        DisplayName: JS-ExtractClientAndSetKey
        Properties: {}
