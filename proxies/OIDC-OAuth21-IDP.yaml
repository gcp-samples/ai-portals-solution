# yaml-language-server: $schema=https://raw.githubusercontent.com/apigee/apigee-templater/main/schema/gateway.schema.1.0.json
name: OIDC-OAuth21-IDP
displayName: OIDC-OAuth21-IDP
type: feature
gateway: apigee
schemaVersion: 1.0.0
description: "Complete Identity Provider, OpenID Connect & OAuth 2.1 BFF Proxy for Apigee"
documentation: ""
categories: []
parameters:
  - name: REDIRECT_URI
    displayName: Redirect URI
    description: Allowed redirect URI for external apps (exact match)
    default: https://localhost:8080/callback
  - name: GOOGLE_CLIENT_ID
    displayName: Google OAuth Client ID
    description: Google OAuth 2.0 Client ID for upstream Google Sign-In (optional)
    default: ""
  - name: GOOGLE_CLIENT_SECRET
    displayName: Google OAuth Client Secret
    description: Google OAuth 2.0 Client Secret for upstream Google Sign-In (optional)
    default: ""
  - name: APIHUB_LOCATION
    displayName: APIHUB_LOCATION
    description: Google Cloud region where API Hub is provisioned
    default: europe-west1
defaultEndpoint:
  name: default
  basePath: /
  routes:
    - name: default
  flows:
    - name: PreFlow
      mode: Request
      steps:
        - name: CORS-SetCors
    - name: GET OpenID Configuration
      mode: Response
      condition: "(proxy.pathsuffix MatchesPath \"/.well-known/openid-configuration\") and (request.verb = \"GET\")"
      steps:
        - name: JS-OidcConfig
    - name: GET AI Catalog
      mode: Response
      condition: "(proxy.pathsuffix MatchesPath \"/.well-known/ai-catalog.json\") and (request.verb = \"GET\")"
      steps:
        - name: SC-GetAPIs
        - name: JS-BuildAiCatalog
    - name: GET JWKS
      mode: Response
      condition: "(proxy.pathsuffix MatchesPath \"/jwks.json\") and (request.verb = \"GET\")"
      steps:
        - name: JS-SetSecurityKeyNames
        - name: KVM-GetSecurityKeys
        - name: AM-JWKS
    - name: GET Register
      mode: Response
      condition: "(proxy.pathsuffix MatchesPath \"/register\") and (request.verb = \"GET\")"
      steps:
        - name: AM-RegisterForm
    - name: POST Register
      mode: Response
      condition: "(proxy.pathsuffix MatchesPath \"/register\") and (request.verb = \"POST\") and (not (request.content Like \"*redirect_uris*\"))"
      steps:
        - name: JS-ProcessRegister
        - name: SC-CreateDeveloper
          condition: "register_success = \"true\""
        - name: KVM-PutUser
          condition: "register_success = \"true\""
        - name: KVM-PutUserByEmail
          condition: "register_success = \"true\""
        - name: AM-RegisterSuccess
          condition: "register_success = \"true\""
        - name: AM-RegisterFailure
          condition: "register_success = \"false\" or register_error != null"
    - name: POST Register Client
      mode: Response
      condition: "((proxy.pathsuffix MatchesPath \"/register-client\") and (request.verb = \"POST\")) or ((proxy.pathsuffix MatchesPath \"/register\") and (request.verb = \"POST\") and (request.content Like \"*redirect_uris*\"))"
      steps:
        - name: JS-ProcessRegisterClient
        - name: KVM-PutClient
          condition: "client_register_success = \"true\""
        - name: AM-RegisterClientSuccess
          condition: "client_register_success = \"true\""
        - name: AM-RegisterClientFailure
          condition: "client_register_success = \"false\" or client_register_error != null"
    - name: GET Google Authorize
      mode: Response
      condition: "(proxy.pathsuffix MatchesPath \"/authorize/google\") and (request.verb = \"GET\")"
      steps:
        - name: JS-ExtractClientAndSetKey
        - name: KVM-GetClient
          condition: "(is_static_client = \"false\") and (client_id_extracted != null) and (client_id_extracted != \"\")"
        - name: JS-ValidateAuthorize
        - name: JS-PrepareGoogleAuth
        - name: PC-StoreGoogleState
          condition: "google_auth_ready = \"true\""
        - name: AM-RedirectGoogle
          condition: "google_auth_ready = \"true\""
        - name: AM-LoginFormWithError
          condition: "(authorize_valid = \"false\") or (google_auth_ready = \"false\")"
    - name: GET Google Callback
      mode: Response
      condition: "(proxy.pathsuffix MatchesPath \"/callback/google\") and (request.verb = \"GET\")"
      steps:
        - name: JS-ExtractGoogleCallback
        - name: LC-LookupGoogleState
          condition: "google_callback_ok = \"true\""
        - name: IC-InvalidateGoogleState
          condition: "google_callback_ok = \"true\""
        - name: JS-PrepareGoogleTokenRequest
          condition: "google_callback_ok = \"true\""
        - name: SC-GoogleTokenExchange
          condition: "google_callback_ok = \"true\""
        - name: JS-ExtractGoogleAccessToken
          condition: "google_callback_ok = \"true\""
        - name: SC-GoogleUserInfo
          condition: "google_callback_ok = \"true\""
        - name: JS-ProcessGoogleUser
          condition: "google_callback_ok = \"true\""
        - name: SC-CreateDeveloper
          condition: "auth_success = \"true\""
        - name: PC-StoreCode
          condition: "auth_success = \"true\""
        - name: AM-RedirectCode
          condition: "auth_success = \"true\""
        - name: AM-GoogleAuthError
          condition: "auth_success != \"true\""
    - name: GET Authorize
      mode: Response
      condition: "(proxy.pathsuffix MatchesPath \"/authorize\") and (request.verb = \"GET\")"
      steps:
        - name: JS-ExtractClientAndSetKey
        - name: KVM-GetClient
          condition: "(is_static_client = \"false\") and (client_id_extracted != null) and (client_id_extracted != \"\")"
        - name: JS-ValidateAuthorize
        - name: AM-LoginForm
    - name: POST Login / Authorize
      mode: Response
      condition: "(proxy.pathsuffix MatchesPath \"/authorize\") and (request.verb = \"POST\")"
      steps:
        - name: JS-ExtractClientAndSetKey
        - name: KVM-GetClient
          condition: "(is_static_client = \"false\") and (client_id_extracted != null) and (client_id_extracted != \"\")"
        - name: JS-ValidateAuthorize
        - name: JS-ExtractCredentials
          condition: "authorize_valid = \"true\""
        - name: KVM-GetUser
          condition: "authorize_valid = \"true\""
        - name: JS-AuthenticateUser
          condition: "authorize_valid = \"true\""
        - name: PC-StoreCode
          condition: "(authorize_valid = \"true\") and (auth_success = \"true\")"
        - name: AM-RedirectCode
          condition: "(authorize_valid = \"true\") and (auth_success = \"true\")"
        - name: AM-LoginFormWithError
          condition: "(authorize_valid = \"false\") or (auth_success = \"false\")"
    - name: POST Token
      mode: Response
      condition: "(proxy.pathsuffix MatchesPath \"/token\") and (request.verb = \"POST\")"
      steps:
        - name: JS-SetSecurityKeyNames
        - name: KVM-GetSecurityKeys
        - name: JS-ExtractTokenParams
        - name: LC-LookupCode
          condition: "token_grant_type = \"authorization_code\""
        - name: LC-LookupRefreshToken
          condition: "token_grant_type = \"refresh_token\""
        - name: KVM-GetClient
          condition: "token_grant_type = \"client_credentials\""
        - name: JS-VerifyCodeAndPKCE
          condition: "token_grant_type = \"authorization_code\""
        - name: JS-VerifyRefreshToken
          condition: "token_grant_type = \"refresh_token\""
        - name: JS-VerifyClientCredentials
          condition: "token_grant_type = \"client_credentials\""
        - name: IC-InvalidateCode
          condition: "(token_grant_type = \"authorization_code\") and (token_generation_allowed = \"true\")"
        - name: IC-InvalidateRefreshToken
          condition: "(token_grant_type = \"refresh_token\") and (token_generation_allowed = \"true\")"
        - name: JWT-GenerateAccessToken
          condition: "token_generation_allowed = \"true\""
        - name: JWT-GenerateIDToken
          condition: "(token_generation_allowed = \"true\") and (token_scope_has_openid = \"true\")"
        - name: JS-CreateRefreshToken
          condition: "token_generation_allowed = \"true\""
        - name: PC-StoreRefreshToken
          condition: "token_generation_allowed = \"true\""
        - name: AM-TokenResponse
          condition: "token_generation_allowed = \"true\""
        - name: AM-TokenErrorResponse
          condition: "token_generation_allowed = \"false\" or token_error != null"
    - name: UserInfo
      mode: Response
      condition: "(proxy.pathsuffix MatchesPath \"/userinfo\") and ((request.verb = \"GET\") or (request.verb = \"POST\"))"
      steps:
        - name: JS-SetSecurityKeyNames
        - name: KVM-GetSecurityKeys
        - name: JS-SetupVerification
        - name: JWT-VerifyAccessToken
        - name: AM-UserInfoResponse
    - name: GET WellKnown
      mode: Response
      condition: "(proxy.pathsuffix MatchesPath \"/.well-known/oauth-protected-resource\") and (request.verb = \"GET\")"
      steps:
        - name: AM-SetWellKnown
    - name: GET AuthServer
      mode: Response
      condition: "(proxy.pathsuffix MatchesPath \"/.well-known/oauth-authorization-server\") and (request.verb = \"GET\")"
      steps:
        - name: AM-SetAuthServer
  faultRules: []
endpoints: []
targets: []
policies:
  - name: AM-JWKS
    type: AssignMessage
    content:
      AssignMessage:
        metadata:
          name: AM-JWKS
        Set:
          Payload:
            metadata:
              contentType: application/json
            _text: "{jwks_payload}"
  - name: AM-LoginForm
    type: AssignMessage
    content:
      AssignMessage:
        metadata:
          name: AM-LoginForm
        Set:
          Payload:
            metadata:
              contentType: text/html; charset=utf-8
            _text: "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>IDP - Log In</title>\n    <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n    <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n    <link href=\"https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Inter:wght@400;500;600&display=swap\" rel=\"stylesheet\">\n    <style>\n        :root {\n            --primary: #6366f1;\n            --primary-glow: rgba(99, 102, 241, 0.45);\n            --accent: #a855f7;\n            --bg: #090d16;\n            --card-bg: rgba(17, 25, 40, 0.55);\n            --border: rgba(255, 255, 255, 0.08);\n            --text: #f3f4f6;\n            --text-muted: #9ca3af;\n        }\n        * { box-sizing: border-box; margin: 0; padding: 0; }\n        body {\n            font-family: 'Outfit', sans-serif;\n            background-color: var(--bg);\n            background-image:\n                radial-gradient(at 10% 20%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),\n                radial-gradient(at 90% 80%, rgba(168, 85, 247, 0.15) 0px, transparent 50%);\n            color: var(--text);\n            min-height: 100vh;\n            display: flex;\n            justify-content: center;\n            align-items: center;\n            overflow: hidden;\n            position: relative;\n        }\n        .glowing-blob {\n            position: absolute;\n            width: 250px;\n            height: 250px;\n            border-radius: 50%;\n            background: var(--primary);\n            filter: blur(120px);\n            z-index: 1;\n            opacity: 0.6;\n            animation: float 10s ease-in-out infinite alternate;\n        }\n        .blob-1 { top: 15%; left: 10%; background: var(--primary); }\n        .blob-2 { bottom: 15%; right: 10%; background: var(--accent); animation-delay: -5s; }\n        @keyframes float {\n            0% { transform: translateY(0px) scale(1); }\n            100% { transform: translateY(30px) scale(1.15); }\n        }\n        .card {\n            background: var(--card-bg);\n            backdrop-filter: blur(16px);\n            -webkit-backdrop-filter: blur(16px);\n            border: 1px solid var(--border);\n            border-radius: 20px;\n            width: 100%;\n            max-width: 440px;\n            padding: 40px;\n            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.45);\n            z-index: 10;\n            position: relative;\n            animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);\n        }\n        @keyframes fadeIn {\n            from { opacity: 0; transform: translateY(20px); }\n            to { opacity: 1; transform: translateY(0); }\n        }\n        .header { text-align: center; margin-bottom: 30px; }\n        .header h1 {\n            font-size: 2rem;\n            font-weight: 700;\n            background: linear-gradient(135deg, #fff 30%, #a5b4fc 100%);\n            -webkit-background-clip: text;\n            -webkit-text-fill-color: transparent;\n            margin-bottom: 8px;\n        }\n        .header p { color: var(--text-muted); font-size: 0.95rem; font-family: 'Inter', sans-serif; }\n        .form-group { margin-bottom: 20px; position: relative; }\n        .form-group label {\n            display: block;\n            margin-bottom: 8px;\n            color: var(--text);\n            font-size: 0.9rem;\n            font-weight: 600;\n            letter-spacing: 0.05em;\n            text-transform: uppercase;\n        }\n        .form-input {\n            width: 100%;\n            background: rgba(13, 20, 35, 0.6);\n            border: 1px solid var(--border);\n            border-radius: 10px;\n            padding: 12px 16px;\n            color: var(--text);\n            font-family: 'Inter', sans-serif;\n            font-size: 0.95rem;\n            transition: all 0.3s ease;\n        }\n        .form-input:focus {\n            outline: none;\n            border-color: var(--primary);\n            box-shadow: 0 0 14px var(--primary-glow);\n            background: rgba(13, 20, 35, 0.85);\n        }\n        .btn {\n            width: 100%;\n            background: linear-gradient(135deg, var(--primary), var(--accent));\n            border: none;\n            border-radius: 10px;\n            padding: 14px;\n            color: #fff;\n            font-family: 'Outfit', sans-serif;\n            font-size: 1rem;\n            font-weight: 700;\n            cursor: pointer;\n            transition: all 0.3s ease;\n            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);\n            margin-top: 10px;\n        }\n        .btn:hover {\n            transform: translateY(-2px);\n            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.5);\n            filter: brightness(1.1);\n        }\n        .btn:active { transform: translateY(0); }\n        .footer-links {\n            margin-top: 25px;\n            text-align: center;\n            font-size: 0.9rem;\n            color: var(--text-muted);\n            font-family: 'Inter', sans-serif;\n        }\n        .footer-links a {\n            color: var(--primary);\n            text-decoration: none;\n            font-weight: 600;\n        }\n        .footer-links a:hover { text-decoration: underline; }\n        .error-alert {\n            background: rgba(239, 68, 68, 0.15);\n            border: 1px solid rgba(239, 68, 68, 0.3);\n            border-radius: 10px;\n            padding: 12px 16px;\n            color: #fca5a5;\n            font-size: 0.9rem;\n            margin-bottom: 20px;\n            font-family: 'Inter', sans-serif;\n        }\n        .oauth-badge {\n            display: inline-block;\n            background: rgba(255, 255, 255, 0.05);\n            border: 1px solid var(--border);\n            border-radius: 20px;\n            padding: 4px 12px;\n            font-size: 0.8rem;\n            font-weight: 600;\n            color: var(--text-muted);\n            margin-bottom: 15px;\n            text-transform: uppercase;\n        }\n    </style>\n</head>\n<body>\n    <div class=\"glowing-blob blob-1\"></div>\n    <div class=\"glowing-blob blob-2\"></div>\n\n    <div class=\"card\">\n        <div class=\"header\">\n            <div style=\"display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:16px;\"><svg width=\"28\" height=\"28\" viewBox=\"0 0 28 28\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" aria-label=\"Apigee Mesh Logo\"><path d=\"M14 3.5L23.5 9V19L14 24.5L4.5 19V9L14 3.5Z\" stroke=\"#cbd5e1\" stroke-width=\"1.4\" stroke-opacity=\"0.75\"/><path d=\"M14 14L14 3.5M14 14L23.5 19M14 14L4.5 19\" stroke=\"#cbd5e1\" stroke-width=\"1.3\" stroke-opacity=\"0.6\"/><circle cx=\"14\" cy=\"3.5\" r=\"1.8\" fill=\"#e2e8f0\"/><circle cx=\"23.5\" cy=\"9\" r=\"1.8\" fill=\"#e2e8f0\"/><circle cx=\"23.5\" cy=\"19\" r=\"1.8\" fill=\"#e2e8f0\"/><circle cx=\"14\" cy=\"24.5\" r=\"1.8\" fill=\"#e2e8f0\"/><circle cx=\"4.5\" cy=\"19\" r=\"1.8\" fill=\"#e2e8f0\"/><circle cx=\"4.5\" cy=\"9\" r=\"1.8\" fill=\"#e2e8f0\"/><circle cx=\"14\" cy=\"14\" r=\"2.4\" fill=\"#f8fafc\"/></svg><span style=\"font-family:'Outfit',sans-serif;font-size:1.35rem;font-weight:700;letter-spacing:-0.02em;color:#f3f4f6;\">Apigee</span></div>\n            <span class=\"oauth-badge\">OIDC & OAuth 2.1 IDP</span>\n            <h1>Sign In</h1>\n            <p>Sign in to proceed to your application</p>\n        </div>\n\n        <form action=\"/authorize\" method=\"POST\" id=\"loginForm\">\n            <!-- OAuth 2.1 Hidden Params -->\n            <input type=\"hidden\" name=\"client_id\" value=\"{auth_client_id}\">\n            <input type=\"hidden\" name=\"redirect_uri\" value=\"{auth_redirect_uri}\">\n            <input type=\"hidden\" name=\"response_type\" value=\"{auth_response_type}\">\n            <input type=\"hidden\" name=\"scope\" value=\"{auth_scope}\">\n            <input type=\"hidden\" name=\"state\" value=\"{auth_state}\">\n            <input type=\"hidden\" name=\"code_challenge\" value=\"{auth_code_challenge}\">\n            <input type=\"hidden\" name=\"code_challenge_method\" value=\"{auth_code_challenge_method}\">\n\n            <div class=\"form-group\">\n                <label for=\"username\">Email Address</label>\n                <input type=\"text\" id=\"username\" name=\"username\" class=\"form-input\" required autocomplete=\"username\">\n            </div>\n\n            <div class=\"form-group\">\n                <label for=\"password\">Password</label>\n                <input type=\"password\" id=\"password\" name=\"password\" class=\"form-input\" required autocomplete=\"current-password\">\n            </div>\n\n            <button type=\"submit\" class=\"btn\">Authenticate</button>\n        </form>\n\n        <div id=\"google-auth-section\" data-google-client-id=\"{propertyset.oidc.GOOGLE_CLIENT_ID}\" style=\"margin-top: 18px;\">\n            <div style=\"display:flex;align-items:center;gap:10px;margin:14px 0;color:var(--text-muted);font-size:0.8rem;font-family:'Inter',sans-serif;\">\n                <span style=\"flex:1;height:1px;background:var(--border);\"></span>\n                <span>OR</span>\n                <span style=\"flex:1;height:1px;background:var(--border);\"></span>\n            </div>\n            <a href=\"/authorize/google?client_id={auth_client_id}&amp;redirect_uri={auth_redirect_uri}&amp;response_type={auth_response_type}&amp;scope={auth_scope}&amp;state={auth_state}&amp;code_challenge={auth_code_challenge}&amp;code_challenge_method={auth_code_challenge_method}\" class=\"btn\" style=\"display:flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;background:rgba(255,255,255,0.08);border:1px solid var(--border);box-shadow:none;\">\n                <svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\"><path fill=\"#4285F4\" d=\"M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z\"/><path fill=\"#34A853\" d=\"M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z\"/><path fill=\"#FBBC05\" d=\"M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22z\"/><path fill=\"#EA4335\" d=\"M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z\"/></svg>\n                <span>Continue with Google</span>\n            </a>\n        </div>\n        <script>(function(){var el=document.getElementById('google-auth-section');if(el){var cid=el.getAttribute('data-google-client-id')||'';if(!cid||cid.indexOf('{')===0){el.style.display='none';}}})();</script>\n\n        <div class=\"footer-links\">\n            Don't have an account? <a href=\"/register?client_id={auth_client_id}&amp;redirect_uri={auth_redirect_uri}&amp;response_type={auth_response_type}&amp;scope={auth_scope}&amp;state={auth_state}&amp;code_challenge={auth_code_challenge}&amp;code_challenge_method={auth_code_challenge_method}\">Register here</a>\n        </div>\n    </div>\n</body>\n</html>\n"
  - name: AM-LoginFormWithError
    type: AssignMessage
    content:
      AssignMessage:
        metadata:
          name: AM-LoginFormWithError
        Set:
          Payload:
            metadata:
              contentType: text/html; charset=utf-8
            _text: "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>IDP - Log In Error</title>\n    <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n    <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n    <link href=\"https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Inter:wght@400;500;600&display=swap\" rel=\"stylesheet\">\n    <style>\n        :root {\n            --primary: #6366f1;\n            --primary-glow: rgba(99, 102, 241, 0.45);\n            --accent: #a855f7;\n            --bg: #090d16;\n            --card-bg: rgba(17, 25, 40, 0.55);\n            --border: rgba(255, 255, 255, 0.08);\n            --text: #f3f4f6;\n            --text-muted: #9ca3af;\n        }\n        * { box-sizing: border-box; margin: 0; padding: 0; }\n        body {\n            font-family: 'Outfit', sans-serif;\n            background-color: var(--bg);\n            background-image:\n                radial-gradient(at 10% 20%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),\n                radial-gradient(at 90% 80%, rgba(168, 85, 247, 0.15) 0px, transparent 50%);\n            color: var(--text);\n            min-height: 100vh;\n            display: flex;\n            justify-content: center;\n            align-items: center;\n            overflow: hidden;\n            position: relative;\n        }\n        .glowing-blob {\n            position: absolute;\n            width: 250px;\n            height: 250px;\n            border-radius: 50%;\n            background: var(--primary);\n            filter: blur(120px);\n            z-index: 1;\n            opacity: 0.6;\n            animation: float 10s ease-in-out infinite alternate;\n        }\n        .blob-1 { top: 15%; left: 10%; background: var(--primary); }\n        .blob-2 { bottom: 15%; right: 10%; background: var(--accent); animation-delay: -5s; }\n        @keyframes float {\n            0% { transform: translateY(0px) scale(1); }\n            100% { transform: translateY(30px) scale(1.15); }\n        }\n        .card {\n            background: var(--card-bg);\n            backdrop-filter: blur(16px);\n            -webkit-backdrop-filter: blur(16px);\n            border: 1px solid var(--border);\n            border-radius: 20px;\n            width: 100%;\n            max-width: 440px;\n            padding: 40px;\n            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.45);\n            z-index: 10;\n            position: relative;\n            animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);\n        }\n        @keyframes fadeIn {\n            from { opacity: 0; transform: translateY(20px); }\n            to { opacity: 1; transform: translateY(0); }\n        }\n        .header { text-align: center; margin-bottom: 30px; }\n        .header h1 {\n            font-size: 2rem;\n            font-weight: 700;\n            background: linear-gradient(135deg, #fff 30%, #a5b4fc 100%);\n            -webkit-background-clip: text;\n            -webkit-text-fill-color: transparent;\n            margin-bottom: 8px;\n        }\n        .header p { color: var(--text-muted); font-size: 0.95rem; font-family: 'Inter', sans-serif; }\n        .form-group { margin-bottom: 20px; position: relative; }\n        .form-group label {\n            display: block;\n            margin-bottom: 8px;\n            color: var(--text);\n            font-size: 0.9rem;\n            font-weight: 600;\n            letter-spacing: 0.05em;\n            text-transform: uppercase;\n        }\n        .form-input {\n            width: 100%;\n            background: rgba(13, 20, 35, 0.6);\n            border: 1px solid var(--border);\n            border-radius: 10px;\n            padding: 12px 16px;\n            color: var(--text);\n            font-family: 'Inter', sans-serif;\n            font-size: 0.95rem;\n            transition: all 0.3s ease;\n        }\n        .form-input:focus {\n            outline: none;\n            border-color: var(--primary);\n            box-shadow: 0 0 14px var(--primary-glow);\n            background: rgba(13, 20, 35, 0.85);\n        }\n        .btn {\n            width: 100%;\n            background: linear-gradient(135deg, var(--primary), var(--accent));\n            border: none;\n            border-radius: 10px;\n            padding: 14px;\n            color: #fff;\n            font-family: 'Outfit', sans-serif;\n            font-size: 1rem;\n            font-weight: 700;\n            cursor: pointer;\n            transition: all 0.3s ease;\n            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);\n            margin-top: 10px;\n        }\n        .btn:hover {\n            transform: translateY(-2px);\n            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.5);\n            filter: brightness(1.1);\n        }\n        .btn:active { transform: translateY(0); }\n        .footer-links {\n            margin-top: 25px;\n            text-align: center;\n            font-size: 0.9rem;\n            color: var(--text-muted);\n            font-family: 'Inter', sans-serif;\n        }\n        .footer-links a {\n            color: var(--primary);\n            text-decoration: none;\n            font-weight: 600;\n        }\n        .footer-links a:hover { text-decoration: underline; }\n        .error-alert {\n            background: rgba(239, 68, 68, 0.15);\n            border: 1px solid rgba(239, 68, 68, 0.3);\n            border-radius: 10px;\n            padding: 12px 16px;\n            color: #fca5a5;\n            font-size: 0.9rem;\n            margin-bottom: 20px;\n            font-family: 'Inter', sans-serif;\n        }\n        .oauth-badge {\n            display: inline-block;\n            background: rgba(255, 255, 255, 0.05);\n            border: 1px solid var(--border);\n            border-radius: 20px;\n            padding: 4px 12px;\n            font-size: 0.8rem;\n            font-weight: 600;\n            color: var(--text-muted);\n            margin-bottom: 15px;\n            text-transform: uppercase;\n        }\n    </style>\n</head>\n<body>\n    <div class=\"glowing-blob blob-1\"></div>\n    <div class=\"glowing-blob blob-2\"></div>\n\n    <div class=\"card\">\n        <div class=\"header\">\n            <div style=\"display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:16px;\"><svg width=\"28\" height=\"28\" viewBox=\"0 0 28 28\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" aria-label=\"Apigee Mesh Logo\"><path d=\"M14 3.5L23.5 9V19L14 24.5L4.5 19V9L14 3.5Z\" stroke=\"#cbd5e1\" stroke-width=\"1.4\" stroke-opacity=\"0.75\"/><path d=\"M14 14L14 3.5M14 14L23.5 19M14 14L4.5 19\" stroke=\"#cbd5e1\" stroke-width=\"1.3\" stroke-opacity=\"0.6\"/><circle cx=\"14\" cy=\"3.5\" r=\"1.8\" fill=\"#e2e8f0\"/><circle cx=\"23.5\" cy=\"9\" r=\"1.8\" fill=\"#e2e8f0\"/><circle cx=\"23.5\" cy=\"19\" r=\"1.8\" fill=\"#e2e8f0\"/><circle cx=\"14\" cy=\"24.5\" r=\"1.8\" fill=\"#e2e8f0\"/><circle cx=\"4.5\" cy=\"19\" r=\"1.8\" fill=\"#e2e8f0\"/><circle cx=\"4.5\" cy=\"9\" r=\"1.8\" fill=\"#e2e8f0\"/><circle cx=\"14\" cy=\"14\" r=\"2.4\" fill=\"#f8fafc\"/></svg><span style=\"font-family:'Outfit',sans-serif;font-size:1.35rem;font-weight:700;letter-spacing:-0.02em;color:#f3f4f6;\">Apigee</span></div>\n            <span class=\"oauth-badge\">OIDC & OAuth 2.1 IDP</span>\n            <h1>Sign In</h1>\n            <p>Sign in to proceed to your application</p>\n        </div>\n\n        <div class=\"error-alert\">{auth_error_message}</div>\n\n        <form action=\"/authorize\" method=\"POST\" id=\"loginForm\">\n            <!-- OAuth 2.1 Hidden Params -->\n            <input type=\"hidden\" name=\"client_id\" value=\"{auth_client_id}\">\n            <input type=\"hidden\" name=\"redirect_uri\" value=\"{auth_redirect_uri}\">\n            <input type=\"hidden\" name=\"response_type\" value=\"{auth_response_type}\">\n            <input type=\"hidden\" name=\"scope\" value=\"{auth_scope}\">\n            <input type=\"hidden\" name=\"state\" value=\"{auth_state}\">\n            <input type=\"hidden\" name=\"code_challenge\" value=\"{auth_code_challenge}\">\n            <input type=\"hidden\" name=\"code_challenge_method\" value=\"{auth_code_challenge_method}\">\n\n            <div class=\"form-group\">\n                <label for=\"username\">Email Address</label>\n                <input type=\"text\" id=\"username\" name=\"username\" class=\"form-input\" value=\"{login_username}\" required autocomplete=\"username\">\n            </div>\n\n            <div class=\"form-group\">\n                <label for=\"password\">Password</label>\n                <input type=\"password\" id=\"password\" name=\"password\" class=\"form-input\" required autocomplete=\"current-password\">\n            </div>\n\n            <button type=\"submit\" class=\"btn\">Authenticate</button>\n        </form>\n\n        <div id=\"google-auth-section\" data-google-client-id=\"{propertyset.oidc.GOOGLE_CLIENT_ID}\" style=\"margin-top: 18px;\">\n            <div style=\"display:flex;align-items:center;gap:10px;margin:14px 0;color:var(--text-muted);font-size:0.8rem;font-family:'Inter',sans-serif;\">\n                <span style=\"flex:1;height:1px;background:var(--border);\"></span>\n                <span>OR</span>\n                <span style=\"flex:1;height:1px;background:var(--border);\"></span>\n            </div>\n            <a href=\"/authorize/google?client_id={auth_client_id}&amp;redirect_uri={auth_redirect_uri}&amp;response_type={auth_response_type}&amp;scope={auth_scope}&amp;state={auth_state}&amp;code_challenge={auth_code_challenge}&amp;code_challenge_method={auth_code_challenge_method}\" class=\"btn\" style=\"display:flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;background:rgba(255,255,255,0.08);border:1px solid var(--border);box-shadow:none;\">\n                <svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\"><path fill=\"#4285F4\" d=\"M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z\"/><path fill=\"#34A853\" d=\"M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z\"/><path fill=\"#FBBC05\" d=\"M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22z\"/><path fill=\"#EA4335\" d=\"M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z\"/></svg>\n                <span>Continue with Google</span>\n            </a>\n        </div>\n        <script>(function(){var el=document.getElementById('google-auth-section');if(el){var cid=el.getAttribute('data-google-client-id')||'';if(!cid||cid.indexOf('{')===0){el.style.display='none';}}})();</script>\n\n        <div class=\"footer-links\">\n            Don't have an account? <a href=\"/register?client_id={auth_client_id}&amp;redirect_uri={auth_redirect_uri}&amp;response_type={auth_response_type}&amp;scope={auth_scope}&amp;state={auth_state}&amp;code_challenge={auth_code_challenge}&amp;code_challenge_method={auth_code_challenge_method}\">Register here</a>\n        </div>\n    </div>\n</body>\n</html>\n"
  - name: AM-RedirectCode
    type: AssignMessage
    content:
      AssignMessage:
        metadata:
          name: AM-RedirectCode
        Set:
          StatusCode: "302"
          ReasonPhrase: Found
          Headers:
            Header:
              metadata:
                name: Location
              _text: "{auth_redirect_uri}?code={auth_code}&state={auth_state}"
          Payload:
            metadata:
              contentType: text/plain
            _text: ""
  - name: AM-RegisterClientFailure
    type: AssignMessage
    content:
      AssignMessage:
        metadata:
          name: AM-RegisterClientFailure
        Set:
          StatusCode: "400"
          ReasonPhrase: Bad Request
          Payload:
            metadata:
              contentType: application/json
            _text: "{\n  \"error\": \"{client_register_error}\",\n  \"error_description\": \"{client_register_error_description}\"\n}\n"
  - name: AM-RegisterClientSuccess
    type: AssignMessage
    content:
      AssignMessage:
        metadata:
          name: AM-RegisterClientSuccess
        Set:
          StatusCode: "201"
          ReasonPhrase: Created
          Payload:
            metadata:
              contentType: application/json
            _text: "{registered_client_payload}"
  - name: AM-RegisterFailure
    type: AssignMessage
    content:
      AssignMessage:
        metadata:
          name: AM-RegisterFailure
        Set:
          StatusCode: "400"
          ReasonPhrase: Bad Request
          Payload:
            metadata:
              contentType: text/html; charset=utf-8
            _text: "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>IDP - Registration Failed</title>\n    <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n    <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n    <link href=\"https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Inter:wght@400;500;600&display=swap\" rel=\"stylesheet\">\n    <style>\n        :root {\n            --primary: #ef4444;\n            --accent: #f59e0b;\n            --bg: #090d16;\n            --card-bg: rgba(17, 25, 40, 0.55);\n            --border: rgba(255, 255, 255, 0.08);\n            --text: #f3f4f6;\n            --text-muted: #9ca3af;\n        }\n        * { box-sizing: border-box; margin: 0; padding: 0; }\n        body {\n            font-family: 'Outfit', sans-serif;\n            background-color: var(--bg);\n            background-image: radial-gradient(at 10% 20%, rgba(239, 68, 68, 0.1) 0px, transparent 50%);\n            color: var(--text);\n            min-height: 100vh;\n            display: flex;\n            justify-content: center;\n            align-items: center;\n        }\n        .card {\n            background: var(--card-bg);\n            backdrop-filter: blur(16px);\n            border: 1px solid var(--border);\n            border-radius: 20px;\n            width: 100%;\n            max-width: 440px;\n            padding: 45px;\n            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.45);\n            text-align: center;\n        }\n        .icon-container {\n            width: 80px;\n            height: 80px;\n            border-radius: 50%;\n            background: rgba(239, 68, 68, 0.15);\n            border: 2px solid var(--primary);\n            display: flex;\n            justify-content: center;\n            align-items: center;\n            margin: 0 auto 25px;\n            color: var(--primary);\n            box-shadow: 0 0 20px rgba(239, 68, 68, 0.3);\n        }\n        .icon-container svg { width: 40px; height: 40px; fill: currentColor; }\n        h1 { font-size: 1.8rem; font-weight: 700; margin-bottom: 12px; }\n        p { color: #fca5a5; font-family: 'Inter', sans-serif; margin-bottom: 30px; line-height: 1.6; font-weight: 500; }\n        .btn {\n            display: inline-block;\n            width: 100%;\n            background: linear-gradient(135deg, var(--primary), var(--accent));\n            border: none;\n            border-radius: 10px;\n            padding: 14px;\n            color: #fff;\n            font-family: 'Outfit', sans-serif;\n            font-size: 1rem;\n            font-weight: 700;\n            text-decoration: none;\n            transition: all 0.3s ease;\n        }\n        .btn:hover {\n            transform: translateY(-2px);\n            filter: brightness(1.15);\n        }\n    </style>\n</head>\n<body>\n    <div class=\"card\">\n        <div style=\"display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:16px;\"><svg width=\"28\" height=\"28\" viewBox=\"0 0 28 28\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" aria-label=\"Apigee Mesh Logo\"><path d=\"M14 3.5L23.5 9V19L14 24.5L4.5 19V9L14 3.5Z\" stroke=\"#cbd5e1\" stroke-width=\"1.4\" stroke-opacity=\"0.75\"/><path d=\"M14 14L14 3.5M14 14L23.5 19M14 14L4.5 19\" stroke=\"#cbd5e1\" stroke-width=\"1.3\" stroke-opacity=\"0.6\"/><circle cx=\"14\" cy=\"3.5\" r=\"1.8\" fill=\"#e2e8f0\"/><circle cx=\"23.5\" cy=\"9\" r=\"1.8\" fill=\"#e2e8f0\"/><circle cx=\"23.5\" cy=\"19\" r=\"1.8\" fill=\"#e2e8f0\"/><circle cx=\"14\" cy=\"24.5\" r=\"1.8\" fill=\"#e2e8f0\"/><circle cx=\"4.5\" cy=\"19\" r=\"1.8\" fill=\"#e2e8f0\"/><circle cx=\"4.5\" cy=\"9\" r=\"1.8\" fill=\"#e2e8f0\"/><circle cx=\"14\" cy=\"14\" r=\"2.4\" fill=\"#f8fafc\"/></svg><span style=\"font-family:'Outfit',sans-serif;font-size:1.35rem;font-weight:700;letter-spacing:-0.02em;color:#f3f4f6;\">Apigee</span></div>\n        <div class=\"icon-container\">\n            <svg viewBox=\"0 0 24 24\"><path d=\"M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z\"/></svg>\n        </div>\n        <h1>Registration Failed</h1>\n        <p>{register_error}</p>\n        <a href=\"/register\" class=\"btn\">Try Again</a>\n    </div>\n</body>\n</html>\n"
  - name: AM-RegisterForm
    type: AssignMessage
    content:
      AssignMessage:
        IgnoreUnresolvedVariables: "true"
        metadata:
          name: AM-RegisterForm
        Set:
          Payload:
            metadata:
              contentType: text/html; charset=utf-8
            _text: "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>IDP - Create Account</title>\n    <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n    <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n    <link href=\"https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Inter:wght@400;500;600&display=swap\" rel=\"stylesheet\">\n    <style>\n        :root {\n            --primary: #6366f1;\n            --primary-glow: rgba(99, 102, 241, 0.45);\n            --accent: #a855f7;\n            --bg: #090d16;\n            --card-bg: rgba(17, 25, 40, 0.55);\n            --border: rgba(255, 255, 255, 0.08);\n            --text: #f3f4f6;\n            --text-muted: #9ca3af;\n        }\n        * {\n            box-sizing: border-box;\n            margin: 0;\n            padding: 0;\n        }\n        body {\n            font-family: 'Outfit', sans-serif;\n            background-color: var(--bg);\n            background-image:\n                radial-gradient(at 10% 20%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),\n                radial-gradient(at 90% 80%, rgba(168, 85, 247, 0.15) 0px, transparent 50%);\n            color: var(--text);\n            min-height: 100vh;\n            display: flex;\n            justify-content: center;\n            align-items: center;\n            overflow: hidden;\n            position: relative;\n        }\n        .glowing-blob {\n            position: absolute;\n            width: 250px;\n            height: 250px;\n            border-radius: 50%;\n            background: var(--primary);\n            filter: blur(120px);\n            z-index: 1;\n            opacity: 0.6;\n            animation: float 10s ease-in-out infinite alternate;\n        }\n        .blob-1 { top: 15%; left: 10%; background: var(--primary); }\n        .blob-2 { bottom: 15%; right: 10%; background: var(--accent); animation-delay: -5s; }\n        @keyframes float {\n            0% { transform: translateY(0px) scale(1); }\n            100% { transform: translateY(30px) scale(1.15); }\n        }\n        .card {\n            background: var(--card-bg);\n            backdrop-filter: blur(16px);\n            -webkit-backdrop-filter: blur(16px);\n            border: 1px solid var(--border);\n            border-radius: 20px;\n            width: 100%;\n            max-width: 440px;\n            padding: 40px;\n            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.45);\n            z-index: 10;\n            position: relative;\n            animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);\n        }\n        @keyframes fadeIn {\n            from { opacity: 0; transform: translateY(20px); }\n            to { opacity: 1; transform: translateY(0); }\n        }\n        .header {\n            text-align: center;\n            margin-bottom: 30px;\n        }\n        .header h1 {\n            font-size: 2rem;\n            font-weight: 700;\n            background: linear-gradient(135deg, #fff 30%, #a5b4fc 100%);\n            -webkit-background-clip: text;\n            -webkit-text-fill-color: transparent;\n            margin-bottom: 8px;\n        }\n        .header p {\n            color: var(--text-muted);\n            font-size: 0.95rem;\n            font-family: 'Inter', sans-serif;\n        }\n        .form-group {\n            margin-bottom: 20px;\n            position: relative;\n        }\n        .form-group label {\n            display: block;\n            margin-bottom: 8px;\n            color: var(--text);\n            font-size: 0.9rem;\n            font-weight: 600;\n            letter-spacing: 0.05em;\n            text-transform: uppercase;\n        }\n        .form-input {\n            width: 100%;\n            background: rgba(13, 20, 35, 0.6);\n            border: 1px solid var(--border);\n            border-radius: 10px;\n            padding: 12px 16px;\n            color: var(--text);\n            font-family: 'Inter', sans-serif;\n            font-size: 0.95rem;\n            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);\n        }\n        .form-input:focus {\n            outline: none;\n            border-color: var(--primary);\n            box-shadow: 0 0 14px var(--primary-glow);\n            background: rgba(13, 20, 35, 0.85);\n        }\n        .btn {\n            width: 100%;\n            background: linear-gradient(135deg, var(--primary), var(--accent));\n            border: none;\n            border-radius: 10px;\n            padding: 14px;\n            color: #fff;\n            font-family: 'Outfit', sans-serif;\n            font-size: 1rem;\n            font-weight: 700;\n            cursor: pointer;\n            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);\n            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);\n            margin-top: 10px;\n        }\n        .btn:hover {\n            transform: translateY(-2px);\n            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.5);\n            filter: brightness(1.1);\n        }\n        .btn:active {\n            transform: translateY(0);\n        }\n        .footer-links {\n            margin-top: 25px;\n            text-align: center;\n            font-size: 0.9rem;\n            color: var(--text-muted);\n            font-family: 'Inter', sans-serif;\n        }\n        .footer-links a {\n            color: var(--primary);\n            text-decoration: none;\n            font-weight: 600;\n            transition: color 0.2s ease;\n        }\n        .footer-links a:hover {\n            color: #818cf8;\n            text-decoration: underline;\n        }\n        .error-alert {\n            background: rgba(239, 68, 68, 0.15);\n            border: 1px solid rgba(239, 68, 68, 0.3);\n            border-radius: 10px;\n            padding: 12px 16px;\n            color: #fca5a5;\n            font-size: 0.9rem;\n            margin-bottom: 20px;\n            font-family: 'Inter', sans-serif;\n            display: none;\n        }\n    </style>\n</head>\n<body>\n    <div class=\"glowing-blob blob-1\"></div>\n    <div class=\"glowing-blob blob-2\"></div>\n\n    <div class=\"card\">\n        <div class=\"header\">\n            <div style=\"display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:16px;\"><svg width=\"28\" height=\"28\" viewBox=\"0 0 28 28\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" aria-label=\"Apigee Mesh Logo\"><path d=\"M14 3.5L23.5 9V19L14 24.5L4.5 19V9L14 3.5Z\" stroke=\"#cbd5e1\" stroke-width=\"1.4\" stroke-opacity=\"0.75\"/><path d=\"M14 14L14 3.5M14 14L23.5 19M14 14L4.5 19\" stroke=\"#cbd5e1\" stroke-width=\"1.3\" stroke-opacity=\"0.6\"/><circle cx=\"14\" cy=\"3.5\" r=\"1.8\" fill=\"#e2e8f0\"/><circle cx=\"23.5\" cy=\"9\" r=\"1.8\" fill=\"#e2e8f0\"/><circle cx=\"23.5\" cy=\"19\" r=\"1.8\" fill=\"#e2e8f0\"/><circle cx=\"14\" cy=\"24.5\" r=\"1.8\" fill=\"#e2e8f0\"/><circle cx=\"4.5\" cy=\"19\" r=\"1.8\" fill=\"#e2e8f0\"/><circle cx=\"4.5\" cy=\"9\" r=\"1.8\" fill=\"#e2e8f0\"/><circle cx=\"14\" cy=\"14\" r=\"2.4\" fill=\"#f8fafc\"/></svg><span style=\"font-family:'Outfit',sans-serif;font-size:1.35rem;font-weight:700;letter-spacing:-0.02em;color:#f3f4f6;\">Apigee</span></div>\n            <h1>Create Account</h1>\n            <p>Sign up to Apigee Identity Provider</p>\n        </div>\n\n        <div id=\"errorBox\" class=\"error-alert\"></div>\n\n        <form action=\"/register\" method=\"POST\" id=\"registerForm\">\n            <!-- Pass OIDC params forward to register POST request -->\n            <input type=\"hidden\" name=\"client_id\" value=\"{request.queryparam.client_id}\">\n            <input type=\"hidden\" name=\"redirect_uri\" value=\"{request.queryparam.redirect_uri}\">\n            <input type=\"hidden\" name=\"response_type\" value=\"{request.queryparam.response_type}\">\n            <input type=\"hidden\" name=\"scope\" value=\"{request.queryparam.scope}\">\n            <input type=\"hidden\" name=\"state\" value=\"{request.queryparam.state}\">\n            <input type=\"hidden\" name=\"code_challenge\" value=\"{request.queryparam.code_challenge}\">\n            <input type=\"hidden\" name=\"code_challenge_method\" value=\"{request.queryparam.code_challenge_method}\">\n            <div class=\"form-group\">\n                <label for=\"name\">Full Name</label>\n                <input type=\"text\" id=\"name\" name=\"name\" class=\"form-input\" required autocomplete=\"name\">\n            </div>\n\n            <div class=\"form-group\">\n                <label for=\"email\">Email Address</label>\n                <input type=\"email\" id=\"email\" name=\"email\" class=\"form-input\" required autocomplete=\"email\">\n            </div>\n\n            <div class=\"form-group\">\n                <label for=\"username\">Username</label>\n                <input type=\"text\" id=\"username\" name=\"username\" class=\"form-input\" required autocomplete=\"username\">\n            </div>\n\n            <div class=\"form-group\">\n                <label for=\"password\">Password</label>\n                <input type=\"password\" id=\"password\" name=\"password\" class=\"form-input\" required autocomplete=\"new-password\">\n            </div>\n\n            <button type=\"submit\" class=\"btn\">Register</button>\n        </form>\n\n        <div class=\"footer-links\">\n            Already have an account? <a href=\"javascript:history.back()\">Login here</a>\n        </div>\n    </div>\n</body>\n</html>\n"
  - name: AM-RegisterSuccess
    type: AssignMessage
    content:
      AssignMessage:
        IgnoreUnresolvedVariables: "true"
        metadata:
          name: AM-RegisterSuccess
        Set:
          Payload:
            metadata:
              contentType: text/html; charset=utf-8
            _text: "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>IDP - Registration Successful</title>\n    <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n    <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n    <link href=\"https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Inter:wght@400;500;600&display=swap\" rel=\"stylesheet\">\n    <style>\n        :root {\n            --primary: #10b981;\n            --accent: #6366f1;\n            --bg: #090d16;\n            --card-bg: rgba(17, 25, 40, 0.55);\n            --border: rgba(255, 255, 255, 0.08);\n            --text: #f3f4f6;\n            --text-muted: #9ca3af;\n        }\n        * { box-sizing: border-box; margin: 0; padding: 0; }\n        body {\n            font-family: 'Outfit', sans-serif;\n            background-color: var(--bg);\n            background-image: radial-gradient(at 10% 20%, rgba(16, 185, 129, 0.1) 0px, transparent 50%);\n            color: var(--text);\n            min-height: 100vh;\n            display: flex;\n            justify-content: center;\n            align-items: center;\n            overflow: hidden;\n        }\n        .card {\n            background: var(--card-bg);\n            backdrop-filter: blur(16px);\n            border: 1px solid var(--border);\n            border-radius: 20px;\n            width: 100%;\n            max-width: 440px;\n            padding: 45px;\n            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.45);\n            text-align: center;\n            animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);\n        }\n        @keyframes fadeIn {\n            from { opacity: 0; transform: translateY(20px); }\n            to { opacity: 1; transform: translateY(0); }\n        }\n        .icon-container {\n            width: 80px;\n            height: 80px;\n            border-radius: 50%;\n            background: rgba(16, 185, 129, 0.15);\n            border: 2px solid var(--primary);\n            display: flex;\n            justify-content: center;\n            align-items: center;\n            margin: 0 auto 25px;\n            color: var(--primary);\n            box-shadow: 0 0 20px rgba(16, 185, 129, 0.3);\n        }\n        .icon-container svg { width: 40px; height: 40px; fill: currentColor; }\n        h1 { font-size: 1.8rem; font-weight: 700; margin-bottom: 12px; }\n        p { color: var(--text-muted); font-family: 'Inter', sans-serif; margin-bottom: 30px; line-height: 1.6; }\n        .btn {\n            display: inline-block;\n            width: 100%;\n            background: linear-gradient(135deg, var(--primary), var(--accent));\n            border: none;\n            border-radius: 10px;\n            padding: 14px;\n            color: #fff;\n            font-family: 'Outfit', sans-serif;\n            font-size: 1rem;\n            font-weight: 700;\n            text-decoration: none;\n            transition: all 0.3s ease;\n            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.2);\n        }\n        .btn:hover {\n            transform: translateY(-2px);\n            box-shadow: 0 8px 25px rgba(16, 185, 129, 0.4);\n            filter: brightness(1.15);\n        }\n    </style>\n</head>\n<body>\n    <div class=\"card\">\n        <div style=\"display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:16px;\"><svg width=\"28\" height=\"28\" viewBox=\"0 0 28 28\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" aria-label=\"Apigee Mesh Logo\"><path d=\"M14 3.5L23.5 9V19L14 24.5L4.5 19V9L14 3.5Z\" stroke=\"#cbd5e1\" stroke-width=\"1.4\" stroke-opacity=\"0.75\"/><path d=\"M14 14L14 3.5M14 14L23.5 19M14 14L4.5 19\" stroke=\"#cbd5e1\" stroke-width=\"1.3\" stroke-opacity=\"0.6\"/><circle cx=\"14\" cy=\"3.5\" r=\"1.8\" fill=\"#e2e8f0\"/><circle cx=\"23.5\" cy=\"9\" r=\"1.8\" fill=\"#e2e8f0\"/><circle cx=\"23.5\" cy=\"19\" r=\"1.8\" fill=\"#e2e8f0\"/><circle cx=\"14\" cy=\"24.5\" r=\"1.8\" fill=\"#e2e8f0\"/><circle cx=\"4.5\" cy=\"19\" r=\"1.8\" fill=\"#e2e8f0\"/><circle cx=\"4.5\" cy=\"9\" r=\"1.8\" fill=\"#e2e8f0\"/><circle cx=\"14\" cy=\"14\" r=\"2.4\" fill=\"#f8fafc\"/></svg><span style=\"font-family:'Outfit',sans-serif;font-size:1.35rem;font-weight:700;letter-spacing:-0.02em;color:#f3f4f6;\">Apigee</span></div>\n        <div class=\"icon-container\">\n            <svg viewBox=\"0 0 24 24\"><path d=\"M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z\"/></svg>\n        </div>\n        <h1>Registration Success!</h1>\n        <p>Your user profile has been successfully saved to our secure Apigee KVM Identity Store. You can now use your credentials to log in.</p>\n        <a id=\"login-link\" href=\"/authorize\" class=\"btn\">Proceed to Login</a>\n        <script>\n            const params = new URLSearchParams();\n            const clientId = \"{auth_client_id}\";\n            if (clientId && clientId.indexOf(\"{\") !== 0) {\n                params.append(\"client_id\", clientId);\n                params.append(\"redirect_uri\", \"{auth_redirect_uri}\");\n                params.append(\"response_type\", \"{auth_response_type}\");\n                params.append(\"scope\", \"{auth_scope}\");\n                params.append(\"state\", \"{auth_state}\");\n                params.append(\"code_challenge\", \"{auth_code_challenge}\");\n                params.append(\"code_challenge_method\", \"{auth_code_challenge_method}\");\n                document.getElementById(\"login-link\").href = \"/authorize?\" + params.toString();\n            } else {\n                document.getElementById(\"login-link\").href = \"/\";\n            }\n        </script>\n    </div>\n</body>\n</html>\n"
  - name: AM-SetAuthServer
    type: AssignMessage
