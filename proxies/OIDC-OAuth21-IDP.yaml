  - name: JS-BuildAiCatalog
    type: Javascript
    content:
      Javascript:
        metadata:
          continueOnError: "false"
          enabled: "true"
          timeLimit: "200"
          name: JS-BuildAiCatalog
        DisplayName: JS-BuildAiCatalog
        Properties: {}
        Source: "try {\n  var scheme = context.getVariable(\"client.scheme\") || \"https\";\n  var host = context.getVariable(\"request.header.host\") || \"localhost\";\n  var baseUrl = scheme + \"://\" + host;\n\n  var apisRaw = context.getVariable(\"response.content\");\n  var entries = [];\n\n  if (apisRaw) {\n    var apisData = JSON.parse(apisRaw);\n    if (apisData && Array.isArray(apisData.apis)) {\n      for (var i = 0; i < apisData.apis.length; i++) {\n        var api = apisData.apis[i];\n        if (!api) continue;\n\n        var id = api.name ? api.name.split(\"/\").pop() : \"\";\n        var displayName = api.displayName || id;\n        \n        // Determine style (REST or MCP)\n        var displayStyle = \"REST\";\n        var systemStyleObj = api.apiStyle || api.api_style;\n        if (\n          systemStyleObj &&\n          systemStyleObj.enumValues &&\n          systemStyleObj.enumValues.values &&\n          systemStyleObj.enumValues.values[0]\n        ) {\n          displayStyle = systemStyleObj.enumValues.values[0].displayName || systemStyleObj.enumValues.values[0].id || displayStyle;\n        }\n\n        // Determine IANA media type\n        var type = \"application/openapi+json\";\n        if (displayStyle === \"MCP\" || displayStyle === \"mcp-api\") {\n          type = \"application/mcp+json\";\n        }\n\n        // Extract description\n        var description = api.description || displayName || \"\";\n\n        // Build representative queries based on name / tags / description\n        var representativeQueries = [];\n        if (displayStyle === \"MCP\" || id.indexOf(\"Billing\") !== -1 || displayName.indexOf(\"Billing\") !== -1) {\n          representativeQueries = [\n            \"Query my billing history or invoices\",\n            \"Submit an invoice dispute case or billing contest request\",\n            \"Retrieve detailed invoice amounts and line-items\"\n          ];\n        } else {\n          representativeQueries = [\n            \"What developer portals are available\",\n            \"Get details for a specific API product\"\n          ];\n        }\n\n        // Extract tags\n        var tags = [];\n        if (api.attributes) {\n          var keys = Object.keys(api.attributes);\n          for (var k = 0; k < keys.length; k++) {\n            var key = keys[k];\n            var attr = api.attributes[key];\n            if (key.slice(-5) === \"/tags\") {\n              tags = (attr && attr.stringValues && attr.stringValues.values) || [];\n            }\n          }\n        }\n        if (tags.length === 0) {\n          tags = [displayStyle.toLowerCase(), \"api-hub\"];\n        }\n\n        // The product details URL of the portal represents the spec/schema entry endpoint\n        var specUrl = baseUrl + \"/api/portals/default/products/\" + id;\n\n        entries.push({\n          id: id,\n          displayName: displayName,\n          description: description,\n          type: type,\n          url: specUrl,\n          representativeQueries: representativeQueries,\n          tags: tags\n        });\n      }\n    }\n  }\n\n  // Root ARD ai-catalog.json manifest\n  var catalog = {\n    specVersion: \"1.0\",\n    host: {\n      displayName: \"Apigee Developer Portal Identity Provider & Agent Service Catalog\",\n      identifier: baseUrl,\n      documentationUrl: baseUrl + \"/docs\"\n    },\n    entries: entries\n  };\n\n  context.setVariable(\"response.content\", JSON.stringify(catalog));\n  context.setVariable(\"response.header.Content-Type\", \"application/json\");\n  context.setVariable(\"response.status.code\", 200);\n\n} catch(e) {\n  // Graceful fallback if anything goes wrong\n  var defaultCatalog = {\n    specVersion: \"1.0\",\n    host: {\n      displayName: \"Apigee Identity Provider Catalog\",\n      identifier: \"https://localhost:8080\"\n    },\n    entries: []\n  };\n  context.setVariable(\"response.content\", JSON.stringify(defaultCatalog));\n  context.setVariable(\"response.header.Content-Type\", \"application/json\");\n}\n"
  - name: JS-PrepareGoogleAuth
    type: Javascript
    content:
      Javascript:
        metadata:
          name: JS-PrepareGoogleAuth
        DisplayName: JS-PrepareGoogleAuth
        Properties: {}
        Source: |
          var authorizeValid = context.getVariable("authorize_valid");
          var googleClientId = context.getVariable("propertyset.oidc.GOOGLE_CLIENT_ID") || "";
          if (authorizeValid === "true" && googleClientId && googleClientId.indexOf("{") !== 0) {
            var chars = "0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ";
            var gState = "gstate_";
            for (var i = 0; i < 24; i++) {
              gState += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            var scheme = context.getVariable("client.scheme") || "https";
            var host = context.getVariable("request.header.host");
            var googleRedirectUri = scheme + "://" + host + "/callback/google";
            var stateData = {
              client_id: context.getVariable("auth_client_id"),
              redirect_uri: context.getVariable("auth_redirect_uri"),
              response_type: context.getVariable("auth_response_type"),
              scope: context.getVariable("auth_scope"),
              state: context.getVariable("auth_state"),
              code_challenge: context.getVariable("auth_code_challenge"),
              code_challenge_method: context.getVariable("auth_code_challenge_method")
            };
            var url = "https://accounts.google.com/o/oauth2/v2/auth" +
              "?client_id=" + encodeURIComponent(googleClientId) +
              "&redirect_uri=" + encodeURIComponent(googleRedirectUri) +
              "&response_type=code" +
              "&scope=" + encodeURIComponent("openid email profile") +
              "&state=" + encodeURIComponent(gState) +
              "&prompt=select_account";
            context.setVariable("google_state", gState);
            context.setVariable("google_state_data", JSON.stringify(stateData));
            context.setVariable("google_authorize_url", url);
            context.setVariable("google_auth_ready", "true");
          } else {
            context.setVariable("google_auth_ready", "false");
            if (!googleClientId || googleClientId.indexOf("{") === 0) {
              context.setVariable("auth_error_message", "Google Sign-In is not configured on this server.");
            }
          }
