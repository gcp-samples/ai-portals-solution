  - name: JS-ExtractGoogleCallback
    type: Javascript
    content:
      Javascript:
        metadata:
          name: JS-ExtractGoogleCallback
        DisplayName: JS-ExtractGoogleCallback
        Properties: {}
        Source: |
          var code = context.getVariable("request.queryparam.code") || "";
          var state = context.getVariable("request.queryparam.state") || "";
          var err = context.getVariable("request.queryparam.error") || "";
          context.setVariable("google_code", code);
          context.setVariable("google_state", state);
          context.setVariable("auth_success", "false");
          if (err) {
            context.setVariable("google_callback_ok", "false");
            context.setVariable("google_auth_error", "Google authentication error: " + err);
          } else if (!code || !state) {
            context.setVariable("google_callback_ok", "false");
            context.setVariable("google_auth_error", "Missing code or state from Google callback.");
          } else {
            context.setVariable("google_callback_ok", "true");
          }
