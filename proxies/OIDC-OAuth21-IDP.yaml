  - name: JS-ExtractCredentials
    type: Javascript
    content:
      Javascript:
        metadata:
          name: JS-ExtractCredentials
        DisplayName: JS-ExtractCredentials
        Properties: {}
        Source: "var username = context.getVariable(\"request.formparam.username\") || \"\";\nusername = username.trim().toLowerCase();\ncontext.setVariable(\"login_username\", username);\ncontext.setVariable(\"user_key\", \"user:\" + username);\n\n// Extract original OIDC & OAuth 2.1 parameters\ncontext.setVariable(\"auth_client_id\", context.getVariable(\"request.formparam.client_id\"));\ncontext.setVariable(\"auth_redirect_uri\", context.getVariable(\"request.formparam.redirect_uri\"));\ncontext.setVariable(\"auth_response_type\", context.getVariable(\"request.formparam.response_type\"));\ncontext.setVariable(\"auth_scope\", context.getVariable(\"request.formparam.scope\"));\ncontext.setVariable(\"auth_state\", context.getVariable(\"request.formparam.state\"));\ncontext.setVariable(\"auth_code_challenge\", context.getVariable(\"request.formparam.code_challenge\"));\ncontext.setVariable(\"auth_code_challenge_method\", context.getVariable(\"request.formparam.code_challenge_method\"));\n"
  - name: JS-ExtractTokenParams
    type: Javascript
    content:
      Javascript:
        metadata:
          name: JS-ExtractTokenParams
        DisplayName: JS-ExtractTokenParams
        Properties: {}
        Source: |
          var grantType = (context.getVariable("request.formparam.grant_type") || "").trim();
          var code = (context.getVariable("request.formparam.code") || "").trim();
          var redirectUri = (context.getVariable("request.formparam.redirect_uri") || "").trim();
          var clientId = (context.getVariable("request.formparam.client_id") || "").trim();
          var clientSecret = (context.getVariable("request.formparam.client_secret") || "").trim();
          var scope = (context.getVariable("request.formparam.scope") || "").trim();
          var codeVerifier = (context.getVariable("request.formparam.code_verifier") || "").trim();
          var refreshToken = (context.getVariable("request.formparam.refresh_token") || "").trim();

          context.setVariable("token_grant_type", grantType);
          context.setVariable("token_code", code);
          context.setVariable("token_redirect_uri", redirectUri);
          context.setVariable("token_client_id", clientId);
          context.setVariable("token_client_secret", clientSecret);
          context.setVariable("token_requested_scope", scope);
          context.setVariable("token_code_verifier", codeVerifier);
          context.setVariable("token_refresh_token", refreshToken);

          if (grantType === "authorization_code") {
            context.setVariable("auth_code", code);
          } else if (grantType === "refresh_token") {
            context.setVariable("refresh_token", refreshToken);
          } else if (grantType === "client_credentials") {
            context.setVariable("client_key", "client:" + clientId);
          }
  - name: JS-OidcConfig
    type: Javascript
