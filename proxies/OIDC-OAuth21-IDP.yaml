      AssignMessage:
        metadata:
          continueOnError: "false"
          enabled: "true"
          name: AM-SetAuthServer
        DisplayName: AM-SetAuthServer
        Properties: {}
        Set:
          Payload:
            metadata:
              contentType: application/json
            _text: |
              {
                "issuer": "{client.scheme}://{request.header.host}",
                "authorization_endpoint": "{client.scheme}://{request.header.host}/authorize",
                "token_endpoint": "{client.scheme}://{request.header.host}/token",
                "registration_endpoint": "{client.scheme}://{request.header.host}/register-client",
                "scopes_supported": ["openid", "profile", "email", "mcp"],
                "response_types_supported": ["code"],
                "grant_types_supported": ["authorization_code", "refresh_token"],
                "code_challenge_methods_supported": ["S256"]
              }
        IgnoreUnresolvedVariables: "true"
        AssignTo:
          metadata:
            createNew: "false"
            transport: http
            type: response
