          Properties: {}
          URL: https://openidconnect.googleapis.com/v1/userinfo
  - name: JS-ProcessGoogleUser
    type: Javascript
    content:
      Javascript:
        metadata:
          name: JS-ProcessGoogleUser
        DisplayName: JS-ProcessGoogleUser
        Properties: {}
        Source: |
          var userRaw = context.getVariable("googleUserInfoResponse.content");
          var stateRaw = context.getVariable("google_state_data");
          try {
            var userInfo = JSON.parse(userRaw);
            var stateData = JSON.parse(stateRaw);
            if (!userInfo || !userInfo.email) {
              context.setVariable("auth_success", "false");
              context.setVariable("google_auth_error", "Google user profile did not include an email address.");
            } else {
              var email = userInfo.email;
              var fullName = userInfo.name || email.split("@")[0];
              var firstName = userInfo.given_name || fullName.split(" ")[0] || "Developer";
              var lastName = userInfo.family_name || (fullName.indexOf(" ") > -1 ? fullName.split(" ").slice(1).join(" ") : "User");

              context.setVariable("register_email", email);
              context.setVariable("register_firstName", firstName);
              context.setVariable("register_lastName", lastName);
              context.setVariable("register_username", email);

              var chars = "0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ";
              var authCode = "code_";
              for (var i = 0; i < 24; i++) {
                authCode += chars.charAt(Math.floor(Math.random() * chars.length));
              }
              context.setVariable("auth_code", authCode);
              context.setVariable("auth_redirect_uri", stateData.redirect_uri);
              context.setVariable("auth_state", stateData.state || "");

              var codeData = {
                username: email,
                email: email,
                name: fullName,
                client_id: stateData.client_id,
                redirect_uri: stateData.redirect_uri,
                scope: stateData.scope,
                code_challenge: stateData.code_challenge,
                code_challenge_method: stateData.code_challenge_method
              };
              context.setVariable("auth_code_data", JSON.stringify(codeData));
              context.setVariable("auth_success", "true");
            }
          } catch (e) {
            context.setVariable("auth_success", "false");
            context.setVariable("google_auth_error", "Failed to process Google user profile.");
          }
  - name: AM-GoogleAuthError
    type: AssignMessage
    content:
      AssignMessage:
        metadata:
          name: AM-GoogleAuthError
        Set:
          StatusCode: "400"
          ReasonPhrase: Bad Request
          Payload:
            metadata:
              contentType: application/json
            _text: '{"error": "google_auth_failed", "error_description": "{google_auth_error}"}'
