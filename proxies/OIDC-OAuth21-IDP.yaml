  - name: JS-PrepareGoogleTokenRequest
    type: Javascript
    content:
      Javascript:
        metadata:
          name: JS-PrepareGoogleTokenRequest
        DisplayName: JS-PrepareGoogleTokenRequest
        Properties: {}
        Source: |
          var stateRaw = context.getVariable("google_state_data");
          var googleClientId = context.getVariable("propertyset.oidc.GOOGLE_CLIENT_ID") || "";
          var googleClientSecret = context.getVariable("propertyset.oidc.GOOGLE_CLIENT_SECRET") || "";
          var code = context.getVariable("google_code") || "";
          if (!stateRaw) {
            context.setVariable("google_callback_ok", "false");
            context.setVariable("google_auth_error", "Invalid or expired Google login state.");
          } else if (!googleClientId || !googleClientSecret) {
            context.setVariable("google_callback_ok", "false");
            context.setVariable("google_auth_error", "Google OAuth client credentials are not configured.");
          } else {
            var scheme = context.getVariable("client.scheme") || "https";
            var host = context.getVariable("request.header.host");
            var googleRedirectUri = scheme + "://" + host + "/callback/google";
            var body = "code=" + encodeURIComponent(code) +
              "&client_id=" + encodeURIComponent(googleClientId) +
              "&client_secret=" + encodeURIComponent(googleClientSecret) +
              "&redirect_uri=" + encodeURIComponent(googleRedirectUri) +
              "&grant_type=authorization_code";
            context.setVariable("google_token_body", body);
          }
  - name: SC-GoogleTokenExchange
    type: ServiceCallout
    content:
      ServiceCallout:
        metadata:
          continueOnError: "true"
          enabled: "true"
          name: SC-GoogleTokenExchange
        DisplayName: SC-GoogleTokenExchange
        Properties: {}
        Request:
          metadata:
            clearPayload: "true"
            variable: googleTokenRequest
          IgnoreUnresolvedVariables: "false"
          Set:
            Verb: POST
            Headers:
              Header:
                metadata:
                  name: Content-Type
                _text: application/x-www-form-urlencoded
            Payload:
              metadata:
                contentType: application/x-www-form-urlencoded
              _text: "{google_token_body}"
        Response: googleTokenResponse
        HTTPTargetConnection:
          Properties: {}
          URL: https://oauth2.googleapis.com/token
  - name: JS-ExtractGoogleAccessToken
    type: Javascript
    content:
      Javascript:
        metadata:
          name: JS-ExtractGoogleAccessToken
        DisplayName: JS-ExtractGoogleAccessToken
        Properties: {}
        Source: |
          var raw = context.getVariable("googleTokenResponse.content");
          try {
            var data = JSON.parse(raw);
            if (data && data.access_token) {
              context.setVariable("google_access_token", data.access_token);
            } else {
              context.setVariable("google_callback_ok", "false");
              context.setVariable("google_auth_error", (data && (data.error_description || data.error)) || "Failed to exchange Google authorization code.");
            }
          } catch (e) {
            context.setVariable("google_callback_ok", "false");
            context.setVariable("google_auth_error", "Invalid response from Google token endpoint.");
          }
  - name: SC-GoogleUserInfo
    type: ServiceCallout
    content:
      ServiceCallout:
        metadata:
          continueOnError: "true"
          enabled: "true"
          name: SC-GoogleUserInfo
        DisplayName: SC-GoogleUserInfo
        Properties: {}
        Request:
