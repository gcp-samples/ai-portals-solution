      Javascript:
        metadata:
          name: JS-OidcConfig
        DisplayName: JS-OidcConfig
        Properties: {}
        Source: "var host = context.getVariable(\"request.header.host\");\nvar proto = context.getVariable(\"client.scheme\") || \"https\";\nvar baseUrl = proto + \"://\" + host;\n\nvar config = {\n  \"issuer\": baseUrl,\n  \"authorization_endpoint\": baseUrl + \"/authorize\",\n  \"token_endpoint\": baseUrl + \"/token\",\n  \"userinfo_endpoint\": baseUrl + \"/userinfo\",\n  \"jwks_uri\": baseUrl + \"/jwks.json\",\n  \"registration_endpoint\": baseUrl + \"/register-client\",\n  \"scopes_supported\": [\"openid\", \"profile\", \"email\"],\n  \"response_types_supported\": [\"code\"],\n  \"grant_types_supported\": [\"authorization_code\", \"refresh_token\"],\n  \"subject_types_supported\": [\"public\"],\n  \"id_token_signing_alg_values_supported\": [\"RS256\"],\n  \"code_challenge_methods_supported\": [\"S256\", \"plain\"]\n};\n\ncontext.setVariable(\"response.content\", JSON.stringify(config, null, 2));\ncontext.setVariable(\"response.header.content-type\", \"application/json\");\n"
  - name: JS-ProcessRegister
    type: Javascript
    content:
      Javascript:
        metadata:
          name: JS-ProcessRegister
        DisplayName: JS-ProcessRegister
        Properties: {}
        Source: "var body = context.getVariable(\"request.content\") || \"\";\nvar contentType = context.getVariable(\"request.header.Content-Type\") || \"\";\n\nvar username, password, email, name;\n\nif (contentType.indexOf(\"application/json\") > -1) {\n  try {\n    var json = JSON.parse(body);\n    username = json.username;\n    password = json.password;\n    email = json.email;\n    name = json.name;\n  } catch (e) {\n    context.setVariable(\"register_error\", \"Malformed JSON payload\");\n  }\n} else {\n  // Retrieve from formparams (form-urlencoded)\n  username = context.getVariable(\"request.formparam.username\");\n  password = context.getVariable(\"request.formparam.password\");\n  email = context.getVariable(\"request.formparam.email\");\n  name = context.getVariable(\"request.formparam.name\");\n}\n\nif (!username || !password || !email || !name) {\n  context.setVariable(\"register_error\", \"All fields are required (name, email, username, password)\");\n  context.setVariable(\"register_success\", \"false\");\n} else {\n  username = username.trim().toLowerCase();\n\n  // Clean pure JS SHA-256 implementation\n  function sha256(ascii) {\n      function rotateRight(n, x) {\n          return (n >>> x) | (n << (32 - x));\n      }\n\n      var h0 = 0x6a09e667, h1 = 0xbb67ae85, h2 = 0x3c6ef372, h3 = 0xa54ff53a;\n      var h4 = 0x510e527f, h5 = 0x9b05688c, h6 = 0x1f83d9ab, h7 = 0x5be0cd19;\n\n      var k = [\n          0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5,\n          0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174,\n          0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da,\n          0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967,\n          0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85,\n          0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070,\n          0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3,\n          0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2\n      ];\n\n      var msgBytes = [];\n      for (var i = 0; i < ascii.length; i++) {\n          msgBytes.push(ascii.charCodeAt(i) & 0xFF);\n      }\n\n      var msgLenBits = msgBytes.length * 8;\n      msgBytes.push(0x80);\n      while ((msgBytes.length + 8) % 64 !== 0) {\n          msgBytes.push(0x00);\n      }\n\n      msgBytes.push(0x00);\n      msgBytes.push(0x00);\n      msgBytes.push(0x00);\n      msgBytes.push(0x00);\n      msgBytes.push((msgLenBits >>> 24) & 0xFF);\n      msgBytes.push((msgLenBits >>> 16) & 0xFF);\n      msgBytes.push((msgLenBits >>> 8) & 0xFF);\n      msgBytes.push(msgLenBits & 0xFF);\n\n      for (var chunkStart = 0; chunkStart < msgBytes.length; chunkStart += 64) {\n          var w = new Array(64);\n          for (var i = 0; i < 16; i++) {\n              w[i] = (msgBytes[chunkStart + i * 4] << 24) |\n                     (msgBytes[chunkStart + i * 4 + 1] << 16) |\n                     (msgBytes[chunkStart + i * 4 + 2] << 8) |\n                     msgBytes[chunkStart + i * 4 + 3];\n          }\n\n          for (var i = 16; i < 64; i++) {\n              var s0 = rotateRight(w[i - 15], 7) ^ rotateRight(w[i - 15], 18) ^ (w[i - 15] >>> 3);\n              var s1 = rotateRight(w[i - 2], 17) ^ rotateRight(w[i - 2], 19) ^ (w[i - 2] >>> 10);\n              w[i] = (w[i - 16] + s0 + w[i - 7] + s1) | 0;\n          }\n\n          var a = h0, b = h1, c = h2, d = h3, e = h4, f = h5, g = h6, h = h7;\n\n          for (var i = 0; i < 64; i++) {\n              var s1_e = rotateRight(e, 6) ^ rotateRight(e, 11) ^ rotateRight(e, 25);\n              var ch = (e & f) ^ (~e & g);\n              var temp1 = (h + s1_e + ch + k[i] + w[i]) | 0;\n              var s0_a = rotateRight(a, 2) ^ rotateRight(a, 13) ^ rotateRight(a, 22);\n              var maj = (a & b) ^ (a & c) ^ (b & c);\n              var temp2 = (s0_a + maj) | 0;\n\n              h = g;\n              g = f;\n              f = e;\n              e = (d + temp1) | 0;\n              d = c;\n              c = b;\n              b = a;\n              a = (temp1 + temp2) | 0;\n          }\n\n          h0 = (h0 + a) | 0;\n          h1 = (h1 + b) | 0;\n          h2 = (h2 + c) | 0;\n          h3 = (h3 + d) | 0;\n          h4 = (h4 + e) | 0;\n          h5 = (h5 + f) | 0;\n          h6 = (h6 + g) | 0;\n          h7 = (h7 + h) | 0;\n      }\n\n      var bytes = [];\n      var words = [h0, h1, h2, h3, h4, h5, h6, h7];\n      for (var i = 0; i < 8; i++) {\n          bytes.push((words[i] >>> 24) & 0xFF);\n          bytes.push((words[i] >>> 16) & 0xFF);\n          bytes.push((words[i] >>> 8) & 0xFF);\n          bytes.push(words[i] & 0xFF);\n      }\n\n      var hex = \"\";\n      for (var i = 0; i < bytes.length; i++) {\n          var h = bytes[i].toString(16);\n          if (h.length < 2) h = \"0\" + h;\n          hex += h;\n      }\n      return hex;\n  }\n\n  var salt = \"Apigee-IDP-Salt-\";\n  var hashedPassword = sha256(salt + username + \":\" + password);\n\n  var userRecord = {\n    username: username,\n    password: hashedPassword,\n    email: email.trim(),\n    name: name.trim()\n  };\n\n  var nameParts = name.trim().split(/\\s+/);\n  var firstName = nameParts[0] || \"\";\n  var lastName = nameParts.slice(1).join(\" \") || \"Developer\";\n\n  context.setVariable(\"register_email\", email.trim().toLowerCase());\n  context.setVariable(\"register_username\", username);\n  context.setVariable(\"register_firstName\", firstName);\n  context.setVariable(\"register_lastName\", lastName);\n\n  context.setVariable(\"user_key\", \"user:\" + username);\n  context.setVariable(\"user_email_key\", \"user:\" + email.trim().toLowerCase());\n  context.setVariable(\"user_json_payload\", JSON.stringify(userRecord));\n  context.setVariable(\"register_success\", \"true\");\n  context.setVariable(\"registered_username\", username);\n\n  // Extract hidden OIDC params forward to flow context\n  context.setVariable(\"auth_client_id\", context.getVariable(\"request.formparam.client_id\") || \"\");\n  context.setVariable(\"auth_redirect_uri\", context.getVariable(\"request.formparam.redirect_uri\") || \"\");\n  context.setVariable(\"auth_response_type\", context.getVariable(\"request.formparam.response_type\") || \"\");\n  context.setVariable(\"auth_scope\", context.getVariable(\"request.formparam.scope\") || \"\");\n  context.setVariable(\"auth_state\", context.getVariable(\"request.formparam.state\") || \"\");\n  context.setVariable(\"auth_code_challenge\", context.getVariable(\"request.formparam.code_challenge\") || \"\");\n  context.setVariable(\"auth_code_challenge_method\", context.getVariable(\"request.formparam.code_challenge_method\") || \"\");\n}\n"
  - name: JS-ProcessRegisterClient
    type: Javascript
    content:
      Javascript:
        metadata:
          name: JS-ProcessRegisterClient
        DisplayName: JS-ProcessRegisterClient
        Properties: {}
        Source: "try {\n  var bodyStr = context.getVariable(\"request.content\") || \"{}\";\n  var body = JSON.parse(bodyStr);\n\n  var clientName = (body.client_name || \"Claude Code CLI\").trim();\n  var redirectUris = body.redirect_uris;\n  if (!redirectUris || !Array.isArray(redirectUris) || redirectUris.length === 0) {\n    throw new Error(\"Missing required 'redirect_uris' array.\");\n  }\n\n  // Generate secure unique client_id and client_secret\n  function randHex(len) {\n    var chars = \"abcdefghijklmnopqrstuvwxyz0123456789\";\n    var str = \"\";\n    for (var i = 0; i < len; i++) {\n      str += chars.charAt(Math.floor(Math.random() * chars.length));\n    }\n    return str;\n  }\n\n  var clientId = \"cli-\" + randHex(16);\n  var clientSecret = \"sec-\" + randHex(32);\n\n  var clientConfig = {\n    client_id: clientId,\n    client_secret: clientSecret,\n    client_name: clientName,\n    redirect_uris: redirectUris,\n    grant_types: body.grant_types || [\"authorization_code\", \"refresh_token\"],\n    response_types: body.response_types || [\"code\"],\n    scope: body.scope || \"openid profile email\",\n    client_id_issued_at: Math.floor(Date.now() / 1000)\n  };\n\n  context.setVariable(\"client_key\", \"client:\" + clientId);\n  context.setVariable(\"client_json_payload\", JSON.stringify(clientConfig));\n  context.setVariable(\"client_register_success\", \"true\");\n\n  context.setVariable(\"registered_client_id\", clientId);\n  context.setVariable(\"registered_client_secret\", clientSecret);\n  context.setVariable(\"registered_client_payload\", JSON.stringify(clientConfig, null, 2));\n\n} catch (e) {\n  context.setVariable(\"client_register_success\", \"false\");\n  context.setVariable(\"client_register_error\", \"invalid_client_metadata\");\n  context.setVariable(\"client_register_error_description\", e.message || String(e));\n}\n"
  - name: JS-SetupVerification
    type: Javascript
    content:
      Javascript:
        metadata:
          name: JS-SetupVerification
        DisplayName: JS-SetupVerification
        Properties: {}
        Source: "var host = context.getVariable(\"request.header.host\");\nvar proto = context.getVariable(\"client.scheme\") || \"https\";\ncontext.setVariable(\"token_issuer\", proto + \"://\" + host);\n\n// public.key loaded from KVM GetSecurityKeys\n\nfunction decodeBase64(input) {\n    var chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/';\n    var str = String(input).replace(/=+$/, '');\n    var output = '';\n    if (str.length % 4 == 1) {\n        throw new Error(\"Invalid base64 string.\");\n    }\n    for (\n        var bc = 0, bs, buffer, idx = 0;\n        buffer = str.charAt(idx++);\n        ~buffer && (bs = bc % 4 ? bs * 64 + buffer : buffer,\n            bc++ % 4) ? output += String.fromCharCode(255 & bs >> (-2 * bc & 6)) : 0\n    ) {\n        buffer = chars.indexOf(buffer);\n    }\n    return output;\n}\n\nvar authHeader = context.getVariable(\"request.header.Authorization\") || \"\";\nvar aud = \"\";\nif (authHeader.indexOf(\"Bearer \") === 0) {\n  var token = authHeader.substring(7).trim();\n  var parts = token.split(\".\");\n  if (parts.length === 3) {\n    try {\n      var payloadBase64 = parts[1];\n      var base64 = payloadBase64.replace(/-/g, \"+\").replace(/_/g, \"/\");\n      var decoded = decodeBase64(base64);\n      var payload = JSON.parse(decoded);\n      aud = payload.aud || \"\";\n    } catch (e) {\n      // Ignore decoding error\n    }\n  }\n}\ncontext.setVariable(\"verified_client_id\", aud);\n"
  - name: JS-ValidateAuthorize
    type: Javascript
    content:
      Javascript:
        metadata:
          name: JS-ValidateAuthorize
        DisplayName: JS-ValidateAuthorize
        Properties: {}
        Source: "var verb = context.getVariable(\"request.verb\");\nvar clientId, redirectUri, responseType, scope, state, codeChallenge, codeChallengeMethod;\n\nif (verb === \"POST\") {\n  clientId = context.getVariable(\"request.formparam.client_id\");\n  redirectUri = context.getVariable(\"request.formparam.redirect_uri\");\n  responseType = context.getVariable(\"request.formparam.response_type\");\n  scope = context.getVariable(\"request.formparam.scope\") || \"\";\n  state = context.getVariable(\"request.formparam.state\") || \"\";\n  codeChallenge = context.getVariable(\"request.formparam.code_challenge\");\n  codeChallengeMethod = context.getVariable(\"request.formparam.code_challenge_method\");\n} else {\n  clientId = context.getVariable(\"request.queryparam.client_id\");\n  redirectUri = context.getVariable(\"request.queryparam.redirect_uri\");\n  responseType = context.getVariable(\"request.queryparam.response_type\");\n  scope = context.getVariable(\"request.queryparam.scope\") || \"\";\n  state = context.getVariable(\"request.queryparam.state\") || \"\";\n  codeChallenge = context.getVariable(\"request.queryparam.code_challenge\");\n  codeChallengeMethod = context.getVariable(\"request.queryparam.code_challenge_method\");\n}\n\nif (clientId) clientId = clientId.trim();\nif (redirectUri) redirectUri = redirectUri.trim();\n\nvar isStatic = false;\nvar clientConfig = null;\n\nif (clientId) {\n  var clientJson = context.getVariable(\"client_json_payload\");\n  if (clientJson) {\n    try {\n      clientConfig = JSON.parse(clientJson);\n    } catch (e) {\n      // Ignore parse errors, clientConfig will be null\n    }\n  }\n}\n\nvar error = null;\nvar errorDesc = null;\n\nif (!clientId) {\n  error = \"invalid_client\";\n  errorDesc = \"The client identifier is required.\";\n} else {\n  // Dynamic client validation\n  if (!clientConfig) {\n    error = \"invalid_client\";\n    errorDesc = \"The client identifier provided is invalid or not registered.\";\n  } else {\n    // Validate redirect_uri matches any in the client's registered redirect_uris array\n    var uris = clientConfig.redirect_uris;\n    var found = false;\n    if (uris && Array.isArray(uris)) {\n      for (var i = 0; i < uris.length; i++) {\n        if (String(uris[i]).trim() === redirectUri) {\n          found = true;\n          break;\n        }\n      }\n    }\n    if (!found) {\n      error = \"invalid_redirect_uri\";\n      errorDesc = \"The redirect URI provided does not match any of the registered redirect URIs for this client.\";\n    }\n  }\n}\n\nif (!error) {\n  if (responseType !== \"code\") {\n    error = \"unsupported_response_type\";\n    errorDesc = \"Only response_type=code (Authorization Code Flow) is supported under OAuth 2.1; implicit grant flow is disabled.\";\n  } else if (!codeChallenge || !codeChallengeMethod) {\n    error = \"invalid_request\";\n    errorDesc = \"Proof Key for Code Exchange (PKCE) is MANDATORY under OAuth 2.1. Please provide code_challenge and code_challenge_method.\";\n  } else if (codeChallengeMethod !== \"S256\" && codeChallengeMethod !== \"plain\") {\n    error = \"invalid_request\";\n    errorDesc = \"Only PKCE challenge methods 'S256' or 'plain' are supported.\";\n  }\n}\n\nif (error) {\n  context.setVariable(\"login_username\", context.getVariable(\"login_username\") || \"\");\n  context.setVariable(\"authorize_valid\", \"false\");\n  context.setVariable(\"authorize_error\", error);\n  context.setVariable(\"authorize_error_description\", errorDesc);\n  context.setVariable(\"auth_client_id\", clientId || \"\");\n  context.setVariable(\"auth_redirect_uri\", redirectUri || \"\");\n  context.setVariable(\"auth_response_type\", responseType || \"\");\n  context.setVariable(\"auth_scope\", scope || \"\");\n  context.setVariable(\"auth_state\", state || \"\");\n  context.setVariable(\"auth_code_challenge\", codeChallenge || \"\");\n  context.setVariable(\"auth_code_challenge_method\", codeChallengeMethod || \"\");\n  context.setVariable(\"auth_error_message\", errorDesc || error);\n} else {\n  context.setVariable(\"authorize_valid\", \"true\");\n  context.setVariable(\"auth_client_id\", clientId);\n  context.setVariable(\"auth_redirect_uri\", redirectUri);\n  context.setVariable(\"auth_response_type\", responseType);\n  context.setVariable(\"auth_scope\", scope);\n  context.setVariable(\"auth_state\", state);\n  context.setVariable(\"auth_code_challenge\", codeChallenge);\n  context.setVariable(\"auth_code_challenge_method\", codeChallengeMethod);\n  context.setVariable(\"auth_error_message\", \"\");\n}\n"
  - name: JS-VerifyClientCredentials
    type: Javascript
    content:
      Javascript:
        metadata:
          name: JS-VerifyClientCredentials
        DisplayName: JS-VerifyClientCredentials
        Properties: {}
        Source: |
          var clientJsonStr = context.getVariable("client_json_payload");
          var clientId = context.getVariable("token_client_id") || "";
          var clientSecret = context.getVariable("token_client_secret") || "";
          var requestedScope = context.getVariable("token_requested_scope") || "";

          context.setVariable("token_debug_verifier", "");
          context.setVariable("token_debug_method", "");
          context.setVariable("token_debug_expected", "");
          context.setVariable("token_debug_calculated", "");

          var error = null;
          var errorDesc = null;

          if (!clientJsonStr) {
            error = "invalid_client";
            errorDesc = "Unknown client_id.";
          } else {
            try {
              var clientData = JSON.parse(clientJsonStr);
              if (!clientData.client_secret || clientData.client_secret !== clientSecret) {
                error = "invalid_client";
                errorDesc = "Invalid client credentials.";
              } else if (!Array.isArray(clientData.grant_types) || clientData.grant_types.indexOf("client_credentials") === -1) {
                error = "unauthorized_client";
                errorDesc = "Client is not authorized for client_credentials grant.";
              } else {
                var allowedScopes = (clientData.scope || "portal:admin").split(/\s+/);
                var finalScope = clientData.scope || "portal:admin";
                if (requestedScope) {
                  var reqList = requestedScope.split(/\s+/);
                  var valid = true;
                  for (var i = 0; i < reqList.length; i++) {
                    if (reqList[i] && allowedScopes.indexOf(reqList[i]) === -1) {
                      valid = false;
                      break;
                    }
                  }
                  if (!valid) {
                    error = "invalid_scope";
                    errorDesc = "Requested scope is not allowed for this client.";
                  } else {
                    finalScope = requestedScope;
                  }
                }
                if (!error) {
                  var host = context.getVariable("request.header.host");
                  var proto = context.getVariable("client.scheme") || "https";
                  var subjectEmail = (context.getVariable("request.formparam.subject_email") || "").trim();
                  var subjectName = (context.getVariable("request.formparam.subject_name") || "").trim();
                  context.setVariable("token_issuer", proto + "://" + host);
                  context.setVariable("token_client_id", clientId);
                  if (subjectEmail && allowedScopes.indexOf("portal:admin") !== -1) {
                    context.setVariable("token_username", subjectEmail);
                    context.setVariable("token_email", subjectEmail);
                    context.setVariable("token_name", subjectName || subjectEmail.split("@")[0]);
                    context.setVariable("token_auth_time", String(Math.floor(Date.now() / 1000)));
                    context.setVariable("token_nonce", "none");
                    context.setVariable("token_scope", "openid profile email");
                    context.setVariable("token_scope_has_openid", "true");
                  } else {
                    context.setVariable("token_username", clientData.client_name || clientId);
                    context.setVariable("token_email", clientId + "@service.local");
                    context.setVariable("token_name", clientData.client_name || "Portal Admin");
                    context.setVariable("token_scope", finalScope);
                    context.setVariable("token_scope_has_openid", "false");
                    context.setVariable("token_id_token", "");
                  }
                  if (!context.getVariable("private.key_id")) {
                    context.setVariable("private.key_id", "kid-1");
                  }
                  context.setVariable("token_generation_allowed", "true");
                }
              }
            } catch (e) {
              error = "invalid_client";
              errorDesc = "Failed to parse client configuration.";
            }
          }

          if (error) {
            context.setVariable("token_generation_allowed", "false");
            context.setVariable("token_error", error);
            context.setVariable("token_error_description", errorDesc);
          }
  - name: JS-VerifyCodeAndPKCE
    type: Javascript
    content:
      Javascript:
        metadata:
          name: JS-VerifyCodeAndPKCE
        DisplayName: JS-VerifyCodeAndPKCE
        Properties: {}
        Source: "// Clean pure JS SHA-256 implementation\nfunction sha256_base64url(ascii) {\n    function rotateRight(n, x) {\n        return (n >>> x) | (n << (32 - x));\n    }\n\n    var h0 = 0x6a09e667, h1 = 0xbb67ae85, h2 = 0x3c6ef372, h3 = 0xa54ff53a;\n    var h4 = 0x510e527f, h5 = 0x9b05688c, h6 = 0x1f83d9ab, h7 = 0x5be0cd19;\n\n    var k = [\n        0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5,\n        0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174,\n        0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da,\n        0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967,\n        0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85,\n        0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070,\n        0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3,\n        0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2\n    ];\n\n    var msgBytes = [];\n    for (var i = 0; i < ascii.length; i++) {\n        msgBytes.push(ascii.charCodeAt(i) & 0xFF);\n    }\n\n    var msgLenBits = msgBytes.length * 8;\n    msgBytes.push(0x80);\n    while ((msgBytes.length + 8) % 64 !== 0) {\n        msgBytes.push(0x00);\n    }\n\n    // Upper 4 bytes of 64-bit length are always 0 for short strings\n    msgBytes.push(0x00);\n    msgBytes.push(0x00);\n    msgBytes.push(0x00);\n    msgBytes.push(0x00);\n    msgBytes.push((msgLenBits >>> 24) & 0xFF);\n    msgBytes.push((msgLenBits >>> 16) & 0xFF);\n    msgBytes.push((msgLenBits >>> 8) & 0xFF);\n    msgBytes.push(msgLenBits & 0xFF);\n\n    for (var chunkStart = 0; chunkStart < msgBytes.length; chunkStart += 64) {\n        var w = new Array(64);\n        for (var i = 0; i < 16; i++) {\n            w[i] = (msgBytes[chunkStart + i * 4] << 24) |\n                   (msgBytes[chunkStart + i * 4 + 1] << 16) |\n                   (msgBytes[chunkStart + i * 4 + 2] << 8) |\n                   msgBytes[chunkStart + i * 4 + 3];\n        }\n\n        for (var i = 16; i < 64; i++) {\n            var s0 = rotateRight(w[i - 15], 7) ^ rotateRight(w[i - 15], 18) ^ (w[i - 15] >>> 3);\n            var s1 = rotateRight(w[i - 2], 17) ^ rotateRight(w[i - 2], 19) ^ (w[i - 2] >>> 10);\n            w[i] = (w[i - 16] + s0 + w[i - 7] + s1) | 0;\n        }\n\n        var a = h0, b = h1, c = h2, d = h3, e = h4, f = h5, g = h6, h = h7;\n\n        for (var i = 0; i < 64; i++) {\n            var s1_e = rotateRight(e, 6) ^ rotateRight(e, 11) ^ rotateRight(e, 25);\n            var ch = (e & f) ^ (~e & g);\n            var temp1 = (h + s1_e + ch + k[i] + w[i]) | 0;\n            var s0_a = rotateRight(a, 2) ^ rotateRight(a, 13) ^ rotateRight(a, 22);\n            var maj = (a & b) ^ (a & c) ^ (b & c);\n            var temp2 = (s0_a + maj) | 0;\n\n            h = g;\n            g = f;\n            f = e;\n            e = (d + temp1) | 0;\n            d = c;\n            c = b;\n            b = a;\n            a = (temp1 + temp2) | 0;\n        }\n\n        h0 = (h0 + a) | 0;\n        h1 = (h1 + b) | 0;\n        h2 = (h2 + c) | 0;\n        h3 = (h3 + d) | 0;\n        h4 = (h4 + e) | 0;\n        h5 = (h5 + f) | 0;\n        h6 = (h6 + g) | 0;\n        h7 = (h7 + h) | 0;\n    }\n\n    var bytes = [];\n    var words = [h0, h1, h2, h3, h4, h5, h6, h7];\n    for (var i = 0; i < 8; i++) {\n        bytes.push((words[i] >>> 24) & 0xFF);\n        bytes.push((words[i] >>> 16) & 0xFF);\n        bytes.push((words[i] >>> 8) & 0xFF);\n        bytes.push(words[i] & 0xFF);\n    }\n\n    var base64 = \"\";\n    var chars = \"ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_\";\n    for (var i = 0; i < bytes.length; i += 3) {\n        var b1 = bytes[i], b2 = i + 1 < bytes.length ? bytes[i + 1] : NaN, b3 = i + 2 < bytes.length ? bytes[i + 2] : NaN;\n        var enc1 = b1 >> 2;\n        var enc2 = ((b1 & 3) << 4) | (isNaN(b2) ? 0 : b2 >> 4);\n        var enc3 = isNaN(b2) ? NaN : (((b2 & 15) << 2) | (isNaN(b3) ? 0 : b3 >> 6));\n        var enc4 = isNaN(b3) ? NaN : b3 & 63;\n\n        base64 += chars.charAt(enc1) + chars.charAt(enc2);\n        if (!isNaN(enc3)) base64 += chars.charAt(enc3);\n        if (!isNaN(enc4)) base64 += chars.charAt(enc4);\n    }\n    return base64;\n}\n\nvar codeDataStr = context.getVariable(\"auth_code_data\");\nvar codeVerifier = context.getVariable(\"token_code_verifier\") || \"\";\nvar clientIdSubmitted = context.getVariable(\"token_client_id\");\nvar redirectUriSubmitted = context.getVariable(\"token_redirect_uri\");\n\nvar error = null;\nvar errorDesc = null;\n\n// Initialize debug variables to avoid unresolved variable crashes\ncontext.setVariable(\"token_debug_verifier\", \"\");\ncontext.setVariable(\"token_debug_method\", \"\");\ncontext.setVariable(\"token_debug_expected\", \"\");\ncontext.setVariable(\"token_debug_calculated\", \"\");\n\nif (!codeDataStr) {\n  error = \"invalid_grant\";\n  errorDesc = \"The authorization code is invalid or has expired.\";\n} else {\n  try {\n    var codeData = JSON.parse(codeDataStr);\n\n    // Validate Client Match\n    if (clientIdSubmitted && clientIdSubmitted !== codeData.client_id) {\n      error = \"invalid_client\";\n      errorDesc = \"Client ID mismatch.\";\n    } else if (redirectUriSubmitted && redirectUriSubmitted !== codeData.redirect_uri) {\n      error = \"invalid_grant\";\n      errorDesc = \"Redirect URI mismatch.\";\n    } else {\n       // PKCE Validation (Mandatory for OAuth 2.1)\n       if (!codeVerifier) {\n         error = \"invalid_request\";\n         errorDesc = \"code_verifier parameter is required for PKCE validation under OAuth 2.1.\";\n       } else {\n         context.setVariable(\"token_debug_verifier\", codeVerifier);\n         context.setVariable(\"token_debug_method\", codeData.code_challenge_method || \"none\");\n         context.setVariable(\"token_debug_expected\", codeData.code_challenge || \"none\");\n\n         if (codeData.code_challenge_method === \"S256\") {\n           var challengeCalculated = sha256_base64url(codeVerifier);\n           context.setVariable(\"token_debug_calculated\", challengeCalculated);\n           if (challengeCalculated !== codeData.code_challenge) {\n             error = \"invalid_grant\";\n             errorDesc = \"PKCE verification failed (S256 challenge mismatch).\";\n           }\n         } else if (codeData.code_challenge_method === \"plain\") {\n           context.setVariable(\"token_debug_calculated\", codeVerifier);\n           if (codeVerifier !== codeData.code_challenge) {\n             error = \"invalid_grant\";\n             errorDesc = \"PKCE verification failed (plain challenge mismatch).\";\n           }\n         }\n       }\n    }\n\n    if (!error) {\n      // Setup claims for native GenerateJWT policies\n      var host = context.getVariable(\"request.header.host\");\n      var proto = context.getVariable(\"client.scheme\") || \"https\";\n      context.setVariable(\"token_issuer\", proto + \"://\" + host);\n      context.setVariable(\"token_client_id\", codeData.client_id);\n      context.setVariable(\"token_username\", codeData.username);\n      context.setVariable(\"token_email\", codeData.email);\n      context.setVariable(\"token_name\", codeData.name);\n      context.setVariable(\"token_auth_time\", String(Math.floor(Date.now() / 1000)));\n      context.setVariable(\"token_nonce\", codeData.nonce || \"none\");\n\n      var scope = codeData.scope || \"\";\n      context.setVariable(\"token_scope\", scope);\n      context.setVariable(\"token_scope_has_openid\", scope.indexOf(\"openid\") > -1 ? \"true\" : \"false\");\n\n      // private.key loaded from KVM GetSecurityKeys\n       if (!context.getVariable(\"private.key_id\")) {\n         context.setVariable(\"private.key_id\", \"kid-1\");\n       }\n\n      context.setVariable(\"token_generation_allowed\", \"true\");\n    }\n  } catch(e) {\n    error = \"invalid_grant\";\n    errorDesc = \"Failed to process authorization code data.\";\n  }\n}\n\nif (error) {\n  context.setVariable(\"token_generation_allowed\", \"false\");\n  context.setVariable(\"token_error\", error);\n  context.setVariable(\"token_error_description\", errorDesc);\n}\n"
  - name: JS-VerifyRefreshToken
    type: Javascript
    content:
      Javascript:
        metadata:
          name: JS-VerifyRefreshToken
        DisplayName: JS-VerifyRefreshToken
        Properties: {}
        Source: "var refreshDataStr = context.getVariable(\"refresh_token_data\");\nvar clientIdSubmitted = context.getVariable(\"token_client_id\");\n\nvar error = null;\nvar errorDesc = null;\n\nif (!refreshDataStr) {\n  error = \"invalid_grant\";\n  errorDesc = \"Refresh token is invalid or has expired.\";\n} else {\n  try {\n    var rData = JSON.parse(refreshDataStr);\n    if (clientIdSubmitted && clientIdSubmitted !== rData.client_id) {\n      error = \"invalid_client\";\n      errorDesc = \"Client ID mismatch.\";\n    } else {\n      // Setup claims for GenerateJWT policies\n      var host = context.getVariable(\"request.header.host\");\n      var proto = context.getVariable(\"client.scheme\") || \"https\";\n      context.setVariable(\"token_issuer\", proto + \"://\" + host);\n      context.setVariable(\"token_client_id\", rData.client_id);\n      context.setVariable(\"token_username\", rData.username);\n      context.setVariable(\"token_email\", rData.email);\n      context.setVariable(\"token_name\", rData.name);\n      context.setVariable(\"token_auth_time\", Math.floor(Date.now() / 1000).toString());\n      context.setVariable(\"token_nonce\", \"\");\n\n      var scope = rData.scope || \"\";\n      context.setVariable(\"token_scope\", scope);\n      context.setVariable(\"token_scope_has_openid\", scope.indexOf(\"openid\") > -1 ? \"true\" : \"false\");\n\n      // private.key loaded from KVM GetSecurityKeys\n      if (!context.getVariable(\"private.key_id\")) {\n        context.setVariable(\"private.key_id\", \"kid-1\");\n      }\n\n      context.setVariable(\"token_generation_allowed\", \"true\");\n    }\n  } catch(e) {\n    error = \"invalid_grant\";\n    errorDesc = \"Failed to parse refresh token.\";\n  }\n}\n\nif (error) {\n  context.setVariable(\"token_generation_allowed\", \"false\");\n  context.setVariable(\"token_error\", error);\n  context.setVariable(\"token_error_description\", errorDesc);\n}\n"
